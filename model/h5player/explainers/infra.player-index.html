    <h1>前台接待：唯一入口</h1>
    <p class="lede">这一层是 <span data-arch="infra.player-index">PlayerIndex</span>：<span data-arch="infra.player-index" data-field="summary"></span>。业务方认识整个发动机，只通过这一个前台。</p>

    <h2>前台的四扇窗</h2>
    <div class="cols c2">
      <div><b><span data-arch="infra.player-index.player-api">操作窗</span></b>播放 / 切流 / 销毁翻译成一条条命令交给主轴；前台不解释语义，只做翻译。</div>
      <div><b><span data-arch="infra.player-index.status-projection">事件窗</span></b>内部领域事件按白名单映射成对外事件——清单之外的存在感为零。</div>
      <div><b><span data-arch="infra.player-index.stats">快照窗</span></b>getStats 给只读快照与能力面：能看什么由账本声明，前台照单。</div>
      <div><b><span data-arch="infra.player-index.model-access">模型收窄</span> 与 <span data-arch="infra.player-index.public-surface">转出面</span></b>业务方要的能力先收窄再给；对外导出面（含插件基类）从这里转出去。</div>
    </div>

    <p class="note">不含播放决策：前台若开始「替业务方判断」，入口就失去了唯一性——所有可靠性设计都建立在入口唯一之上。</p>
