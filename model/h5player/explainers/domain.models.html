    <h1>记账本</h1>
    <p class="lede">这一层是 <span data-arch="domain.models">领域模型</span>：<span data-arch="domain.models" data-field="summary"></span>。播放过程中的一切事实都记在账上，且只许按规则记账。</p>

    <figure>
      <svg viewBox="0 0 640 208" role="img" aria-label="两本总账与两套分册，只存值快照，对外只读视图">
        <defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker></defs>
        <rect x="16" y="26" width="190" height="78" rx="10" fill="var(--ok-soft)" stroke="var(--ok)"/>
        <text x="111" y="50" font-size="11.5" text-anchor="middle" class="">两本总账</text>
        <text x="32" y="72" font-size="9.5" class="muted">播放状态账（能不能播、播到哪）</text>
        <text x="32" y="88" font-size="9.5" class="muted">统计账（卡顿、耗时、码率）</text>
        <rect x="16" y="116" width="190" height="70" rx="10" fill="var(--bg)" stroke="var(--ok)"/>
        <text x="111" y="140" font-size="11.5" text-anchor="middle" class="">两套分册</text>
        <text x="32" y="162" font-size="9.5" class="muted">流模型（FLV / HLS / MP4 各一）</text>
        <text x="32" y="178" font-size="9.5" class="muted">播放模型（与方案一一对应）</text>
        <path d="M208,80 L238,96 M208,150 L238,120" stroke="var(--text-2)" stroke-width="1.6" marker-end="url(#c)"/>
        <rect x="242" y="66" width="150" height="100" rx="10" fill="var(--bg)" stroke="var(--warn)"/>
        <text x="317" y="96" font-size="11.5" text-anchor="middle" class="">守门规矩</text>
        <text x="258" y="118" font-size="9" class="muted">持有事实 · 守住不变量；</text>
        <text x="258" y="134" font-size="9" class="muted">只存值快照——</text>
        <text x="258" y="150" font-size="9" class="muted">绝不碰画面与句柄</text>
        <path d="M394,116 L422,116" stroke="var(--text-2)" stroke-width="2" marker-end="url(#c)"/>
        <rect x="426" y="66" width="200" height="100" rx="10" fill="var(--accent-soft)" stroke="var(--accent)"/>

        <text x="442" y="130" font-size="9" class="muted">人人都能来查账，</text>
        <text x="442" y="146" font-size="9" class="muted">但不能伸手改账</text>
        <text x="320" y="194" font-size="10" text-anchor="middle" class="">记账的笔只有模型自己的方法——其余人拿到的是快照</text>
      </svg>
      <figcaption>总账、分册、守门规矩与只读视图。</figcaption>

    <h2>四个分册</h2>
    <div class="cols c2">
      <div><b><span data-arch="domain.models.playback-state">播放状态账</span> 与 <span data-arch="domain.models.statistic">统计账</span></b>两本总账：前者回答「现在能不能播、播到哪」，后者回答「这一路体验如何」。</div>
      <div><b><span data-arch="domain.models.stream">流模型</span> 与 <span data-arch="domain.models.play">播放模型</span></b>分册按协议与方案一一对应：流的元信息一本、每种方案的播放姿态一本；<span data-arch="domain.models.base">公共底座</span> 统一它们的骨架。</div>
    </div>

    <p class="note ok">为什么只存值快照：账本若握着画面句柄，测试就得开浏览器——值快照让它永远可在命令行里核对。</p>
