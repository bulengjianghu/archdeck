    <h1>三段传送带：只执行，不做决定</h1>
    <p class="lede">这一层是 <span data-arch="infra.mus">MUs 媒体单元</span>：<span data-arch="infra.mus" data-field="summary"></span>。一帧数据从网络到屏幕的全程流水线，快而稳。</p>

    <h2>零件与把手</h2>
    <div class="cols c3">
      <div><b>原料段</b><span data-arch="infra.mus.loader">搬字节</span> 与 <span data-arch="infra.mus.demuxer">拆包</span> 把整流变成一帧一帧；段尾阀门归 <span data-arch="infra.mus.buffer">缓冲</span>，开不开由策略说了算。</div>
      <div><b>加工段</b><span data-arch="infra.mus.corrector">校正</span> 修时间戳；加密流走 <span data-arch="infra.mus.process-plugin">外部插件插槽</span>，统一契约随装随用。造零件的是 <span data-arch="infra.mus.factory">单元工厂</span>。</div>
      <div><b>成品段</b><span data-arch="infra.mus.remuxer">重新打包</span> → <span data-arch="infra.mus.decoder">解码</span>（重活在后台线程）→ <span data-arch="infra.mus.render">上屏</span>，按媒体钟走点。</div>
    </div>

    <p class="note">传送带不做任何决定：水位多高、何时追帧、怎么拖动进度，都不归它管——所以换一种「玩法」时，传送带的零件不变，变的只是指挥它的策略。</p>
