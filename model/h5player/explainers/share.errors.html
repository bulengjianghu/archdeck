    <h1>错误词典</h1>
    <p class="lede">这一层是 <span data-arch="share.errors">错误原语</span>：<span data-arch="share.errors" data-field="summary"></span>。全 SDK 的错误只有一种长相——报错的上层永远不用猜格式。</p>

    <h2>词典与主轴的握手</h2>
    <p>错误链归主轴管，但「什么算致命」由这本词典说了算——机制与含义分离：主轴不用认识每一种错误，词典改一条映射，处置行为就跟着变。加上 <span data-arch="share.contracts">成败封装</span>，跨层错误传递从「撞大运的异常」变成「有编号的回答」。</p>
