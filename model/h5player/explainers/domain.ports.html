    <h1>插座标准</h1>
    <p class="lede">这一层是 <span data-arch="domain.ports">领域端口</span>：<span data-arch="domain.ports" data-field="summary"></span>。脑定义插座的样子，手负责插上去。</p>

    <h2>为什么要有一层专门的插座</h2>
    <p>没有插座，脑要认识每一只手——换一只手就要动脑。有了插座：机器层实现插座、调度层调用插座、规则层只定义签名。测试时拿一个假插头插上，整台机器就能在命令行里跑通。这就是「脑手分离」能落地的物理基础。</p>
