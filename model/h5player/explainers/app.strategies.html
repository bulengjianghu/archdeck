    <h2>几位司机</h2>
    <div class="cols c2">
      <div><b><span data-arch="app.strategies.load">加载段司机</span></b>上报流事实、开闸放水、控制拉流节奏——水流多急由它定。</div>
      <div><b><span data-arch="app.strategies.play-base">播放段司机</span></b>成品段的水位与出闸节奏，直播、点播共用的底子。</div>
      <div><b><span data-arch="app.strategies.live-frame">直播司机</span></b>追帧、丢帧、充水：宁可丢旧画面也要咬住直播。</div>
      <div><b><span data-arch="app.strategies.vod-frame">点播司机</span></b>拖动进度与回退：从哪一帧重新放，怎么衔接缓冲。</div>
    </div>

    <p class="note">脑手分开：缓冲的控制律（怎么想）是规则层的纯函数；司机只做事件采样与执行。上岗前先签 <span data-arch="app.strategies.contracts">司机契约</span>——按方案挂载，接口统一。</p>
