# 取自 h5player docs/design/6-features/timeshift/leg-switch.md §3.3–§3.7 与 timeShiftCoordinator.ts（handleUserPauseEntry / armSession）。
scenario:
  id: sc.timeshift-pause
  name: 暂停后切时移（含回直播）
  kind: main
  description: |
    FLV 直播登记了时移录制地址后，用户暂停即进时移会话：在接点 K（处理后队列第一个关键帧）关直播段尾阀，建一条强制点播的录制 HLS 腿；
    暂停期内录制覆盖 K 且余量够就对接（换腿事务，切点 = K），提交即撤直播腿。续播那一刻裁决：已对接进灰度区，录像首帧出画即上屏；
    未对接当场放弃，按普通直播续播。上屏之后只有用户 backToLive() 回直播。
  cause: 已登记时移地址的 FLV 直播中，用户调用 pause()
  steps:
    - call: {id: pause, from: actor.biz, to: infra.player-index.player-api, interface: if.player-index.pause, label: pause()}
    - async: {from: infra.player-index.player-api, to: infra.framework.state-machine.scheduler, relation: rel.player-shell.api-framework-command, interface: if.framework.state-machine.sendCommand, payload: ds.CommandInfo, label: "sendCommand(Pause{origin: 'user'})"}
    - async: {from: infra.framework.state-machine.scheduler, to: infra.framework.state-machine.engine, label: 串行执行 Pause}
    - call: {from: infra.framework.state-machine.engine, to: app.timeshift.coordinator, relation: rel.framework.sm-engine-timeshift-hooks, label: Pause 前置 Hook：记暂停来源 user}
    - async: {from: infra.framework.state-machine.engine, to: app.timeshift.coordinator, relation: rel.framework.sm-engine-status-timeshift, payload: ds.PlayerStatusChangeEventPayload, label: PlayerStatusChange（Paused）：用户暂停入口, note: 经事件总线（via bus，M14）}
    - call: {id: arm, from: app.timeshift.coordinator, to: domain.services.timeshift, label: shouldArm（有时移地址、FLV 直播、方案受支持、主腿）}
    - alt:
        - when: 满足 shouldArm，进时移会话
          steps:
            - async: {id: hold, from: app.timeshift.coordinator, to: app.solution.legs, interface: if.timeshift.coordinator.legPort, label: "holdPlayQueue + holdLeg('primary')：在接点 K 截流关阀"}
            - async: {id: create, from: app.timeshift.coordinator, to: app.solution.legs, interface: if.timeshift.coordinator.legPort, label: "createLeg('timeshift', Hls / Vod)"}
            - call: {from: app.solution.legs, to: app.factories.load, label: 以腿上下文建待命腿 Load 段工厂}
            - call: {from: app.solution.legs, to: infra.framework.pipeline.legs, interface: if.framework.pipeline.PipelineLegHandle, label: openLeg + updatePipeline：录制腿 Load 段进图（待命）}
            - call: {from: app.timeshift.coordinator, to: app.timeshift.recording-driver, interface: if.timeshift.recording-driver.driver, label: start：拉清单、定位接点所在片、有界预取}
            - async: {from: app.timeshift.recording-driver, to: infra.mus.loader.hls, label: 'LoadStreamInfo / LoadData：拉录制清单与分片'}
            - loop:
                while: 暂停中，录制片落地或接点变化
                steps:
                  - call: {id: decide, from: app.timeshift.coordinator, to: domain.services.timeshift, interface: if.services.timeshift.decideLeg, label: decideLeg（录制覆盖 K 且余量 ≥ 3s？）}
            - alt:
                - when: 暂停期内判 switch，对接
                  steps:
                    - async: {id: switch, from: app.timeshift.coordinator, to: app.solution.legs, interface: if.timeshift.coordinator.legPort, label: "switchLeg('timeshift', {cutPts: K})"}
                    - ref: sc.timeshift-leg-switch
                    - return: {from: app.solution.legs, to: app.timeshift.coordinator, payload: ds.LegSwitchOutcome, label: 对接完成}
                    - async: {from: app.timeshift.coordinator, to: infra.player-index.player-api, relation: rel.timeshift.events-api, label: TimeShiftHandoffDone, note: 经事件总线（via bus，M14）}
                    - async: {from: app.timeshift.coordinator, to: app.solution.legs, interface: if.timeshift.coordinator.legPort, label: "withdrawLeg('primary')：提交即撤直播腿"}
                    - call: {id: resume, from: actor.biz, to: infra.player-index.player-api, interface: if.player-index.resume, label: resume()}
                    - async: {from: infra.player-index.player-api, to: infra.framework.state-machine.scheduler, relation: rel.player-shell.api-framework-command, interface: if.framework.state-machine.sendCommand, label: sendCommand(Resume)}
                    - async: {from: infra.framework.state-machine.scheduler, to: infra.framework.state-machine.engine, label: 串行执行 Resume}
                    - call: {from: infra.framework.state-machine.engine, to: app.timeshift.coordinator, relation: rel.framework.sm-engine-timeshift-hooks, label: Resume 前置 Hook：已对接，进灰度区}
                    - call: {from: app.timeshift.coordinator, to: app.timeshift.grace, label: 灰度区开始计时（每 100ms 巡检）}
                    - async: {from: infra.mus.render, to: app.timeshift.coordinator, relation: rel.timeshift.render-video-rendered, label: VideoRendered：首个 pts ≥ K 的录像帧出画, note: 经事件总线（via bus，M14）}
                    - call: {from: app.timeshift.grace, to: domain.services.timeshift, interface: if.services.timeshift.decideGrace, label: decideGrace → on-screen}
                    - async: {from: app.timeshift.coordinator, to: infra.player-index.player-api, relation: rel.timeshift.events-api, label: "TimeShiftStarted{trigger: 'pause'}（转发业务方）", note: 经事件总线（via bus，M14）}
                    - ref: sc.timeshift-back-to-live
                - when: 续播时仍未对接（录制追不上或已放弃）
                  steps:
                    - call: {id: resume-live, from: actor.biz, to: infra.player-index.player-api, interface: if.player-index.resume, label: resume()}
                    - async: {from: infra.player-index.player-api, to: infra.framework.state-machine.scheduler, relation: rel.player-shell.api-framework-command, interface: if.framework.state-machine.sendCommand, label: sendCommand(Resume)}
                    - async: {from: infra.framework.state-machine.scheduler, to: infra.framework.state-machine.engine, label: 串行执行 Resume}
                    - call: {from: infra.framework.state-machine.engine, to: app.timeshift.coordinator, relation: rel.framework.sm-engine-timeshift-hooks, label: Resume 前置 Hook：未对接，放流放阀}
                    - async: {from: app.timeshift.coordinator, to: app.solution.legs, interface: if.timeshift.coordinator.legPort, label: "releasePlayQueue + releaseLeg('primary')；withdrawLeg('timeshift')"}
                    - async: {from: app.timeshift.coordinator, to: infra.player-index.player-api, relation: rel.timeshift.events-api, label: "TimeShiftFailed{not-catching-up}：按普通直播续播", note: 经事件总线（via bus，M14）}
        - when: 不满足（未登记地址、非 FLV 直播或方案不支持）
          steps:
            - call: {from: app.timeshift.coordinator, to: app.timeshift.source-wiring, label: 只做一次预解析，普通直播暂停}
