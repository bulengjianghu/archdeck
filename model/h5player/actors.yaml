# 外部参与者：主动发起交互的外部实体（A3），及其入口关系。
actors:
  - id: actor.biz
    name: 业务方
    kind: system
    description: 集成 SDK 的业务页面代码，通过 Player API 发起 init / play / switch / reset 等命令，并订阅播放器事件。

relations:
  - id: rel.ctx.api
    from: actor.biz
    to: infra.player-index.player-api
    type: commands
    description: 业务方交给 Player 对外 API：调用 Player 对外 API（init / load / play / pause / stop / reset / switch / seek / destroy …）
