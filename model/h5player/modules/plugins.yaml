# 区域：横向用例插件（app.plugins）与时移（app.timeshift）
# 代码：packages/player/src/plugins/*.ts、record/**、tracker/**、timeshift/**（不含 plugins/solution/**）
# 规范：docs/04-model-generation.md；只用 parent 往第二级模块下挂子模块。

modules:
  # ════════════════════════════ app.plugins ════════════════════════════
  - id: app.plugins.buffer-strategy
    parent: app.plugins
    name: 缓冲策略
    kind: group
    responsibility: 直播 / 点播播放段的缓冲水位驾驶与缓冲阈值自适应：何时起冲 / 停冲、追帧、回收已播数据，以及按网络与供数节奏动态调整四个缓冲阈值。控制律在 Domain 决策服务，本组只做事件采样、宿主适配、执行与写回；不负责拉流节奏（归 app.strategies）。
    docRefs:
      - docs/design/5-capabilities/buffer/buffer-adaptive.md
      - docs/design/5-capabilities/buffer/supply-aware-live-buffer.md
      - docs/design/5-capabilities/buffer/latency-drop-backlog-gate.md
      - docs/design/4-solutions/mse/mse-strategy.md
      - docs/design/4-solutions/fhls/fhls-solution.md
    children:
      - id: app.plugins.buffer-strategy.mse-live
        name: MSE 直播水位策略
        responsibility: MSE 直播（含时移态）的播放段水位驾驶：BufferChange 驱动起冲 / 停冲、按积压追帧（Seek 到绝对目标）、暂停期 append 闸与暂停超时回收 SourceBuffer、直播已播数据回收。
        principle: |
          - 每次 BufferChange 先记「可用缓冲」，再按纯函数 `decideBufferFill` 判 fill / stop-fill；`nextStatus` 经命令队列异步置位，用同步本地闩（T4）堵住同一回合重入。
          - 缓冲回合只属于播放会话：暂停期（含时移补数）不起冲，离开 Playing·Buffering 即松闩。
          - 追帧：仅在 `latencyDropAllowed`（积压检测放行）时，按 `decideChasingFrameTarget` 算目标并经 `resolveMseChasingSeekMs` 换成毫秒，发渲染 `Seek`。
          - 暂停期可播缓冲超上限时清理至停丢水位；直播已播数据按 `decidePlayedDataRemoveEnd` 游标回收。
        codeRefs:
          - packages/player/src/plugins/pluginMseBufferStrategy.ts
        docRefs:
          - docs/design/4-solutions/mse/mse-strategy.md
      - id: app.plugins.buffer-strategy.fhls-live
        name: Fhls 连续呈现水位策略
        responsibility: Fhls 直播连续呈现的水位驾驶（解析后队列直通、重封装分片节拍、按呈现时钟算水位起冲 / 停冲），并组合持有三条连续呈现看门狗（未渲染 / 进度停滞 / 暂停→恢复消费间隔）。看门狗也被 Fhls 连续呈现点播策略复用。
        principle: |
          - 水位基准读 Fhls 播放模型上的渲染轴零点 `renderZeroPts`（重封装器写入），换回直播后重装的实例与原实例同基；零点未定时不做水位计算。
          - 处理后队列每批 Input 原样 `SendBuffer`，限流由解析后缓存按墙钟节拍放帧完成。
          - 看门狗 `FhlsContinuousWatchdog` 不继承插件基类，经宿主口取状态 / 就绪度 / 时钟 / 错误出口；判据（`judgeNotRendering` / `judgeProgressStalled` / `judgeConsumeGap`）在 Domain，判出只上抛 `MuVideoRenderError` 或 Warn，不自行恢复。
        provides: [if.plugins.buffer.fhlsWatchdog]
        dataStructures: [ds.FhlsContinuousWatchdogHost]
        codeRefs:
          - packages/player/src/plugins/pluginFhlsBufferStrategy.ts
          - packages/player/src/plugins/fhlsContinuousWatchdog.ts
        docRefs:
          - docs/design/4-solutions/fhls/fhls-solution.md
      - id: app.plugins.buffer-strategy.live-adaptive
        name: 直播自适应阈值
        responsibility: 直播缓冲阈值的三种互斥自适应模式（Auto=SelfAdaptive、SupplyAware、CadenceSwitch）：观测 bufferSize 与到达节奏，按 Domain 控制器结论写回四个缓冲阈值与 latencyDropAllowed，并上报阈值变化 / 欠载交棒埋点。不做快慢放与降码率（只上报）。
        principle: |
          - 控制律单一实现在 Domain（`selfAdaptiveBufferPolicy` / `supplyAwareBufferPolicy` / `cadenceSwitchBufferPolicy` / `backlogDetector`）；插件只把 PluginBase 能力包成控制器的 Host 接口并接生命周期。
          - SelfAdaptive：网络波动期抬高阈值（少卡顿）、平静期收回（降延迟）；积压检测器看清链路之前降延迟一律不放行，由本插件独家写 `latencyDropAllowed`。
          - SupplyAware：先判区制（阵雨 / 旱季）再定储备与回填阈值，追帧只在稳态放行；断流期间靠定时 tick 推进区制。
          - CadenceSwitch：SAB 与 SupplyAware 常驻观测，按送货节奏决定谁写回。
          - 三者按 bufferMode 互斥装配；暂停期只观测不调参，续播重置观测态；卸载时把阈值与 latencyDropAllowed 还原为装载前的值（换腿交接清单）。
          - 写回一律经 `context.settings` 显式端口（setBufferThresholds / setLatencyDropAllowed）。
        codeRefs:
          - packages/player/src/plugins/pluginSelfAdaptiveBuffer.ts
          - packages/player/src/plugins/pluginSupplyAwareBuffer.ts
          - packages/player/src/plugins/pluginCadenceSwitchBuffer.ts
        docRefs:
          - docs/design/5-capabilities/buffer/buffer-adaptive.md
          - docs/design/5-capabilities/buffer/supply-aware-live-buffer.md
          - docs/design/5-capabilities/buffer/latency-drop-backlog-gate.md
      - id: app.plugins.buffer-strategy.vod-adaptive
        name: 点播自适应阈值
        responsibility: 点播（HLS / MP4）缓冲阈值自适应：按分片下载采样估算带宽与编码码率、预测下一片下载耗时 T_load，据此调整缓冲阈值；倍速 / seek 时立即重算，卸载时还原。
        principle: |
          - 事件聚合（分片开始 / 字节到达 / 完成）留在插件，控制律（EWMA、体积估算、T_load 预测、阈值推导）在 Domain `vodAdaptiveBufferPolicy`。
          - 写回带变化率夹断与最小间隔；SetPlaybackRate / Seek 经命令后置钩子强制跳过最小间隔，seek 只重置预测态、保留 EWMA 历史。
        codeRefs:
          - packages/player/src/plugins/pluginVodSelfAdaptiveBuffer.ts
        docRefs:
          - docs/design/5-capabilities/buffer/buffer-adaptive.md
      - id: app.plugins.buffer-strategy.water-level-math
        name: MSE 水位与追帧换算
        responsibility: 播放策略共用的无状态换算：MSE 当前水位、要补的毫秒数换算成送帧数、追帧偏移换算成渲染 Seek 的绝对毫秒目标。被 MSE 直播策略、直播 HLS 加载策略及点播 MSE / Fhls 策略复用。
        provides:
          - if.plugins.buffer.decideMediaBuffer
          - if.plugins.buffer.decideBufferCount
          - if.plugins.buffer.resolveMseChasingSeekMs
        codeRefs:
          - packages/player/src/plugins/mseBufferWaterLevel.ts
          - packages/player/src/plugins/mseChasingSeek.ts

  - id: app.plugins.network
    parent: app.plugins
    name: 网络监测与重连
    kind: group
    responsibility: 识别网络在线 / 离线 / 不稳定并发布事实，直播下对拉流故障与断流做有限次重连；点播下拉片失败且缓冲耗尽时暂停。不负责错误码到恢复动作的通用映射（归错误处理）。
    docRefs:
      - docs/design/5-capabilities/guard/live-reconnect.md
    children:
      - id: app.plugins.network.monitor
        name: 网络状态监测
        responsibility: 直播 / 点播两种网络监测插件：监听 online / offline、数据到达间隔与拉片结果，发布 NetworkStatusChange（data.networkStatus 由组合根投影落值）；点播拉片失败且缓冲为空时发 Pause{origin:network}，时移录制腿供数中让位给时移协调器。
        provides: [if.plugins.network.getStatus]
        codeRefs:
          - packages/player/src/plugins/pluginNetworkMonitor.ts
          - packages/player/src/plugins/pluginVodNetworkMonitor.ts
      - id: app.plugins.network.reconnect
        name: 直播重连
        responsibility: 直播拉流故障 / 起播超时 / 断流的重连编排：一轮内有限次重试、业务 beforeRetry 换地址、页面隐藏 / 断网 / 用户暂停时挂起、终态只上抛不重启。全局装载，不随方案或加载段重建；只在直播介入。
        principle: |
          - 判定全部在纯函数 `decideReconnect(state, input, facts)`：插件把事件翻译成 `ReconnectInput`，把播放器现状拼成 `ReconnectFacts`，逐条执行返回的 `ReconnectEffect`（stop / play / 开关定时器 / 调业务回调 / 报终态 / setActive）。
          - 相位：idle → guarding（守护起播或一次重试）→ waiting（退避 delays）→ asking（等 beforeRetry）→ 再 guarding；suspended 为挂起；`seq` 每开定时器 / 发回调前进一次，迟到的定时器与回调按 seq 丢弃。
          - 断流计时用 `StatusScopedIntervalTask` 只在 Playing / Buffering 下运行；HLS 的断流阈值按分片目标时长 × 3 估算；后台续播首次核验判出断流时 Stop 后立即重试。
          - 命令一律 `void sendCommand` 不 await，beforeRetry 一律异步落地，避免在状态机串行执行栈中重入。
          - `takeResumeRetry()` 供 `Player.resume()` 取走「本次续播触发的重试」。
        provides:
          - if.plugins.reconnect.decide
          - if.plugins.reconnect.takeResumeRetry
        dataStructures:
          - ds.ReconnectState
          - ds.ReconnectInput
          - ds.ReconnectEffect
          - ds.ReconnectFacts
          - ds.ResolvedReconnectConfig
        codeRefs:
          - packages/player/src/plugins/pluginNetworkReconnect.ts
          - packages/player/src/plugins/reconnectDecision.ts
        docRefs:
          - docs/design/5-capabilities/guard/live-reconnect.md

  - id: app.plugins.runtime-guard
    parent: app.plugins
    name: 运行状态守护
    kind: group
    responsibility: 播放会话内的运行健康监测：画面长时间不更新 / 分片 video 异常时重启、检测视频帧损坏、采样主线程定时器负载并给出系统负载档位（供丢帧策略使用）。
    docRefs:
      - docs/design/5-capabilities/guard/monitor-detection.md
    children:
      - id: app.plugins.runtime-guard.render-watch
        name: 出画停滞守护
        responsibility: 周期检查渲染是否推进与 video 异常持续时长，超限经 Stop + Play 重启播放器（Vcs 方案）；通用版 PluginRuntimeMonitor 检查流水线断流，当前无装配方。
        codeRefs:
          - packages/player/src/plugins/pluginVcsRuntimeMonitor.ts
          - packages/player/src/plugins/pluginRuntimeMonitor.ts
      - id: app.plugins.runtime-guard.video-quality
        name: 视频损坏检测
        responsibility: 基于 VideoPlaybackQuality 记录最近 5 秒渲染帧数，总帧数增长而有效帧不增长时判视频损坏并上报。
        codeRefs:
          - packages/player/src/plugins/pluginVideoRuntimeMonitor.ts
      - id: app.plugins.runtime-guard.system-load
        name: 系统负载采样
        responsibility: 播放会话内以 10ms 定时器采样回调间隔，按 1s 窗口与连续 5 次判定系统负载档位，写入统计模型供抽帧 / 丢帧策略读取；离开会话即停止采样并把档位复位为 None。
        codeRefs:
          - packages/player/src/plugins/pluginSystemLoad.ts

  - id: app.plugins.error
    parent: app.plugins
    name: 错误处理
    kind: group
    responsibility: 全局错误链上的错误到恢复动作的映射，以及漏网错误的兜底捕获。
    docRefs:
      - docs/design/5-capabilities/guard/error-recovery.md
    children:
      - id: app.plugins.error.recovery
        name: 错误恢复
        responsibility: 在全局错误链上按错误码决定上抛 SDK、从直播重启（Stop{Recovery} → Play{Recovery}，暂停态补 Pause）、只记日志或停止；限制重启频率，恢复后 8s 未出画报一次 ReStartFail，不再重启；维护重启 / 失败计数（统计组 A）。时移灰度期换不回直播、直播重连终态等按各自契约特判。
        principle: |
          - 作为 `registerErrorHandler` 链中的一环，返回 null 表示已消费；排在时移协调器之后注册，后者先拿灰度期录制错误。
          - 恢复序列以 Stop{source:'Recovery'} 落定为界，之后到达的 StreamDataArrived 才算「本次 Play 之后的数据」，据此开出画观察窗。
          - 记录用户来源的 Pause，恢复重放的 Pause 继承 origin:'user'。
        codeRefs:
          - packages/player/src/plugins/pluginErrorHandler.ts
        docRefs:
          - docs/design/5-capabilities/guard/error-recovery.md
      - id: app.plugins.error.global-capture
        name: 全局异常兜底
        responsibility: 监听 window error / unhandledrejection，把漏网的同步异常与未处理 Promise 拒绝记为 Error 级日志；不触发恢复流程。
        codeRefs:
          - packages/player/src/plugins/pluginGlobalErrorCapture.ts

  - id: app.plugins.stats
    parent: app.plugins
    name: 统计与埋点
    kind: group
    responsibility: 播放统计采集（码率、帧率、延迟、卡顿、字节数、请求数等）写入统计模型、起播里程碑事件、端到端时间校准，以及基于 RMS SDK 的会话级埋点上报。不负责对外统计快照的投影（归 infra.player-index）。
    docRefs:
      - docs/design/5-capabilities/stats/statistic-plugins.md
      - docs/design/5-capabilities/stats/statistic-record-samplers.md
      - docs/design/5-capabilities/stats/tracking-report-plugins.md
      - docs/design/6-features/player-get-stats.md
    children:
      - id: app.plugins.stats.statistic
        name: 播放统计采集
        responsibility: 按方案装配的统计插件（基类 + FLV / MP4·HLS 两条腿）：采集码率、帧率、音画同步、画面延迟账本（关键帧 pts → 推流端 SEI 时刻）、卡顿段、不可见时长、拉流字节 / 请求 / 失败数，写入统计模型并发 NetworkSpeedChange。换腿重装时累计值由统计模型承接、插件只追加。
        principle: |
          - 码率按「收到的 bit ÷ 同期媒体时间戳前进时长」计算（FLV 成批推送、HLS 突发下载都不受推送节奏影响）；HLS 用分片时长（EXTINF）作分母。
          - 时间轴不连续（倒退 / 大幅前跳 / 换流）时重新起算，攒够前保持上一次读数。
          - 换腿重装以 `hasFirstRendered` 判据在派生腿 init 末尾续表（maybeResumeOnMount）。
          - 定时计算交给 record 采样器，基于共享定时器。
        codeRefs:
          - packages/player/src/plugins/pluginStatisticBase.ts
          - packages/player/src/plugins/pluginStatisticFlv.ts
          - packages/player/src/plugins/pluginStatisticMp4.ts
        docRefs:
          - docs/design/5-capabilities/stats/statistic-plugins.md
      - id: app.plugins.stats.samplers
        name: 统计采样器
        responsibility: 一组按周期结算的统计采样器（速率、累加、平均、方差、标准差、解码信息），挂在共享定时器上，供统计与快照插件复用。
        provides: [if.plugins.stats.recordSampler]
        codeRefs:
          - packages/player/src/plugins/record/**
        docRefs:
          - docs/design/5-capabilities/stats/statistic-record-samplers.md
      - id: app.plugins.stats.milestones
        name: 起播里程碑
        responsibility: 以 Play 命令为起点，把首次连接 / 首包 / 首个解析数据 / 首帧渲染翻译成 FirstLoad / FirstData / FirstFrame 事件（带耗时），供统计、重连、时移、埋点等订阅。
        codeRefs:
          - packages/player/src/plugins/pluginPipeline.ts
      - id: app.plugins.stats.tracker
        name: 会话埋点上报
        responsibility: 基于外部 RMS SDK（self.RMS，未加载则 no-op）的播放会话埋点：用户 Play 开 scope、Stop / Reset / Destroy 结算，内部恢复并入当前会话；周期上报 gauge、命令审计、触发式帧级窗口上报。
        principle: |
          - 会话边界以 UserAction 为准（只有公开 API 发出），内部恢复的同名命令不切会话。
          - 10s 周期 gauge（码率 / 延迟 / fps / buffer），2min 轮转 root span、30min 兜底超时；失败或页面关闭来不及发的切片落 IndexedDB 下次回放。
          - `FrameInfoRecorder` 维护帧级环形缓存（parse → append → render 各时刻），触发时取前 10s / 后 5s 窗口并按 keepalive 字节预算分片。
        codeRefs:
          - packages/player/src/plugins/pluginTracker.ts
          - packages/player/src/plugins/tracker/**
        docRefs:
          - docs/design/5-capabilities/stats/tracking-report-plugins.md
      - id: app.plugins.stats.time-calibrator
        name: 时间校准
        responsibility: 起播时请求授时服务（no-store + 一次性地址），用 Resource Timing 取响应中点估算服务器墙钟，并与单调钟成对锚定，供端到端延迟计算；失败有限次重试。
        codeRefs:
          - packages/player/src/plugins/pluginTimeCalibrator.ts

  - id: app.plugins.device
    parent: app.plugins
    name: 可见性与设备
    kind: group
    responsibility: 页面可见性事实的发布与压后台 / 回前台的播放处理，以及播放期间防止设备休眠。
    docRefs:
      - docs/design/5-capabilities/guard/visibility.md
    children:
      - id: app.plugins.device.visibility
        name: 可见性
        responsibility: 监听 document.visibilitychange 发布 VisibilityChange；压后台且正在播放时发 Pause，回前台只发 Resume（不重新播放，后台期间被停归重连或用户）。
        codeRefs:
          - packages/player/src/plugins/pluginVisibility.ts
          - packages/player/src/plugins/pluginVisibilityHandler.ts
        docRefs:
          - docs/design/5-capabilities/guard/visibility.md
      - id: app.plugins.device.no-sleep
        name: 防休眠
        responsibility: 播放中（按方案 / 播放模式 / 可见性判定）开启 Wake Lock，不支持时退化为循环播放的隐藏 video；离开播放即释放。
        codeRefs:
          - packages/player/src/plugins/pluginNoSleep.ts

  - id: app.plugins.diagnostics
    parent: app.plugins
    name: 日志与调试
    kind: group
    responsibility: 日志输出、开发调试数据采集与上报、页面内播放器信息浮层；不参与播放控制。
    children:
      - id: app.plugins.diagnostics.logger
        name: 日志输出
        responsibility: 订阅 Log 事件，按级别格式化输出到控制台。
        codeRefs:
          - packages/player/src/plugins/pluginLogger.ts
      - id: app.plugins.diagnostics.debug
        name: 调试快照与上报
        responsibility: 运行时度量快照（PluginSnapshot / 帧缓冲快照 PluginSnapshotFrame）与调试心跳上报（PluginDebug，开启 framework 内部耗时采集并 POST 到调试服务；当前在组合根中注释未装配）。
        provides: [if.plugins.diagnostics.runtimeSnapshot]
        codeRefs:
          - packages/player/src/plugins/pluginDebug.ts
          - packages/player/src/plugins/pluginSnapshot.ts
          - packages/player/src/plugins/pluginSnapshotFrame.ts
      - id: app.plugins.diagnostics.player-info
        name: 播放器信息浮层
        responsibility: 在播放器容器上渲染方案、分辨率、码率、延迟、缓冲等实时信息的 DOM 浮层，随事件与统计更新。
        codeRefs:
          - packages/player/src/plugins/pluginPlayerInfo.ts

  - id: app.plugins.support
    parent: app.plugins
    name: 插件公共支撑
    kind: group
    responsibility: 插件共用的小工具与类型：把周期任务生命周期绑定到播放会话状态（构造未起播 / stop 后不常驻定时任务）、插件公共类型；以及当前无引用方的旧帧策略基类 PluginStrategyBase。
    provides: [if.plugins.support.statusScopedIntervalTask]
    codeRefs:
      - packages/player/src/plugins/statusScopedIntervalTask.ts
      - packages/player/src/plugins/plugin.types.ts
      - packages/player/src/plugins/pluginStrategyBase.ts

  # ════════════════════════════ app.timeshift ════════════════════════════
  - id: app.timeshift.shell
    parent: app.timeshift
    name: 协调器插件外壳
    kind: component
    responsibility: PluginTimeShiftCoordinator：常驻全局插件，apply 时组装协调器依赖（腿端口薄代理、腿视图、录制腿驱动工厂、命令前置 Hook、全局错误链、事件、会话探测 probeInfo、事实快照）并启动核心协调器；对 Player 暴露回直播、拖进度换腿、位置换算等入口；组合持有 Fhls 切后台续播与非活动腿字节计量。
    principle: |
      - `legs` 是每次调用才 `getSolution().legs` 的手写白名单薄代理（「现取」）；`legView` 按运行时形状窄读 `SolutionLegs.records` 的腿内总线与流模型。
      - `probeInfo(url)` 复用点播链：临时建探测腿（真实 HlsModel + HLS 加载段，腿号自增），拉清单、定位窗口首片求原点后撤腿；首片按点播退避表重试 2 次。
      - `setActiveLeg` 不写数据，只与 `context.data.activeLeg` 投影比对记日志。
      - `TimeShiftLegByteMeter` 订阅非活动腿腿内总线，把下载字节直接计入统计模型，与统计插件按活动腿互斥。
    provides: [if.timeshift.shell.api]
    dataStructures: [ds.PluginTimeShiftCoordinatorOptions]
    codeRefs:
      - packages/player/src/plugins/timeshift/timeShiftCoordinatorShell.ts
      - packages/player/src/plugins/timeshift/timeShiftLegByteMeter.ts
    docRefs:
      - docs/design/6-features/timeshift/leg-switch.md
  - id: app.timeshift.coordinator
    parent: app.timeshift
    name: 时移会话协调器
    kind: component
    responsibility: TimeShiftCoordinator：时移会话状态机（待命 → 武装 → 换边 → 灰度 → 上屏 / 放弃 / 回直播）的唯一编排者；订阅全局事件、命令前置 Hook、错误链与两条腿的腿内总线，按 Domain 纯函数结论调腿端口与录制腿驱动，发布 TimeShiftHandoffDone / Started / SupplyIssue / Failed 等公开事件。只接线、不含判定规则。
    principle: |
      - 武装：用户暂停（Pause{origin:'user'}）且 `shouldArm` 成立 → 记会话记录（时移地址 / 解密）→ 处理后队列截流 + `holdLeg('primary')` 关直播段尾阀（关阀点 = 接点 K）→ `createLeg('timeshift', {Hls, Vod})` → 建录制腿驱动 → 会话探测。
      - 重判：直播接点队列进出、录制片落地、时间基准求精时调 `decideLeg(anchor, recordStart, recordHead, …)`；switch → `switchLeg('timeshift', {cutPts, originPts})`（换腿事务由 Solution 执行）；give-up → 放弃出口并放流放阀。
      - 墙钟模式常量 C（录制原始 pts + C = 直播轴）只求一次后 `setTimeline`；清单轴原点 = startPts + C。
      - 续播裁决：已对接进灰度区，否则当场放弃 `not-catching-up`；放流放阀在 Resume 前置 Hook 内、先于状态迁移完成。
      - 收口：Stop / Idle / Switch / Destroy 结束会话；每次收口推进会话代次，所有 await 之后按代次丢弃迟到续体。
    provides:
      - if.timeshift.coordinator.lifecycle
      - if.timeshift.coordinator.legPort
    dataStructures:
      - ds.TimeShiftCoordinatorDeps
      - ds.TimeShiftFacts
      - ds.TimeShiftProbeResult
      - ds.TimeShiftLegModelView
      - ds.TimeShiftLegResult
    codeRefs:
      - packages/player/src/plugins/timeshift/timeShiftCoordinator.ts
      - packages/player/src/plugins/timeshift/timeShiftCoordinatorTypes.ts
      - packages/player/src/plugins/timeshift/timeShiftSessionMath.ts
    docRefs:
      - docs/design/6-features/timeshift/leg-switch.md
      - docs/design/6-features/timeshift/guardrail-contracts.md
      - docs/design/2-assembly/leg-switch-transaction.md
  - id: app.timeshift.frame-ledger
    parent: app.timeshift
    name: 接点与帧队列记账
    kind: component
    responsibility: 协调器的纯记账部件：直播处理后队列视频帧与关键帧轨迹（接点 K 的来源）、录制腿解析后视频快照（recordStart / recordHead / 关键帧表）、两条腿腿内总线的消息分流、处理后队列截流 / 放流记账。不订阅全局总线、不含判定规则。
    principle: |
      - `LiveAnchorQueue` 按 pts 精确匹配移除 Output / Drop 帧，关键帧轨迹只在 Input 更新、帧被消费后仍保留，供 `resolveAnchor` 用「最后关键帧 + GOP 均距」推算接点。
      - `RecordingSnapshot` 只暴露原始 pts 的最小 / 最大与关键帧表，C 由协调器读取时施加。
      - `PlayQueueHoldWiring`：端口返回 ok 才置 held；换边成功由事务放流、只改记账；Stop / Switch / Destroy 零端口调用复位。
    dataStructures: [ds.RawFrame]
    codeRefs:
      - packages/player/src/plugins/timeshift/timeShiftAnchorSnapshot.ts
      - packages/player/src/plugins/timeshift/timeShiftPrimaryBusWiring.ts
      - packages/player/src/plugins/timeshift/timeShiftRecordingBusWiring.ts
      - packages/player/src/plugins/timeshift/timeShiftPlayQueueHold.ts
  - id: app.timeshift.recording-driver
    parent: app.timeshift
    name: 回看腿待命驱动
    kind: component
    responsibility: RecordingLegDriver：回看腿（playMode Vod 的 HLS Load 段）待命期间替代未装配的点播加载策略，完成「拉清单 → 定位接点所在片 → 有界预取 → 清单刷新 → 逐片落地」，直到腿升为活动后由点播加载策略接手。
    principle: |
      - 定位：墙钟模式按接点墙钟找片；pts 模式末片抽样 + 就近修正（跳片先 DropAllBuffer）；拖进度给出 positionMs 时直接拉含该位置的片。
      - 在途请求按绝对下标记账，窗口前移不反算；失败按 `vodLoadFailureBackoffMs` 退避重拉同一片；抽样片已滚出窗口则重新定位，接点早于窗口首片则停 idle 交协调器判。
      - 预取量由 Domain `decidePrefetch` / `resolveLegPlaybackBuffer` 决定，清单刷新复用共享 `HlsPlaylistRefreshScheduler`。
      - 指令只经腿句柄 dispatch（LoadStreamInfo / UpdatePlaylist / DropAllBuffer），事件只经腿内总线。
    provides: [if.timeshift.recording-driver.driver]
    dataStructures: [ds.RecordingAnchorSnapshot]
    codeRefs:
      - packages/player/src/plugins/timeshift/recordingLegDriver.ts
    docRefs:
      - docs/design/6-features/timeshift/leg-switch.md
  - id: app.timeshift.grace
    parent: app.timeshift
    name: 灰度区控制
    kind: component
    responsibility: TimeShiftGraceController：换腿提交到录像上屏之间的灰度区计时与回退判定；出口只有三种——上屏收口、新建直播腿回退、录制出错经错误恢复从直播重起。
    principle: |
      - 触发源：未出画计时（暂停期冻结）、全局连续拉片失败（≥3）、全局错误链（放行清单内 Warn 原样放行，其余消费并走从直播重起）。
      - 判定调 Domain `decideGrace`；每个出口先置未激活再回调，保证一次性。
    codeRefs:
      - packages/player/src/plugins/timeshift/timeShiftGraceController.ts
    docRefs:
      - docs/design/6-features/timeshift/leg-switch.md
  - id: app.timeshift.live-recovery
    parent: app.timeshift
    name: 上屏后监视与回直播
    kind: component
    responsibility: 上屏后的供数监视记账（出画停滞 T1、录制拉片连败 T2、录制已结束 T3，只发 SupplyIssue 不自动回直播）与回直播恢复流程编排（用户 backToLive、拖进度落点超时、灰度回退）。
    principle: |
      - `StarvationMonitor` 纯记账：零端口、零事件、零定时器；协调器约 1s tick 喂入，归约调 Domain `starvationEvent` / `isStarved`。
      - `LiveLegRecoveryFlow.recover(trigger)`：`ensureLiveLeg` 建新直播腿 → 定向 LoadData → 8s 内等首帧判据（首关键帧起水位 ≥ 直播起播水位）→ `revertLiveLeg` 换回 → setActiveLeg('live') → `withdrawLeg('timeshift')` → 会话收口。
      - 顺序硬约束：首帧未就绪绝不换边；失败出口统一 `failAttempt`（用户触发兑现 false，自动触发交错误恢复）；连败 3 次收口，防无限建腿。
    codeRefs:
      - packages/player/src/plugins/timeshift/timeShiftStarvationMonitor.ts
      - packages/player/src/plugins/timeshift/timeShiftLiveLegRecovery.ts
    docRefs:
      - docs/design/6-features/timeshift/leg-switch.md
  - id: app.timeshift.seek-switch
    parent: app.timeshift
    name: 拖进度换腿
    kind: component
    responsibility: SeekSwitchFlow：直播态 seek(ms) 的整条换腿事务——冻结当前帧、建录制腿并按清单轴定位、等落点首帧、seekSwitchLeg 换边、协调器接管并撤直播腿、冻结中点播 seek 定位、解冻；提交前失败留在直播（不进错误链），用户暂停 / 回直播 / stop 撤销。
    principle: |
      - 判定调 Domain `shouldSeekSwitch` / `resolveSeekSwitchTarget` / `seekSwitchReady` / `seekSwitchUnfreezeGate`。
      - 每个 await 后比对尝试代次，迟到续体不再调端口；落点首帧等待上限 8s。
      - 本流程自己发的内部 Seek 以 options.source='Internal' 标记，不被当作用户再次拖动。
    codeRefs:
      - packages/player/src/plugins/timeshift/timeShiftSeekSwitchFlow.ts
    docRefs:
      - docs/design/6-features/timeshift/leg-switch.md
  - id: app.timeshift.background-resume
    parent: app.timeshift
    name: Fhls 切后台续播
    kind: component
    responsibility: TimeShiftBackgroundResume：Fhls 方案下用户暂停后从后台续播时，原生续播接不上则原地重装呈现（盖截图 → 换新 SW 流 → 定位暂停点 → 细定位 → 撤图），8s 兜底无画则回直播并发 TimeShiftResumeUnavailable{vod-resume-failed}；回直播后同样重装到直播边缘。只管时序，判据在 Domain。
    codeRefs:
      - packages/player/src/plugins/timeshift/timeShiftBackgroundResume.ts
    docRefs:
      - docs/design/6-features/timeshift/leg-switch.md
  - id: app.timeshift.source-wiring
    parent: app.timeshift
    name: 时移源接线
    kind: component
    responsibility: TimeShiftSourceWiring：时移地址登记响应与预解析、清单概况（时移口径 VideoDurationChange）的记账与补发、清单轴位置换算（positionAt）、暂停中放弃时直接发 Error{TimeShiftResumeUnavailable}（不进错误链）。
    principle: |
      - 「换不出来就不发」：录制末端或渲染轴基准（mediaOriginPts）任缺一样就置待补发，宁可晚发不发错数。
      - 会话收口时把清单轴原点定格；新建直播腿换回后直接清账（新连接时间轴不接旧轴）。
    codeRefs:
      - packages/player/src/plugins/timeshift/timeShiftSourceWiring.ts
    docRefs:
      - docs/design/6-features/timeshift/leg-switch.md

relations:
  # ── app.plugins · 缓冲策略 ──
  - id: rel.plugins.mse-live-strategies
    from: app.plugins.buffer-strategy.mse-live
    to: app.strategies
    type: depends
    description: 继承 PluginBasePlayStrategy，复用追帧判定报告 mseChasingDecision
  - id: rel.plugins.mse-live-math
    from: app.plugins.buffer-strategy.mse-live
    to: app.plugins.buffer-strategy.water-level-math
    type: calls
    mode: sync
    interface: if.plugins.buffer.resolveMseChasingSeekMs
    description: 追帧偏移换算成渲染 Seek 绝对毫秒
  - id: rel.plugins.mse-live-mus
    from: app.plugins.buffer-strategy.mse-live
    to: infra.mus
    type: depends
    description: 直接 import mus/render/mse 的 bufferGapDecision、bufferRecycleRange 纯判定
  - id: rel.plugins.mse-live-index
    from: app.plugins.buffer-strategy.mse-live
    to: infra.player-index
    type: depends
    description: 经 modelAccess.requireMseModel 取 MSE 播放模型
  - id: rel.plugins.mse-live-domain
    from: app.plugins.buffer-strategy.mse-live
    to: domain.services
    type: depends
    description: 读 HLS 直播追帧默认参数 HLS_LIVE_CATCHUP_DEFAULTS
  - id: rel.plugins.mse-live-events
    from: app.plugins.buffer-strategy.mse-live
    to: infra.framework
    type: event
    mode: async
    description: 订阅 BufferChange / PlayerStatusChange，驱动起冲停冲、追帧与回收
  - id: rel.plugins.mse-live-commands
    from: app.plugins.buffer-strategy.mse-live
    to: infra.framework
    type: calls
    mode: async
    description: 发 FillBuffer / StopFillBuffer 命令与渲染 Seek、SourceBuffer 清理动作
  - id: rel.plugins.fhls-live-strategies
    from: app.plugins.buffer-strategy.fhls-live
    to: app.strategies
    type: depends
    description: 继承 PluginBasePlayStrategy
  - id: rel.plugins.fhls-live-index
    from: app.plugins.buffer-strategy.fhls-live
    to: infra.player-index
    type: depends
    description: 经 modelAccess.requireFhlsModel 读渲染轴零点等 Fhls 播放模型
  - id: rel.plugins.fhls-live-domain
    from: app.plugins.buffer-strategy.fhls-live
    to: domain.services
    type: calls
    mode: sync
    description: 看门狗判据 judgeNotRendering / judgeProgressStalled / judgeConsumeGap（fhlsPresentationHealth）
  - id: rel.plugins.fhls-live-events
    from: app.plugins.buffer-strategy.fhls-live
    to: infra.framework
    type: event
    mode: async
    description: 订阅 BufferChange / FhlsSegmentConsumed / PlayerStatusChange
  - id: rel.plugins.fhls-live-commands
    from: app.plugins.buffer-strategy.fhls-live
    to: infra.framework
    type: calls
    mode: async
    description: SendBuffer 命令与动作、看门狗判出时 handleError
  - id: rel.plugins.live-adaptive-domain
    from: app.plugins.buffer-strategy.live-adaptive
    to: domain.services
    type: calls
    mode: sync
    payload: [ds.BufferThresholds]
    description: 创建并喂入 SelfAdaptive / SupplyAware / CadenceSwitch 控制器与积压检测器，取回阈值结论
  - id: rel.plugins.live-adaptive-events
    from: app.plugins.buffer-strategy.live-adaptive
    to: infra.framework
    type: event
    mode: async
    description: 订阅 bufferSize 观测与 PlayerStatusChange；上报 BufferThresholdChange 等 Track
  - id: rel.plugins.live-adaptive-settings
    from: app.plugins.buffer-strategy.live-adaptive
    to: infra.framework
    type: calls
    mode: sync
    payload: [ds.BufferThresholds]
    description: 经 context.settings 写回缓冲四阈值与 latencyDropAllowed，卸载时还原
  - id: rel.plugins.vod-adaptive-domain
    from: app.plugins.buffer-strategy.vod-adaptive
    to: domain.services
    type: calls
    mode: sync
    description: vodAdaptiveBufferPolicy：EWMA 更新、T_load 预测、deriveVodBufferThresholds
  - id: rel.plugins.vod-adaptive-models
    from: app.plugins.buffer-strategy.vod-adaptive
    to: domain.models
    type: depends
    description: assertHlsStreamModel 断言 HLS 流模型以查分片时长
  - id: rel.plugins.vod-adaptive-fw
    from: app.plugins.buffer-strategy.vod-adaptive
    to: infra.framework
    type: event
    mode: async
    description: 订阅分片 LoadStart / DataArrived / Loaded；挂 SetPlaybackRate / Seek 命令钩子；经 settings 写回阈值
  - id: rel.plugins.water-level-mus
    from: app.plugins.buffer-strategy.water-level-math
    to: infra.mus
    type: depends
