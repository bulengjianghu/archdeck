interfaces:
  # ── app.plugins ──
  - id: if.plugins.reconnect.decide
    name: decideReconnect
    owner: app.plugins.network.reconnect
    signature: |
      function decideReconnect(
        state: ReconnectState,
        input: ReconnectInput,
        facts: ReconnectFacts,
      ): { state: ReconnectState; effects: ReconnectEffect[] };
      function isReconnectFault(code: string): boolean;
      function resolveReconnectConfig(raw?: Partial<ResolvedReconnectConfig>): ResolvedReconnectConfig;
      function resolveStallThreshold(i: { stallTimeout: number; isHls: boolean; targetDurationMs?: number }): number;
      const RECONNECT_CODES: { connectTimeout; noFrameTimeout; streamStalled; networkOffline };
    description: 直播重连纯判定：无 IO、无定时器、不读播放器，全部分支在此，L1 直接测。
    semantics: |
      - 调用方必须逐条按序执行返回的 effects，并以返回的 state 覆盖旧状态。
      - attemptTimeout / delayElapsed / beforeRetryResult 携带 seq，seq 不等于当前 state.seq 的输入被忽略（过期）。
      - 点播或时移态（facts.live=false / timeShiftMode）下不开新一轮；userCancel 优先于点播判断，保证切点播后也能收尾。
      - 用尽次数或 beforeRetry 返回 false 时给出 reportTerminal{exhausted|aborted}，之后进入 settling 收尾窗口。
  - id: if.plugins.reconnect.takeResumeRetry
    name: PluginNetworkReconnect.takeResumeRetry
    owner: app.plugins.network.reconnect
    signature: |
      class PluginNetworkReconnect extends PluginBase {
        takeResumeRetry(): Promise<unknown> | undefined;
      }
    description: Player.resume() 专用：取走本次续播触发的那次重试。
    semantics: 只能取一次；本轮不在挂起中时返回 undefined，调用方照常投递 Resume。重试 Play 被接受时 resolve，本轮先结束则 reject（无人取走时不产生未处理 rejection）。
  - id: if.plugins.buffer.decideMediaBuffer
    name: decideMediaBuffer
    owner: app.plugins.buffer-strategy.water-level-math
    signature: |
      const decideMediaBuffer: (input: {
        bufferedStart: number;
        bufferedEnd: number;
        currentPlaybackTime: number;
        maxStartPts: number;      // 首帧可能的最大起点（ptsBase - dtsBase）
      }) => number;               // 当前水位（毫秒）
    description: MSE 当前水位：已缓冲末端相对当前播放位置的余量；直播 currentTime 尚未走到起点时按整段缓冲长度算。
    semantics: 纯函数；由点播 MSE 策略使用，直播 MSE 不用。
  - id: if.plugins.buffer.decideBufferCount
    name: decideBufferCount
    owner: app.plugins.buffer-strategy.water-level-math
    signature: |
      const decideBufferCount: (input: {
        frames: readonly BufferFrameInfo[];
        duration: number;          // 要补的毫秒数
      }) => number;                // 该送的帧数
    description: 把「要补 duration 毫秒」换算成队列里该送多少帧（二分查找第一个超出目标 pts 的下标）。
    semantics: 纯函数；被点播 MSE 与 Fhls 连续呈现点播策略使用。
  - id: if.plugins.buffer.resolveMseChasingSeekMs
    name: resolveMseChasingSeekMs
    owner: app.plugins.buffer-strategy.water-level-math
    signature: |
      function resolveMseChasingSeekMs(input: {
        ranges: readonly (readonly [number, number])[]; // <video> 已缓冲区间（秒）
        currentTimeSec: number;
        offsetMs: number;                               // 追帧偏移
        frameDurationMs: number;
        bufferDurationMs: number;                       // 可播缓冲
      }): number | undefined;                       // 绝对目标（毫秒）
    description: 追帧偏移量换算成渲染 Seek 的绝对媒体时间；未命中返回 undefined，调用方据此决定是否发 Seek。
    semantics: 渲染 Seek 只有绝对语义；MSE 直播水位策略与直播 HLS 加载策略共用。
  - id: if.plugins.buffer.fhlsWatchdog
    name: FhlsContinuousWatchdog
    owner: app.plugins.buffer-strategy.fhls-live
    signature: |
      class FhlsContinuousWatchdog {
        constructor(host: FhlsContinuousWatchdogHost);
        onSegmentConsumed(): void;           // FhlsSegmentConsumed 时调用
        onStatusChange(next: PlayerStatus): void;
        onSegmentInput(): void;              // 重封装器 Input 到达时调用
        onSegmentOutput(): void;
        checkStalled(segmentSequence: number, progressSequence: number | undefined): void;
        resetStartup(): void;                // Play / Stop / Reset 时归零
        resetConsumeGap(): void;
        reset(): void;
      }
    description: Fhls 连续呈现三条看门狗：未渲染（起播）、进度停滞、暂停→恢复消费间隔。
    semantics: 判出未渲染 / 停滞经 host.raise 上抛 MuVideoRenderError，消费间隔只报 Warn；不自行恢复。错误 module 字段由宿主传入，须保持 PluginFhlsBufferStrategy。
  - id: if.plugins.network.getStatus
    name: PluginNetworkMonitor.getStatus
    owner: app.plugins.network.monitor
    signature: |
      getStatus(): NetworkStatus;   // Unknown / Online / Offline / Unstable
    description: 读取监测插件当前判定的网络状态。
  - id: if.plugins.support.statusScopedIntervalTask
    name: createStatusScopedIntervalTask
    owner: app.plugins.support
    signature: |
      const PLAYBACK_SESSION_STATUSES: ReadonlySet<PlayerStatus>;
      function createStatusScopedIntervalTask(
        task: () => void,
        timeoutMs: number,
        aliveStatuses: ReadonlySet<PlayerStatus>,
        options?: SharedIntervalTaskOptions,
      ): StatusScopedIntervalTask;
      interface StatusScopedIntervalTask {
        readonly active: boolean;
        sync(status: PlayerStatus): void;  // 进入存活集合注册，离开注销；幂等
        dispose(): void;                   // 注销并拒绝之后的注册
      }
    description: 把一条 sharedIntervalTimer 周期任务的生命周期绑到播放会话状态上。
    semantics: init() 中创建后先 sync(stateModel.status)，再把 PlayerStatusChange.newStatus 转发给 sync；onDestroy() 中 dispose()。
  - id: if.plugins.stats.recordSampler
    name: RecordBase
    owner: app.plugins.stats.samplers
    signature: |
      abstract class RecordBase {
        start(space?: number): void;   // 默认 1000ms 周期结算
        stop(): void;
        append(value: any): void;
        getValue(): any;
        protected abstract caculate(): void;
      }
      // 实现：RateRecord / SumRecord / AverageRecord / VarianceRecord /
      //       StandardDeviationRecord / DecodeInfoRecord
    description: 周期结算的统计采样器基类，挂在共享定时器上。
    semantics: start 会先 stop 再重新计时；周期时长为 0 时不结算。
  - id: if.plugins.diagnostics.runtimeSnapshot
    name: RuntimeSnapshot
    owner: app.plugins.diagnostics.debug
    signature: |
      interface RuntimeSnapshot {
        getMeasures: () => any;
        getRuntimeInfo: () => any;
      }
    description: 调试插件读取的运行时度量快照口。

  # ── app.timeshift ──
  - id: if.timeshift.shell.api
    name: PluginTimeShiftCoordinator
    owner: app.timeshift.shell
    signature: |
      class PluginTimeShiftCoordinator extends PluginBase {
        constructor(options: { getSolution: () => { legs: TimeShiftLegPort } | undefined });
        backToLive(): Promise<boolean>;
        canSeekSwitch(): boolean;
        seekSwitch(ms: number): Promise<boolean>;
        seekSwitchInFlight(): boolean;
        onUserPauseDuringSeekSwitch(): Promise<void> | undefined;
        onUserResumeDuringSeekSwitch(): void;
        positionAt(pts: number): number | undefined;  // 清单轴毫秒
        reinstallPresentationForLive(): void;
      }
    description: Player 调用的时移入口：回直播、直播中拖进度换腿、VideoRendered.positionMs 换算。
    semantics: |
      - 须在 bootstrapSolution 之后、PluginErrorHandler 之前注册（全局错误链按注册顺序调用）。
      - 未登记时移地址时零端口调用、零网络请求、零时移事件。
      - backToLive 兑现 false 表示未换回（被撤销或失败），不报错。
  - id: if.timeshift.coordinator.lifecycle
    name: TimeShiftCoordinator
    owner: app.timeshift.coordinator
    signature: |
      class TimeShiftCoordinator {
        constructor(deps: TimeShiftCoordinatorDeps);
        start(): void;
        dispose(): void;
        reanchorGraceTo(positionMs: number): void;
        endSessionForRestart(): void;
      }
    description: 时移核心协调器：依赖全部注入，可在替身环境独立测试。
    semantics: start 后才订阅；dispose 后零端口调用。每次会话收口推进代次，await 之后按代次丢弃迟到续体。
  - id: if.timeshift.coordinator.legPort
    name: TimeShiftLegPort
    owner: app.timeshift.coordinator
    signature: |
      interface TimeShiftLegPort {
        createLeg(legId, { url, loadMode, playMode, timeline? }): Promise<TimeShiftLegResult<{ legId; handle; controller }>>;
        holdLeg(legId): Promise<TimeShiftLegResult<void>>;
        releaseLeg(legId, { fromPts?, spliceIfTrimmed? }?): Promise<TimeShiftLegResult<void>>;
        holdPlayQueue?(): Promise<TimeShiftLegResult<void>>;
        releasePlayQueue?({ flush }): Promise<TimeShiftLegResult<void>>;
        setTimeline(legId, offset): Promise<TimeShiftLegResult<void>>;
        switchLeg(legId, { cutPts, originPts?, timeShiftNeedsDecryption? }): Promise<TimeShiftLegResult<{ legId; cutPts }>>;
        revertLeg(legId, { cutPts }): Promise<TimeShiftLegResult<{ legId; cutPts }>>;
        ensureLiveLeg?(): Promise<TimeShiftLegResult<{ legId; handle }>>;
        revertLiveLeg?(): Promise<TimeShiftLegResult<{ legId; cutPts }>>;
        seekSwitchLeg?(legId, { landingPts, originPts? }): Promise<TimeShiftLegResult<{ legId; cutPts }>>;
        withdrawLeg(legId): Promise<TimeShiftLegResult<void>>;
        getActiveLeg(): string;
      }
    description: 协调器所需的窄腿端口（需求方声明），是 Solution LegPort 的结构性子集，由 app.solution 的 SolutionLegs 满足；不 import 真身。
    semantics: |
      - 腿号 'primary' = 直播主腿，'timeshift' = 回看腿，探测腿 'timeshift-probe-<n>'。
      - 可选方法缺失时协调器按失败计，不静默空转；外壳薄代理是手写白名单，端口新增方法须同步转发。
      - 失败一律以 ok:false 返回，不抛异常；换边事务提交前失败由 Solution 回滚。
  - id: if.timeshift.recording-driver.driver
    name: RecordingLegDriver / TimeShiftDriver
    owner: app.timeshift.recording-driver
    signature: |
      interface TimeShiftDriver {
        start(): void;
        poke(): void;              // 接点变化后重新评估定位 / 预取
        dispose(): void;           // 先撤订阅再清定时器
        recordEnded?(): boolean;   // ENDLIST ∧ 已落地末片
        anchorRolledOut?(): boolean;
      }
      class RecordingLegDriver implements TimeShiftDriver {
        constructor(deps: { leg: RecordingLegHandle; bus: RecordingLegBus; model: HlsModel;
          anchor: () => RecordingAnchorSnapshot | undefined; log?(m: string): void });
        readonly phase: 'idle' | 'locating' | 'prefetching' | 'holding' | 'disposed';
      }
    description: 回看腿待命期的取片驱动；腿升为活动后由协调器 dispose，点播加载策略接手。
    semantics: anchor() 返回 undefined 时等待；连续拉片失败按点播退避重试，放弃与否交协调器判。

dataStructures:
  # ── app.plugins ──
  - id: ds.ReconnectState
    name: ReconnectState
    definition: |
      type ReconnectPhase = 'idle' | 'guarding' | 'waiting' | 'asking' | 'suspended';
      interface ReconnectState {
        phase: ReconnectPhase;
        seq: number;              // 每开定时器 / 发回调前进，过期结果按它丢弃
        failed: number;           // 本轮已失败的重试次数
        retrying: boolean;        // guarding 是重试（true）还是守护首次起播
        dataSeen: boolean;        // 本次 Play 后是否收到过数据
        firstRetryTime?: number;
        lastError?: ReconnectError;
        url?: string;
        pendingUrl?: string;      // 挂起期间拿到的 beforeRetry 地址
        hidden: boolean; offline: boolean; userPaused: boolean;
        settling: boolean;        // 一轮结束后到状态回到非播放态之前的收尾窗口
      }
    description: 直播重连一轮的判定状态，由插件持有、交纯函数推进。
    invariants: 挂起原因（hidden / offline / userPaused）任一为真时 phase 为 suspended 或 idle；settling 期间不开新一轮。
  - id: ds.ReconnectInput
    name: ReconnectInput
    definition: |
      type ReconnectInput =
        | { kind: 'userPlayAccepted'; url?: string } | { kind: 'userCancel' }
        | { kind: 'userPause' } | { kind: 'userResume' }
        | { kind: 'fault'; error: ReconnectError }
        | { kind: 'dataArrived' } | { kind: 'firstFrame' }
        | { kind: 'attemptTimeout'; seq: number } | { kind: 'delayElapsed'; seq: number }
        | { kind: 'beforeRetryResult'; seq: number; result: string | false }
        | { kind: 'stallCheck'; idleMs: number; thresholdMs: number; immediate?: boolean }
        | { kind: 'visibility'; hidden: boolean } | { kind: 'network'; online: boolean }
        | { kind: 'settled' };
    description: 插件把事件翻译成的判定输入。
  - id: ds.ReconnectEffect
    name: ReconnectEffect
    definition: |
      type ReconnectEffect =
        | { type: 'stop' } | { type: 'play'; url: string } | { type: 'clearTimers' }
        | { type: 'startAttemptTimer'; ms: number; seq: number }
        | { type: 'startDelayTimer'; ms: number; seq: number }
        | { type: 'callBeforeRetry'; seq: number; payload: ReconnectRetryPayload }
        | { type: 'callTotalFailed'; payload: ReconnectRetryPayload }
        | { type: 'reportTerminal'; reason: 'exhausted' | 'aborted'; payload: ReconnectRetryPayload }
        | { type: 'setActive'; active: boolean };
    description: 判定给出的待执行动作，插件逐条执行。
  - id: ds.ReconnectFacts
    name: ReconnectFacts
    definition: |
      interface ReconnectFacts {
        live: boolean;
        timeShiftMode: boolean;
        status: PlayerStatus;
        now: number;
        url: string | undefined;
        config: ResolvedReconnectConfig;
      }
    description: 判定时刻的播放器现状快照。
  - id: ds.ResolvedReconnectConfig
    name: ResolvedReconnectConfig
    definition: |
      interface ResolvedReconnectConfig {
        maxRetries: number;    // 默认 3
        delays: number;        // 默认 3000ms
        timeout: number;       // 单次连接 / 出帧时限，默认 15000ms
        stallTimeout: number;  // 断流阈值，默认 15000ms
      }
    description: 归一化后的重连配置。
  - id: ds.FhlsContinuousWatchdogHost
    name: FhlsContinuousWatchdogHost
    definition: |
      interface FhlsContinuousWatchdogHost {
        module: string;            // 报错 module 字段
        status(): PlayerStatus;
        readyState(): number;
        videoBufferEnd(): number;
        currentPts(): number;      // 毫秒
        now(): number;
        raise(error: ErrorBase): void;
      }
    description: Fhls 看门狗的宿主口：状态、就绪度、时钟与错误出口全部由持有方提供。

  # ── app.timeshift ──
  - id: ds.PluginTimeShiftCoordinatorOptions
    name: PluginTimeShiftCoordinatorOptions
    definition: |
      interface PluginTimeShiftCoordinatorOptions {
        getSolution: () => { legs: TimeShiftLegPort } | undefined;  // 每次调用现取
      }
    description: 时移协调器插件的构造参数。
  - id: ds.TimeShiftCoordinatorDeps
    name: TimeShiftCoordinatorDeps
    definition: |
      interface TimeShiftCoordinatorDeps {
        legs: TimeShiftLegPort;
        legView(legId: string): TimeShiftLegView | undefined;   // 腿内总线 + 流模型
        createDriver(d: { leg; bus; model: TimeShiftLegModelView; anchor: () => AnchorSnapshot | undefined;
          config: { buffer?: PlaybackBufferThresholds } }): TimeShiftDriver;
        events: { on(key: string, l: (p: unknown) => void): () => void };
        commands: { onCommand(l: (cmd) => void | Promise<void>): () => void; send?(cmd): Promise<unknown> };
        errors: { register(h: (e: unknown) => unknown): () => void };
        reportError(e: unknown): void;
        emit(e: { key: string; payload?: unknown }): void;
        setActiveLeg(leg: 'live' | 'recording'): void;
        probeInfo(url: string): Promise<TimeShiftProbeResult>;
        facts(): TimeShiftFacts;
        backgroundResumeInFlight?(): boolean;
        reinstallPresentationForLive?(): void;
        // … log、cover / uncoverPresentationForLive
      }
    description: 协调器的依赖注入面，由插件外壳组装为真实接线。
    invariants: onCommand 监听返回 Promise 时外壳 await 后才放行命令（续播放阀须先于状态迁移）。
  - id: ds.TimeShiftFacts
    name: TimeShiftFacts
    definition: |
      interface TimeShiftFacts {
        timeShiftUrl: string | undefined;
        timeShiftNeedsDecryption: boolean | undefined;
        loadMode: string; playMode: string; solution: string;
        frameDurationMs: number;
        mediaOriginPts: number | undefined;   // Mse 播放模型媒体原点；帧方案为 undefined
        liveWallClock: { size: number; ptsAt(wallMs): number | undefined; wallAt(pts): number | undefined } | undefined;
        buffer: PlaybackBufferThresholds | undefined;
      }
    description: 协调器读取的播放器现状快照（地址、模式、方案、媒体原点、直播墙钟轨迹、缓冲阈值）。
  - id: ds.TimeShiftProbeResult
    name: TimeShiftProbeResult
    definition: |
      type TimeShiftProbeResult =
        | { ok: true; value: { durationMs: number; startPts: number; targetDurationMs: number;
            segmentCount: number; endWallMs?: number } }
        | { ok: false; error: unknown; stage?: 'segment' };
    description: 录制清单探测结果（量程、录制原始轴起点、目标分片时长）。
    invariants: startPts 是录制原始轴；清单轴原点在直播轴 = startPts + C。stage 为 segment 时放弃原因归 fetch-failed。
  - id: ds.TimeShiftLegModelView
    name: TimeShiftLegModelView
    definition: |
      interface TimeShiftLegModelView {
        playlist?: { segments: { uri; durationStart; durationEnd }[]; targetDuration: number;
          dateRanges?: { id?; startDate? }[]; endList?: boolean };
        windowStartIndex: number;
        segmentIndex: number;
        getSegmentByIndex(absoluteIndex: number):
          { uri; durationStart; durationEnd; discontinuity?; discontinuityGroupId? } | undefined;
      }
    description: 协调器对回看腿 HLS 流模型的窄只读视图（结构性满足 HlsModel）。
  - id: ds.TimeShiftLegResult
    name: TimeShiftLegResult
    definition: |
      interface TimeShiftLegResult<T> { ok: boolean; value?: T; error?: unknown }
    description: 腿端口各方法的统一结果形状（不抛异常）。
  - id: ds.RecordingAnchorSnapshot
    name: RecordingAnchorSnapshot
    definition: |
      interface RecordingAnchorSnapshot {
        pts: number;             // 接点（直播轴）
        wallMs?: number;         // 有值 = 墙钟模式
        positionMs?: number;     // 拖进度目标（清单轴毫秒）
        ptsOffset?: number;      // 常量 C
        covered: boolean;        // 录制是否已覆盖接点
        aheadOfAnchorMs: number; // 接点之后录制已解析的毫秒数
      }
    description: 协调器交给录制腿驱动的接点快照，驱动不自行重算 covered。
  - id: ds.RawFrame
    name: RawFrame
    definition: |
      interface RawFrame {
        pts: number;
        frameType: string;        // FrameType.I 为关键帧
        generationTime?: number;  // SEI 读出的推流端 Unix 毫秒；录制腿求常量 C 只认它
      }
    description: 协调器从 BufferChange 帧列表中读取的最小帧形状，用于接点队列与录制快照。
