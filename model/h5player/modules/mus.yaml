interfaces:
  - id: if.mus.mu-lifecycle
    name: MU 基础契约（输入 / 输出 / 动作生命周期）
    owner: infra.mus
    signature: |
      abstract class MediaUnit<T extends MediaData | undefined, K extends MediaData | undefined> {
        key: MuKey; nodeId: MuKey; nextMus: MediaUnit[]; previousMus: MediaUnit[];
        abstract support(type?: MediaPacketType): boolean;
        input(data: T): void;                       // 状态非 Running 直接丢弃；support 为假则原样 output
        protected abstract processMediaData(data: T): void;
        protected output(data: T | K): void;        // for (mu of nextMus) mu.input(data)
        handleAction(action: Action): MuActionResponse;
        handleActionAsync(action: Action): Promise<MuActionResponse>;
        protected doAction(action: Action): ActionResponsePayload;
        protected doActionAsync(action: Action): Promise<ActionResponsePayload>;
      }
    description: 所有 MU 实现的数据面与控制面契约；基类由 infra.framework 提供，本区域每个 MU 族按此实现。
    semantics: |
      - 数据面零间接：`output` 直接同步调用每个下游的 `input`，逐帧路径不经 Solution / Plugin / Hook；异步来源（网络、WebCodecs、Worker、wasm 回调）在回调里发起直推。
      - `input` 先检查本节点状态（按 nodeId），非 Running 时丢弃——用来屏蔽 Stop 后迟到的异步输出。
      - 生命周期动作：Init → Load → Play →（Pause / Resume）→ Stop → Destroy；Init / Destroy / Load / Play 在同一命令代次内各恰一次（动作账本判重，`reason: 'restart'` 豁免）。Stop 可重启，Destroy 为终态。
      - 处理与动作中的异常被包装为 MuProcessUnknownError / MuActionUnknownError 抛出；异步回调中的错误经 `handleError` 进错误路由。
  - id: if.mus.factory.createMu
    name: createMu
    owner: infra.mus.factory
    signature: |
      muFactory.createMu(context: Context, muConfig: MuConfig): MediaUnit<MediaPacket | undefined, MediaPacket | undefined> | null
    description: 三段工厂按 MuKey 取得 MU 实例的唯一入口。
    semantics: |
      - `muConfig.type === MuType.Plugin` 时返回包装了 `muConfig.plugin` 的插件节点；缺 plugin 抛错。
      - 同一 MuKey 可能按浏览器能力返回不同实现（VideoFrameRender：MediaStream → WebGL → 2D）。
      - 未知 MuKey 返回 null；构造期副作用（如 Wasm 视频解码器创建 Worker、画布创建 canvas 元素）在此发生。
  - id: if.mus.loader.StreamLoader
    name: StreamLoader
    owner: infra.mus.loader.stream-reader
    signature: |
      interface StreamLoader {
        start(url: string, onConnected: (time: number) => void,
              onDataReceived: (data: Uint8Array) => void,
              onError: (err: ErrorBase) => void,
              options?: StreamLoaderStartOptions): void;
        stop(): void;
        isStreaming: boolean;
      }
    description: HTTP 流式读取的抽象，供 FLV / HLS 加载 MU 复用。
    semantics: |
      - `stallTimeoutMs` 设置后，自请求起及每收到一块数据起重新计时，超时中止并以 `MuHttpLoaderStreamError`（message 以 `stream stalled` 开头）报一次失败。
      - `stop()` 中止当前请求；中止后不再回调数据。
  - id: if.mus.loader.load-actions
    name: 加载动作
    owner: infra.mus.loader
    signature: |
      // 经 Action 下发给加载 MU
      ActionKey.LoadStreamInfo  // MP4：拉 moov；HLS：拉主 / 媒体清单（payload: LoadActionPayload）
      ActionKey.LoadData        // FLV：开流；HLS：拉下一片；MP4：拉字节区间（payload: LoadMp4FragmentActionPayload）
      ActionKey.UpdatePlaylist  // HLS 直播：刷新清单（fire-and-forget）
      ActionKey.CancelLoad      // 取消在途下载（HLS 录像腿保留下载以便接续）
      ActionKey.Stop | ActionKey.Destroy
    description: 加载策略驱动加载 MU 的控制面接口；加载 MU 自身不决定节奏。
    semantics: |
      - Stop 后可再次 LoadData；Destroy 之后迟到的请求结果全部丢弃。
      - 直播 HLS 分片 / 清单连续失败 3 次才以原始错误码上报；清单刷新单次失败按可恢复错误上报。
  - id: if.mus.buffer.release-actions
    name: 缓冲出队与阀门动作
    owner: infra.mus.buffer
    signature: |
      ActionKey.SendAllBuffer          // DemuxedBuffer：整批出队（关阀时不下推）
      ActionKey.SendBuffer             // ProcessedBuffer / DecodedBuffer：按 payload 定量出队
      ActionKey.Hold | ActionKey.Release                      // DemuxedBuffer 段尾阀门
      ActionKey.HoldFromNextKeyframe | ActionKey.ReleaseHold  // ProcessedBuffer 截流
      ActionKey.DropBuffer             // payload: DropBufferActionPayload（原因、区间）
      ActionKey.DropAllBuffer | ActionKey.StopFillBuffer | ActionKey.ContentDiscontinuity  // Fhls 族另有 CancelPendingDrop / ReinstallPresentation
    description: 运行时驾驶策略与换腿事务控制缓冲出队的接口；出队后的数据仍以 output 直推下游。
    semantics: |
      - 关阀期间数据按到达序保留，超过保留跨度（点播停拉线）从队头裁剪并记 `heldQueueTrimmed`，放阀前需向下游发 ContentDiscontinuity{source:'pause-hold-trimmed'}。
      - 截流状态 off → armed（等关键帧）→ holding（边界关键帧及其后视频帧留队，比较基准为边界帧 dts；音频按 pts 跟随）。
      - 每次入队 / 出队 / 丢弃都发 BufferChange。
  - id: if.mus.remuxer.mp4.actions
    name: fMP4 重封装动作
    owner: infra.mus.remuxer.mp4
    signature: |
      ActionKey.Reset                 // 清空重封装状态，下一批重新生成 init segment
      ActionKey.ContentDiscontinuity  // payload: ContentDiscontinuityActionPayload { source }
      ActionKey.Stop | ActionKey.Destroy
    description: 换腿 / seek / 内容跳变时复位 fMP4 重封装器。
    semantics: |
      - `source: 'pause-hold-trimmed'` 只武装视频空洞接续，不清轨；其他来源丢弃累计轨里尚未写出的旧内容样本。
  - id: if.mus.render.display-actions
    name: 呈现动作
    owner: infra.mus.render
    signature: |
      ActionKey.Attach (AttachActionPayload) | ActionKey.Detach
      ActionKey.Play | ActionKey.Pause | ActionKey.Resume | ActionKey.Active
      ActionKey.SetVolume (SetVolumePayload) | ActionKey.SetPlaybackRate (SetPlaybackRatePayload)
      ActionKey.Capture (CaptureActionPayload) → Promise<截图数据>   // 走 doActionAsync
      ActionKey.ClearScreen | ActionKey.ToggleFullscreen
      ActionKey.FillBuffer | ActionKey.StopFillBuffer
    description: 各渲染 MU 对齐的一组呈现动作（video 元素、画布、MediaStream、Vcs、音频按需实现子集）。
    semantics: |
      - Attach 幂等：已在目标容器中的元素不再移动节点。
      - 未 attach 的播放器初始音量为 0；自动播放被拒时降级静音，首次用户激活后恢复。
      - Capture 是唯一必须异步的动作。
  - id: if.mus.render.mse.actions
    name: MSE 渲染动作
    owner: infra.mus.render.mse
    signature: |
      ActionKey.SetAppendGate (SetAppendGateActionPayload { enabled, limitMs })
      ActionKey.RemoveRange   (RemoveRangeActionPayload)
      ActionKey.SetDuration   (SetDurationActionPayload)
      ActionKey.EndOfStream
      ActionKey.Seek          (SeekPayload：绝对媒体时间)
      ActionKey.DropAllBuffer | ActionKey.FillBuffer | ActionKey.StopFillBuffer
      ActionKey.ContentDiscontinuity
    description: 直播 / 点播 MSE 策略下发给唯一 MSE 渲染实现的执行接口。
    semantics: |
      - 渲染只执行，不读 PlayerStatus；写入闸判据由策略配置，渲染在 append 前询问。
      - seek 完成发内部事件 VideoSeeked{currentTime}（秒），不直接发 VideoRendered；SourceBuffer updateend 发 SourceBufferUpdated。
  - id: if.mus.render.mse.decisions
    name: MSE 缓冲纯决策函数
    owner: infra.mus.render.mse
    signature: |
      computeBufferDuration(input: { currentTimeMs; latestVideoPts; latestAudioPts; ranges }): number
      decideBufferGapTarget(ranges, currentTime: number, tolerance: number): number | undefined
      decideChasingFrameTarget(input: { ranges; currentTime; offset; frameDuration; bufferDuration }):
        { kind: 'align' | 'chase' | 'none'; seekTo?: number }
      decidePlayedDataRemoveEnd(input: { currentTime; lastRemoveTime; gopDuration }): number | undefined
      decideExpiredBufferRemovals(input: { ranges; currentTime; removeEnd; preloadTime; bufferBehind; clearAll? }): …
      decideInitialSeekTarget(…) // 首帧对齐
    description: 从 MSE 渲染中提纯的无副作用决策，被 app 层 MSE 直播 / 点播策略与 HLS 加载策略直接 import。
    semantics: 纯函数，无 I/O；时间单位按各函数参数约定（秒或毫秒）。属于「Domain 候选」：未来可下沉到 domain.services / domain.algorithms。
  - id: if.mus.render.keep-last-frame.createVideoElementPool
    name: 元素池 / 备用元素构造
    owner: infra.mus.render.keep-last-frame
    signature: |
      createVideoElementPool(options?: VideoElementPoolOptions, env?: VideoElementPoolEnv): VideoElementPool  // implements VideoElementPoolPort
      createVideoElementReserve(hasPool: boolean): VideoElementReserve | undefined                        // implements VideoElementReservePort
      shouldRetainOnStop(facts: RetainFacts): boolean
    description: 组合根创建跨渲染代际存活的 video 元素资源，经 Context 端口注入渲染 MU。
    semantics: |
      - 有元素池时不创建备用元素（`createVideoElementReserve(true)` 返回 undefined）。
      - 元素池交接：新元素出帧后叠放到旧元素上方，再出一帧后撤旧元素并执行其释放函数；待命位为屏外 fixed（不用 visibility:hidden）。
  - id: if.mus.decoder.wasm-video.worker-protocol
    name: Wasm 视频解码 Worker 消息
    owner: infra.mus.decoder.wasm-video
    signature: |
      // 主线程 → Worker：metadata（解码器配置）、data（视频帧）、reset / destroy
      // Worker → 主线程：
      'output'   (data: DecodedVideoData & { decodeInfo?: { startTime; frameType; dts; cost } })
      'error'    (e: { fatal?: boolean; reason?; message?; dts?; pts?; frameType?; size? })
      'metadata' (spsppsHash?: string)
    description: MuWasmVideoDecoder 与 Worker 内 WasmVideoDecodeTask 之间经 WorkerMessageBridge 的消息约定。
    semantics: |
      - `output` 无 data 表示该帧未产出画面，主线程仍需结束在途计数。
      - `error.fatal` 表示 wasm trap：60s 滑动窗口内最多重建 Worker 3 次，重建后补发 metadata。

dataStructures:
  - id: ds.MediaInfo
    name: MediaInfo
    definition: |
      class MediaInfo {
        mimeType?: string; duration?: number;
        hasAudio?: boolean; hasVideo?: boolean;
        audioCodec?: string; videoCodec?: string;
        audioSampleRate?: number; audioChannelCount?: number;
        width?: number; height?: number; fps?: number;
        profile?: string; level?: string; refFrames?: number; chromaFormat?: string;
        sarNum?: number; sarDen?: number;
        metadata?: Record<string, string | number | boolean>;
        hasKeyframesIndex?: boolean;
        keyframesIndex?: { times: number[]; filepositions: number[] };
        isComplete(): boolean; isSeekable(): boolean;
        getNearestKeyframe(ms: number): { index; milliseconds; fileposition } | null;
      }
    description: FLV 解封装从 onMetaData 与轨道配置汇总的媒体信息。
    invariants: isComplete() 要求 mimeType / duration / metadata / hasKeyframesIndex 已知，且有音频时音频参数齐、有视频时视频参数齐。
  - id: ds.ProbeData
    name: ProbeData
    definition: |
      interface ProbeData {
        match: boolean;
        consumed?: number; dataOffset?: number;
        hasAudioTrack?: boolean; hasVideoTrack?: boolean;
      }
    description: FLV 首包 header 探测结果，决定解析器的音视频轨开关与数据起始偏移。
  - id: ds.PmtResult
    name: PmtResult
    definition: |
      interface PmtResult {
        audioPid: number; videoPid: number;
        segmentVideoCodec: 'avc' | 'hevc';
        segmentAudioCodec: 'aac' | 'ac3' | 'mp3';
      }
    description: TS 解析 PMT 得到的音视频 PID 与编码；轨道集合需看到第二张完整 PMT 才视为稳定。
  - id: ds.PtsCorrectionPlan
    name: PtsCorrectionPlan
    definition: |
      interface PtsCorrectionPlan {
        batchSize: number;            // 0 表示条件不满足、本次不成批
        breakWithKeyframe: boolean;   // 本批是否因遇到下一个关键帧而收批
        corrections: { index: number; pts: number; cts: number }[];
      }
      // 时间戳基线来自入参 lastKeyframeInfo: { pts; dts; cts; poc }
    description: ptsOrderRules.planPtsCorrection 决出的一个校正批次（按 POC 序重分配 DTS 增量后的 pts / cts）。
    invariants: 纯函数产出，不修改入参；corrections 顺序不作契约，调用方按 index 取值。
  - id: ds.StreamLoaderStartOptions
    name: StreamLoaderStartOptions
    definition: |
      interface StreamLoaderStartOptions {
        stallTimeoutMs?: number;  // 下载停滞超时；不设 = 永不超时
      }
    description: StreamLoader.start 的可选参数。
  - id: ds.InitSegment
    name: InitSegment
    definition: |
      type InitSegment = Omit<Mp4RemuxedMetadata, 'type'>;  // { mediaType; data: Uint8Array(ftyp+moov); codec; container; … }
    description: fMP4 初始化分片（ftyp + moov），MSE 建 SourceBuffer 与重配时使用。
  - id: ds.MediaSegment
    name: MediaSegment
    definition: |
      type MediaSegment = Omit<Mp4RemuxedData, 'type'>;  // { mediaType; data: Uint8Array(moof+mdat); info: MediaSegmentInfo; … }
    description: fMP4 媒体分片（moof + mdat）。
  - id: ds.Mp4VideoSample
    name: Mp4VideoSample
    definition: |
      interface Mp4VideoSample extends Mp4SampleBase {
        units?: AVCUnit[];
        isKeyframe: boolean; frameType: FrameType;
        generationTime: number;
        flags?: { isLeading; dependsOn; isDependedOn; hasRedundancy; isNonSync };
        poc: number; spsppsHash: string | undefined; nalRefIdc: number; index: number;
      }
    description: 进入 fMP4 重封装的视频样本（trun 样本标志由此生成）。
  - id: ds.SampleInfo
    name: SampleInfo
    definition: |
      class SampleInfo implements Mp4MediaSampleInfo {
        dts: number; pts: number; duration: number;
        originalDts: number; isSyncPoint: boolean; filePosition: number | null;
      }
    description: 已写出样本的时间信息（重封装后时间轴与原始 dts 并存）。
  - id: ds.MediaSegmentInfo
    name: MediaSegmentInfo
    definition: |
      class MediaSegmentInfo implements Mp4RemuxedDataInfo {
        beginDts: number; endDts: number; beginPts: number; endPts: number;
        originalBeginDts: number; originalEndDts: number;
        syncPoints: SampleInfo[];  // 仅视频 IDR
        firstSample: SampleInfo | null; lastSample: SampleInfo | null;
      }
    description: 一个 fMP4 媒体分片的时间范围与随机访问点，随 Mp4RemuxedData 下发给渲染。
  - id: ds.RetainFacts
    name: RetainFacts
    definition: |
      interface RetainFacts {
        enabled: boolean;      // 有元素池且元素归本 MU
        suppressed: boolean;   // 销毁 / 清屏路径内部的 stop
        onScreen: boolean; hasFrame: boolean; fullscreen: boolean;
        unsupported: boolean;  // 如 Video 方案的 rAF 代理
      }
    description: Stop 当刻是否保留 video 元素（保留最后一帧）的结构化事实。
    invariants: shouldRetainOnStop 仅当 enabled ∧ ¬suppressed ∧ onScreen ∧ hasFrame ∧ ¬fullscreen ∧ ¬unsupported 时为真。
  - id: ds.VcsModel
    name: VcsModel
    definition: |
      class VcsModel extends ModelBase {
        readonly frameBufferModel: FrameBufferLedger;
        metadata?: Mp4RemuxedMetadata;
        appendRemuxedData(data: Mp4RemuxedData): void;
        get bufferSize(): number;
        reset(): void; onDestory(): void;
        // … 当前片位置、分片槽链表、渲染时间轴（RenderTimeline）
      }
    description: Vcs 方案的播放模型，由组合根注册进 ModelRegistry（kind = play），供 Vcs 渲染与直播 Vcs 策略读写。
    invariants: 读面 getter 不得调用实例方法（ModelRegistry 对方法装了快照影子，否则会递归）。
  - id: ds.FragmentModel
    name: FragmentModel
    definition: |
      class FragmentModel {
        index: number; status: FPlayerStatus; canLoad: boolean;
        duration: number; dataDuration: number; playStartDts: number; playbackRate: number;
        videoPtsToIndexMap: Map<number, number[]>; ptsBaseline?: number;
        recordPlaybackState(state: { currentTimeMs: number; durationMs: number }): void;
        // … 前后分片指针（3 个分片槽组成环）
      }
    description: Vcs 渲染中单个分片槽（绑定一个 video 元素）的状态；由 View 采样 video 元素后写入播放读数，自身不持有 DOM 句柄。
