  - { id: rel.strategies.hls-contracts, from: app.strategies.load.hls, to: app.strategies.contracts, type: calls, description: 调用 hlsCatchupDecision 做直播追帧决策 }
  - { id: rel.strategies.hls-model-access, from: app.strategies.load.hls, to: infra.player-index.model-access, type: calls, description: 调用 requireFrameModel / requireMseModel 取模型能力 }
  - { id: rel.strategies.vcs-contracts, from: app.strategies.live-vcs, to: app.strategies.contracts, type: calls, description: 调用 vcsBufferDecision 做缓冲决策 }
  - { id: rel.strategies.vcs-render-fill, from: app.strategies.live-vcs, to: app.strategies.live-frame.render-fill, type: calls, description: 创建 LiveSendRenderStrategy 并委托它送渲染与充水 }
  - { id: rel.strategies.vcs-play-model, from: app.strategies.live-vcs, to: domain.models.play, type: calls, description: 调用 assertVcsPlaybackModel 收窄播放模型 }
  - { id: rel.strategies.vcs-invariant, from: app.strategies.live-vcs, to: domain.models.base, type: calls, description: 模型不符时抛 InvariantError }
  - { id: rel.strategies.vcs-model-access, from: app.strategies.live-vcs, to: infra.player-index.model-access, type: calls, description: 调用 requireFrameBufferModel / requireRenderTimelineModel 取模型能力 }
  - { id: rel.strategies.vod-model-access, from: app.strategies.load.vod, to: infra.player-index.model-access, type: calls, description: 调用 requireFrameModel / requirePlaybackPositionModel 取模型能力 }
  - { id: rel.strategies.play-model-access, from: app.strategies.play-base, to: infra.player-index.model-access, type: calls, description: 调用 requireVideoPlayModel 取 Video 播放模型 }
  - { id: rel.strategies.fhls-presentation, from: app.strategies.vod-fhls, to: domain.services.fhls-presentation, type: calls, description: 调用连续供给与呈现规则（decideContinuousSupply、continuousSupplyBudget、epochIndexAt、toSourcePts 等） }
  - { id: rel.strategies.fhls-stream-model, from: app.strategies.vod-fhls, to: domain.models.stream, type: calls, description: 调用 assertHlsStreamModel 收窄流模型 }
  - { id: rel.solution.legs-lifecycle, from: app.solution.legs, to: app.solution.lifecycle, type: calls, description: 调用 toSolutionSelectConfig 构造腿的方案选型配置 }
  - { id: rel.solution.leg-switch-lifecycle, from: app.solution.leg-switch, to: app.solution.lifecycle, type: calls, description: 调用 toSolutionSelectConfig 构造接手腿的方案选型配置 }
  - { id: rel.registry.core-errors, from: app.registry.core, to: share.errors, type: calls, description: 注册表核心在配置不合法时以 registryError 构造 ErrorBase（ConfigError）抛出 }
  - { id: rel.strategies.errors, from: app.strategies, to: share.errors, type: calls, description: 直播帧、Vcs 与点播帧策略把送解码与拖动寻址的异常经 errorWrapper 包装为 ErrorBase }

interfaces:
  # ── 契约接口（implements 的目标，M11、K5：方案控制器、段工厂、片段句柄；字段见同名数据结构） ──
  - id: if.solution.ports.SolutionDeps
    name: SolutionDeps
    owner: app.solution.ports
    signature: |
      interface SolutionDeps { stateMachine; pipeline; models; registry; fragments; factories; legs?; context; selector; capabilities; errors; log }
    description: Solution 需要外界注入的全部能力；组合根与片段挂载器等结构性满足其中的成员。字段见 ds.SolutionDeps。
  - id: if.solution.ports.SolutionStageFactory
    name: SolutionStageFactory
    owner: app.solution.ports
    signature: |
      interface SolutionStageFactory { createPipeline(options); updatePipeline(options); createController() }
    description: 段工厂契约，各加载 / 播放段工厂结构性满足。字段见 ds.SolutionStageFactory。
  - id: if.strategies.contracts.FrameController
    name: FrameController
    owner: app.strategies.contracts
    signature: |
      interface FrameController extends PlayController { reset; resetDecoder; dropDemuxedBuffer; dropDecodedBuffer; dropAllDemuxedBuffer; dropAllDecodedBuffer; flushDecoder }
    description: Wcs / Wasm 帧方案控制器契约，播放段工厂产出。字段见 ds.FrameController。
  - id: if.strategies.contracts.MseController
    name: MseController
    owner: app.strategies.contracts
    signature: |
      interface MseController extends PlayController { seek(timestamp: number): void }
    description: Mse 方案控制器契约。
  - id: if.strategies.contracts.VideoController
    name: VideoController
    owner: app.strategies.contracts
    signature: |
      interface VideoController extends PlayController { seek(timestamp: number): void }
    description: Video 方案控制器契约（与 Mse 同形）。
  - id: if.strategies.contracts.VcsController
    name: VcsController
    owner: app.strategies.contracts
    signature: |
      interface VcsController extends PlayController {}
    description: Vcs 方案控制器契约。
  - id: if.strategies.contracts.FhlsController
    name: FhlsController
    owner: app.strategies.contracts
    signature: |
      interface FhlsController extends PlayController { seek(timestamp: number): void; presentation(): FhlsPresentation }
    description: Fhls 方案控制器契约。
  - id: if.strategies.contracts.HlsLoadController
    name: HlsLoadController
    owner: app.strategies.contracts
    signature: |
      interface HlsLoadController extends VodLoadController { loadData(): void }
    description: Hls 加载段控制器契约，加载段工厂产出。
  - id: if.strategies.contracts.Mp4LoadController
    name: Mp4LoadController
    owner: app.strategies.contracts
    signature: |
      interface Mp4LoadController extends VodLoadController { loadData(startByte: number, byteLength: number): void }
    description: Mp4 加载段控制器契约。
  - id: if.registry.fragment-contracts.VodLoadHandle
    name: VodLoadHandle
    owner: app.registry.fragment-contracts
    signature: |
      interface VodLoadHandle { startLoadFragment(timestamp?); loadMoreFragment(); resumeFromSegment(segmentIndex); setStartPosition(positionMs, anchor?) }
    description: 点播加载策略对外暴露的窄句柄契约（键 VOD_LOAD_HANDLE_KEY = 'vod-load'）。字段见 ds.VodLoadHandle。
  - id: if.solution.Solution
    name: Solution 生命周期
    owner: app.solution.lifecycle
    signature: |
      class Solution {
        constructor(deps: SolutionDeps);
        attachHooks(): boolean;   // 初判选型 + 挂前后置命令 Hook
        dispose(): void;          // 摘 Hook、释放资源
        readonly legs: LegPort;   // 直播时移多腿端口
        createStreamFactReporter(): StreamFactReporter;
        readonly playStageStart: PlayStageStart;
      }
    semantics: 由组合根创建并 attachHooks；之后一切编排都发生在状态机命令的前 / 后置 Hook 内。初判失败（ConfigError）走错误链并返回 false；非 ConfigError 直接抛出。dispose 幂等。
  - id: if.solution.createStreamFactReporter
    name: 流事实上报器
    owner: app.solution.lifecycle
    signature: |
      createStreamFactReporter(): StreamFactReporter;
      // StreamFactReporter.reportStreamInfo(facts: StreamInfoFacts)
      //   : Promise<{ start: PlayStageStart | null; resumeDespiteUnload?: boolean }>
    semantics: 每次挂载加载段片段产生新代次；旧代次上报返回 {start:null} 被丢弃。上报可能触发重新选型与段重挂（异步）。返回的 start 供加载段策略在就绪后启动播放段。
  - id: if.solution.playStageStart
    name: 播放段启动
    owner: app.solution.play-stage-start
    signature: |
      type PlayStageStart = (target: PlayStageStartTarget, reason: PlayStageStartReason) => Promise<void>;
      // target: 'Loaded' | 'Playing' | 'Paused' | 'Buffering'；reason: 'command' | 'facts'
    semantics: 经 play-stage 句柄 load / play，目标为 Paused 时补派 Pause；无句柄或无 url 直接返回。失败不抛，统一进错误链；不回滚建图。
  - id: if.solution.onSwitch
    name: 段换代
    owner: app.solution.stage-swap
    signature: |
      onSwitch(host: SolutionStageSwapHost, url: string, decision: SolutionDecision,
               creatorOptions?: { playMode?: PlayMode }): Promise<void>;
      resetLoadPipeline(host, loadMode?, playMode?, creatorOptions?): Promise<void>;
      resetPlayPipeline(host, changePlayMode?, solution?, playMode?): Promise<void>;
      resetProcessPipeline(host): Promise<void>;
    semantics: 卸载旧片段 → context.reset → 按 decision.changes 重建段（压入待提交账本）→ connectStage → 切状态机模式 → 重挂片段。单段建图失败立即回滚该段并抛出；处理段差量失败置 pipelineUpdateFailed 并进错误链。
  - id: if.solution.connectStage
    name: 连段提交
    owner: app.solution.stage-swap
    signature: |
      connectStage(host: SolutionStageSwapHost): Promise<boolean>;
    semantics: 以各段工厂 head/tail 计算跨段边，将待提交账本一次性提交为一个 Pipeline 事务；缺少 load 尾或 play 头时报 PipelineNotWorkError。失败回滚全部账本（模型 rollback、新工厂 destroy、旧工厂 resume）并返回 false，成功 commit 模型切换。
  - id: if.solution.handleStreamInfoFacts
    name: 流事实协调
    owner: app.solution.stream-facts
    signature: |
      handleStreamInfoFacts(host: SolutionStreamFactsHost, generation: number,
        reconciled: StreamFactsReconcileOutput, facts: StreamInfoFacts)
        : Promise<{ start: PlayStageStart | null; resumeDespiteUnload?: boolean }>;
    semantics: 依次尝试解密翻转重选、inferredPlayMode 重选、最终段重挂；任一步换代失败返回 start=null。
  - id: if.solution.LegPort
    name: 腿端口
    owner: app.solution.legs
    signature: |
      interface LegPort {
        createLeg(legId: LegId, o: { url: string; loadMode: LoadMode; playMode: PlayMode; timeline?: StreamModelTimeline }): Promise<SolutionResult<CreatedLeg>>;
        holdLeg(legId: LegId): Promise<SolutionResult<void>>;
        releaseLeg(legId: LegId, o?: { fromPts?: number; spliceIfTrimmed?: boolean }): Promise<SolutionResult<void>>;
        holdPlayQueue(): Promise<SolutionResult<void>>;
        releasePlayQueue(o: { flush: boolean }): Promise<SolutionResult<void>>;
        setTimeline(legId: LegId, offset: number): Promise<SolutionResult<void>>;
        switchLeg(legId: LegId, o: { cutPts: number; originPts?: number; timeShiftNeedsDecryption?: boolean }): Promise<SolutionResult<LegSwitchOutcome>>;
        revertLeg(legId: LegId, o: { cutPts: number }): Promise<SolutionResult<LegSwitchOutcome>>;
        seekSwitchLeg(legId: LegId, o: { landingPts: number; originPts?: number }): Promise<SolutionResult<LegSwitchOutcome>>;
        ensureLiveLeg(): Promise<SolutionResult<CreatedLeg>>;
        revertLiveLeg(): Promise<SolutionResult<LegSwitchOutcome>>;
        withdrawLeg(legId: LegId): Promise<SolutionResult<void>>;
        getActiveLeg(): LegId;
      }
    semantics: 所有方法不抛错，以 SolutionResult 返回；deps 未提供腿端口时一律 Err。主要消费方为时移协调器（app.timeshift）。
  - id: if.solution.switchLeg
    name: 换腿
    owner: app.solution.legs
    signature: |
      switchLeg(legId: LegId, options: { cutPts: number; originPts?: number;
        timeShiftNeedsDecryption?: boolean }): Promise<SolutionResult<LegSwitchOutcome>>;
    semantics: 发 SwitchLeg 内部命令走状态机串行队列，十步事务在前置 Hook 内执行；②–⑦ 失败 saga 回滚、原腿继续播放（可恢复错误）；⑧–⑩ 失败不回滚，经 LegSwitchOutcome.postCommitError 报告。
  - id: if.solution.createLeg
    name: 建待命腿
    owner: app.solution.legs
    signature: |
      createLeg(legId: LegId, options: { url: string; loadMode: LoadMode; playMode: PlayMode;
        timeline?: StreamModelTimeline }): Promise<SolutionResult<CreatedLeg>>;
    semantics: 同名腿已存在返回 Err；建待命模型槽、腿上下文（standby）、腿句柄与 Load 段并提交入图；任一步失败撤掉已建部分，之后可同名重建。
  - id: if.solution.performLegSwitch
    name: 换腿十步事务
    owner: app.solution.leg-switch
    signature: |
      performLegSwitch(legs: SolutionLegs, incomingLegId: LegId, cutPts: number,
        direction: LegSwitchDirection, timeShiftNeedsDecryption?: boolean)
        : Promise<SolutionResult<LegSwitchOutcome>>;
      runLegAwareCommandHook(legs: SolutionLegs, command: { key: string; payload?: unknown }): Promise<void>;
    semantics: 只在 SwitchLeg 前置 Hook 内调用（与其他命令串行）；不抛错（前置 Hook 抛错会被状态机包成 Fatal）。revert 失败为 Fatal 进错误链；revert-live 失败不进错误链。
  - id: if.registry.SolutionRegistry
    name: 方案注册表
    owner: app.registry.core
    signature: |
      interface SolutionRegistry {
        registerSolution(descriptor: SolutionDescriptor): void;
        registerLoad(descriptor: LoadDescriptor): void;
        getSolutionDescriptor(solution: SolutionType): SolutionDescriptor;
        getLoadDescriptor(loadMode: LoadMode): LoadDescriptor;
        getRegisteredSolutions(): SolutionType[];
      }
    semantics: 重复登记与查询缺失均抛 ConfigError（module = 'SolutionRegistry'）。
  - id: if.registry.registerDefaultDescriptors
    name: 注册默认描述符
    owner: app.registry.default-descriptors
    signature: |
      registerDefaultDescriptors(registry?: SolutionRegistry): void;
    semantics: 由组合根显式调用，模块导入无副作用；同一注册表幂等，已存在的同 key 描述符跳过。
  - id: if.registry.planFragments
    name: 片段规划
    owner: app.registry.fragment-planner
    signature: |
      planFragments(specs: readonly FragmentSpec[], input: FragmentPlanInput,
        availableHandles?: ReadonlySet<FragmentKey>): FragmentSpec[];
    semantics: 纯函数；返回满足条件并按依赖拓扑排序的片段。key / handle 重复、未知依赖、自依赖、依赖环均抛 ConfigError。
  - id: if.registry.FragmentMounter
    name: 片段挂载器
    owner: app.registry.fragment-mounter
    signature: |
      class FragmentMounter {
        constructor(deps: { pluginController: PluginController; context: Context });
        mount(stage: 'load' | 'play', specs: readonly FragmentSpec[], input: FragmentMountInput): PluginBase[];
        remountSolutionScoped(stage: 'load' | 'play'): void;
        unmountStage(stage: 'load' | 'play'): void;
        getHandle<T extends object>(key: FragmentKey): T | null;
        destroy(): void;
      }
    semantics: mount 先完成全部实例化再替换旧段（实例化失败不影响已挂片段）；卸载时先吊销句柄再移除插件，吊销后的句柄调用即抛错。销毁后 mount 抛错。
  - id: if.factories.StageFactory
    name: 段工厂
    owner: app.factories.base
    signature: |
      abstract class BaseFactory<T extends Controller> {
        createPipeline(options): Promise<StagePipelinePlan>;  // 候选，不触 live graph
        updatePipeline(options): Promise<boolean>;            // 就地重配并提交
        createController(): T;
        head(): string | string[] | undefined;
        tail(): string | string[] | undefined;
        getLastPipelineError(): ErrorBase | undefined;
        quiesce(): Promise<void>;
        resume(): Promise<void>;
        destroy(): Promise<void>;
        protected abstract diff(options, currentMus): FactoryDiffResult;
      }
    semantics: createPipeline 不做任何生命周期动作；updatePipeline 失败返回 false 并记 lastPipelineError；quiesce 失败回滚已停节点并抛原错；destroy 在候选期与提交后均适用。
  - id: if.factories.configureBufferLimits
    name: 重配解码缓冲上限
    owner: app.factories.play
    signature: |
      configureBufferLimits?(playMode: PlayMode): void;
    semantics: 仅 Wcs / Wasm 播放段工厂实现，只改上限不动台账；调用方一律可选调用。
  - id: if.strategies.vodLoad
    name: 点播加载句柄
    owner: app.strategies.load.vod
    signature: |
      interface VodLoadHandle {
        startLoadFragment(timestamp?: number): void;
        loadMoreFragment(): boolean;
        resumeFromSegment(segmentIndex: number): void;
        setStartPosition(positionMs: number, anchor?: StartPositionAnchor): void;
      }
    semantics: 经 FragmentMounter 以代理句柄 'vod-load' 发布，策略被卸载后句柄吊销。setStartPosition 只记录、首次起拉生效；resumeFromSegment 用于换腿承接，不走硬 seek。
  - id: if.strategies.vodLoadFailureBackoffMs
    name: 点播拉片失败退避
    owner: app.strategies.load.vod
    signature: |
      const VOD_LOAD_FAILURE_BACKOFF_MS: readonly [500, 1000, 2000];
      function vodLoadFailureBackoffMs(consecutiveFailures: number): number;
    semantics: 纯函数；入参为连续失败次数（从 1 起），≤0 / NaN 返回 0；与时移待命预取驱动共用。
  - id: if.strategies.HlsPlaylistRefreshScheduler
    name: HLS 清单刷新调度器
    owner: app.strategies.load.hls
    signature: |
      class HlsPlaylistRefreshScheduler {
        constructor(host: HlsPlaylistRefreshHost);
        begin(): void;       // 开始循环（清零末片不变累计）
        endFlight(): void;   // 一次刷新结束，排下一次
        stop(): void;
      }
      function playlistTargetDurationMs(playlist): number;
    semantics: 定时器创建 / 撤销与在飞状态收在内部；判定（等多久、要不要继续）委托 Domain hlsPlaylistRefresh。点播 HLS 加载策略与时移待命预取驱动各持一个实例。
  - id: if.strategies.hlsSegmentChores
    name: HLS 逐片三项
    owner: app.strategies.load.hls
    signature: |
      interface HlsSegmentChorePorts { model: HlsModel; dispatch(action, muKeys): void; enableKeyframeCheck?(): void }
      function handleHlsDiscontinuity(ports: HlsSegmentChorePorts): void;
      function handleFragmentLoaded(ports: HlsSegmentChorePorts, payload: { success: boolean }): void;
      function loadSegmentAt(ports: HlsSegmentChorePorts, index: number): void;
    semantics: 纯函数，与时移待命预取驱动共用；片落地需先 Flush 再 SegmentLoaded，拉片需先推进游标再 LoadData，顺序不可换。
  - id: if.strategies.playStage
    name: 播放段句柄（play-stage）
    owner: app.strategies.play-base
    signature: |
      // 由主播放片段经 'play-stage' 句柄暴露，实现 Domain PlayStageHandle
      { load(url: string): Promise<void>; play(url: string): Promise<void>; continueDecodeInProgress(): void }
    semantics: load / play 经方案控制器定向发给播放段 MU；continueDecodeInProgress 仅点播帧方案有实际动作（换腿承接），其余 no-op。
  - id: if.strategies.LiveStrategy
    name: 直播充水
    owner: app.strategies.live-frame
    signature: |
      interface LiveStrategy { fillBuffer(): void; stopFillBuffer(): void }
    semantics: 直播帧 / Vcs 主策略实现，供缓冲类插件控制是否进入补缓冲。

dataStructures:
  - id: ds.SolutionDeps
    name: SolutionDeps
    definition: |
      interface SolutionDeps {
        stateMachine: { addPreCommandHook; addPostCommandHook; sendCommand; updateStateMachineMode; getPlayerStatus; getTargetStatus };
        pipeline: { getSegmentNodes; updatePipeline; dispatch; destroy; openLeg?; getLeg?; getActiveLeg? };
        models: { replaceStreamModel; beginStreamModelSwitch; replacePlaybackModel; beginPlaybackModelSwitch;
                  changePlayMode; getView; createStandby?; standbyView?; beginPromote?; destroyStandby?; /* … */ };
        registry: { getLoadDescriptor; getSolutionDescriptor; getRegisteredSolutions };
        fragments: { mount; unmountStage; remountSolutionScoped; getHandle; destroy };
        factories: { createLoadFactory(d, scope?); createPlayFactory(d); createProcessFactory() };
        legs?: { createLegContext(legId, { url, role? }): SolutionLegContext };
        context: { config; data: SolutionData; updateNeedsDecryption; stop; reset };
        selector: { selectSolution(input: SolutionSelectInput): SolutionResult<SolutionDecision> };
        capabilities: { getSnapshot(); supportVideoVolumeChange() };
        errors: { handleError(error) };
        log(level: number, ...data: unknown[]): void;
      }
    description: Solution 的全部外部依赖，由组合根注入；Solution 目录只依赖它，不 import Framework / plugins 实现。
    invariants: 腿相关成员要么全部提供、要么全部缺省；缺省时 Solution 退化为单腿行为。
  - id: ds.SolutionStageFactory
    name: SolutionStageFactory
    definition: |
      interface SolutionStageFactory {
        createPipeline(options: Record<string, unknown>): Promise<StagePipelinePlan | readonly PipelineNodeView[]>;
        updatePipeline(options: Record<string, unknown>): Promise<boolean>;
        createController(): unknown;
        head(): string | readonly string[] | undefined;
        tail(): string | readonly string[] | undefined;
        getLastPipelineError?(): SolutionErrorLike | undefined;
        quiesce?(): Promise<void> | void;
        resume?(): Promise<void> | void;
        destroy(): Promise<void> | void;
        configureBufferLimits?(playMode: PlayMode): void;
      }
    description: 编排区眼中的段工厂窄面；三段工厂（BaseFactory 子类）结构性满足。
  - id: ds.StagePipelinePlan
    name: StagePipelinePlan
    definition: |
      interface StagePipelinePlan {
        readonly nodes: readonly PipelineNodeView[];
        readonly edges: readonly { from: string; to: string }[];
      }
    description: 段工厂交出的候选建图计划（目标节点 + 段内边），由 Solution 统一提交。
  - id: ds.PipelineNodeView
    name: PipelineNodeView
    definition: |
      interface PipelineNodeView {
        readonly key: string;
        readonly previousMus: readonly PipelineNodeView[];
        readonly nextMus: readonly PipelineNodeView[];
      }
    description: Solution 看到的 MU 节点窄视图（只关心键与邻接）。
  - id: ds.SolutionPipelineUpdate
    name: SolutionPipelineUpdate
    definition: |
      interface SolutionPipelineUpdate {
        readonly addNodes?: readonly { node: PipelineNodeView; segment: 'load' | 'play' | 'process' | 'external' }[];
        readonly removeNodes?: readonly string[];
        readonly edges: readonly { from: string; to: string }[];
      }
      // 腿场景另带 activeLeg?: LegId
    description: 一次 Pipeline 事务的增删节点与边差量。
  - id: ds.SolutionLegHandle
    name: SolutionLegHandle
    definition: |
      interface SolutionLegHandle {
        readonly legId: LegId;
        readonly isActive: boolean;
        getNode(key: string): unknown;
        nodes(): readonly PipelineNodeView[];
        getSegmentNodes(segment): readonly PipelineNodeView[];
        dispatch(action: { key: string; payload?: unknown }, muKeys?: readonly string[]): unknown;
        dispatchAsync(action, muKeys?): Promise<unknown>;
        updatePipeline(diff: SolutionPipelineUpdate & { activeLeg?: LegId }): Promise<SolutionResult<unknown>>;
        catchUpRestart(mu: unknown): Promise<void>;
      }
    description: Framework PipelineLegHandle 的窄结构面：某条腿上的节点查询、定向派发与图事务。
  - id: ds.SolutionLegContext
    name: SolutionLegContext
    definition: |
      interface SolutionLegContext {
        readonly legId: LegId;
        readonly role: 'active' | 'standby' | 'yielded';
        setRole(role: 'active' | 'standby' | 'yielded'): void;
        replayStreamFacts(): void;
        dispose(): void;
      }
    description: Framework LegContext 的窄结构面：腿角色与流事实重放。
  - id: ds.SolutionConfig
    name: SolutionConfig
    definition: |
      interface SolutionConfig {
        readonly url?: string;
        readonly playMode?: PlayMode;
        readonly solution?: SolutionType;
        readonly needsDecryption?: boolean;
        readonly hasAudio?: boolean;
        readonly solutionPriority?: readonly SolutionType[];
      }
    description: Solution 关心的播放器配置子集（选型 / 建段相关）。
  - id: ds.SolutionData
    name: SolutionData
    definition: |
      interface SolutionData {
        url: string | undefined;
        previousUrl: string | undefined;
        loadMode: LoadMode;
        playMode: PlayMode;
        solution: SolutionType | undefined;
        needsDecryption: boolean;
        isAttached?: boolean;
      }
    description: 当前会话的方案三元组与地址等运行数据（Context.data 的窄面）。
  - id: ds.SolutionResult
    name: SolutionResult
    definition: |
      type SolutionResult<T> =
        | { readonly ok: true; readonly value: T }
        | { readonly ok: false; readonly error: SolutionErrorLike };  // error: { code; module; details? }
    description: Solution 端口统一的 Result 形态。
  - id: ds.PendingStageSwap
    name: PendingStageSwap
    definition: |
      interface PendingStageSwap {
        readonly segment: 'load' | 'process' | 'play';
        readonly previousFactory: SolutionStageFactory | undefined;
        readonly nextFactory: SolutionStageFactory;
        readonly previousNodes: readonly PipelineNodeView[];
        readonly plan: StagePipelinePlan;
        readonly modelSwitch?: PlaybackModelSwitch;
        readonly previousQuiesced?: boolean;
        readonly rollback: () => void;
      }
    description: 待提交换代账本的一项：一个段从旧工厂 / 旧节点到新候选计划的全部回滚信息。
    invariants: 账本非空期间 stageNodes(segment) 优先返回账本中的新段节点；connectStage 结束后账本必被 commit 或 rollback 清空。
  - id: ds.CreatedLeg
    name: CreatedLeg
    definition: |
      interface CreatedLeg {
        readonly legId: LegId;
        readonly handle: SolutionLegHandle;
        readonly controller: unknown;  // 该腿 Load 段控制器
      }
    description: createLeg / ensureLiveLeg 的结果。
  - id: ds.LegSwitchOutcome
    name: LegSwitchOutcome
    definition: |
      interface LegSwitchOutcome {
        readonly legId: LegId;
        readonly cutPts: number;
        readonly postCommitError?: SolutionErrorLike;  // ⑧–⑩ 提交后收尾失败
      }
    description: 换腿 / 换回事务结果。
  - id: ds.LegRecord
    name: LegRecord
    definition: |
      interface LegRecord {
        context: SolutionLegContext;
        handle: SolutionLegHandle;
        loadFactory: SolutionStageFactory;
        loadDescriptor: LoadDescriptor;
        controller: unknown;
        url: string;  // primary 为空串（地址随 data.url）
      }
    description: SolutionLegs 内每条腿的记账条目（换腿事务与撤腿 Hook 读写）。
  - id: ds.LegSwitchDirection
    name: LegSwitchDirection
    definition: |
      type LegSwitchDirection = 'switch' | 'revert' | 'revert-live' | 'seek-switch';
    description: 十步事务的方向，决定 hold / 丢残留 / 承接 / 放阀与失败是否进错误链的裁剪。
  - id: ds.SolutionDescriptor
    name: SolutionDescriptor
    definition: |
      interface SolutionDescriptor {
        solution: SolutionType;
        createPlayFactory(deps: FactoryDeps): BaseFactory;
        fragments: readonly FragmentSpec[];
        requiresLoadStage: boolean;
        reusePipelineOnPlayModeChange: boolean;
        holdPlayQueueOnLegSwitch?: boolean;  // 换腿是否截流处理后队列（Mse / Fhls 为 true）
      }
    description: 一个播放方案的描述符：播放段工厂 + 片段清单 + 方案属性。solution/ports.ts 有同名窄面（不含 createPlayFactory，fragments 只要 key）。
  - id: ds.LoadDescriptor
    name: LoadDescriptor
    definition: |
      interface LoadDescriptor {
        loadMode: LoadMode;
        createLoadFactory(deps: FactoryDeps): BaseFactory;
        fragments: readonly FragmentSpec[];
      }
    description: 一种加载方式的描述符。solution/ports.ts 有同名窄面。
  - id: ds.FactoryDeps
    name: FactoryDeps
    definition: |
      interface FactoryDeps {
        context: Context;                       // framework Context（腿场景为 LegContext）
        pipelineController: PipelineController; // 腿场景为腿句柄
      }
    description: 段工厂构造依赖。
  - id: ds.SolutionRegistry
    name: SolutionRegistry
    definition: |
      interface SolutionRegistry {
        registerSolution(d: SolutionDescriptor): void;
        registerLoad(d: LoadDescriptor): void;
        getSolutionDescriptor(s: SolutionType): SolutionDescriptor;
        getLoadDescriptor(m: LoadMode): LoadDescriptor;
        getRegisteredSolutions(): SolutionType[];
      }
    description: 方案注册表接口。
  - id: ds.FragmentSpec
    name: FragmentSpec
    definition: |
      interface FragmentSpec {
        key: FragmentKey;
        stage: 'load' | 'play' | 'none';
        scope: 'solution' | 'stage';
        playModes?: readonly PlayMode[];
        activeLegs?: readonly ('live' | 'recording')[];
        when?: (config: Readonly<PlayerConfig>, controller?: unknown) => boolean;
        needs?: readonly FragmentKey[];
        handle?: { key: FragmentKey; expose(plugin: PluginBase): object };
        create(deps: FragmentDeps): PluginBase;
      }
    description: 方案片段（插件）声明：挂载条件、作用域、依赖与对外句柄。solution/ports.ts 有只含 key 的同名窄面。
    invariants: 同一批规划内 key 与 handle.key 均唯一；needs 无环。
  - id: ds.FragmentPlanInput
    name: FragmentPlanInput
    definition: |
      interface FragmentPlanInput {
        playMode: PlayMode;
        activeLeg?: 'live' | 'recording';  // 挂载时从 Context 读入
        config: Readonly<PlayerConfig>;
        requiresLoadStage: boolean;
        controller?: unknown;
      }
    description: 片段规划输入。
  - id: ds.FragmentMountInput
    name: FragmentMountInput
    definition: |
      interface FragmentMountInput extends FragmentPlanInput {
        controller: unknown;            // 本段控制器
        reporter?: StreamFactReporter;  // 仅 load 段
      }
    description: 片段挂载输入；solution/ports.ts 有同名窄面。
  - id: ds.FragmentDeps
    name: FragmentDeps
    definition: |
      interface FragmentDeps {
        controller: unknown;
        reporter?: StreamFactReporter;
        handles: Readonly<Record<FragmentKey, object>>;  // 只含 needs 声明的句柄
        context: Context;
      }
    description: 片段 create 时拿到的依赖。
  - id: ds.VodLoadHandle
    name: VodLoadHandle
    definition: |
      interface VodLoadHandle {
        startLoadFragment(timestamp?: number): void;
        loadMoreFragment(): boolean;
        resumeFromSegment(segmentIndex: number): void;
        setStartPosition(positionMs: number, anchor?: StartPositionAnchor): void;
      }
      const VOD_LOAD_HANDLE_KEY = 'vod-load';
    description: 点播加载策略对点播播放策略与 Solution 暴露的窄句柄。
  - id: ds.StartPositionAnchor
    name: StartPositionAnchor
    definition: |
      interface StartPositionAnchor {
        segmentUri: string;
        offsetMs: number;
      }
    description: 起播定位锚点：滚动录制清单原点前移时按片 uri 换算落点。
  - id: ds.FactoryDiffResult
    name: FactoryDiffResult
    definition: |
      interface FactoryDiffResult {
        addMus: MediaUnit[];
        removeMus: MediaUnit[];
        nextMus: MediaUnit[];  // 目标节点序列（复用同 key 既有节点）
        edges: PipelineEdge[];
        segment?: SegmentKind;
      }
    description: 段工厂 diff 的产出：本段目标形态与相对存量的增删。
  - id: ds.PlayController
    name: PlayController
    definition: |
      interface PlayController {
        play(url: string): Promise<void>;
        load(url: string): Promise<void>;
      }
    description: 播放段控制器基础面（所有方案）。
  - id: ds.FrameController
    name: FrameController
    definition: |
      interface FrameController extends PlayController {
        reset(): void | Promise<void>;
        resetDecoder(): void;
        dropDemuxedBuffer(type, timestampType, timestampList: number[]): void;
        dropDecodedBuffer(type, timestampType, timestampList: number[]): void;
        dropAllDemuxedBuffer(): void;
        dropAllDecodedBuffer(): void;
        flushDecoder(): void;
      }
    description: Wcs / Wasm 帧方案控制器。
  - id: ds.MseController
    name: MseController
    definition: |
      interface MseController extends PlayController {
        seek(timestamp: number): void;
      }
    description: Mse 方案控制器（Video 方案同形）。
  - id: ds.FhlsController
    name: FhlsController
    definition: |
      interface FhlsController extends PlayController {
        seek(timestamp: number): void;
        presentation(): FhlsPresentation;  // 建段即定；建段前读取抛错
      }
    description: Fhls 方案控制器。
  - id: ds.VodLoadController
    name: VodLoadController
    definition: |
      interface VodLoadController {
        loadStreamInfo(url: string): Promise<void>;
        cancelLoad(): void;
      }
      interface HlsLoadController extends VodLoadController { loadData(): void }
      interface Mp4LoadController extends VodLoadController { loadData(startByte: number, byteLength: number): void }
    description: 加载段控制器（Hls / Mp4）。
  - id: ds.SendDecodeStrategy
    name: SendDecodeStrategy
    definition: |
      interface SendDecodeStrategy {
        name: string;
        trySendDecode(): void;
        reset(): void;
        onVideoDemuxed?(): void;
        onVideoRendered?(): void;
        onVideoDecoded?(): void;
        onDecodeScheduleInvalidated?(): void;  // 转入 Playing 时作废旧排期
        continueDecodeInProgress?(): void;     // 换腿承接
        destroy?(): void;
      }
    description: 点播送解码策略部件接口（Wcs / Wasm 两实现）。
  - id: ds.LiveFramePart
    name: LiveFramePart
    definition: |
      interface LiveFramePart {
        onPlayerStatusChange?(payload): void;
        onBufferChanged?(payload): void;
        onVideoFrameDecoded?(payload): void;
      }
    description: 直播帧策略从属部件（丢帧 / 丢音频 / 充水）的事件回调面，宿主按序扇出。
  - id: ds.VodFrameStrategy
    name: VodFrameStrategy
    definition: |
      interface VodFrameStrategy {
        freezeRenderTime(timestamp?: number): void;
        unfreezeRenderTime(pts?: number): void;
        reloadData(timestamp: number): void;
        presentSeekFrameWhilePaused(timestamp: number): void;
      }
    description: 点播帧策略对其 seek 部件暴露的回调面。
  - id: ds.StrategyDecisionReport
    name: StrategyDecisionReport
    definition: |
      interface StrategyDecisionReport {
        atMs: number;
        action: StrategyDecisionAction;
        blockedBy: StrategyBlockedBy | undefined;  // 只在「本该动但被挡住」时有值
        lagMs: number | undefined;
        thresholdMs: number | undefined;
      }
    description: 追帧 / 缓冲决策的观测形态，写入统计 lastDecision。
