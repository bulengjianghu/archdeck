# 区域：Share + Domain（share.* / domain.* 第二级之下的子模块、本区域关系、接口与数据结构）
# 代码来源：packages/share/src/**、packages/domain/src/**
# 骨架模块（share.contracts 等第二级）在 layers.yaml 中定义，本文件只用 parent 往下挂。

modules:
  # ───────────────────────── share（层的包入口）─────────────────────────
  - id: share
    name: Share
    codeRefs: [packages/share/src/index.ts]

  # ───────────────────────── domain.types ─────────────────────────
  - id: domain.types.ambient
    parent: domain.types
    name: 宿主类型补丁
    responsibility: domain 的 lib 收窄为 ES2020 后按 lib.dom.d.ts 契约补的最小全局类型面（WHATWG URL），供分片地址归一化使用；只有类型，不构造任何 I/O 对象。
    codeRefs: [packages/domain/src/globals.d.ts]
  - id: domain.types.modes
    parent: domain.types
    name: 方案三元组与模式枚举
    responsibility: 定义 LoadMode（Mp4/Flv/Hls）、PlayMode（Live/Vod）、SolutionType（Wcs/Wasm/Mse/Fhls/Vcs/Video）三元组枚举，以及 Fhls 呈现形态 FhlsPresentation 与建段判定 decidePresentation。不含任何选型规则。
    dataStructures: [ds.LoadMode, ds.PlayMode, ds.SolutionType, ds.FhlsPresentation]
    codeRefs: [packages/domain/src/types/modes.ts, packages/domain/src/types/fhlsPresentation.ts]
    docRefs: [docs/design/1-domain/domain-model.md, docs/design/4-solutions/fhls/fhls-solution.md]

  - id: domain.types.model-types
    parent: domain.types
    name: 模型与观测类型
    responsibility: 领域公共类型的唯一属地：MuKey / MuType / PlayerStatus / MuStatus / State / Overlay 等状态与 MU 枚举，PlaybackState 与 Statistic 的三档能力面（只读 ⊂ 采集 ⊂ 持有/状态机），ModelViewMap / PlaybackProfile 等 Registry 视图契约，以及弱网观测事实（缓冲、追帧、丢帧、策略决策、拉流）。framework 侧只重导出同一枚举对象，不另起一套值。
    principle: |
      - 能力面收窄矩阵用结构类型继承链表达：`PlaybackStateReadView ⊂ CollectorView ⊂ MachineView`、`StatisticReadView ⊂ CollectorView ⊂ OwnerView`，Registry 按调用方身份窄化分发。
      - `ModelViewMap` 把 5 个槽（state / runtime / statistic / stream / play）映射到各自最宽视图；`WatchableProp` 通过类型运算排除方法键，只允许观察数据属性。
      - 观测事实一律 `null` 起步，区分「未接计数」与「计为 0」；动作与闸是枚举（StrategyDecisionAction / StrategyBlockedBy），防止统计口径漂移。
    dataStructures:
      - ds.MuKey
      - ds.MuType
      - ds.PlayerStatus
      - ds.MuStatus
      - ds.MuState
      - ds.State
      - ds.Overlay
      - ds.PlaybackStateMemento
      - ds.PlaybackStateReadView
      - ds.PlaybackStateCollectorView
      - ds.PlaybackStateMachineView
      - ds.StatisticReadView
      - ds.StatisticCollectorView
      - ds.StatisticOwnerView
      - ds.ModelKind
      - ds.ModelViewMap
      - ds.PlaybackProfile
      - ds.SystemLoadLevel
      - ds.StrategyMode
      - ds.StrategyDecisionAction
      - ds.StrategyBlockedBy
      - ds.AdaptiveBufferFacts
      - ds.StrategyDecisionFacts
    codeRefs: [packages/domain/src/types/model.ts]
    docRefs: [docs/design/1-domain/domain-model.md, docs/design/6-features/player-get-stats.md]

  - id: domain.types.pipeline-topology
    parent: domain.types
    name: Pipeline 拓扑契约
    responsibility: Pipeline 图的拓扑契约类型唯一属地：段类别 SegmentKind、语义锚点 SemanticPosition、腿 LegId / 节点 NodeId、边、拓扑快照与变更描述 PipelineDiffSpec。framework 的 PipelineDiff 等公开 API 由 framework 承载，这里只放规则判定所需的形状。
    dataStructures: [ds.SegmentKind, ds.SemanticPosition, ds.LegId, ds.NodeId, ds.PipelineEdge, ds.PipelineTopology, ds.PipelineDiffSpec, ds.TopologyError]
    codeRefs: [packages/domain/src/types/pipelineTopology.ts]
    docRefs: [docs/design/0-kernel/pipeline-graph-rules.md, docs/design/0-kernel/pipeline-legs.md]

  - id: domain.types.events
    parent: domain.types
    name: 领域事件
    responsibility: 定义领域事件判别联合 DomainEvent（加载/播放模式变化、方案变化、叠加态进出、统计切片开始）。只定义事件形状，发布通道由 domain.ports 的 DomainEventPublisher 提供。
    dataStructures: [ds.DomainEvent]
    codeRefs: [packages/domain/src/events.ts]
    docRefs: [docs/design/1-domain/domain-model.md]

  # ───────────────────────── domain.models ─────────────────────────
  - id: domain.models.base
    parent: domain.models
    name: 聚合基类
    responsibility: 领域聚合的公共基类 ModelBase（只注入 DomainEventPublisher、抽象 reset、幂等 dispose）与不变量违例错误 InvariantError。不持 Context，不做观察 Proxy（观察归 Registry）。
    dataStructures: [ds.ModelBase, ds.InvariantError]
    codeRefs: [packages/domain/src/models/modelBase.ts]
    docRefs: [docs/design/1-domain/domain-model.md]

  - id: domain.models.playback-state
    parent: domain.models
    name: PlaybackState 播放状态聚合
    responsibility: 持有播放器基态（current / next 两相）、叠加态（Seeking / Buffering）、命令代次与 MU 编制（含多腿别名表），守住转移与叠加的不变量，提供 memento 快照与回滚。不决定迁移规则（由 framework 状态机驱动）。
    principle: |
      - 两相提交：`beginTransition` 写入 next 并递增 commandGeneration → `commitTransition` 落到 current → `endTransition` 释放 next；重复 begin / 无 next 时 commit 一律抛 InvariantError。
      - 叠加不变量：只在 Loaded/Playing/Paused/Buffering 上可开叠加；同 kind 不可重入；Seeking 进行中禁止 Buffering；基态转入 Stopped/Destroyed/Error 时自动清空叠加并逐个发 OverlayExited。
      - MU 编制：`addMu` 按 `mappingPlayerStatus` 把基态映射为 MU 状态；多腿下以 NodeId 为内部键，裸 MuKey 经别名表解析到活动腿。
      - `snapshot()` / `restore()` 把基态、叠加、别名一起做原子快照，供 Pipeline 事务回滚。
    provides: [if.models.playback-state.PlaybackState]
    dataStructures: [ds.PlaybackState, ds.PlaybackStateMemento]
    codeRefs: [packages/domain/src/models/playbackState.ts]
    docRefs: [docs/design/1-domain/domain-model.md, docs/design/0-kernel/state-machine.md]

  - id: domain.models.statistic
    parent: domain.models
    name: Statistic 统计聚合
    responsibility: 播放统计事实的唯一持有者：首帧里程碑、帧率/码率/帧延迟、卡顿与丢帧计数、播放结局累计、弱网观测（观察时长、追帧、拉流、缓冲策略决策）等；区分「未记录」与「记录为 0」，管理计数窗口与统计切片。不取时钟（时刻由调用方传入），不做对外快照映射。
    principle: |
      - 写入面按能力面分档：采集方只拿 StatisticCollectorView（mark* / report* / count*），持有方额外有 startNewSlice / reset。
      - 入参先过不变量校验（有限数、非负、at ≥ since），违例抛 InvariantError，不静默兜底。
      - 计数族有「观测窗口」：构造 / startNewSlice / countPlaybackAttempt 开窗，reset 关窗；组 A 播放结局累计跨切片保留。
      - `startNewSlice(reason)` 发布 StatisticSliceStarted 领域事件。
    provides: [if.models.statistic.Statistic]
    dataStructures: [ds.Statistic]
    codeRefs: [packages/domain/src/models/statistic.ts]
    docRefs: [docs/design/6-features/player-get-stats.md, docs/design/1-domain/domain-model.md]

  - id: domain.models.stream
    parent: domain.models
    name: 流模型
    responsibility: 加载腿的流事实聚合：FlvStreamModel / HlsModel / Mp4StreamModel 三种流模型共享解析得到的流事实（时间基准、帧信息、SPS/PPS、到达高水位、加密版本），并各自承载协议专属事实——HLS 清单滚动窗口、起播分片、墙钟找片；MP4 字节区间与分片加载进度；直播 pts↔墙钟映射轨 WallClockTrack。不发网络请求，不持 DOM。
    principle: |
      - 公共流事实委托给组件 StreamFactsCore，三种流模型只是薄外观 + 协议专属状态；Registry 合成 `loadMode` / `playMode` 判别字段，形成 StreamModelUnion。
      - HlsModel：清单按媒体序号编址，`updatePlaylist` 经 `computeAppendPlan` 判「承接 / 断档」并裁剪 30s 以前的旧片；起播分片按目标延迟从清单尾向前累加；`segmentIndexForWall` 按 DATERANGE 墙钟找片（时移录制腿用）。
      - Mp4StreamModel：按时间戳换算字节区间，`getNextRange` 按停拉水位给出下一段 Range。
      - StreamModelTimeline 描述腿的时间基准（playlist / source 轴 + 常量 C），供时移换腿统一到直播轴。
    provides: [if.models.stream.StreamFacts, if.models.stream.HlsModel, if.models.stream.Mp4StreamModel, if.models.stream.WallClockTrack]
    dataStructures:
      - ds.StreamModel
      - ds.StreamModelUnion
      - ds.StreamModelViewBase
      - ds.StreamModelTimeline
      - ds.FlvStreamModel
      - ds.HlsModel
      - ds.Mp4StreamModel
      - ds.HlsPlaylist
      - ds.HlsSegment
      - ds.WallClockTrack
    codeRefs:
      - packages/domain/src/models/streamModel/**
      - packages/domain/src/models/wallClockTrack.ts
    docRefs: [docs/design/1-domain/domain-model.md, docs/design/1-domain/mp4-stream-model.md, docs/design/6-features/timeshift/guardrail-contracts.md]

  - id: domain.models.play
    parent: domain.models
    name: 播放模型
    responsibility: 播放段的领域事实聚合，按方案一一对应：FrameModel（Wcs/Wasm 帧级渲染）、MseModel（MSE SourceBuffer 事实）、FhlsModel（Fhls 分片生成、呈现时钟、原生取片需求）、VideoPlayModel（原生 Video）。提供能力面断言（assert* / has*）供调用方按能力而非按类判别。VCS 播放模型由 Player 持有，此处只定义其视图契约。不持 DOM / SourceBuffer 句柄。
    principle: |
      - 播放模型只存可序列化的值快照（VideoPlaybackSnapshot、帧台账、渲染时间轴），DOM 读数由渲染适配层采样后 `record*` 写入。
      - 能力面拆分（FrameBufferPlaybackCapability、RenderTimelinePlaybackCapability、MediaReadyStateCapability 等）+ 结构型断言：换方案后模型已换代时 `has*` 返回 false，调用方跳过写入而不抛错。
      - FhlsModel 按 2s 分片把帧样本组织成 m3u8 分片，记录消费游标、硬 seek 起点与呈现时钟分代（委托 fhlsPresentationClock 纯函数换算）。
    provides: [if.models.play.FrameModel, if.models.play.MseModel, if.models.play.FhlsModel, if.models.play.assertPlaybackCapability]
    dataStructures:
      - ds.PlaybackModel
      - ds.PlaybackModelUnion
      - ds.PlaybackModelViewBase
      - ds.PlaybackModelInstance
      - ds.VcsPlaybackModelView
      - ds.FrameModel
      - ds.MseModel
      - ds.FhlsModel
      - ds.VideoPlayModel
      - ds.NativeDemand
      - ds.SegmentInfo
    codeRefs: [packages/domain/src/models/playModel/**]
    docRefs: [docs/design/1-domain/domain-model.md, docs/design/4-solutions/fhls/fhls-solution.md]

  - id: domain.models.components
    parent: domain.models
    name: 模型组件
    responsibility: 被流模型 / 播放模型组合复用的值组件：StreamFactsCore（解析链路共享流事实）、FrameBufferLedger（解复用/解码帧台账与 GOP 账）、RenderTimeline（渲染时间轴、倍速、补缓冲冻结）、VideoPlaybackSnapshot（video 元素状态值快照）。
    principle: |
      - StreamFactsCore 的 `arrivedMaxDts` 是会话内单调高水位，必须在任何丢帧 / 时间戳修正之前上报，否则积压判据会闭环自我抹除；fps 在首秒样本内锁定，dts 倒退时重新起算。
      - FrameBufferLedger 只记账不持帧数据：按 demuxed / decoding / decoded 三段记帧信息与上限，GopLedger 保留最近 5 个 GOP 的帧数。
    provides: [if.models.components.FrameBufferLedger, if.models.components.RenderTimeline]
    dataStructures:
      - ds.StreamFactsCore
      - ds.StreamFrameFact
      - ds.StreamSampleFact
      - ds.VideoMetadataFact
      - ds.FrameBufferLedger
      - ds.BufferFrameInfo
      - ds.FrameBufferLimits
      - ds.BufferChange
      - ds.RenderTimeline
      - ds.VideoPlaybackSnapshot
      - ds.VideoPlaybackState
    codeRefs: [packages/domain/src/models/components/**]
    docRefs: [docs/design/1-domain/domain-model.md]

  # ───────────────────────── domain.services ─────────────────────────
  - id: domain.services.solution-select
    parent: domain.services
    name: 方案选型与流事实裁决
    responsibility: 由 URL / 配置 / 请求 / 当前三元组 / 环境能力推出目标 (loadMode, playMode, solution) 及变化标记；流信息到达后裁决是否需要解密与重选方案；推导 Process 段需求（PTS 校正、解密）与直播帧策略的方案分派。只给结论，不执行装配。
    principle: |
      - 推断优先级：URL 推断 > 本次请求 > 当前值 > 配置 > 默认（Live / Flv 或 Mp4）；与显式配置冲突时返回 `err(ErrorBase(ConfigError))`。
      - 可用方案 = 已注册 ∩ 环境能力 ∩ 业务约束（Flv / HLS / 解密 / 直播禁用 Video，点播禁用 Vcs），按 solutionPriority 排序；Video 可用时恒排最前。显式指定只看能力不受优先级名单限制。
      - `reconcileStreamFacts`：流加密而配置声明不需要解密 → ConfigError；当前为 Video 且流事实与其不兼容 → requiresReselect。
      - 结果统一用 share 的 `Result<T, ErrorBase>`，不抛异常。
    provides:
      - if.services.solution-select.selectSolution
      - if.services.solution-select.inferSourceModes
      - if.services.solution-select.reconcileStreamFacts
      - if.services.solution-select.computeProcessRequirements
      - if.services.solution-select.resolveLiveFramePlan
    dataStructures:
      - ds.SolutionSelectInput
      - ds.SolutionDecision
      - ds.SolutionCapabilities
      - ds.SourceModeInference
      - ds.StreamFactsReconcileInput
      - ds.StreamFactsReconcileOutput
      - ds.ProcessRequirements
      - ds.LiveFramePlan
    codeRefs:
      - packages/domain/src/services/solutionSelector.ts
      - packages/domain/src/services/streamFactsReconcile.ts
      - packages/domain/src/services/processRequirements.ts
      - packages/domain/src/services/liveFramePlan.ts
    docRefs: [docs/design/2-assembly/solution.md, docs/design/4-solutions/wcs-wasm/live-frame-strategy.md]

  - id: domain.services.buffer-baseline
    parent: domain.services
    name: 基线缓冲阈值
    responsibility: 按播放模式 / 加载模式 / 活动腿给出四阈值基线（起补 / 停补 / 起丢 / 停丢），配置覆盖优先；录制腿固定取点播档。是各自适应控制律与时移阈值的共同起点。
    provides: [if.services.buffer-baseline.resolvePlaybackBuffer]
    dataStructures: [ds.PlaybackBufferThresholds]
    codeRefs: [packages/domain/src/services/playbackBufferPolicy.ts]
    docRefs: [docs/design/5-capabilities/buffer/buffer-adaptive.md]

  - id: domain.services.live-buffer-control
    parent: domain.services
    name: 直播自适应缓冲控制律
    responsibility: 直播缓冲阈值的控制律（框架无关、host 注入）：SAB 自适应控制器、供需感知控制器 SupplyAware、两者按送货节奏切换的融合控制器 CadenceSwitch、降延迟放行的积压检测器 BacklogDetector，以及 VCS 送帧线的 EWMA 包络控制器。只计算阈值 / 放行位 / 跳跃量，写回与埋点由宿主插件做。
    principle: |
      - SAB：扩张只看实测缓冲谷底，固定死区 + 封顶 band + 起播冷静期；平静确认后按固定步长回收；空档预留 setGapFloor 作为独立下限；欠载时上报交棒。
      - SupplyAware：凹陷深度取「到达回撤」而非缓冲谷底；先判区制（Startup/Stable/Volatile/Underload/Outage/Recovering）再定储备，追帧只在 Stable 放行。
      - CadenceSwitch：两控制律常驻观测、各自产出影子输出，按批间空档证据决定生效方，切换不 reset 任何一方。
      - BacklogDetector：开环判据「已到达媒体量 − 墙钟」相邻两窗谷底之差，长窗 / 短窗 / 富余窗三路任一成立即放行降延迟。
      - VCS AdaptiveBufferController：波谷样本 → 有界窗 mean+k(max−mean) → 非对称 EWMA floor → 死区 + 迟滞台阶输出停等 / 前跳。
    provides:
      - if.services.live-buffer-control.createSelfAdaptiveBufferController
      - if.services.live-buffer-control.createSupplyAwareBufferController
      - if.services.live-buffer-control.createCadenceSwitchBufferController
      - if.services.live-buffer-control.createBacklogDetector
      - if.services.live-buffer-control.AdaptiveBufferController
    dataStructures: [ds.BufferThresholds, ds.SabHost, ds.SupplyAwareHost, ds.SupplyAwareFacts, ds.CadenceSwitchFacts, ds.TickInput, ds.TickResult]
    codeRefs:
      - packages/domain/src/services/selfAdaptiveBufferPolicy.ts
      - packages/domain/src/services/supplyAwareBufferPolicy.ts
      - packages/domain/src/services/cadenceSwitchBufferPolicy.ts
      - packages/domain/src/services/backlogDetector.ts
      - packages/domain/src/services/vcsAdaptiveBufferPolicy.ts
    docRefs:
      - docs/design/5-capabilities/buffer/buffer-adaptive.md
      - docs/design/5-capabilities/buffer/supply-aware-live-buffer.md
      - docs/design/5-capabilities/buffer/latency-drop-backlog-gate.md
      - docs/design/5-capabilities/buffer/vcs-adaptive-buffer-controller.md

  - id: domain.services.vod-buffer
    parent: domain.services
    name: 点播缓冲与加载水位
    responsibility: 点播的自适应缓冲（带宽 / 码率 EWMA、下一段体积与拉流耗时预测、起补 / 停补阈值推导与节流）与加载水位滞回（是否继续拉下一段）。不认识任何 Model 类型与 LoadMode，来源换算由插件整理成入参。
    principle: |
      - 阈值推导 = 预测 T_load × 安全系数，经 clamp、变化率夹断与最小间隔节流；拖慢检测命中时跳过节流立即重算。
      - 水位滞回：停拉线先判且等号侧退出，起拉线严格小于才进入。
    provides: [if.services.vod-buffer.createVodAdaptiveBufferPolicy, if.services.vod-buffer.deriveVodBufferThresholds, if.services.vod-buffer.vodLoadWatermark]
    dataStructures: [ds.VodBufferThresholds, ds.VodThresholdDecision]
    codeRefs: [packages/domain/src/services/vodAdaptiveBufferPolicy.ts, packages/domain/src/services/vodLoadWatermark.ts]
    docRefs: [docs/design/5-capabilities/buffer/buffer-adaptive.md, docs/design/2-assembly/load-factory-strategy.md]

  - id: domain.services.hls-live
    parent: domain.services
    name: HLS 直播与清单节律
    responsibility: HLS 专属的纯决策：按分片时长与目标延迟推直播缓冲策略、追帧 / 落后判定与暂停恢复（重定位 / 追赶 / 不动）、清单刷新节律（快档 / 慢档 / 停止，点播策略与录制腿驱动共用）。副作用与运行态守卫留在策略层。
    provides: [if.services.hls-live.getHlsLiveBufferPolicy, if.services.hls-live.decideLiveEdgeLag, if.services.hls-live.hlsPlaylistRefresh]
    dataStructures: [ds.HlsLiveBufferPolicy, ds.HlsLiveEdgeLagDecision, ds.HlsLiveResumeDecision, ds.HlsPlaylistRefreshDecision]
    codeRefs:
      - packages/domain/src/services/hlsLiveBufferPolicy.ts
      - packages/domain/src/services/hlsLiveCatchupPolicy.ts
      - packages/domain/src/services/hlsPlaylistRefresh.ts
    docRefs: [docs/design/2-assembly/load-factory-strategy.md]

  - id: domain.services.fhls-presentation
    parent: domain.services
    name: Fhls 呈现规则
    responsibility: Fhls 方案的纯规则：呈现时钟（源 pts ↔ 呈现时间 ↔ 媒体原点，按渲染轴分代）、连续呈现三条看门狗判据（未渲染 / 进度停滞 / 消费间隔）、连续呈现点播组的供数预算与 seek 收敛判据、原生取片饥饿缓解。不读墙钟、无定时器，错误码留在接线层。
    principle: |
      - 渲染 dts = 源 dts + 代偏移 + Σ已生效丢帧偏移；内容跳变（换边 / seek）用 `spliceEpoch` 开新一代，新一代首帧接在两轨最后渲染 dts 之后，渲染轴恒单调。
      - 供数量按呈现轴计算，避免往回 seek 时源轴算出超量。
    provides: [if.services.fhls-presentation.presentationClock, if.services.fhls-presentation.judgePresentationHealth, if.services.fhls-presentation.decideContinuousSupply]
    dataStructures: [ds.PresentationClockFacts, ds.ClockEpoch]
    codeRefs:
      - packages/domain/src/services/fhlsPresentationClock.ts
      - packages/domain/src/services/fhlsPresentationHealth.ts
      - packages/domain/src/services/fhlsContinuousSupply.ts
    docRefs: [docs/design/4-solutions/fhls/fhls-solution.md]

  - id: domain.services.timeshift
    parent: domain.services
    name: 时移换腿决策
    responsibility: 直播时移的纯判定：直播腿接点跟踪、换腿判定（覆盖 + 关键帧对齐 + 交接余量）、灰度区回退、接管前有界预取、追不上（饥饿）判定、拖进度换腿、Fhls 切后台续播，以及录制腿与直播腿的对齐方式与时间基准常量 C 换算。无 IO / 定时器 / 全局状态；执行换腿事务的是 app.timeshift。
    principle: |
      - `decideLeg` 规则顺序即契约、命中即出：覆盖且对齐（余量够 → switch，不够 → wait）→ 对不齐定局 → 接点滚出 → 录制结束 → 拉取失败 → 未覆盖片数到上限 → 录制头未知 → 等下一片；连续无进展可把 wait 改判 give-up。
      - 对齐：两侧都能解出绝对墙钟用 wall 模式，C = 直播轨在该帧墙钟处 pts − 帧原始 pts；否则 pts 模式 C = 0。录制帧一律加 C 换到直播轴。
      - `decideGrace`：录制出错 → error-recovery；已出画 → on-screen；拉片连败 → fallback-live；续播后未出画超时 → fallback-live(no-picture)。
    provides:
      - if.services.timeshift.decideLeg
      - if.services.timeshift.decideGrace
      - if.services.timeshift.timeBaseConstant
      - if.services.timeshift.shouldSeekSwitch
      - if.services.timeshift.decideBackgroundResume
    dataStructures: [ds.LegDecisionInput, ds.LegDecision, ds.GraceDecision, ds.AlignmentMode, ds.TimeBaseInput, ds.SeekSwitchSnapshot, ds.BackgroundResumeDecision]
    codeRefs:
      - packages/domain/src/services/timeShiftLegDecision.ts
      - packages/domain/src/services/timeShiftAlignment.ts
      - packages/domain/src/services/timeShiftSeekSwitchDecision.ts
      - packages/domain/src/services/timeShiftBackgroundResume.ts
    docRefs: [docs/design/6-features/timeshift/leg-switch.md, docs/design/6-features/timeshift/guardrail-contracts.md]

  # ───────────────────────── domain.algorithms ─────────────────────────
  - id: domain.algorithms.codec-syntax
    parent: domain.algorithms
    name: H.264 位流语法
    responsibility: H.264 码流的比特级读取（ExpGolomb 缓存式整块读取、FastExpGolomb 逐字节轻量读取，ue(v)/se(v) 解码）与 SPS 解析（profile/level、尺寸含 cropping、SAR、VUI 帧率、POC 字段）。越界抛 share 的 ErrorBase。
    provides: [if.algorithms.codec-syntax.ExpGolomb, if.algorithms.codec-syntax.parseSps]
    codeRefs: [packages/domain/src/algorithms/bitReader/**, packages/domain/src/algorithms/h264/**]
    docRefs: [docs/design/1-domain/stream-parse-algorithms.md]

  - id: domain.algorithms.container
    parent: domain.algorithms
    name: 容器元数据解析
    responsibility: AMF0 解码（FLV script data / onMetaData：时长、宽高、码率、编码 id、点播关键帧索引表），按类型标记递归下降；数据非法时上抛 DemuxFormatError，不静默返回空对象。
    provides: [if.algorithms.container.parseScriptData]
    dataStructures: [ds.ParseValueDataType]
    codeRefs: [packages/domain/src/algorithms/container/**]
    docRefs: [docs/design/1-domain/stream-parse-algorithms.md]

  - id: domain.algorithms.latency-drop
    parent: domain.algorithms
    name: Fhls 降延迟丢帧选段
    responsibility: 状态转移形纯函数：在合流队列上按关键帧对齐、断裂点约束选出降延迟丢帧区间，缓冲不足时取消；只给 drop/pass/hold/cancel 动作，执行丢帧与偏移记账留给调用方。
    provides: [if.algorithms.latency-drop.pickLatencyDropRange]
    dataStructures: [ds.LatencyDropState, ds.LatencyDropEvent, ds.LatencyDropResult]
    codeRefs: [packages/domain/src/algorithms/fhlsLatencyDropRange.ts]
    docRefs: [docs/design/4-solutions/fhls/fhls-solution.md]

  # ───────────────────────── domain.rules ─────────────────────────
  - id: domain.rules.pipeline-rules
    parent: domain.rules
    name: Pipeline 图规则
    responsibility: Pipeline 图变更的唯一规则属地：校验 PipelineDiffSpec（节点增删、段归属、边合法性、外部锚点、多腿 G1–G7 活动腿分区、语义锚点唯一性），推导目标边并应用外部锚点；提供 NodeId / 腿段账本键的唯一拼接口。不持图实例，「当前已有边」由调用方传入。
    principle: |
      - `validateDiff(topology, diff, playerPhase, currentEdges)` 在拷贝上依次做 remove → add → 边校验 → 外部锚点校验 → buildTargetEdges → 活动腿分区 → 语义锚点校验，任何错误收集为 TopologyError[] 一次返回；全部通过才 applyExternalAnchors 产出最终边。
      - 多腿模式由拓扑或本次 diff 带 activeLeg 触发；不带时保持单腿透传行为不变。
    provides: [if.rules.pipeline-rules.validateDiff, if.rules.pipeline-rules.toNodeId]
    codeRefs: [packages/domain/src/rules/pipelineRules.ts]
    docRefs: [docs/design/0-kernel/pipeline-graph-rules.md, docs/design/0-kernel/pipeline-legs.md]

  - id: domain.rules.status-mapping
    parent: domain.rules
    name: 状态映射规则
    responsibility: 播放器基态 PlayerStatus → MU 状态 MuStatus 的穷举映射表（Loaded/Playing/Paused/Buffering → Running 等），framework 状态机同名再导出。
    provides: [if.rules.status-mapping.mappingPlayerStatus]
    codeRefs: [packages/domain/src/rules/mappingPlayerStatus.ts]
    docRefs: [docs/design/1-domain/domain-model.md]

