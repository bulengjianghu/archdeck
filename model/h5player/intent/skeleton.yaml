# 骨架（持久草图，X1、X2，ADR-0023）：4 个层 + 第二级模块（ID 固定，见 docs/04-description-format.md §3.1），人拥有、AI 重新生成时不改动；
# 第二级封闭（closed）：区域文件只能用 parent 往第二级模块下挂子模块，不得重复定义本文件中的模块。从 modules/layers.yaml 机械拆出，ID 与内容不变。

sketch:
  id: skeleton
  lifetime: persistent
  closed: [infra, app, domain, share]
  modules:
  - id: infra
    name: Infrastructure
    kind: layer
    order: 1
    abstraction: 副作用与机制：贴近浏览器、网络、Worker、Wasm 的实现，以及通用的状态 / 资源管理机制
    responsibility: 对外 API、组合根、机制内核（状态机 / Pipeline / 插件 / 事件 / ModelRegistry）与媒体单元等环境适配。
    includes: [PlayerIndex 与对外 API, Bootstrap 组合根, Framework 机制内核, MU 与外部适配器, Worker 基础设施]
    excludes: [方案选择规则, 播放策略的多份副本]
    mayDependOn: [app, domain, share]
    docRefs: [docs/arch/blueprint.md]
    children:
    - id: infra.player-index
      name: PlayerIndex
      kind: subsystem
      role: core
      responsibility: SDK 入口 Player：把用户操作转成状态机命令，把框架事件按白名单转发并做对外状态投影，提供 getStats 只读快照；另含模型能力收窄助手（modelAccess）与对外转出面。不含播放决策。
      provides: [if.player-index.play, if.player-index.switch, if.player-index.reset, if.player-index.destroy, if.player-index.getStats, if.player-index.on]
      dataStructures: [ds.PlayerStatsSnapshot, ds.StatsCapability]
      codeRefs: [packages/player/src/index.ts, packages/player/src/externalStatusProjector.ts, packages/player/src/modelAccess.ts, packages/player/src/stats.ts, packages/player/src/statsSnapshot.ts, packages/player/src/types.ts, packages/player/src/types/**, packages/player/src/pluginBase.ts, packages/player/src/rmsBundle.ts]
      docRefs: [docs/design/0-kernel/mu-base-sdk-entry.md, docs/design/6-features/player-get-stats.md]
    - id: infra.bootstrap
      name: Bootstrap 组合根
      kind: subsystem
      responsibility: 组合根：创建 ModelRegistry、Context、Framework 与 Solution 并接线；把 Framework 控制器、ModelRegistry、方案注册表、工厂适配成 SolutionDeps 窄端口，接好 playerData 事件投影，构造领域模型创建器。只被入口 Player 调用，其余只有出边。
      provides: [if.bootstrap.createPlayerRuntime, if.bootstrap.bootstrapSolution]
      dataStructures: [ds.PlayerRuntime, ds.StreamModelCreatorOptions]
      codeRefs: [packages/player/src/bootstrap/**]
      docRefs: [docs/design/2-assembly/solution.md]
    - id: infra.framework
      name: Framework 机制内核
      kind: subsystem
      role: core
      responsibility: 通用机制：状态机、Pipeline 事务（含多腿）、插件生命周期、事件 / 错误路由、ModelRegistry（含待命槽位）、Context 与设置端口、MediaUnit 基类与公共类型契约；不含方案选择与播放策略。
      provides: [if.framework.kernel.Framework, if.framework.state-machine.sendCommand, if.framework.state-machine.addPreCommandHook, if.framework.pipeline.updatePipeline, if.framework.pipeline.Dispatcher, if.framework.plugin.PluginBase, if.framework.model-registry.beginStreamModelSwitch, if.framework.context.Context, if.framework.media-unit.MediaUnit]
      dataStructures: [ds.CommandInfo, ds.Action, ds.PipelineDiff, ds.PipelineUpdateResult, ds.PlaybackModelSwitch, ds.EventInfo, ds.PlayerConfig, ds.PlayerData, ds.MediaPacket]
      codeRefs: [packages/framework/src/**]
      docRefs: [docs/design/0-kernel/state-machine.md, docs/design/0-kernel/pipeline-transaction.md, docs/design/0-kernel/model-registry.md, docs/design/0-kernel/pipeline-legs.md, docs/design/0-kernel/pipeline-graph-rules.md, docs/design/0-kernel/plugin-controller.md, docs/design/0-kernel/mu-base-sdk-entry.md, docs/design/0-kernel/observation-and-coordination.md]
    - id: infra.mus
      name: MUs 媒体单元
      kind: subsystem
      role: core
      responsibility: 数据面三段流水线上的节点与其工厂：Load（加载 / 解封装 / 段尾缓冲）、Process（校正 / 外部插件如解密）、Play（重封装 / 解码 / 缓冲 / 渲染）。上游 output 直接调用下游 input，逐帧零间接直推；缓冲位按策略动作出队，Fhls 分片经 Service Worker 转为拉模式。只执行，不做水位、追帧、seek 等决策。
      provides: [if.mus.mu-lifecycle, if.mus.factory.createMu, if.mus.buffer.release-actions, if.mus.render.display-actions]
      dataStructures: [ds.VcsModel, ds.MediaInfo, ds.MediaSegmentInfo]
      codeRefs: ['packages/player/src/mus/{loader,demuxer,corrector,remuxer,decoder,buffer,render}/**', packages/player/src/mus/muFactory.ts, packages/player/src/mus/muPluginWrapper.ts]
      docRefs: [docs/design/3-components]
    - id: infra.workers
      name: Worker 基础设施
      kind: subsystem
      responsibility: 跨出主线程的两类通道：Dedicated Worker 线程内 RPC（解码任务）与 Service Worker 注册 / 引用计数 / 双向消息协议及 SW 脚本本体；Fhls 服务是 SW 通道的业务使用方。只搬运与配对，不含播放决策（WorkerMessageBridge 本体在 Framework）。
      provides: [if.workers.sw-channel.ServiceWorkerMessenger, if.workers.fhls-services.FhlsService, if.workers.worker-task.WorkerTaskBase]
      dataStructures: [ds.ServiceWorkerMessage, ds.NativeDemandFacts]
      codeRefs: [packages/player/src/mus/workerTask/**, packages/player/src/mus/serviceWorker/**]
      docRefs: [docs/design/0-kernel/worker-infrastructure.md]
    - id: infra.third-party
      name: 三方库与外部媒体插件
      kind: subsystem
      responsibility: 内置三方库（mp4box、hls.js 的 ADTS 解析、sonic 变速）与两个内置解密媒体插件（Wasm，实现 MediaPlugin 契约，由 ProcessFactory 挂入流水线）。
      provides: [if.third-party.sonic.AudioTimeShift, if.third-party.decrypt-plugins.interceptorAsync]
      codeRefs: [packages/player/src/thirdParty/**, packages/player/src/mediaPlugins/**]
  - id: app
    name: Application
    kind: layer
    order: 2
    abstraction: 用例编排：按什么顺序做——方案初始化、切换事务、段重建、运行时驾驶策略
    responsibility: 执行方案选择的结果，编排三段流水线的装配与切换，并承载运行时驾驶与横向用例。
    includes: [Solution, 业务 Plugins / Fragments, 三段 Factory, Descriptor 与注册表]
    excludes: [具体 Controller / MU 构造, 逐帧加工, 环境探测实现]
    mayDependOn: [domain, share]
    docRefs: [docs/design/2-assembly/solution.md]
    children:
    - id: app.solution
      name: Solution
      kind: subsystem
      role: core
      responsibility: 方案选择结果的执行者：初始化、段换代、换腿事务、流事实到达后的协调；只做编排不做决策。依赖倒置：只依赖组合根注入的 SolutionDeps 端口，不 import Framework / plugins；对外暴露 LegPort，换腿十步事务在 SwitchLeg 前置 Hook 内执行。
      provides: [if.solution.Solution, if.solution.LegPort, if.solution.switchLeg, if.solution.createStreamFactReporter, if.solution.playStageStart]
      dataStructures: [ds.SolutionDeps, ds.SolutionStageFactory, ds.StagePipelinePlan, ds.LegSwitchOutcome, ds.CreatedLeg]
      codeRefs: [packages/player/src/solution/**]
      docRefs: [docs/design/2-assembly/solution.md, docs/design/2-assembly/leg-switch-transaction.md]
    - id: app.registry
      name: 方案注册表
      kind: subsystem
      responsibility: 方案 Descriptor / FragmentSpec 的注册、条件过滤与拓扑排序；片段挂载器（按段实例化、挂到 PluginController、发布并吊销代理句柄）；默认 6 方案 / 3 加载描述符表。
      provides: [if.registry.SolutionRegistry, if.registry.FragmentMounter, if.registry.planFragments, if.registry.registerDefaultDescriptors]
      dataStructures: [ds.SolutionDescriptor, ds.LoadDescriptor, ds.FragmentSpec, ds.VodLoadHandle]
      codeRefs: [packages/player/src/plugins/solution/registry/**, packages/player/src/plugins/solution/fragments/**]
    - id: app.factories
      name: 三段工厂
      kind: subsystem
      role: core
      responsibility: 按方案产出 Load / Process / Play 三段的候选计划（MU 图描述），由 Solution 的切换事务统一提交；同时产出段控制器，支持 quiesce / resume / destroy 与就地差量重配。
      provides: [if.factories.StageFactory, if.factories.configureBufferLimits]
      dataStructures: [ds.FactoryDiffResult, ds.FrameController, ds.MseController]
      codeRefs: [packages/player/src/plugins/solution/factory/**]
      docRefs: [docs/design/2-assembly/load-factory-strategy.md]
    - id: app.strategies
      name: 运行时驾驶策略
      kind: subsystem
      role: core
      responsibility: 作为方案片段挂载，运行期间驾驶各方案的加载与播放：加载段上报流事实并开闸放水、拉流节奏、直播追帧 / 丢帧 / 充水、点播 seek 与回退。Mse / Fhls 的直播主缓冲策略在横向用例插件中。
      provides: [if.strategies.vodLoad, if.strategies.playStage, if.strategies.HlsPlaylistRefreshScheduler]
      codeRefs: [packages/player/src/plugins/solution/strategy/**, packages/player/src/plugins/solution/vod/**]
    - id: app.plugins
      name: 横向用例插件
      kind: subsystem
      responsibility: 与具体方案无关的横向用例：缓冲水位策略与阈值自适应、网络监测与直播重连、运行状态守护、错误恢复、统计采集与埋点、可见性与防休眠、日志调试。控制律在 Domain，本模块只做事件采样、宿主适配与执行。
      provides: [if.plugins.reconnect.decide, if.plugins.reconnect.takeResumeRetry, if.plugins.buffer.resolveMseChasingSeekMs, if.plugins.support.statusScopedIntervalTask]
      dataStructures: [ds.ReconnectState, ds.ReconnectInput, ds.ReconnectEffect]
      codeRefs: [packages/player/src/plugins/*.ts, packages/player/src/plugins/record/**, packages/player/src/plugins/tracker/**]
    - id: app.timeshift
      name: 时移
      kind: subsystem
      responsibility: 直播时移编排：判断何时从直播腿换到回看（录制 HLS）腿、换不成怎么办（灰度回退、回直播恢复、Fhls 后台续播重装），发布时移公开事件。建腿 / 换腿事务归 Solution，判定规则归 Domain。
      provides: [if.timeshift.shell.api, if.timeshift.coordinator.legPort]
      dataStructures: [ds.TimeShiftFacts, ds.TimeShiftProbeResult, ds.RecordingAnchorSnapshot]
      codeRefs: [packages/player/src/plugins/timeshift/**]
      docRefs: [docs/design/6-features/timeshift, docs/design/2-assembly/leg-switch-transaction.md]
  - id: domain
    name: Domain
    kind: layer
    order: 3
    abstraction: 规则与事实：纯决策，零 I/O，可在 Node 中纯输入输出测试
    responsibility: 领域类型与模型、方案选型等决策服务、协议算法与规则表，以及引用领域类型的端口。
    includes: [纯决策, 领域类型 / 模型, 协议算法, 规则表, 领域端口]
    excludes: [DOM, 网络, Framework / Player 实现, 装配时序]
    mayDependOn: [share]
    docRefs: [docs/design/1-domain/domain-model.md]
    children:
    - id: domain.types
      name: 类型与事件
      kind: subsystem
      responsibility: 领域公共类型的唯一属地：方案三元组枚举、MuKey / MuType / PlayerStatus 等状态与 MU 枚举、PlaybackState / Statistic 的能力面、ModelViewMap 等 Registry 视图契约、Pipeline 拓扑契约与领域事件；Framework 只重导出同一对象。
      dataStructures: [ds.LoadMode, ds.PlayMode, ds.SolutionType, ds.PlayerStatus, ds.MuKey, ds.ModelViewMap, ds.DomainEvent]
      codeRefs: [packages/domain/src/types/**, packages/domain/src/events.ts, packages/domain/src/index.ts]
    - id: domain.ports
      name: 领域端口
      kind: subsystem
      role: core
      responsibility: 签名引用领域类型的端口：领域事件发布、模型注册表、流事实上报与播放段启动入口，由 Infrastructure / Application 实现。
      provides: [if.ports.DomainEventPublisher, if.ports.IModelRegistry, if.ports.StreamFactReporter, if.ports.PlayStageStart]
      codeRefs: [packages/domain/src/ports.ts]
    - id: domain.models
      name: 领域模型
      kind: subsystem
      role: core
      responsibility: PlaybackState 播放状态聚合、Statistic 统计聚合、流模型（Flv / Hls / Mp4）与按方案一一对应的播放模型：持有事实、守住不变量、提供语义方法与只读视图；只存值快照，不持 DOM 句柄。
      dataStructures: [ds.PlaybackState, ds.Statistic, ds.StreamModelUnion, ds.PlaybackModelUnion]
      codeRefs: [packages/domain/src/models/**]
      docRefs: [docs/design/1-domain/domain-model.md, docs/design/1-domain/mp4-stream-model.md]
    - id: domain.services
      name: 决策服务
      kind: subsystem
      role: core
      responsibility: 方案选型与流事实裁决、基线 / 直播自适应 / 点播缓冲控制律、HLS 与 Fhls 专属规则、时移换腿判定等纯决策；控制律通过 host 注入，写回由宿主插件完成。
      codeRefs: [packages/domain/src/services/**]
    - id: domain.algorithms
      name: 协议算法
      kind: subsystem
      responsibility: 无 I/O 的协议算法：H.264 位流语法、AMF0 元数据解析、Fhls 降延迟丢帧选段。
      codeRefs: [packages/domain/src/algorithms/**]
      docRefs: [docs/design/1-domain/stream-parse-algorithms.md]
    - id: domain.rules
      name: 规则表
      kind: subsystem
      responsibility: 可穷举的规则：Pipeline 图变更校验（含多腿 G1–G7）与 PlayerStatus → MuStatus 状态映射。
      codeRefs: [packages/domain/src/rules/**]
  - id: share
    name: Share
    kind: layer
    order: 4
    abstraction: 稳定公共原语：跨层最小契约，无业务规则、无领域类型、无可变全局状态
    responsibility: 所有层共用的最小契约、Result / Error 原语与无状态工具。
    includes: [跨层最小契约, Result / Error, 无状态通用原语]
    excludes: [业务规则, 领域类型依赖, 可变全局状态]
    mayDependOn: []
    children:
    - id: share.contracts
      name: 跨层契约
      kind: subsystem
      role: core
      responsibility: 跨层最小契约：IPlugin 插件契约与 Result / ok / err。
      provides: [if.contracts.IPlugin, if.contracts.Result]
      dataStructures: [ds.Result]
      codeRefs: [packages/share/src/contracts/**]
    - id: share.errors
      name: 错误原语
      kind: subsystem
      role: core
      responsibility: ErrorBase 错误基类、错误码及 ErrorCode → (ErrorType, ErrorLevel) 的查表映射、异常归一。
      provides: [if.errors.ErrorBase, if.errors.errorWrapper]
      dataStructures: [ds.ErrorBase, ds.ErrorCode, ds.ErrorLevel, ds.ErrorType, ds.ErrorDetail]
      codeRefs: [packages/share/src/errors/**]
    - id: share.utils
      name: 通用原语
      kind: subsystem
      responsibility: 无状态的通用工具函数。
      provides: [if.utils.lastOf]
      codeRefs: [packages/share/src/utils/**]
