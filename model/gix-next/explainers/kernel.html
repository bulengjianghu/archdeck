    <h1>八块围着一本账转</h1>
    <p class="lede">内核里谁想改状态，都得开一笔写账事务；<span data-arch="kernel.ledger">账与投影</span>在这笔事务里请<span data-arch="kernel.rules">兜底规则与门</span>把关、请反应补出后续。所以读这一层先看那笔事务，再看谁往里写、谁插在里面。</p>

    <h2>唯一的写入口：一笔写账事务</h2>
    <figure>
      <svg viewBox="0 0 480 292" role="img" aria-label="上排五个服务开事务写账，中间是事务的五步，下排是插进事务的规则端口">
        <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker></defs>
        <text x="10" y="14" class="m">开事务、写事件的服务</text>
        <g data-arch="kernel.tasks"><rect x="10" y="22" width="86" height="36" rx="8" fill="var(--kernel-s)" stroke="var(--kernel)"/><text x="53" y="45" text-anchor="middle">任务与卡</text></g>
        <g data-arch="kernel.orchestration"><rect x="103" y="22" width="86" height="36" rx="8" fill="var(--kernel-s)" stroke="var(--kernel)"/><text x="146" y="45" text-anchor="middle">统筹与执行</text></g>
        <g data-arch="kernel.dispatch"><rect x="196" y="22" width="86" height="36" rx="8" fill="var(--kernel-s)" stroke="var(--kernel)"/><text x="239" y="45" text-anchor="middle">适配器调用</text></g>
        <g data-arch="kernel.liveness"><rect x="289" y="22" width="86" height="36" rx="8" fill="var(--kernel-s)" stroke="var(--kernel)"/><text x="332" y="45" text-anchor="middle">活性与恢复</text></g>
        <g data-arch="kernel.intake"><rect x="382" y="22" width="88" height="36" rx="8" fill="var(--kernel-s)" stroke="var(--kernel)"/><text x="426" y="45" text-anchor="middle">信号池</text></g>
        <path d="M53 58 V80 M146 58 V80 M239 58 V80 M332 58 V80 M426 58 V80" stroke="var(--text-2)" marker-end="url(#a)"/>
        <!-- 事务 -->
        <g data-arch="kernel.ledger">
          <rect x="10" y="84" width="460" height="92" rx="10" fill="var(--kernel-s)" stroke="var(--kernel)" stroke-width="2.5"/>
          <text x="22" y="104" class="t">账与投影：一笔事务，要么全成，要么全不成</text>
        </g>
        <g>
          <rect x="22" y="118" width="74" height="40" rx="6" fill="var(--bg)" stroke="var(--kernel)"/><text x="59" y="143" text-anchor="middle">守卫</text>
          <rect x="110" y="118" width="74" height="40" rx="6" fill="var(--bg)" stroke="var(--kernel)"/><text x="147" y="143" text-anchor="middle">追加事件</text>
          <rect x="198" y="118" width="74" height="40" rx="6" fill="var(--bg)" stroke="var(--kernel)"/><text x="235" y="143" text-anchor="middle">投影</text>
          <rect x="286" y="118" width="74" height="40" rx="6" fill="var(--bg)" stroke="var(--kernel)"/><text x="323" y="143" text-anchor="middle">反应</text>
          <rect x="374" y="118" width="84" height="40" rx="6" fill="var(--bg)" stroke="var(--kernel)"/><text x="416" y="139" text-anchor="middle">收尾</text><text x="416" y="153" text-anchor="middle" class="m">再提交</text>
          <path d="M96 138 H108 M184 138 H196 M272 138 H284 M360 138 H372" stroke="var(--text-2)" marker-end="url(#a)"/>
        </g>
        <!-- 插件 -->
        <text x="10" y="200" class="m">插进事务的端口函数（账本身不认识它们）</text>
        <g data-arch="kernel.rules"><rect x="10" y="208" width="150" height="40" rx="8" fill="var(--kernel-s)" stroke="var(--kernel)" stroke-dasharray="4 3"/><text x="85" y="226" text-anchor="middle">兜底规则与门</text><text x="85" y="241" text-anchor="middle" class="m">守卫 + 反应</text></g>
        <g data-arch="kernel.intake"><rect x="168" y="208" width="96" height="40" rx="8" fill="var(--kernel-s)" stroke="var(--kernel)" stroke-dasharray="4 3"/><text x="216" y="226" text-anchor="middle">信号规则</text><text x="216" y="241" text-anchor="middle" class="m">守卫 + 反应</text></g>
        <g data-arch="kernel.dispatch"><rect x="272" y="208" width="96" height="40" rx="8" fill="var(--kernel-s)" stroke="var(--kernel)" stroke-dasharray="4 3"/><text x="320" y="226" text-anchor="middle">结果归一</text><text x="320" y="241" text-anchor="middle" class="m">反应（最后跑）</text></g>
        <g data-arch="kernel.liveness"><rect x="376" y="208" width="94" height="40" rx="8" fill="var(--kernel-s)" stroke="var(--kernel)" stroke-dasharray="4 3"/><text x="423" y="226" text-anchor="middle">补唤醒</text><text x="423" y="241" text-anchor="middle" class="m">收尾</text></g>
        <path d="M59 208 V160 M120 208 L310 160 M216 208 L318 160 M320 208 V160 M423 208 V160" stroke="var(--gray)" stroke-dasharray="3 3" marker-end="url(#a)"/>
        <g data-arch="kernel.assembly"><rect x="10" y="260" width="460" height="26" rx="6" fill="none" stroke="var(--gray)"/><text x="240" y="278" text-anchor="middle" class="m">内核装配：启动时把这些函数按顺序插上，此后不再变</text></g>
      </svg>
      <figcaption>上排是开事务写事件的服务，下排是插在事务里的函数。账只管顺序与回滚边界，换掉一条规则不碰账；守卫一抛错，这一笔连同它引出的后续一起撤销。</figcaption>
    </figure>

    <h2>为什么依赖成了一个环，怎么读</h2>
    <figure>
      <svg viewBox="0 0 480 270" role="img" aria-label="上：账、反应规则、各服务三者成环；下：把环按一笔事务展开成一条时间线">
        <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker></defs>
        <text x="10" y="16" class="m">按 import 看：一个环</text>
        <rect x="20" y="30" width="110" height="36" rx="8" fill="var(--kernel-s)" stroke="var(--kernel)" stroke-width="2"/><text x="75" y="53" text-anchor="middle">账（事务）</text>
        <rect x="185" y="30" width="110" height="36" rx="8" fill="var(--kernel-s)" stroke="var(--kernel)"/><text x="240" y="53" text-anchor="middle">反应规则</text>
        <rect x="350" y="30" width="110" height="36" rx="8" fill="var(--kernel-s)" stroke="var(--kernel)"/><text x="405" y="53" text-anchor="middle">各个服务</text>
        <path d="M130 48 H183" stroke="var(--text-2)" marker-end="url(#b)"/><text x="156" y="42" text-anchor="middle" class="m">调</text>
        <path d="M295 48 H348" stroke="var(--text-2)" marker-end="url(#b)"/><text x="321" y="42" text-anchor="middle" class="m">调</text>
        <path d="M405 66 C405 100, 75 100, 75 68" fill="none" stroke="var(--text-2)" marker-end="url(#b)"/><text x="240" y="98" text-anchor="middle" class="m">再写账</text>
        <line x1="10" y1="116" x2="470" y2="116" stroke="var(--line)"/>
        <text x="10" y="136" class="m">按一笔事务看：一条有头有尾的线</text>
        <rect x="10" y="146" width="460" height="74" rx="10" fill="none" stroke="var(--kernel)" stroke-dasharray="5 4"/>
        <text x="20" y="164" class="m">开事务</text>
        <text x="434" y="164" class="m">提交</text>
        <rect x="22" y="172" width="80" height="32" rx="6" fill="var(--soft)" stroke="var(--line)"/><text x="62" y="193" text-anchor="middle">事件 A</text>
        <rect x="128" y="172" width="96" height="32" rx="6" fill="var(--soft)" stroke="var(--line)"/><text x="176" y="193" text-anchor="middle">反应 → 服务</text>
        <rect x="250" y="172" width="80" height="32" rx="6" fill="var(--soft)" stroke="var(--line)"/><text x="290" y="193" text-anchor="middle">事件 B</text>
        <rect x="356" y="172" width="104" height="32" rx="6" fill="var(--soft)" stroke="var(--line)"/><text x="408" y="193" text-anchor="middle">补唤醒、入队</text>
        <path d="M102 188 H126 M224 188 H248 M330 188 H354" stroke="var(--text-2)" marker-end="url(#b)"/>
        <text x="240" y="240" text-anchor="middle" class="m">反应只补事件、排唤醒、放任务包，不在事务里唤起统筹者；</text>
        <text x="240" y="258" text-anchor="middle" class="m">统筹者要等看门狗下一轮另开事务，所以线一定会走到头。</text>
      </svg>
      <figcaption>环是真实的：反应得调各服务，各服务又得写账。但它不是失控的递归——同一笔事务里每圈都要产生新事件、过一遍守卫，最终只落成唤醒和任务包；读的时候沿「一笔事务」走，不沿 import 走。</figcaption>
    </figure>

    <h2>不卡死：唤醒是账上的事实</h2>
    <figure>
      <svg viewBox="0 0 480 214" role="img" aria-label="每笔事务收尾补唤醒，看门狗到点触发，活性唤起统筹者，统筹者的决定再写账">
        <defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker></defs>
        <rect x="10" y="20" width="130" height="50" rx="8" fill="var(--kernel-s)" stroke="var(--kernel)"/><text x="75" y="42" text-anchor="middle">事务收尾</text><text x="75" y="60" text-anchor="middle" class="m">没唤醒就补一条</text>
        <rect x="175" y="20" width="130" height="50" rx="8" fill="var(--kernel-s)" stroke="var(--kernel)"/><text x="240" y="42" text-anchor="middle">看门狗一轮</text><text x="240" y="60" text-anchor="middle" class="m">默认 15 秒</text>
        <rect x="340" y="20" width="130" height="50" rx="8" fill="var(--kernel-s)" stroke="var(--kernel)" stroke-width="2"/><text x="405" y="42" text-anchor="middle">唤起统筹者</text><text x="405" y="60" text-anchor="middle" class="m">快照 + 增量事件</text>
        <path d="M140 45 H173 M305 45 H338" stroke="var(--text-2)" marker-end="url(#c)"/>
        <text x="322" y="38" text-anchor="middle" class="m">到点</text>
        <rect x="340" y="110" width="130" height="44" rx="8" fill="var(--playbooks-s)" stroke="var(--playbooks)"/><text x="405" y="130" text-anchor="middle">统筹者会话</text><text x="405" y="146" text-anchor="middle" class="m">派执行、发卡、设唤醒</text>
        <path d="M405 70 V108" stroke="var(--text-2)" marker-end="url(#c)"/>
        <path d="M340 132 H75 V72" fill="none" stroke="var(--text-2)" marker-end="url(#c)"/>
        <text x="200" y="126" text-anchor="middle" class="m">经 MCP 写账，又是一笔事务</text>
        <path d="M240 70 V 176 H 120" fill="none" stroke="var(--gray)" stroke-dasharray="3 3" marker-end="url(#c)"/>
        <text x="10" y="170" class="m">看门狗顺手做：</text>
        <text x="10" y="188" class="m">判停滞杀会话 · 卡到期 · 租约过期</text>
        <text x="10" y="206" class="m">runner 离线 · 外部状态轮询</text>
        <text x="250" y="196" class="m">等人答卡时只是兜底的唤醒：照记，不唤起</text>
      </svg>
      <figcaption>活性只看一张唤醒表：写账时补齐、到点触发，<span data-arch="kernel.orchestration">统筹与执行</span>只在被触发时才起会话。事务里的反应从不直接唤起统筹者，这样一笔事务的长短与 AI 会话无关。</figcaption>
    </figure>

    <h2>对外：两条事件夹住一次调用，合入要过门</h2>
    <figure>
      <svg viewBox="0 0 480 220" role="img" aria-label="人放行后请求合入，守卫查放行与证据，经适配器调用记两条事件，结果归一成已合入">
        <defs><marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker></defs>
        <circle cx="40" cy="40" r="26" fill="var(--human-s)" stroke="var(--human)"/><text x="40" y="45" text-anchor="middle" class="w">人放行</text>
        <rect x="90" y="18" width="110" height="44" rx="8" fill="var(--kernel-s)" stroke="var(--kernel)" stroke-width="2"/><text x="145" y="38" text-anchor="middle">合入门</text><text x="145" y="54" text-anchor="middle" class="m">对当前 head 吗？</text>
        <rect x="228" y="18" width="120" height="44" rx="8" fill="var(--kernel-s)" stroke="var(--kernel)"/><text x="288" y="38" text-anchor="middle">记「请求调用」</text><text x="288" y="54" text-anchor="middle" class="m">同事务放任务包</text>
        <rect x="376" y="18" width="94" height="44" rx="8" fill="var(--client-s)" stroke="var(--client)"/><text x="423" y="38" text-anchor="middle">runner</text><text x="423" y="54" text-anchor="middle" class="m">适配器执行</text>
        <path d="M66 40 H88 M200 40 H226 M348 40 H374" stroke="var(--text-2)" marker-end="url(#d)"/>
        <rect x="228" y="100" width="120" height="44" rx="8" fill="var(--kernel-s)" stroke="var(--kernel)"/><text x="288" y="120" text-anchor="middle">记「调用完成」</text><text x="288" y="136" text-anchor="middle" class="m">同事务归一</text>
        <path d="M423 62 V122 H350" fill="none" stroke="var(--text-2)" marker-end="url(#d)"/><text x="430" y="96" class="m">回报</text>
        <rect x="90" y="100" width="110" height="44" rx="8" fill="var(--kernel-s)" stroke="var(--kernel)"/><text x="145" y="120" text-anchor="middle">已合入</text><text x="145" y="136" text-anchor="middle" class="m">终态，收工</text>
        <path d="M228 122 H202" stroke="var(--text-2)" marker-end="url(#d)"/>
        <line x1="145" y1="62" x2="145" y2="98" stroke="var(--human)" stroke-dasharray="3 3"/>
        <text x="152" y="84" class="m w">守卫查两次</text>
        <text x="10" y="176" class="m">任务包是运行表、不进账（里面有令牌）；</text>
        <text x="10" y="194" class="m">派了什么、结果如何，由框里的两条事件记下。</text>
        <text x="10" y="212" class="m">统筹者与执行者都没有合入权限，只能请人放行。</text>
      </svg>
      <figcaption>合入是最典型的一次对外调用：<span data-arch="kernel.rules">门</span>在请求与落定两处各拦一次，<span data-arch="kernel.dispatch">适配器调用、租约与真机</span>负责两条事件和中间的任务包。其余调用（建工作树、跑判项、跑真机）走同一条路，只是不过合入门。</figcaption>
    </figure>
