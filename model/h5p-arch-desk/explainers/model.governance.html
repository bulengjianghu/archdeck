    <h1>裁判：三方对账、棘轮、先问后写</h1>
    <p class="lede">这一层是 <span data-arch="model.governance">架构治理</span>：<span data-arch="model.governance" data-field="summary"></span>。三方对不上的地方，就是架构在偏航。</p>

        <defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker></defs>

        <circle cx="460" cy="138" r="9" fill="var(--hot)"/>
        <text x="320" y="20" font-size="11" text-anchor="middle" class="">事实 · 代码里真实发生的依赖</text>
        <text x="180" y="160" font-size="11" text-anchor="middle" class="">描述 · AI 声称的架构</text>
        <text x="460" y="160" font-size="11" text-anchor="middle" class="">意图 · 架构师定的规则</text>
        <text x="320" y="84" font-size="12" text-anchor="middle" class="">裁判</text>
        <text x="320" y="102" font-size="9.5" text-anchor="middle" class="muted">默认拒绝：写了白名单即只许这些</text>
        <text x="320" y="118" font-size="9.5" text-anchor="middle" class="muted">欠账只能还，不能涨</text>
      </svg>
      <figcaption>三方对照：确定的事实 × 架构师的意图 × AI 的描述。</figcaption>
    </figure>

      <figcaption>基线棘轮 + AI 写前判定。</figcaption>

    <h2>裁判台的四个窗口</h2>
    <div class="cols c2">
      <div><b><span data-arch="model.governance.facts">事实台</span></b>文件依赖按模块归属汇总，与描述比对：哪些关系有代码作证、哪些是嘴上说说、哪些代码走了描述没写的路。</div>
      <div><b><span data-arch="model.governance.rules">规则台</span></b>按架构师定的规则与分层判定违规：越层、越白名单、越过访问面，都记下来。</div>
      <div><b><span data-arch="model.governance.cycles">环台</span></b>模块环与文件环、环度变化——环是腐化的前兆，看见就报。</div>
      <div><b><span data-arch="model.governance.query">查询窗口</span></b>AI 的写前判定走这里：定位模块、给出职责与该走的门，判定之外还指路。</div>
    </div>

    <p class="note">它只对照、不执法：改规则、加例外永远由人决定；裁判把偏航如实记下来，让棘轮只紧不松。</p>
