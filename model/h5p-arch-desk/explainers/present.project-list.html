    <h1>进门第一面墙：先看健不健康</h1>
    <p class="lede">这一层是 <span data-arch="present.project-list">项目列表主页</span>：<span data-arch="present.project-list" data-field="summary"></span>。它把每个项目压缩成一张卡，健康度摆在最显眼的位置。</p>

    <figure>
      <svg viewBox="0 0 640 216" role="img" aria-label="项目卡以健康度为主、简介与规模为次，点击进入工作台">
        <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker></defs>
        <rect x="14" y="14" width="296" height="178" rx="10" fill="var(--bg)" stroke="var(--warn)"/>
        <text x="30" y="40" font-size="12" class="">项目卡 · 健康度为主</text>
        <rect x="30" y="52" width="120" height="24" rx="5" fill="var(--warn-soft)" stroke="var(--warn)"/><text x="90" y="68" font-size="9.5" text-anchor="middle" class="">描述错误与提醒 N</text>
        <rect x="156" y="52" width="138" height="24" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="225" y="68" font-size="9.5" text-anchor="middle" class="">违规 相对基线 ±N</text>

        <rect x="156" y="82" width="138" height="24" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="225" y="98" font-size="9.5" text-anchor="middle" class="">未证实 · 未归属</text>
        <text x="30" y="128" font-size="9.5" class="muted">次要：简介 · 分层 · 规模 · 生成来源</text>
        <rect x="30" y="140" width="264" height="38" rx="8" fill="var(--soft)" stroke="var(--line)"/><text x="162" y="156" font-size="9.5" text-anchor="middle" class="">推进中的设计版本（已实现 / 已放弃</text><text x="162" y="170" font-size="9.5" text-anchor="middle" class="muted">的归档，只注明个数）</text>
        <rect x="330" y="14" width="296" height="178" rx="10" fill="var(--soft)" stroke="var(--line)"/>
        <rect x="330" y="14" width="296" height="178" rx="10" fill="var(--soft)" stroke="var(--line)"/>
        <text x="478" y="44" font-size="12" text-anchor="middle" class="">一眼决定：先修哪家</text>
        <text x="478" y="70" font-size="9.5" text-anchor="middle" class="muted">健康度差的排前面——</text>
        <text x="478" y="86" font-size="9.5" text-anchor="middle" class="muted">卡片的排序逻辑就是「哪里最疼」</text>
        <path d="M478,104 C478,124 380,120 320,108" stroke="var(--text-2)" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#b)"/>

        <text x="320" y="206" font-size="10" text-anchor="middle" class="">清单从数据站来（projects.json 附体检结果），点击进入项目工作台</text>

      <figcaption>一张卡 = 一次体检结论 + 一扇门。</figcaption>
    </figure>

    <h2>它和谁打交道</h2>
    <div class="cols c2">
      <div><b>数据从哪来</b>清单与体检结果由 <span data-arch="access.model-source">数据站</span> 提供——列表页自己不算任何健康指标。</div>
      <div><b>点了去哪</b>单击卡片进入 <span data-arch="present.desk-view">项目视图</span>；项目带推进中的设计时，直达该设计的最新一轮。</div>
    </div>

    <p class="note">主页只陈列、不做体检：所有数字都是模型层算好、数据站搬来的——列表页换一种排版也不会算错一个数。</p>
