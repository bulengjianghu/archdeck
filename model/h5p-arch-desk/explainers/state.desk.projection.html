    <h1>派生车间：全是 computed</h1>

    <h2>车间纪律</h2>
    <p>车间里禁止存放：任何想「记下来下用」的念头都违规——要什么由输入现算，输入不变结果不变。车间也禁止越界：关于被描述系统的事实只能从模型层来，坐标只能从排版来，绝不私查账本。呈现层拿到的永远是算好的成品——它想算也没有原料入口。</p>

    <ul data-arch="state.desk.projection" data-field="invariants"></ul>

    <p class="note">写入口在 <span data-arch="state.desk.actions">dispatch</span>，读出口在车间——一进一出，账本才守得住。</p>
