    <h1>会话是一个值</h1>
    <p class="lede"><span data-arch="state.desk.edit">编辑中的草图</span>是架构师在画布上改草图时的会话：手势改的是会话里的值，保存才落盘。</p>

    <h2>手势改值，保存落盘</h2>

      <svg viewBox="0 0 480 252" role="img" aria-label="草图编辑会话：手势经编辑操作与纯函数应用改会话值，保存时整个设计一次落盘">
