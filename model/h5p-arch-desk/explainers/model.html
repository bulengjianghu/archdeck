    <h1>百科全书：进料、索引、两条投影链</h1>
    <p class="lede">这一层是 <span data-arch="model">模型层</span>：<span data-arch="model" data-field="summary"></span>。结构与行为归架构台，这里只存「关于被描述系统的知识」——脱离工作台依然成立。</p>

    <h2>为什么页面、终端、助手都信它</h2>
    <p>百科全书不依赖任何界面：输入描述与事实，输出数据与答案。页面要画图来问，命令行要校验来问，AI 助手要判断来问——同一个 <span data-arch="model.pipeline">进料口</span>、同一套索引，同一个答案。换单词表不必改全书：<span data-arch="model.types">公共词表</span> 一页管所有名字与形状。</p>
    <p>班里还有一位裁判：<span data-arch="model.governance">架构治理</span>，专管「描述说的」与「代码干的」对不对得上，它有自己的图解。</p>

    <p class="note ok">知识与会话分开：换个前端（页面 / 命令行 / AI），全书照用——这是本项目判别「一条规则放哪层」的那把刀。</p>
