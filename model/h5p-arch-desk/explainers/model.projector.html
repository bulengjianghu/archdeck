<!doctype html>

    <style>
:root{--bg:#ffffff;--text:#1f2328;--text-2:#57606a;--line:#d0d7de;--soft:#f6f8fa;--accent:#0969da;--accent-soft:#ddf4ff;--ok:#1a7f37;--ok-soft:#dafbe1;--hot:#8250df;--hot-soft:#fbefff;--warn:#9a6700;--warn-soft:#fff8c5;--gray:#8c959f;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--text:#e6edf3;--text-2:#9da7b3;--line:#30363d;--soft:#161b22;--accent:#4493f8;--accent-soft:#0c2d6b;--ok:#3fb950;--ok-soft:#12351e;--hot:#ab7df8;--hot-soft:#2b1d47;--warn:#d29922;--warn-soft:#3b2e0a;--gray:#6e7681}}
body{margin:0;padding:18px 22px 32px;background:var(--bg);color:var(--text);font:14px/1.7 -apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif}
h1{font-size:18px;margin:0 0 4px}
h2{font-size:15px;margin:22px 0 6px}
.lede{color:var(--text-2);margin:0 0 14px}
figure{margin:10px 0 4px}
figcaption{font-size:12px;color:var(--text-2);margin-top:4px}
svg{width:100%;height:auto;display:block}
svg text{font-family:inherit;fill:var(--text)}
svg .muted{fill:var(--text-2)}
.cols{display:grid;gap:8px;margin:8px 0}
.c2{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(3,1fr)}
.cols div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--soft);font-size:13px}
.cols b{display:block;font-size:13.5px}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:6px 10px;border-radius:0 6px 6px 0;margin:12px 0 4px;font-size:13px}
.note.ok{border-left-color:var(--ok);background:var(--ok-soft)}
code{font-size:12.5px;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 4px}
</style>

  <body>

    <h1>一层切片怎么算出来</h1>
    <p class="lede">这一层是 <span data-arch="model.projector">Projector 层次投影</span>：<span data-arch="model.projector" data-field="summary"></span>。同一张架构图，你在哪一层看，它就切出哪一层的片子。</p>

    <figure>
      <svg viewBox="0 0 640 214" role="img" aria-label="给定父模块，端点提升、收集器合并，产出节点边边界参与者，分层声明出总览带">
        <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker></defs>
        <rect x="14" y="30" width="148" height="64" rx="10" fill="var(--soft)" stroke="var(--line)"/>
        <text x="88" y="54" font-size="11" text-anchor="middle" class="">给定父模块</text>
        <text x="30" y="76" font-size="9" class="muted">「现在站在哪一层看」</text>
        <path d="M164,62 L192,62" stroke="var(--text-2)" stroke-width="2" marker-end="url(#m)"/>
        <rect x="196" y="30" width="148" height="64" rx="10" fill="var(--bg)" stroke="var(--warn)"/>
        <text x="270" y="54" font-size="11" text-anchor="middle" class="">端点映射</text>
        <text x="212" y="76" font-size="9" class="muted">子模块的关系提升到本层</text>
        <path d="M346,62 L374,62" stroke="var(--text-2)" stroke-width="2" marker-end="url(#m)"/>
        <rect x="378" y="30" width="130" height="64" rx="10" fill="var(--bg)" stroke="var(--warn)"/>
        <text x="443" y="54" font-size="11" text-anchor="middle" class="">收集合并</text>
        <text x="394" y="76" font-size="9" class="muted">同一对端的线并成一条</text>
        <path d="M510,62 L538,62" stroke="var(--text-2)" stroke-width="2" marker-end="url(#m)"/>
        <rect x="542" y="22" width="86" height="80" rx="10" fill="var(--accent-soft)" stroke="var(--accent)"/>
        <text x="585" y="44" font-size="10" text-anchor="middle" class="">本层切片</text>
        <text x="552" y="64" font-size="8.5" class="muted">节点 · 直接边</text>
        <text x="552" y="78" font-size="8.5" class="muted">聚合边 · 边界</text>
        <text x="552" y="92" font-size="8.5" class="muted">外部参与者</text>
        <rect x="196" y="120" width="148" height="60" rx="10" fill="var(--ok-soft)" stroke="var(--ok)"/>
        <text x="270" y="142" font-size="10.5" text-anchor="middle" class="">声明了分层？</text>
        <text x="212" y="162" font-size="9" class="muted">出分层总览：一层一条带，</text>
        <text x="212" y="176" font-size="9" class="muted">带内成员 + 核心跨层边</text>
        <rect x="378" y="120" width="148" height="60" rx="10" fill="var(--soft)" stroke="var(--line)"/>
        <text x="452" y="142" font-size="10.5" text-anchor="middle" class="">临时展开</text>
        <text x="394" y="162" font-size="9" class="muted">展开的带露出全部内容</text>
        <text x="452" y="176" font-size="9" class="muted">（O6），收起只留带名</text>
        <text x="320" y="204" font-size="10" text-anchor="middle" class="">与场景投影同一套端点规则（P1）——两张片子上的同一个模块永远同一个名字</text>
      </svg>
      <figcaption>结构班的切片机：站得高看得粗，下钻变细。</figcaption>
    </figure>

    <h2>三个岗位</h2>
    <div class="cols c3">
      <div><b><span data-arch="model.projector.endpoints">端点</span></b>关系两端在当前层是谁：落到本层节点、还是经由上层、还是到边界。</div>
      <div><b><span data-arch="model.projector.collector">收集</span></b>同层同向的线合并成一条聚合边——远看粗、近看细。</div>
      <div><b><span data-arch="model.projector.overview">总览</span> 与 <span data-arch="model.projector.hierarchy">层次</span></b>声明了分层就出带状总览；普通层次逐级下钻，切片规则同一套。</div>
    </div>
