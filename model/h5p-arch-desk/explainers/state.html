    <h1>一个值、纯函数、一个协调者</h1>
    <p class="lede">关于「这一次浏览」的一切都住在<span data-arch="state">视图状态层</span>：看哪、选谁、走到哪、怎么摆。它由三件套组成：<span data-arch="state.desk">DeskState</span>、<span data-arch="state.transition">视图状态转移</span>和 <span data-arch="state.layout">Layout</span>。</p>

    <h2>三件套怎么配合</h2>
    <figure>
      <svg viewBox="0 0 480 246" role="img" aria-label="视图状态层三件套：意图经转移规则写入 DeskState，排版算坐标，呈现层只读派生；地址、文件、本机记忆是状态的投影">
        <defs><marker id="a8P" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker><marker id="a8S" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--warn)"/></marker><marker id="a8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok)"/></marker><marker id="a8M" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--hot)"/></marker><marker id="a8g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker><marker id="a8l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker></defs>
        <rect x="8" y="8" width="130" height="46" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="73.0" y="28.3" font-size="13" text-anchor="middle">意图</text><text x="73.0" y="42.8" font-size="10.5" text-anchor="middle" class="muted">来自三个区</text>
        <g data-arch="state.transition"><rect x="8" y="96" width="130" height="52" rx="8" fill="var(--warn-soft)" stroke="var(--warn)"/><text x="73.0" y="119.3" font-size="13" text-anchor="middle">视图状态转移</text><text x="73.0" y="133.8" font-size="10.5" text-anchor="middle" class="muted">纯函数</text></g>
        <g data-arch="state.desk"><rect x="170" y="88" width="140" height="68" rx="8" fill="var(--warn-soft)" stroke="var(--warn)"/><text x="240.0" y="112.4" font-size="14" text-anchor="middle" font-weight="600">DeskState</text><text x="240.0" y="126.9" font-size="10.5" text-anchor="middle" class="muted">唯一的值</text><text x="240.0" y="141.4" font-size="10.5" text-anchor="middle" class="muted">唯一的写入口</text></g>

        <path d="M310,100 C330,80 330,50 342,40" stroke="var(--text-2)" stroke-width="1.8" fill="none" marker-end="url(#a8g)"/>
        <path d="M408,54 L408,98" stroke="var(--text-2)" stroke-width="1.8" fill="none" marker-end="url(#a8g)"/>
        <path d="M310,124 L342,124" stroke="var(--text-2)" stroke-width="1.8" fill="none" marker-end="url(#a8g)"/>
        <rect x="100" y="200" width="84" height="32" rx="8" fill="var(--soft)" stroke="var(--line)" stroke-dasharray="5 4"/><text x="142.0" y="220.0" font-size="11.5" text-anchor="middle">地址</text>

        <path d="M240,156 L242,198" stroke="var(--text-2)" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#a8g)"/>
        <rect x="300" y="200" width="84" height="32" rx="8" fill="var(--soft)" stroke="var(--line)" stroke-dasharray="5 4"/><text x="342.0" y="220.0" font-size="11.5" text-anchor="middle">本机记忆</text>
        <path d="M240,156 L342,198" stroke="var(--text-2)" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#a8g)"/>
        <text x="48" y="220" font-size="10.5" text-anchor="middle" class="muted">同步适配器</text>

    </figure>

    <h2>主语从状态推出来</h2>
    <figure>
      <svg viewBox="0 0 480 292" role="img" aria-label="主语从状态推出：有选中取选中，在回放取进度所在步骤，否则取当前层的父模块；四个视图标签读主语">
        <defs><marker id="a9P" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker><marker id="a9S" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--warn)"/></marker><marker id="a9A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok)"/></marker><marker id="a9M" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--hot)"/></marker><marker id="a9g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker><marker id="a9l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker></defs>
        <g data-arch="state.desk"><rect x="8" y="6" width="464" height="40" rx="8" fill="var(--warn-soft)" stroke="var(--warn)"/><text x="240.0" y="30.4" font-size="12.5" text-anchor="middle">状态：层次 · 选中 · 场景与进度 · 草图会话</text></g>
        <rect x="40" y="62" width="400" height="34" rx="8" fill="var(--soft)" stroke="var(--line)"/><text x="50" y="83.2" font-size="12" text-anchor="start">① 有选中 → 选中的对象</text>
        <path d="M24,79 L38,79" stroke="var(--text-2)" stroke-width="1.2" fill="none" marker-end="url(#a9g)"/>
        <rect x="40" y="106" width="400" height="34" rx="8" fill="var(--soft)" stroke="var(--line)"/><text x="50" y="127.2" font-size="12" text-anchor="start">② 在回放 → 进度所在的那一步</text>
        <path d="M24,123 L38,123" stroke="var(--text-2)" stroke-width="1.2" fill="none" marker-end="url(#a9g)"/>
        <rect x="40" y="150" width="400" height="34" rx="8" fill="var(--soft)" stroke="var(--line)"/><text x="50" y="171.2" font-size="12" text-anchor="start">③ 都没有 → 当前层的父模块（根层即系统）</text>
        <path d="M24,167 L38,167" stroke="var(--text-2)" stroke-width="1.2" fill="none" marker-end="url(#a9g)"/>
        <line x1="24" y1="46" x2="24" y2="167" stroke="var(--text-2)" stroke-width="1.2"/>
        <rect x="180" y="196" width="120" height="36" rx="8" fill="var(--warn-soft)" stroke="var(--warn)"/><text x="240.0" y="218.7" font-size="13.5" text-anchor="middle" font-weight="600">主语</text>
        <path d="M240,190 L240,194" stroke="var(--text-2)" stroke-width="1.2" fill="none" marker-end="url(#a9g)"/>
        <line x1="240" y1="164" x2="240" y2="190" stroke="var(--text-2)" stroke-width="1.2"/>
        <rect x="8" y="256" width="108" height="30" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="62.0" y="275.2" font-size="12" text-anchor="middle">图解</text>
        <path d="M240,232 L62,254" stroke="var(--accent)" stroke-width="1.2" fill="none" marker-end="url(#a9P)"/>
        <rect x="126" y="256" width="108" height="30" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="180.0" y="275.2" font-size="12" text-anchor="middle">描述</text>
        <path d="M240,232 L180,254" stroke="var(--accent)" stroke-width="1.2" fill="none" marker-end="url(#a9P)"/>
        <rect x="244" y="256" width="108" height="30" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="298.0" y="275.2" font-size="12" text-anchor="middle">核对</text>
        <path d="M240,232 L298,254" stroke="var(--accent)" stroke-width="1.2" fill="none" marker-end="url(#a9P)"/>
        <rect x="362" y="256" width="108" height="30" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="416.0" y="275.2" font-size="12" text-anchor="middle">时序图</text>
        <path d="M240,232 L416,254" stroke="var(--accent)" stroke-width="1.2" fill="none" marker-end="url(#a9P)"/>
      </svg>
      <figcaption>主语不是另存的一份状态，而是从选中、进度与层次推出来的值，所以永远和选中对得上。选中的步骤就是进度所在的一步；状态里没有「播放中」，回放只随人的操作前进。</figcaption>
    </figure>

    <h2>排版单独一站</h2>
    <figure>
      <svg viewBox="0 0 480 140" role="img" aria-label="排版单独一站：层次视图进，坐标出，按内容缓存；选中与悬停只改描边与显隐">
        <defs><marker id="a10P" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker><marker id="a10S" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--warn)"/></marker><marker id="a10A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok)"/></marker><marker id="a10M" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--hot)"/></marker><marker id="a10g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker><marker id="a10l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker></defs>
        <rect x="6" y="30" width="132" height="54" rx="8" fill="var(--soft)" stroke="var(--line)"/><text x="72.0" y="54.1" font-size="12.5" text-anchor="middle">本层要画的</text><text x="72.0" y="68.6" font-size="10.5" text-anchor="middle" class="muted">节点 · 边（无像素）</text>
        <g data-arch="state.layout"><rect x="170" y="22" width="140" height="70" rx="8" fill="var(--warn-soft)" stroke="var(--warn)"/><text x="240.0" y="47.4" font-size="14" text-anchor="middle" font-weight="600">Layout</text><text x="240.0" y="61.9" font-size="10.5" text-anchor="middle" class="muted">按内容缓存</text><text x="240.0" y="76.4" font-size="10.5" text-anchor="middle" class="muted">不变就不重算</text></g>
        <rect x="342" y="30" width="132" height="54" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="408.0" y="54.1" font-size="12.5" text-anchor="middle">画布</text><text x="408.0" y="68.6" font-size="10.5" text-anchor="middle" class="muted">照坐标画</text>
        <path d="M138,57 L168,57" stroke="var(--text-2)" stroke-width="1.8" fill="none" marker-end="url(#a10g)"/>
        <path d="M310,57 L340,57" stroke="var(--text-2)" stroke-width="1.8" fill="none" marker-end="url(#a10g)"/>
        <text x="240" y="124" font-size="10.5" text-anchor="middle" class="muted">选中、悬停、回放只改描边与显隐，不进排版</text>
      </svg>
      <figcaption>坐标既不是会话规则也不是系统知识，所以单独由排版来算。它只认「这一层要画什么」，结果按内容缓存；节点不会因为点了一下而挪位。</figcaption>
    </figure>
