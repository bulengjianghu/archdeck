    <h1>规则机器</h1>
    <p class="lede">这一层是 <span data-arch="state.transition">视图状态转移</span>：<span data-arch="state.transition" data-field="summary"></span>。它是纯函数：不碰 Vue、路由、计时器，同样的输入永远同样的输出。</p>

    <h2>机器上的五个工位</h2>
    <div class="cols c3">
      <div><b><span data-arch="state.transition.selection">选中</span></b>与 <span data-arch="state.transition.navigation">导航</span>：选中是唯一排他的主语；下钻、回退都在规则里排队。</div>
      <div><b><span data-arch="state.transition.playback">进度</span> 与 <span data-arch="state.transition.mode">模式</span></b>选中的步骤就是进度所在；回放只由用户驱动——状态里没有「播放中」。</div>
      <div><b><span data-arch="state.transition.url">URL</span> 与 <span data-arch="state.transition.edit">编辑态</span></b>地址怎么编解码、草图的脏与存，同一处规则说了算。</div>
    </div>

    <ul data-arch="state.transition" data-field="invariants"></ul>

    <p class="note">它不认识界面也不认识磁盘——所以单测穷举规则清单即可全覆盖，不用启动浏览器。</p>
