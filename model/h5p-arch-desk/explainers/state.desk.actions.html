    <h1>唯一的写入口</h1>
    <p class="lede">这一层是 <span data-arch="state.desk.actions">dispatch 与操作</span>：<span data-arch="state.desk.actions" data-field="summary"></span>。整张桌子的状态只有一个赋值处——想改账，排队从这里过。</p>

    <figure>
      <svg viewBox="0 0 640 212" role="img" aria-label="每种意图一个操作，操作只构造动作，dispatch 经转移函数写回">
        <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker></defs>

        <text x="30" y="74" font-size="8.5" class="muted">下钻 · 返回 · 选中 · 悬停</text>
        <text x="30" y="90" font-size="8.5" class="muted">打开场景 · 单步 · 选分支</text>
        <text x="30" y="106" font-size="8.5" class="muted">跳转 · 定位 · 关闭场景</text>

        <text x="293" y="100" font-size="8.5" text-anchor="middle" class="muted">不直接写状态</text>
        <path d="M370,88 L398,88" stroke="var(--text-2)" stroke-width="2" marker-end="url(#a)"/>
        <rect x="402" y="62" width="110" height="56" rx="10" fill="var(--bg)" stroke="var(--warn)"/>
        <text x="457" y="86" font-size="11.5" text-anchor="middle" class="">dispatch</text>

      <figcaption>一支笔：操作装弹，dispatch 击发，规则瞄准。</figcaption>

    <h2>为什么这么绕</h2>
    <p>多个窗口都想改同一处显示时，谁说了算？答案不是优先级，而是只有一支笔：所有改动都变成「动作」，过同一道纯函数，写回同一个值。于是「下钻时选中谁」「关场景时标签怎么收」这些互相牵扯的问题，永远只在规则机器一个地方回答。</p>

    <ul data-arch="state.desk.actions" data-field="invariants"></ul>

    <p class="note">派生给转移函数的上下文（索引、本层帧投影）来自 <span data-arch="state.desk.projection">派生车间</span>；规则本体在 <span data-arch="state.transition">视图状态转移</span>——这里只是那支笔。</p>
