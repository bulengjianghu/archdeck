    <h2>为什么值得单列一层</h2>
    <p>词表一乱，全书各行其是。把契约收在一页：改一个字段，全文检索这一页就知道谁受影响；呈现层想显示名字，只能查这一页的表——所以页面上的每个叫法与描述必然一致。词典不解释世界，只统一说法：解释归 <span data-arch="model.projector">投影班</span> 与 <span data-arch="model.governance">裁判</span>。</p>
