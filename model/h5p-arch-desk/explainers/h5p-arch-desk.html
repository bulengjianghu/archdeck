    <h1>一张会动的架构地图桌</h1>
    <p class="lede">把代码仓库压缩成一张可下钻、可点选、可回放的图：<b>看见</b>（画图）、<b>对照</b>（事实与描述）、<b>守住</b>（规则与基线）。四层楼，依赖只准从上往下。</p>

    <figure>
      <svg viewBox="0 0 640 300" role="img" aria-label="磁盘到画布的数据旅行，四层楼各一站">
        <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker></defs>
        <rect x="120" y="8" width="400" height="56" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/>
        <text x="320" y="30" font-size="12.5" text-anchor="middle" class="">呈现层 · 画布</text><text x="320" y="48" font-size="9.5" text-anchor="middle" class="muted">把状态画出来、把手势上交——只画不算</text>
        <rect x="120" y="84" width="400" height="56" rx="8" fill="var(--warn-soft)" stroke="var(--warn)"/>
        <text x="320" y="106" font-size="12.5" text-anchor="middle" class="">视图状态层 · 这次浏览的大脑</text><text x="320" y="124" font-size="9.5" text-anchor="middle" class="muted">现在看哪、选了什么、怎么摆</text>
        <rect x="20" y="160" width="260" height="66" rx="8" fill="var(--ok-soft)" stroke="var(--ok)"/>
        <text x="150" y="182" font-size="12.5" text-anchor="middle" class="">接入层 · 搬运工</text><text x="150" y="200" font-size="9.5" text-anchor="middle" class="muted">读描述读源码，只搬运不解释</text>
        <text x="150" y="216" font-size="9.5" text-anchor="middle" class="muted">命令行与 AI 从这扇窗进</text>
        <rect x="360" y="160" width="260" height="66" rx="10" fill="var(--bg)" stroke="var(--ok)"/>
        <text x="490" y="182" font-size="12.5" text-anchor="middle" class="">模型层 · 百科全书</text><text x="490" y="200" font-size="9.5" text-anchor="middle" class="muted">关于被描述系统的知识：</text>
        <text x="490" y="214" font-size="9.5" text-anchor="middle" class="muted">换个前端依然成立</text>
        <rect x="16" y="244" width="150" height="48" rx="8" fill="var(--soft)" stroke="var(--line)"/><text x="91" y="264" font-size="11" text-anchor="middle" class="">磁盘</text><text x="91" y="280" font-size="9" text-anchor="middle" class="muted">描述 YAML + 源码</text>
        <rect x="474" y="244" width="150" height="48" rx="8" fill="var(--soft)" stroke="var(--line)"/><text x="549" y="264" font-size="11" text-anchor="middle" class="">命令行与 AI</text><text x="549" y="280" font-size="9" text-anchor="middle" class="muted">同一个查询核心</text>
        <path d="M91,240 L91,230 L130,230 L130,228" stroke="var(--ok)" stroke-width="2.5" fill="none" marker-end="url(#g)"/>
        <path d="M280,196 C310,196 320,180 340,164" stroke="var(--ok)" stroke-width="2.5" fill="none" marker-end="url(#g)"/>
        <path d="M490,158 C470,140 400,148 360,142" stroke="var(--ok)" stroke-width="2.5" fill="none" marker-end="url(#g)"/>
        <path d="M350,140 C330,140 330,146 326,144" stroke="var(--ok)" stroke-width="2.5" fill="none" marker-end="url(#g)"/>
        <path d="M549,240 L549,232" stroke="var(--ok)" stroke-width="2.5" fill="none" marker-end="url(#g)"/>
        <text x="320" y="244" font-size="10" text-anchor="middle" class="muted">数据旅行：磁盘 → 搬运工 → 百科全书 → 大脑 → 画布</text>
      </svg>
      <figcaption>四层楼与一次数据的旅行。</figcaption>
    </figure>

    <h2>一次点击的回路</h2>
    <figure>
      <svg viewBox="0 0 640 128" role="img" aria-label="手势变意图，纯函数算新状态，画布照单重画">
        <defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker></defs>
        <rect x="12" y="24" width="108" height="52" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="66" y="46" font-size="10.5" text-anchor="middle" class="">手势 → 意图</text><text x="66" y="62" font-size="9" text-anchor="middle" class="muted">画布不上交计算</text>
        <path d="M122,50 L146,50" stroke="var(--text-2)" stroke-width="2" marker-end="url(#h)"/>
        <rect x="150" y="24" width="148" height="52" rx="8" fill="var(--bg)" stroke="var(--warn)"/><text x="224" y="46" font-size="10.5" text-anchor="middle" class="">规则机器（纯函数）</text><text x="224" y="62" font-size="9" text-anchor="middle" class="muted">旧状态 + 动作 → 新状态</text>
        <path d="M300,50 L324,50" stroke="var(--text-2)" stroke-width="2" marker-end="url(#h)"/>
        <rect x="328" y="24" width="150" height="52" rx="8" fill="var(--bg)" stroke="var(--warn)"/><text x="403" y="46" font-size="10.5" text-anchor="middle" class="">唯一状态持有者</text><text x="403" y="62" font-size="9" text-anchor="middle" class="muted">重派生要画的数据</text>
        <path d="M480,50 L504,50" stroke="var(--text-2)" stroke-width="2" marker-end="url(#h)"/>
        <rect x="508" y="24" width="120" height="52" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="568" y="46" font-size="10.5" text-anchor="middle" class="">画布重画</text><text x="568" y="62" font-size="9" text-anchor="middle" class="muted">节点位置不动</text>
        <path d="M568,80 C568,116 66,116 66,80" stroke="var(--warn)" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#h)"/>
        <text x="320" y="108" font-size="10" text-anchor="middle" class="muted">「位置不动、只换边」是硬规矩——下钻再深，你看过的节点还在原地</text>
      </svg>
      <figcaption>画布永远只是「照单办事」。</figcaption>
    </figure>

    <p class="note ok">命令行、页面、AI 问的是同一本百科全书——同一输入，同一答案。所以图上的知识在终端里、在助手里同样成立。</p>
