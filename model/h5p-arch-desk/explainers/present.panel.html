    <h1>讲解员与登记台</h1>
    <p class="lede">这一层是 <span data-arch="present.panel">属性面板</span>：<span data-arch="present.panel" data-field="summary"></span>。选中什么讲什么；架构师的笔迹也从这里登记。</p>

    <figure>
      <svg viewBox="0 0 640 232" role="img" aria-label="头部加三卡：理解、核对、相关资料">
        <defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker></defs>
        <rect x="14" y="10" width="612" height="40" rx="8" fill="var(--soft)" stroke="var(--line)"/>
        <text x="30" y="35" font-size="11" class="">头部：名称 · 徽标 · 设计说明 · ×</text>
        <rect x="14" y="58" width="196" height="110" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/>
        <text x="112" y="80" font-size="11.5" text-anchor="middle" class="">理解卡</text>
        <text x="30" y="100" font-size="9" class="muted">六问：是什么 / 不是什么 /</text>
        <text x="30" y="114" font-size="9" class="muted">怎么分 / 守住什么 / 表面 /</text>
        <text x="30" y="128" font-size="9" class="muted">协作——意图在先、画布有</text>
        <text x="30" y="142" font-size="9" class="muted">的不复述、全文不截字</text>
        <rect x="222" y="58" width="196" height="110" rx="8" fill="var(--warn-soft)" stroke="var(--warn)"/>
        <text x="320" y="80" font-size="11.5" text-anchor="middle" class="">核对卡</text>
        <text x="238" y="100" font-size="9" class="muted">先结论后条目：证实 / 治理 /</text>
        <text x="238" y="114" font-size="9" class="muted">表面 / 拆分 / 演化 / 确认；</text>
        <text x="238" y="128" font-size="9" class="muted">异常行下平铺条目，清单</text>
        <text x="238" y="142" font-size="9" class="muted">折叠带计数、按严重度排</text>
        <rect x="430" y="58" width="196" height="110" rx="8" fill="var(--ok-soft)" stroke="var(--ok)"/>
        <text x="528" y="80" font-size="11.5" text-anchor="middle" class="">相关资料卡</text>
        <text x="446" y="100" font-size="9" class="muted">本模块的图解（▣）与参与</text>
        <text x="446" y="114" font-size="9" class="muted">的场景：单击预览、双击固</text>
        <text x="446" y="128" font-size="9" class="muted">定、已打开标「已打开」；</text>
        <text x="446" y="142" font-size="9" class="muted">多于 3 份缺省收起</text>
        <text x="320" y="196" font-size="10" text-anchor="middle" class="">「确认 / 例外 / 评审意见」从面板写入人拥有的文件——只追加，写后更新指纹</text>
        <text x="320" y="216" font-size="9.5" text-anchor="middle" class="muted">面板是分派器：对象不同（模块 / 关系 / 边 / 系统 / 设计）换不同的卡，自己不存内容</text>
      </svg>
      <figcaption>头部 + 三卡：讲解给读者，登记给架构师。</figcaption>
    </figure>

    <h2>分派出去的窗口</h2>
    <div class="cols c3">
      <div><b>模块窗</b><span data-arch="present.panel.module">模块卡</span> 由 <span data-arch="present.panel.dispatch">分派器</span> 按选中对象换装：关系、边、系统、设计各有各的卡。</div>
      <div><b>写入通道</b>确认、例外、评审意见经 <span data-arch="access.writer">描述写入</span> 落盘——面板是唯一入口，且只追加。</div>
      <div><b>讲解原理</b>理解卡讲「是什么 / 不是什么」，但每个模块「为什么这样设计」另有图解——面板的相关资料卡就是图解的门（本页你能看到，就是从那扇门进来的）。</div>
    </div>
