    <style>

body{margin:0;padding:16px 16px 28px;background:var(--bg);color:var(--text);font:14px/1.7 -apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif}

    <h1>只画不算的照单办事员</h1>
    <p class="lede"><span data-arch="present.canvas">画布</span>拿到什么画什么，碰到手势就上交。它不做投影，也不做布局。</p>

        <path d="M300,118 C316,118 316,198 328,198" stroke="var(--accent)" stroke-width="1.2" fill="none" marker-end="url(#a16P)"/>
      </svg>
      <figcaption>坐标来自排版，显隐与描边来自视图状态，画布一个数都不算。单击、悬停、拖动都变成意图交出去；单击 ▣ 也只是选中这个模块，图解标签自己会跟上。</figcaption>

    <h2>四个零件</h2>
