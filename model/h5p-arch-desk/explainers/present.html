    <h1>三区分工、只画不算</h1>
    <p class="lede">呈现层把状态画出来、把操作交上去。<span data-arch="present.desk-view">项目视图</span>搭好三区：<span data-arch="present.nav-tree">侧栏</span>与<span data-arch="present.canvas">画布</span>决定看谁，视图区里的<span data-arch="present.panel">属性面板</span>、<span data-arch="present.sequence">时序图</span>讲它是什么。</p>

    <h2>三区怎么分工</h2>
    <figure>
      <svg viewBox="0 0 480 268" role="img" aria-label="项目视图分三区：左边侧栏与画布是系统，决定主语；右边视图区是主语的投影，标签里有属性面板、时序图与源代码">
        <g data-arch="present.desk-view"><rect x="8" y="4" width="464" height="26" rx="6" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="240" y="21.5" font-size="12" text-anchor="middle">项目视图：搭三区、注入一份 DeskState</text></g>
        <rect x="8" y="38" width="96" height="190" rx="8" fill="none" stroke="var(--line)"/>
        <rect x="112" y="38" width="220" height="190" rx="8" fill="none" stroke="var(--line)"/>
        <rect x="340" y="38" width="132" height="190" rx="8" fill="none" stroke="var(--line)"/>
        <line x1="8" y1="64" x2="472" y2="64" stroke="var(--line)"/>
        <text x="56" y="56" font-size="11" text-anchor="middle" class="muted">项目 ▾</text>
        <text x="146" y="56" font-size="11" text-anchor="middle" class="muted">面包屑</text>
        <g data-arch="present.perspective"><rect x="184" y="44" width="140" height="16" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="254" y="56" font-size="10.5" text-anchor="middle">结构｜交互 · 场景 ▾</text></g>
        <text x="406" y="56" font-size="11" text-anchor="middle" class="muted">主语条</text>
        <g data-arch="present.nav-tree"><rect x="16" y="74" width="80" height="144" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="56" y="132" font-size="13" text-anchor="middle" font-weight="600">侧栏</text><text x="56" y="150" font-size="10.5" text-anchor="middle" class="muted">竖栏切三页</text><text x="56" y="164" font-size="10.5" text-anchor="middle" class="muted">模块 场景 改动</text></g>
        <g data-arch="present.canvas"><rect x="120" y="74" width="204" height="108" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="222" y="122" font-size="13" text-anchor="middle" font-weight="600">画布</text><text x="222" y="140" font-size="10.5" text-anchor="middle" class="muted">节点与边，单击即选中</text></g>
        <g data-arch="present.player"><rect x="160" y="190" width="124" height="26" rx="13" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="222" y="207.5" font-size="11" text-anchor="middle">◀ 第 3 / 21 步 ▶</text></g>
        <text x="406" y="80" font-size="10.5" text-anchor="middle" class="muted">图解 描述 核对 · 常驻</text>
        <g data-arch="present.panel"><rect x="348" y="88" width="116" height="40" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="406" y="105" font-size="12" text-anchor="middle">属性面板</text><text x="406" y="120" font-size="10.5" text-anchor="middle" class="muted">描述 · 核对</text></g>
        <g data-arch="present.sequence"><rect x="348" y="134" width="116" height="40" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="406" y="151" font-size="12" text-anchor="middle">时序图</text><text x="406" y="166" font-size="10.5" text-anchor="middle" class="muted">跟随场景</text></g>
        <g data-arch="present.source"><rect x="348" y="180" width="116" height="38" rx="8" fill="var(--soft)" stroke="var(--line)" stroke-dasharray="5 4"/><text x="406" y="196" font-size="12" text-anchor="middle">源代码</text><text x="406" y="211" font-size="10.5" text-anchor="middle" class="muted">资料，不跟随</text></g>
        <path d="M8,238 L8,244 L332,244 L332,238" stroke="var(--text-2)" fill="none"/>
        <text x="170" y="260" font-size="11.5" text-anchor="middle">系统：在这里决定主语</text>
        <path d="M340,238 L340,244 L472,244 L472,238" stroke="var(--text-2)" fill="none"/>
        <text x="406" y="260" font-size="11.5" text-anchor="middle">视图：主语的投影</text>
      </svg>
      <figcaption>左边两区回答「看谁」：侧栏和画布里的单击都只改选中。右边回答「关于它有什么」：视图标签随主语换内容，时序图跟着场景走，资料标签不跟随。所以选中什么，三区的宽度都不变。</figcaption>
    </figure>

    <h2>只画不算</h2>
    <figure>
      <svg viewBox="0 0 480 214" role="img" aria-label="呈现层只读视图状态层派生好的数据、只发意图；投影、布局、规则与读文件都不在呈现层">
        <defs><marker id="p1P" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker><marker id="p1S" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--warn)"/></marker></defs>
        <rect x="8" y="8" width="300" height="50" rx="8" fill="var(--warn-soft)" stroke="var(--warn)"/><text x="158" y="29" font-size="13" text-anchor="middle" font-weight="600">视图状态层（DeskState）</text><text x="158" y="45" font-size="10.5" text-anchor="middle" class="muted">一个值 · 转移规则 · 派生 · 坐标</text>
        <path d="M100,60 L100,128" stroke="var(--warn)" stroke-width="1.8" fill="none" marker-end="url(#p1S)"/>
        <text x="94" y="98" font-size="10.5" text-anchor="end" class="muted">派生数据</text><text x="94" y="112" font-size="10.5" text-anchor="end" class="muted">（只读）</text>
        <path d="M216,128 L216,60" stroke="var(--accent)" stroke-width="1.8" fill="none" marker-end="url(#p1P)"/>
        <text x="222" y="98" font-size="10.5" class="muted">意图</text><text x="222" y="112" font-size="10.5" class="muted">（dispatch）</text>
        <rect x="8" y="130" width="300" height="50" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="158" y="151" font-size="13" text-anchor="middle" font-weight="600">呈现层</text><text x="158" y="167" font-size="10.5" text-anchor="middle" class="muted">按数据画 · 把单击、拖动、按键交上去</text>
        <rect x="330" y="8" width="142" height="172" rx="8" fill="var(--soft)" stroke="var(--line)" stroke-dasharray="5 4"/>
        <text x="401" y="32" font-size="12" text-anchor="middle">不在这里</text>
        <text x="346" y="60" font-size="11.5" class="bad">✕</text><text x="362" y="60" font-size="11.5">层次投影</text>
        <text x="346" y="88" font-size="11.5" class="bad">✕</text><text x="362" y="88" font-size="11.5">布局算法</text>
        <text x="346" y="116" font-size="11.5" class="bad">✕</text><text x="362" y="116" font-size="11.5">会话规则</text>
        <text x="346" y="144" font-size="11.5" class="bad">✕</text><text x="362" y="144" font-size="11.5">读描述文件</text>
        <text x="401" y="168" font-size="10.5" text-anchor="middle" class="muted">换个前端也要的都在下层</text>
        <text x="158" y="204" font-size="10.5" text-anchor="middle" class="muted">一条单击：画布发「选中」→ 状态变 → 主语变 → 视图标签重画</text>
      </svg>
      <figcaption>判别法是「换一个前端还要不要」：命令行也要的投影、规则和布局都放在下面几层，这里只剩画和交。这样同一份状态可以同时喂给侧栏、画布和视图区，三处永远一致。</figcaption>
    </figure>

    <h2>共用件只放叶子</h2>
    <figure>
      <svg viewBox="0 0 480 178" role="img" aria-label="呈现共用件被项目视图、画布、属性面板引用，自身不引用任何呈现子系统，所以不成环；「以资料标签预览」的注入键放在共用件里">
        <defs><marker id="p2P" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker><marker id="p2B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker></defs>
        <g data-arch="present.desk-view"><rect x="8" y="8" width="140" height="40" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="78" y="25" font-size="12" text-anchor="middle">项目视图</text><text x="78" y="40" font-size="10.5" text-anchor="middle" class="muted">提供「预览」入口</text></g>
        <g data-arch="present.canvas"><rect x="170" y="8" width="140" height="40" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="240" y="32" font-size="12" text-anchor="middle">画布</text></g>
        <g data-arch="present.panel"><rect x="332" y="8" width="140" height="40" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="402" y="25" font-size="12" text-anchor="middle">属性面板</text><text x="402" y="40" font-size="10.5" text-anchor="middle" class="muted">取用「预览」入口</text></g>
        <path d="M78,48 L190,112" stroke="var(--accent)" stroke-width="1.6" fill="none" marker-end="url(#p2P)"/>
        <path d="M240,48 L240,112" stroke="var(--accent)" stroke-width="1.6" fill="none" marker-end="url(#p2P)"/>
        <path d="M402,48 L290,112" stroke="var(--accent)" stroke-width="1.6" fill="none" marker-end="url(#p2P)"/>
        <g data-arch="present.shared"><rect x="150" y="114" width="180" height="44" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="240" y="133" font-size="12.5" text-anchor="middle" font-weight="600">呈现共用件</text><text x="240" y="149" font-size="10.5" text-anchor="middle" class="muted">文案 · 高亮 · 注入键</text></g>
        <path d="M330,70 L150,70" stroke="var(--bad)" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#p2B)"/>
        <text x="240" y="64" font-size="10.5" text-anchor="middle" class="bad">面板直接依赖项目视图会成环</text>
        <text x="410" y="138" font-size="10.5" text-anchor="middle" class="muted">只被引用，</text><text x="410" y="152" font-size="10.5" text-anchor="middle" class="muted">不引用兄弟</text>
      </svg>
      <figcaption>项目视图渲染面板，面板又要用项目视图提供的「预览」入口；把注入键放在共用件里，两边都只依赖这片叶子，就不会成环。</figcaption>
    </figure>
