    <h1>唯一账本</h1>
    <p class="lede">这一层是 <span data-arch="state.desk">DeskState</span>：<span data-arch="state.desk" data-field="summary"></span>。整张桌子的现在时只有一本账：层次、选中、悬停、开关、场景与进度、对比基线……全是同一个值的不同面。</p>

    <h2>账本上的岗位</h2>
    <div class="cols c3">
      <div><b>操作台</b><span data-arch="state.desk.actions">对外操作</span> 是唯一入口：改账本必经纯转移函数，没有第二支笔。</div>
      <div><b>装载与回写</b><span data-arch="state.desk.loading">装载</span> 建账，<span data-arch="state.desk.writer">写入</span> 把评审意见等落盘并回填指纹。</div>
      <div><b>对外的窗</b><span data-arch="state.desk.versions">版本对比</span>、<span data-arch="state.desk.facts">治理事实</span>、<span data-arch="state.desk.files">源码文件</span>、<span data-arch="state.desk.evolution">演化</span>——呈现层只读这些派生，不摸底账。</div>
    </div>

    <p class="note">为什么只有一个主语能成立：因为账本唯一。选中与进度不打架，是因为它们本来就是同一本账上的两栏。</p>
