    <h1>唯一账本</h1>
    <p class="lede"><span data-arch="state.desk">DeskState</span> 持有一个项目版本的全部视图状态。写只有一个入口，读是一组派生，外界是它的投影。</p>

    <h2>一笔写，多处读</h2>
