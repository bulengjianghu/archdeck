    <h2>为什么这样切</h2>
    <div class="cols c3">
      <div><b><span data-arch="model.pipeline.loader">单文件关</span></b>格式问题就地拦截，报错带文件与行号——不把坏数据往下游送。</div>
      <div><b><span data-arch="model.pipeline.validator">跨文件关</span></b>引用完整性在这里收口：悬空的模块、接口、场景全部现形。</div>
      <div><b><span data-arch="model.pipeline.indexer">索引关</span></b>建好查询结构后，投影、治理、agent 全都直查索引——同一个入口，同一种口径。</div>
    </div>

    <p class="note">流水线只出索引不出结论：谁连谁归投影班管、对不对得上归裁判管——进料的只保证「干净」。</p>
