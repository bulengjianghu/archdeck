    <h1>剧本怎么变成放映</h1>
    <p class="lede">这一层是 <span data-arch="model.scenario">场景投影</span>：<span data-arch="model.scenario" data-field="summary"></span>。描述里的场景是一棵剧本树；它负责把剧本变成任何一层都能放的影片。</p>

    <figure>
      <svg viewBox="0 0 640 236" role="img" aria-label="步骤树绑定关系，展开帧树，按分支取路径，按层投影可见消息">
        <defs><marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker></defs>
        <rect x="14" y="28" width="130" height="78" rx="10" fill="var(--soft)" stroke="var(--line)"/>
        <text x="79" y="48" font-size="10.5" text-anchor="middle" class="">剧本（步骤树）</text>
        <text x="26" y="68" font-size="8.5" class="muted">消息步骤=叶子</text>
        <text x="26" y="82" font-size="8.5" class="muted">组合步骤=容器</text>
        <text x="26" y="96" font-size="8.5" class="muted">alt 处分叉</text>
        <path d="M146,66 L174,66" stroke="var(--text-2)" stroke-width="2" marker-end="url(#n)"/>
        <rect x="178" y="28" width="130" height="78" rx="10" fill="var(--bg)" stroke="var(--warn)"/>
        <text x="243" y="48" font-size="10.5" text-anchor="middle" class="">绑定与展开</text>
        <text x="192" y="68" font-size="8.5" class="muted">每条消息绑到一条关系；</text>
        <text x="192" y="82" font-size="8.5" class="muted">展开成帧树（回放计划）</text>
        <path d="M310,66 L338,66" stroke="var(--text-2)" stroke-width="2" marker-end="url(#n)"/>
        <rect x="342" y="28" width="130" height="78" rx="10" fill="var(--bg)" stroke="var(--warn)"/>
        <text x="407" y="48" font-size="10.5" text-anchor="middle" class="">取回放路径</text>
        <text x="356" y="68" font-size="8.5" class="muted">按已选分支走出线性</text>
        <text x="356" y="82" font-size="8.5" class="muted">帧序列（可回放的）</text>
        <path d="M474,66 L502,66" stroke="var(--text-2)" stroke-width="2" marker-end="url(#n)"/>
        <rect x="506" y="28" width="122" height="78" rx="10" fill="var(--accent-soft)" stroke="var(--accent)"/>
        <text x="567" y="48" font-size="10.5" text-anchor="middle" class="">本层可见消息</text>
        <text x="516" y="68" font-size="8.5" class="muted">帧落到本层哪条边、</text>
        <text x="516" y="82" font-size="8.5" class="muted">哪个节点或不可见；</text>
        <text x="516" y="96" font-size="8.5" class="muted">合并成单步单位</text>
        <rect x="50" y="128" width="540" height="42" rx="10" fill="var(--ok-soft)" stroke="var(--ok)"/>
        <text x="320" y="146" font-size="10" text-anchor="middle" class="">两条投影链平行：关系 → 视图边，帧 → 可见消息；可见消息画在对应视图边上</text>
        <text x="320" y="162" font-size="9" text-anchor="middle" class="muted">只写一套最细步骤——各层各自投影，下钻后粒度自动变细（R7）</text>
        <rect x="50" y="184" width="540" height="38" rx="10" fill="var(--soft)" stroke="var(--line)"/>
        <text x="320" y="200" font-size="10" text-anchor="middle" class="">还能答题：本层下一步是谁？到第 7 帧该选哪支？谁参与了哪几步？</text>
        <text x="320" y="214" font-size="9" text-anchor="middle" class="muted">（不知道坐标——输出纯数据，坐标交给排版）</text>
      </svg>
      <figcaption>运行班：从剧本到放映的四道工序。</figcaption>
    </figure>

    <h2>四个岗位</h2>
    <div class="cols c2">
      <div><b><span data-arch="model.scenario.path">路径</span> 与 <span data-arch="model.scenario.level">层次投影</span></b>先按分支求出线性路径，再按当前层合并出可见消息——你在哪层看，它就放哪层的版本。</div>
      <div><b><span data-arch="model.scenario.participation">参与</span> 与 <span data-arch="model.scenario.outline">概要</span></b>某个模块 / 关系参与过哪些步骤、整个场景的分段概览——面板与定位都从这里取。</div>
    </div>

    <p class="note">剧本语义（步骤树怎么变成可信的回放计划）由专门的语义模块先行校验；本层只管投影——校验过的剧本，放到哪层都不会走样。</p>
