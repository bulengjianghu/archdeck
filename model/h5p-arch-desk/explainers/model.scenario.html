    <h1>剧本怎么变成本层的银幕</h1>
    <p class="lede"><span data-arch="model.scenario">场景投影</span>把一个场景按已选的分支和当前层次投影出来，时序图与回放都只读它的结果。</p>

    <figure>
      <svg viewBox="0 0 480 296" role="img" aria-label="场景投影：步骤按已选分支走成路径，帧投影到当前层次合并成可见消息，产出时序模型；大纲与参与查询在旁">

        <rect x="6" y="4" width="250" height="48" rx="8" fill="var(--soft)" stroke="var(--line)"/><text x="131.0" y="25.3" font-size="13" text-anchor="middle">场景：一套最细的步骤</text><text x="131.0" y="39.8" font-size="10.5" text-anchor="middle" class="muted">剧本，每行一步</text>

      <figcaption>步骤是剧本的一行，帧是最小的一次演出，路径是按所选分支串起来的帧，可见消息是本层看得见的那一段。同一套步骤在不同层次投影出粗细不同的消息，所以下钻时时序图跟着变细。</figcaption>
