# 外部参与者：主动发起交互的外部实体（A3），及其入口关系。
actors:
  - id: actor.architect
    name: 架构师
    kind: user
    description: 在架构台上浏览结构、打开场景回放、评审设计版本的人。
  - id: actor.ai
    name: AI
    kind: system
    description: 按代码生成当前版本、起草设计版本的 AI；它改写描述文件后，开发服务器把变更推送给页面。

relations:
  - {id: rel.ctx.perspective, from: actor.architect, to: present.perspective, type: commands, description: 架构师交给视角切换：点「运行」打开场景列表；退出场景}
  - {id: rel.ctx.scenarios, from: actor.architect, to: present.scenarios, type: commands, description: 架构师交给场景列表：选定场景}
  - {id: rel.ctx.player, from: actor.architect, to: present.player, type: commands, description: 架构师交给回放控制条：上一步 / 下一步、拖动进度、选分支}
  - {id: rel.ctx.nav-tree, from: actor.architect, to: present.nav-tree, type: commands, description: 架构师交给导航树：在模块树中定位、下钻；在步骤树中指向某一步、选分支}
  - {id: rel.ctx.sequence, from: actor.architect, to: present.sequence.interact, type: commands, description: 架构师交给时序图交互：单击时序图中的消息、悬停预览}
  - {id: rel.ctx.canvas, from: actor.architect, to: present.canvas.flow, type: commands, description: 架构师交给视图转换与交互：单击 / 双击 / 悬停节点与边，单击步骤序号}
  - {id: rel.ctx.panel, from: actor.architect, to: present.panel, type: commands, description: 架构师交给属性面板：在属性面板中跳转、指向步骤}
  - {id: rel.ctx.ai, from: actor.ai, to: access.model-source, type: notifies, description: 改写描述文件（不等结果）；开发服务器监听到变化后按项目推送 arch-model:changed}
