# 设计 sketch-editor 挂在「present.version」上的草图：由一期的 designs/sketch-editor/sketch.yaml 按挂载点机械拆出（ADR-0025 迁移，内容不变），同设计另有 model.intent、state.desk、state.transition、access.writer、present.canvas、present.panel。
sketch:
  id: sketch-editor
  mount: present.version
  lifetime: until-implemented
  modules:
    - id: present.version.edit
      name: 编辑信息条
      kind: component
      responsibility: 「编辑草图：<名>」、未保存标记、保存 / 放弃 / 校验按钮、新建设计入口；保存成功后停留在编辑态。
