design:
  id: sketch-editor
  name: 草图的画布编辑
  status: draft
  goal: |
    任务 A 二期（ADR-0023）：让架构师在画布上编辑草图——层、模块、关系、接口、封闭与核心标记——保存为整份写回，
    编辑中即时校验并对当前版本实时核验。功能清单与边界见 plans/arch-desk-round3/08-sketch-editor-features.md（不进仓库），
    其中待确认的 4 个问题负责人均按推荐裁决：移动模块自动改 ID 并级联（二次确认）；编辑态实时核验；新建设计的底稿二选一、缺省复制当前版本第二级；
    注释只在未改动节点保留。

    **本设计同时是草图生命周期的第一个真实样本**（负责人 2026-10-22）：草图由协调者代架构师起草，AI 展开 r1，协调者评审留 feedback，
    至少 2 轮、最多 5 轮定稿；实现后核验一致即归档。本次架构师不参与，只走通流程、留下执行通路。
