# 回溯草图（自举样本，ADR-0023）：二期动态视角定稿时（ADR-0003）架构师钉住的那部分——
# 新增一个模型层核心模块「场景投影」（封闭：它的直接子模块只许这几个）、视图状态层拆出「视图状态转移」、Layout 加时序图排布、
# 呈现层加时序图 / 场景列表 / 回放控制条 / 视角切换与两个面板；其余（职责细节、更深层的拆分、接口签名）由 AI 展开。
# 对 r1–r4 与当前版本跑核验（npm run arch -- sketch-check --design phase2-dynamic [--revision r1]）得到真实的偏差清单：
# r1 还没有「视图状态转移」与回放路径（r2、r3 评审后才加），当前版本在封闭的「场景投影」下多出了步骤大纲（outline）。
sketch:
  id: phase2-dynamic
  lifetime: until-implemented
  closed: [model.scenario]
  modules:
    - id: model.scenario
      parent: model
      name: 场景投影
      kind: subsystem
      core: true
      responsibility: 运行视角的核心规则：场景的步骤树展开成回放计划，按已选分支求出回放路径，再按当前层次投影成可见消息与时序模型；回答本层的下一步、到达某帧需要的分支选择、谁参与了哪一步。
      children:
        - { id: model.scenario.flatten, name: 回放计划, responsibility: 步骤树 → 帧树（ref 内联、loop 一遍、par 串行、alt 分叉） }
        - { id: model.scenario.path, name: 回放路径, responsibility: 按已选分支从回放计划走出线性帧序列，在未选分支处截止 }
        - { id: model.scenario.level, name: 帧的层次投影, responsibility: 帧按与结构图同一套端点规则投影到当前层次，合并为可见消息 }
        - { id: model.scenario.participation, name: 参与查询, responsibility: 某个模块 / 关系 / 边在本场景中参与了哪些步骤 }
        - { id: model.scenario.sequence, name: 时序模型, responsibility: 本层的泳道、消息与组合框，不含坐标 }
    - id: state.transition
      parent: state
      name: 视图状态转移
      kind: subsystem
      core: true
      responsibility: 会话规则的纯函数：给定视图状态、动作与上下文算出下一个视图状态；关于被描述系统的问题一律问模型层。
      children:
        - { id: state.transition.navigation, name: 导航规则, responsibility: 下钻、返回、定位、重新加载后的回退（N） }
        - { id: state.transition.playback, name: 回放规则, responsibility: 打开 / 退出场景、单步、指向、选分支（R、F6） }
        - { id: state.transition.url, name: URL 编解码, responsibility: 视图状态 ↔ 查询参数 }
    - id: state.layout.sequence
      parent: state.layout
      name: 时序图排布
      responsibility: 给时序模型算泳道与消息的坐标。
    - id: present.sequence
      parent: present
      name: 时序图
      kind: subsystem
      core: true
      responsibility: 运行视角下把定位好坐标的时序模型画成 SVG，单击消息指向该步。
    - { id: present.player, parent: present, name: 回放控制条, kind: subsystem, responsibility: 上一步 / 下一步、进度、分支选择 }
    - { id: present.scenarios, parent: present, name: 场景列表, kind: subsystem, responsibility: 按层次与发起者筛选场景，选定即进入运行视角 }
    - { id: present.perspective, parent: present, name: 视角切换, kind: subsystem, responsibility: 「结构 ｜ 运行：<场景名>」，进入 / 退出运行视角 }
    - { id: present.panel.step, parent: present.panel, name: 步骤面板, responsibility: 选中步骤时：作用、输入、输出在前 }
    - { id: present.panel.scenario, parent: present.panel, name: 场景面板, responsibility: 选中场景时的场景概览 }
  relations:
    - { id: rel.sk.desk-scenario, from: state.desk, to: model.scenario, type: calls, description: DeskState 派生回放计划、路径与本层投影 }
    - { id: rel.sk.desk-transition, from: state.desk, to: state.transition, type: calls, description: 唯一写入口 dispatch → transition }
    - { id: rel.sk.desk-seqlayout, from: state.desk, to: state.layout.sequence, type: calls, description: 时序模型 → 坐标 }
    - { id: rel.sk.sequence-desk, from: present.sequence, to: state.desk, type: depends, description: 时序图只读派生数据、只发意图 }
  interfaces:
    - { id: if.model.planScenario, name: planScenario, owner: model.scenario.flatten }
    - { id: if.model.projectScenario, name: projectScenario, owner: model.scenario.level }
    - { id: if.state.transition, name: transition, owner: state.transition }
