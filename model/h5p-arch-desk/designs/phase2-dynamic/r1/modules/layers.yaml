# 骨架：4 个层 + 第二级模块。依赖方向：呈现 → 视图状态 → 模型 ← 接入（docs/03-architecture.md §2–§3）。

modules:
  - id: present
    name: 呈现层
    kind: layer
    order: 1
    abstraction: 把状态画出来、把用户操作上交：只读 DeskState、只调它的操作，不做投影与布局计算
    responsibility: 应用外壳与路由、项目列表、项目视图、画布（含回放高亮）、时序图、场景列表与回放控制、属性面板、导航与问题提示。
    includes: [Vue 组件, 路由, 交互事件, 样式]
    excludes: [层次投影规则, 布局算法, 文件读取]
    mayDependOn: [state, model]
    docRefs: [docs/03-architecture.md]
    children:
      - id: present.shell
        name: 应用外壳与路由
        kind: subsystem
        responsibility: 应用入口与 hash 路由：`/` 是项目列表，`/p/<项目>` 是项目当前版本，`/p/<项目>/d/<设计>/<轮次>` 是设计版本；切换项目或版本时重建视图。
        codeRefs: [src/main.ts, src/App.vue, src/styles.css]
      - id: present.project-list
        name: 项目列表主页
        kind: subsystem
        role: core
        responsibility: 列出模型根目录下的全部项目（简介、分层、规模、生成来源、问题数）及各项目的设计版本，点击进入项目当前版本或设计的最新一轮。
        codeRefs: [src/components/ProjectList.vue]
      - id: present.desk-view
        name: 项目视图
        kind: subsystem
        role: core
        responsibility: 单个项目某个版本的工作台：按项目 + 版本创建并注入一份 DeskState，布置画布、设计信息条与可拖动 / 折叠的属性面板，处理键盘返回与变更通知；打开场景后画布区上下分屏为结构图与时序图，底部出现回放控制条。
        codeRefs: [src/components/DeskView.vue]
        designNote: |
          二期只在工作台的**布局**上加一块：打开场景时，画布区上下分屏（结构图在上、时序图在下，分隔条可拖、时序图可收起），关闭场景恢复原样。
          不另开「动态视角」页面：结构图与时序图同屏才能做到 D-7 联动，也保留下钻、搜索等全部一期能力。
      - id: present.version
        name: 版本切换与设计信息条
        kind: subsystem
        responsibility: 在当前版本与各设计的各轮之间切换（保留层次与选中）；设计版本下显示设计名、轮次、状态，选择对比基线（当前版本 / 上一轮），显示变更计数、标出变更开关与基线漂移提示。
        codeRefs: [src/components/VersionSwitcher.vue, src/components/DesignBar.vue]
        docRefs: [docs/adr/0002-design-versions.md]
      - id: present.scenarios
        name: 场景列表
        kind: subsystem
        responsibility: 列出项目的场景（D-1）：默认只列与当前层次相关的（步骤落在当前父模块子树内），可切到全部；显示名称、步骤数、默认层次；点击打开场景进入回放。
        codeRefs: [src/components/ScenarioList.vue]
        designNote: |
          从工具栏「场景」按钮弹出的下拉面板，不常驻占位。「与当前层次相关」直接用索引里的 scenariosOf(levelId)，不在组件里算。
      - id: present.sequence
        name: 时序图
        kind: subsystem
        role: core
        responsibility: 把定位好坐标的时序模型画成 SVG（D-2）：参与者为泳道，步骤自上而下，alt / loop / par / ref 画成组合框；同步实线实心箭头、异步虚线开放箭头（D-6）；单击步骤选中、当前步骤高亮并滚动到可见（D-7）。
        codeRefs: [src/components/sequence/**]
        docRefs: [docs/02-tech-selection.md]
        designNote: |
          按技术选型 §3.3 自研 Vue + SVG，不用 Mermaid：需要逐步选中、与结构图联动、按层次投影参与者。
          组件只画 `PositionedSequence`（坐标由 Layout 算好），与画布「只画不算」的边界一致。
      - id: present.player
        name: 回放控制条
        kind: subsystem
        responsibility: 回放控制（D-3）：上一步 / 下一步、播放 / 暂停、速度、进度条拖动跳到任意步骤；显示「第 i / N 步」与当前步骤摘要；键盘 ← → 空格。
        codeRefs: [src/components/PlayerBar.vue]
      - id: present.canvas
        name: 画布
        kind: subsystem
        role: core
        responsibility: 把带坐标的视图画成节点和边；处理平移、缩放、单击、双击、悬停；聚焦时只显示相关的边、其余变淡；回放时在结构图上叠加步骤高亮（D-3）。
        codeRefs: [src/components/GraphCanvas.vue, src/components/nodes/**, src/components/edges/**]
      - id: present.panel
        name: 属性面板
        kind: subsystem
        role: core
        responsibility: 按选中对象的类型显示属性：系统（设计版本另含设计说明与变更清单）、模块（含层的抽象原则）、关系、聚合边、场景、步骤；无选中时显示当前父模块（打开场景时显示场景）；设计版本中标出新增 / 修改与设计说明。
        codeRefs: [src/components/panel/**]
      - id: present.nav
        name: 导航
        kind: subsystem
        responsibility: 面包屑（含返回项目列表）、搜索跳转、场景入口、显示开关与关系类型筛选、图例。
        codeRefs: [src/components/Breadcrumb.vue, src/components/Toolbar.vue, src/components/Legend.vue]
      - id: present.issues
        name: 问题提示
        kind: subsystem
        responsibility: 列出架构描述的错误与提醒，定位到文件与行号。
        codeRefs: [src/components/IssueBanner.vue]

  - id: state
    name: 视图状态层
    kind: layer
    order: 2
    abstraction: 「现在看哪里、选中了什么、播到哪一步、怎么摆」：持有交互状态，调用模型层投影并把结果布局成坐标
    responsibility: DeskState 持有层次 / 选中 / 开关 / 回放（设计版本另持对比基线与差异）并与 URL 同步；Layout 把层次视图与时序模型排成坐标与走线。
    includes: [交互状态, 回放状态与计时, URL 同步, 布局与缓存]
    excludes: [DOM 渲染, 投影规则本身, 文件读取]
    mayDependOn: [model]
    children:
      - id: state.desk
        name: DeskState
        kind: subsystem
        role: core
        responsibility: 当前项目当前版本的唯一状态持有者：层次、选中、悬停、显示开关、加载状态，当前场景与回放进度，设计版本的对比基线与差异；对外提供唯一一组操作，并与路由双向同步。
        designNote: 回放状态放进 DeskState（新增子模块「回放」），不另建 store：保持「唯一状态持有者 + 唯一一组操作」，回放与层次切换、选中、URL 同步天然在一处协调（见待确认问题 2）。
        codeRefs: [src/state/useDeskState.ts, src/state/inject.ts]
      - id: state.layout
        name: Layout
        kind: subsystem
        role: core
        responsibility: 给层次视图算坐标与边的走线：分层总览按层序分带规则排布，普通层次用 elkjs；给时序模型算泳道与步骤坐标；结果按视图内容缓存。
        codeRefs: [src/layout/**]
        docRefs: [docs/02-tech-selection.md]

  - id: access
    name: 接入层
    kind: layer
    order: 3
    abstraction: 把磁盘上的 YAML 交给页面与命令行：只搬运文本与做摘要，不解释描述的含义
    responsibility: Vite 插件提供项目列表与项目描述（开发态实时读取并推送变更，构建态固化为静态文件），命令行校验。
    includes: [文件读取, 开发服务器端点, 变更通知, 构建产物, 命令行]
    excludes: [解析规则（交给模型层）, 界面]
    mayDependOn: [model]
    children:
      - id: access.model-source
        name: ModelSource 插件
        kind: subsystem
        role: core
        responsibility: 开发态提供 /projects.json、/models/<项目>.json、/models/<项目>/designs/<设计>/<轮次>.json 并按项目推送 arch-model:changed（含设计版本的变化）；构建态输出同名静态文件。
        codeRefs: [vite/archModelPlugin.ts, vite.config.ts]
      - id: access.reader
        name: 描述读取
        kind: subsystem
        role: core
        responsibility: 约定「模型根目录下含 system.yaml 的子目录即项目、其下 designs/<设计>/ 是设计版本」，读取项目当前版本（跳过 designs/）或设计某一轮的 YAML 及对比基线，读 design.yaml，并跑一遍模型层生成项目摘要。
        codeRefs: [vite/readModelDir.ts]
      - id: access.lint
        name: 命令行校验
        kind: subsystem
        responsibility: npm run lint:model：校验全部项目或指定目录（含各设计版本的每一轮与 design.yaml），按文件:行号输出问题，有错误时非零退出，可接入 CI。
        codeRefs: [scripts/lint-model.ts]

  - id: model
    name: 模型层
    kind: layer
    order: 4
    abstraction: 纯逻辑核心：输入文本、输出数据，不依赖 Vue / DOM / 布局库，可在 Node 中纯输入输出测试
    responsibility: 把多个 YAML 文件变成校验过的模型与索引（含场景），按层次投影出要画的节点与边，并把场景展开、按层次投影成回放帧与时序模型。
    includes: [文件格式与类型, 解析与合并, 引用校验, 索引, 层次投影, 场景展开与投影, 版本对比]
    excludes: [Vue, DOM, elkjs, 文件系统]
    mayDependOn: []
    docRefs: [docs/03-architecture.md]
    children:
      - id: model.types
        name: 类型与 Schema
        kind: subsystem
        role: core
        responsibility: 描述文件的形状（JSON Schema 与对应的 TS 类型，二期新增顶层键 scenario / scenarios 与步骤树），以及加载、索引、投影、场景各阶段的数据类型。
        designNote: |
          场景与模块同在一份描述目录（`model/<项目>/scenarios/*.yaml`），走同一条加载流水线，**接入层零改动**。
          步骤格式沿用技术选型 §4.4：call / async / return / alt / loop / par / ref，call 可选引用 relation / interface / payload。
        codeRefs: [src/model/types.ts, src/model/project-summary.ts, src/model/design.ts, schema/arch-file.schema.json]
      - id: model.pipeline
        name: 加载流水线
        kind: subsystem
        role: core
        responsibility: 文本 → 模型 → 索引：Loader 解析与单文件格式检查，Validator 跨文件引用检查，Indexer 建查询结构；入口 loadModel 串起三步并汇总问题。模块、关系与场景走同一条流水线。
        codeRefs: [src/model/load.ts, src/model/validate.ts, src/model/indexer.ts, src/model/index.ts]
      - id: model.projector
        name: Projector 层次投影
        kind: subsystem
        role: core
        responsibility: 给定当前父模块，算出这一层的节点、直接边、聚合边、边界节点；子模块都是层时算出分层总览（带、核心模块、核心跨层边）。
        codeRefs: [src/model/project.ts]
        docRefs: [docs/01-requirements.md]
      - id: model.scenario
        name: 场景投影
        kind: subsystem
        role: core
        responsibility: 二期核心规则：把场景的步骤树展开成有序的回放帧，再按当前层次投影——每帧落到当前层次的哪条边、哪个节点或哪个边界节点，同一子模块内部的步骤折叠为「内部活动」；并产出当前层次的时序模型（参与者、消息、组合框）。
        principle: |
          - **与结构投影同一套端点规则**：步骤端点用 Projector 的端点映射提升到当前层次，结构图与时序图对「这一步在这一层是谁和谁」永远一致（D-4）。
          - **只写一套最细步骤**：上层由投影自动合并，下钻后自然看到更细的步骤，不要求为每层各写一套。
          - **不知道坐标**：输出纯数据，坐标交给 Layout，与 Projector 的分工一致。
        docRefs: [docs/01-requirements.md]
        designNote: |
          新增第二级模块，与 Projector 并列：Projector 回答「这一层静态上谁连谁」，场景投影回答「这一层一次流程依次经过谁」。
          不并入 Projector，是因为输入（步骤树 vs 关系集合）与输出（有序帧 vs 无序边集）都不同；共用的只有端点映射，抽成公共函数。
      - id: model.diff
        name: 版本对比
        kind: subsystem
        responsibility: 设计版本相对对比基线新增 / 修改 / 删除了哪些模块、关系、接口、数据结构（逐字段比较），以及每个模块涉及多少处变更。
        principle: |
          - 按实体 ID 对齐；出处与 designNote 不算修改，缺省与空数组视为相同。
          - 「涉及变更」：子树内模块的增删改计入各祖先；关系的增删改计入两端及其祖先；接口 / 数据结构计入提供方与持有它的模块。删除项按基线中的位置计入目标模型里仍存在的祖先。
        codeRefs: [src/model/diff.ts]
        docRefs: [docs/adr/0002-design-versions.md]
