# 设计 phase2-dynamic 挂在「state.layout」上的草图：由一期的 designs/phase2-dynamic/sketch.yaml 按挂载点机械拆出（ADR-0025 迁移，内容不变），同设计另有 root、model.scenario、state.transition、present.panel。
sketch:
  id: phase2-dynamic
  mount: state.layout
  lifetime: until-implemented
  modules:
    - id: state.layout.sequence
      name: 时序图排布
      responsibility: 给时序模型算泳道与消息的坐标。
  relations:
    - id: rel.sk.desk-seqlayout
      from: state.desk
      to: state.layout.sequence
      type: queries
      description: 时序模型 → 坐标
