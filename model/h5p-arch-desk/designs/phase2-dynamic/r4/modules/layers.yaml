# 骨架：4 个层 + 第二级模块。依赖方向：呈现 → 视图状态 → 模型 ← 接入（docs/03-architecture.md §2–§3）。

modules:
  - id: present
    name: 呈现层
    kind: layer
    order: 1
    abstraction: 把状态画出来、把用户操作上交：只读 DeskState、只调它的操作，不做投影与布局计算
    responsibility: 应用外壳与路由、项目列表、项目视图、画布（含回放高亮）、时序图、场景列表与回放控制、属性面板、导航与问题提示。
    includes: [Vue 组件, 路由, 交互事件, 样式]
    excludes: [层次投影规则, 布局算法, 文件读取]
    mayDependOn: [state, model]
    docRefs: [docs/03-architecture.md]
    children:
      - id: present.shell
        name: 应用外壳与路由
        kind: subsystem
        responsibility: 应用入口与 hash 路由：`/` 是项目列表，`/p/<项目>` 是项目当前版本，`/p/<项目>/d/<设计>/<轮次>` 是设计版本；切换项目或版本时重建视图。
        codeRefs: [src/main.ts, src/App.vue, src/styles.css]
      - id: present.project-list
        name: 项目列表主页
        kind: subsystem
        core: true
        responsibility: 列出模型根目录下的全部项目（简介、分层、规模、生成来源、问题数）及各项目的设计版本，点击进入项目当前版本或设计的最新一轮。
        codeRefs: [src/components/ProjectList.vue]
      - id: present.desk-view
        name: 项目视图
        kind: subsystem
        core: true
        responsibility: 单个项目某个版本的工作台：按项目 + 版本创建并注入一份 DeskState，布置画布区、设计信息条与可拖动 / 折叠的属性面板，处理键盘意图；打开场景后画布区交给分屏容器放入结构图与时序图，底部出现回放控制条。
        codeRefs: [src/components/DeskView.vue]
        designNote: |
          r2（评审意见 1）：先做**上下分屏**，后续演化为可自由拖拽的分屏。画布区不写死两块，交给新的子模块「分屏容器」，按一份可序列化的布局树（ds.PaneLayout）排布视图；
          二期只提供「上下两块、比例可拖、下方可收起」一种布局，以后加拖拽停靠只扩展布局树的编辑，结构图、时序图组件不用改。
          不另开「动态视角」页面：同屏才能做到 D-7 联动，也保留下钻、搜索等全部一期能力。
          r2（C+）：变更通知改由「模型源同步」适配器处理，本组件只负责创建、注入与布置。
      - id: present.version
        name: 版本切换与设计信息条
        kind: subsystem
        responsibility: 在当前版本与各设计的各轮之间切换（保留层次与选中）；设计版本下显示设计名、轮次、状态，选择对比基线（当前版本 / 上一轮），显示变更计数、标出变更开关与基线漂移提示。
        codeRefs: [src/components/VersionSwitcher.vue, src/components/DesignBar.vue]
        docRefs: [docs/adr/0002-design-versions.md]
      - id: present.scenarios
        name: 场景列表
        kind: subsystem
        responsibility: 列出项目的场景（D-1）：默认只列与当前层次相关的（有帧端点落在当前父模块子树内，规则 R4a），可切到全部，可按发起者（外部参与者）筛选；显示名称、触发者、消息数；选定即进入运行视角（不改层次，规则 R5）。
        codeRefs: [src/components/ScenarioList.vue]
        designNote: |
          r3：由视角切换的「运行」入口弹出，不常驻占位。「与当前层次相关」直接用索引里的 scenariosOf(levelId)，不在组件里算。
      - id: present.perspective
        name: 视角切换
        kind: subsystem
        responsibility: 顶部显式展示当前视角「结构 ｜ 运行：<场景名>」（V1）：结构视角下点「运行」弹出场景列表；运行视角下可换场景或「退出场景」回到结构视角（保留层次与选中）。
        codeRefs: [src/components/PerspectiveSwitch.vue]
        designNote: |
          r3 新增（r2 评审意见 4）。视角不单独存一个开关，由「是否打开了场景」决定：没有场景就没有动态（S1），避免「运行视角但没有场景」的空状态。
      - id: present.sequence
        name: 时序图
        kind: subsystem
        core: true
        responsibility: 运行视角下把定位好坐标的时序模型画成 SVG（D-2）：泳道为当前层次的参与者，外部参与者固定在最左并以竖线隔开系统边界；消息自上而下，alt / loop / par / ref 画成组合框；同步实线实心箭头、异步虚线开放箭头（D-6），只画显式 return（S10a）；当前消息高亮并滚动到可见；单击消息 = 指向这一步（R13）；当前层次看不到任何帧时提示并提供「跳到场景所在层次」。
        codeRefs: [src/components/sequence/**]
        docRefs: [docs/02-tech-selection.md]
        designNote: |
          按技术选型 §3.3 自研 Vue + SVG，不用 Mermaid：需要逐步选中、与结构图联动、按层次投影参与者。
          组件只画 `PositionedSequence`（坐标由 Layout 算好），与画布「只画不算」的边界一致。
      - id: present.player
        name: 回放控制条
        kind: subsystem
        responsibility: 回放控制（D-3）：上一步 / 下一步（按本层可见消息，规则 R7）、播放 / 暂停、速度、进度条拖动到已走路径上任意位置；显示「第 i / N 步」（分支点之后未定时为「≥ N」）与当前消息摘要；到达 alt 分支点时展开全部选项（条件 + 首条消息）供选择，选定后继续；键盘 ← → 空格，数字键选分支。只有播放控制能恢复播放（V4）。
        codeRefs: [src/components/PlayerBar.vue, src/components/BranchChooser.vue]
        designNote: r2：到 alt 时停下并展开全部选项，用户选一个才继续；自动播放也在此暂停。r3：恢复播放即取消钉住，面板回到当前步骤。r4：取消选中（Esc、单击空白）在暂停状态下也回到跟随，但不恢复播放。
      - id: present.canvas
        name: 画布
        kind: subsystem
        core: true
        responsibility: 把带坐标的视图画成节点和边；处理平移、缩放、单击、双击、悬停；聚焦时只显示相关的边、其余变淡；运行视角下结构图作为舞台：本层参与场景的节点与走过的边突出、其余变淡不隐藏，并叠加回放（D-3）。
        codeRefs: [src/components/GraphCanvas.vue, src/components/nodes/**, src/components/edges/**]
      - id: present.panel
        name: 属性面板
        kind: subsystem
        core: true
        responsibility: 显示**焦点**（面板唯一的主语）的属性：结构视角下焦点 = 选中，否则当前父模块；运行视角下焦点 = 跟随（当前步骤）或钉住（用户指向的模块 / 关系 / 边 / 参与者），先回答「在这次流程中做了什么」，结构信息折叠在下方。对象种类：系统（设计版本另含设计说明与变更清单）、模块、关系、聚合边、外部参与者、场景、步骤；设计版本中标出新增 / 修改与设计说明。
        designNote: r3（r2 评审意见 4）：r2 的「有选中显示选中，否则当前步骤」是在两个主语之间猜；r3 改为焦点模型，任何时刻只有一个主语，同一对象在两种视角下回答不同的问题。
        codeRefs: [src/components/panel/**]
      - id: present.nav
        name: 导航
        kind: subsystem
        responsibility: 面包屑（含返回项目列表）、搜索跳转、显示开关与关系类型筛选、图例。
        codeRefs: [src/components/Breadcrumb.vue, src/components/Toolbar.vue, src/components/Legend.vue]
      - id: present.issues
        name: 问题提示
        kind: subsystem
        responsibility: 列出架构描述的错误与提醒，定位到文件与行号。
        codeRefs: [src/components/IssueBanner.vue]

  - id: state
    name: 视图状态层
    kind: layer
    order: 2
    abstraction: 关于**一次浏览会话**的规则与协调：「现在看哪里、焦点是什么、播到哪一步、怎么摆」。视图状态是一个值，会话规则是纯函数，一个协调者负责持有、派生与和外界同步；关于被描述系统的问题一律问模型层
    responsibility: 会话规则（视图状态转移，纯函数）决定视角、焦点、几个指针之间的关系、浏览器历史与 URL；DeskState 持有视图状态、派生要画的数据、经同步适配器与路由 / 时钟 / 描述文件 / 布局保持一致；Layout 把层次视图与时序模型排成坐标与走线。
    includes: [视图状态与会话规则, URL 编解码, 协调与同步适配器, 布局与缓存]
    excludes: [DOM 渲染, 关于被描述系统的知识（投影、最近祖先、本层下一步等，属于模型层）, 文件读取]
    mayDependOn: [model]
    children:
      - id: state.desk
        name: DeskState
        kind: subsystem
        core: true
        responsibility: 当前项目当前版本的唯一状态持有者：层次、选中、悬停、显示开关、加载状态，当前场景与回放进度，设计版本的对比基线与差异；对外提供唯一一组操作，并与路由双向同步。
        designNote: |
          r2（评审意见 2，采用 C+）：DeskState 从「状态 + 规则 + 交互」收缩为**协调者**：持有视图状态这一个值，唯一写入口 dispatch 调用纯的视图状态转移，
          派生全部要画的数据，与外界的交互交给四个同步适配器（路由、时钟、模型源、布局）。协调者只有一个，生命周期是一个项目的一个版本。
        codeRefs: [src/state/useDeskState.ts, src/state/inject.ts]
      - id: state.transition
        name: 视图状态转移
        kind: subsystem
        core: true
        responsibility: 会话规则的纯函数：给定视图状态、动作与上下文，算出下一个视图状态及是否进浏览器历史。管视角（V）、焦点与几个指针的关系（选中、播放头、悬停）、开关、浏览器历史与 URL 编解码；凡是关于被描述系统的问题（最近存在 / 可见的祖先、本层的下一步、到达某帧需要的分支选择、谁参与了哪一步）都调用模型层的架构查询，自己不实现。不依赖 Vue、路由、计时器。
        principle: |
          - **一个事实一个值**：层次、选中、开关、场景、播放头、已选分支、播放状态互相约束，是同一个视图状态（ds.ViewState），不拆成多个有状态模块。
          - **焦点不变式**：运行视角下「播放中 ⇒ 无选中（跟随）」「有选中（钉住）⇒ 暂停」；任何转移都保持这两条。
          - **规则即知识**：每条规则编号、注明来源与所在模块（见设计说明的「领域规则清单」），单测按清单穷举。
        codeRefs: [src/state/transition/**]
        designNote: |
          r3（r2 评审意见 3，按知识划分）：r2 里混着的两种知识拆开——判别法是「换一个前端（命令行、导出脚本、AI 查询）这条规则还需不需要」：
          需要的（N5、N12、R7、F6b、R13 的定位、参与查询）下沉模型层作为架构查询；只在交互浏览时有意义的留在这里。这里因此变薄，条数少、组合简单。
      - id: state.layout
        name: Layout
        kind: subsystem
        core: true
        responsibility: 给层次视图算坐标与边的走线：分层总览按层序分带规则排布，普通层次用 elkjs；给时序模型算泳道与步骤坐标；结果按视图内容缓存。
        codeRefs: [src/layout/**]
        docRefs: [docs/02-tech-selection.md]

  - id: access
    name: 接入层
    kind: layer
    order: 3
    abstraction: 把磁盘上的 YAML 交给页面与命令行：只搬运文本与做摘要，不解释描述的含义
    responsibility: Vite 插件提供项目列表与项目描述（开发态实时读取并推送变更，构建态固化为静态文件），命令行校验。
    includes: [文件读取, 开发服务器端点, 变更通知, 构建产物, 命令行]
    excludes: [解析规则（交给模型层）, 界面]
    mayDependOn: [model]
    children:
      - id: access.model-source
        name: ModelSource 插件
        kind: subsystem
        core: true
        responsibility: 开发态提供 /projects.json、/models/<项目>.json、/models/<项目>/designs/<设计>/<轮次>.json 并按项目推送 arch-model:changed（含设计版本的变化）；构建态输出同名静态文件。
        codeRefs: [vite/archModelPlugin.ts, vite.config.ts]
      - id: access.reader
        name: 描述读取
        kind: subsystem
        core: true
        responsibility: 约定「模型根目录下含 system.yaml 的子目录即项目、其下 designs/<设计>/ 是设计版本」，读取项目当前版本（跳过 designs/）或设计某一轮的描述文件（YAML / JSON）及对比基线，读 design.yaml，并跑一遍模型层生成项目摘要。
        designNote: r2（评审意见 6）：描述文件扩展名加上 .json，其余不变；场景文件放在 scenarios/，与 modules/ 同级，按原有规则一并读取。
        codeRefs: [vite/readModelDir.ts]
      - id: access.lint
        name: 命令行校验
        kind: subsystem
        responsibility: npm run lint:model：校验全部项目或指定目录（含各设计版本的每一轮与 design.yaml），按文件:行号输出问题，有错误时非零退出，可接入 CI。
        codeRefs: [scripts/lint-model.ts]

  - id: model
    name: 模型层
    kind: layer
    order: 4
    abstraction: 关于**被描述系统**的知识，脱离工作台仍成立：输入描述、输出数据，不依赖 Vue / DOM / 布局库，可在 Node 中纯输入输出测试
    responsibility: 把多个描述文件变成校验过的模型与索引（含参与者与场景），按层次投影出要画的节点与边，把场景展开、按层次投影成回放帧与时序模型，并回答关于被描述系统的架构查询（最近存在 / 可见的祖先、本层的下一步、到达某帧需要的分支选择、谁参与了哪一步）。
    includes: [文件格式与类型, 解析与合并, 引用校验, 索引, 层次投影, 场景展开与投影, 架构查询, 版本对比]
    excludes: [Vue, DOM, elkjs, 文件系统]
    mayDependOn: []
    docRefs: [docs/03-architecture.md]
    children:
      - id: model.types
        name: 类型与 Schema
        kind: subsystem
        core: true
        responsibility: 描述文件的形状（JSON Schema 与对应的 TS 类型；二期新增顶层键 actors、scenario / scenarios 与步骤树），以及加载、索引、投影、场景各阶段的数据类型。
        designNote: |
          r2（评审意见 6）：场景文件与结构文件同级（`model/<项目>/scenarios/`，与 `modules/` 并列），YAML 与 JSON 都接受，解析成同一份数据结构；**以数据结构为唯一约定**（ds.ScenarioDef / ds.StepDef / ds.ActorDef，JSON Schema 为准）。
          步骤格式沿用技术选型 §4.4：call / async / return 是消息步骤，alt / loop / par / ref 是组合步骤；消息步骤可写可选的 id。
          场景不写默认层次（规则 S9）与触发者（规则 A6），两者都由数据推出。
        codeRefs: [src/model/types.ts, src/model/project-summary.ts, src/model/design.ts, schema/arch-file.schema.json]
      - id: model.pipeline
        name: 加载流水线
        kind: subsystem
        core: true
        responsibility: 文本 → 模型 → 索引：Loader 解析与单文件格式检查，Validator 跨文件引用检查，Indexer 建查询结构；入口 loadModel 串起三步并汇总问题。模块、关系与场景走同一条流水线。
        codeRefs: [src/model/load.ts, src/model/validate.ts, src/model/indexer.ts, src/model/index.ts]
      - id: model.projector
        name: Projector 层次投影
        kind: subsystem
        core: true
        responsibility: 给定当前父模块，算出这一层的节点、直接边、聚合边、边界节点、外部参与者；子模块都是层时算出分层总览（带、核心模块、核心跨层边）。
        designNote: |
          r2：外部参与者作为系统上下文常驻静态视图（规则 A2）——在某一层次，与本层子树有关系或有帧经过的参与者出现（根层即全部有关系的参与者，A8 已确认），参与者与本层子模块之间的关系按普通规则投影成边。
          r3（按知识划分）：新增架构查询「在给定可见性下最近的可见层次」（N12）。
        codeRefs: [src/model/project.ts]
        docRefs: [docs/01-requirements.md]
      - id: model.scenario
        name: 场景投影
        kind: subsystem
        core: true
        responsibility: 二期核心规则：把场景的步骤树展开成回放计划（帧树，alt 处分叉），按已选分支求出回放路径，再按当前层次投影——每帧落到本层哪条边（或「结构中未建模」）、哪个节点（内部活动）或不可见，合并出本层的可见消息；产出本层的时序模型与场景所在层次；回答场景相关的架构查询：本层的下一步 / 上一步、到达某帧需要的分支选择、某个模块 / 关系 / 边在本场景中参与了哪些步骤。
        principle: |
          - **术语**：**步骤**是描述里的树（消息步骤为叶子，组合步骤为容器，时序图上画成组合框）；**帧**是一条消息步骤展开后的回放单位；
            **回放计划**是展开后的帧树；**回放路径**是按已选分支走出的线性帧序列；**可见消息**是本层投影后合并出的单步单位，一条覆盖一段连续的帧。
          - **步骤与关系**：关系是静态的「会这样交互」，步骤是场景里按时间发生的**一次**交互——运行时关系（calls / dataflow / event）的一次发生（S12）；
            一条关系可被多次经过，一个步骤最多对应一条关系，也可能没有对应（S5a、S13）。两条投影链平行：关系 → 视图边，帧 → 可见消息；可见消息画在连接同一对节点的视图边上，按步骤自己的方向流动（P10）。
          - **与结构投影同一套端点规则**：帧端点用 Projector 的端点映射提升到当前层次（D-4，规则 P1）。
          - **只写一套最细步骤**（评审意见 3）：各层投影合并；时序图与单步粒度都随层次变化，下钻后变细（规则 R7）。
          - **不知道坐标**：输出纯数据，坐标交给 Layout。
        docRefs: [docs/01-requirements.md]
        designNote: |
          新增第二级模块，与 Projector 并列：Projector 回答「这一层静态上谁连谁」，场景投影回答「这一层一次流程依次经过谁」。
          不并入 Projector，是因为输入（步骤树 vs 关系集合）与输出（有序帧 vs 无序边集）都不同；共用的只有端点映射，抽成公共函数。
      - id: model.diff
        name: 版本对比
        kind: subsystem
        responsibility: 设计版本相对对比基线新增 / 修改 / 删除了哪些模块、关系、接口、数据结构（逐字段比较），以及每个模块涉及多少处变更。
        principle: |
          - 按实体 ID 对齐；出处与 designNote 不算修改，缺省与空数组视为相同。
          - 「涉及变更」：子树内模块的增删改计入各祖先；关系的增删改计入两端及其祖先；接口 / 数据结构计入提供方与持有它的模块。删除项按基线中的位置计入目标模型里仍存在的祖先。
        codeRefs: [src/model/diff.ts]
        docRefs: [docs/adr/0002-design-versions.md]
