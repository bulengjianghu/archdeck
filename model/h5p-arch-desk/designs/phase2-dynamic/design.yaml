      summary: |
        **定稿版本。** 相对 r3 只改一处：V4 改为「只有播放控制能恢复播放；取消选中（Esc、单击空白）回到跟随但保持暂停」（视角与焦点规则、回放规则、回放控制条同步修改）。

        二期动态视角的架构结论（详见 ADR-0003）：
        - 不动一期骨架；模型层新增核心模块「场景投影」（回放计划 / 回放路径 / 帧的层次投影 / 参与查询 / 时序模型），与 Projector 共用端点映射。
        - 视图状态 = 一个值；会话规则为纯函数（视图状态转移）；DeskState 只做协调，与外界交互拆成路由、时钟、模型源、布局四个同步适配器。
        - 按知识划分：关于被描述系统、脱离工作台仍成立的知识在模型层（架构查询），关于一次浏览会话的规则在视图状态层。
        - 视角（结构 / 运行）由是否打开场景决定；面板只显示唯一焦点（跟随 / 钉住），播放中 ⇒ 无选中。
        - 步骤是运行时关系的一次发生；外部参与者在模块树之外，作为系统上下文常驻。

