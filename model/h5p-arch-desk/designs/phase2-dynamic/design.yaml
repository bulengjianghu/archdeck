design:
  id: phase2-dynamic
  name: 二期 · 动态视角
  status: implemented
  goal: |
    在一期「看见结构」之上叠加「看见运行」（需求 §5）：一条有名字的执行链路（场景）由有序步骤组成，
    以**时序图**和**结构图上的回放**两种方式呈现，并且与一期的层次规则一致——高层看粗步骤，下钻看细步骤。

    **范围**：需求 D-1 ~ D-7 的架构落点（场景数据模型、场景展开与按层投影、时序图、回放状态与控制、面板、URL）。
    **不在本设计内**：D-8 h5player 场景内容的录入与 blueprint 时序图迁移（实现后按生成规范补写场景描述即可）；场景的画布内编辑。

    **总体判断**：不动一期骨架。新增 1 个模型层核心模块「场景投影」，与 Projector 并列、共用端点映射；
    视图状态层在 DeskState 内加「回放」、在 Layout 内加「时序图排布」；呈现层加时序图、场景列表、回放控制条和两个面板。
    接入层零改动（场景文件与模块描述在同一目录、走同一条加载流水线）。
  base:
    commit: 72d288e76394a5620ab24ad4d17c3a03f1714065
    generatedAt: '2026-10-20'
  revisions:
    - id: r1
      date: '2026-10-20'
      summary: |
        在当前版本上做的扩展与调整（共 4 层，按依赖方向从内到外）：

        - **模型层**：新增核心模块「场景投影」（展开 → 帧的层次投影 → 时序模型）；类型 / Loader / Validator / Indexer 支持场景；
          Projector 的端点映射抽成公共函数 `mapEndpoint`，结构图与时序图用同一套层次规则。
        - **视图状态层**：DeskState 新增子模块「回放」（当前场景、帧、播放 / 暂停、速度，写进 URL 的 `sc` / `step`）；
          视图派生多两步（帧投影、时序布局）；Layout 新增「时序图排布」，泳道左右顺序取自结构图布局。
        - **呈现层**：新增「时序图」（核心）、「场景列表」、「回放控制条」，面板新增场景、步骤两种；
          画布与边组件增加回放叠加（当前步骤流动、走过的边标序号、内部活动只高亮节点）；工作台打开场景时上下分屏。
        - **接入层**：不变。

        建议从根层看「场景投影」与 Projector 的关系，再下钻到 视图状态层 → DeskState → 回放、呈现层 → 时序图。
      questions:
        - "**同屏方式**：打开场景时画布区上下分屏（结构图在上、时序图在下，可拖、可收起）。备选：结构 / 时序标签切换。推荐分屏——D-7 联动需要两图同时可见。"
        - "**回放状态归属**：作为 DeskState 的子模块（推荐，保持唯一状态持有者与唯一一组操作）。备选：独立的 PlaybackState store。"
        - "**下钻粒度（D-4）**：每个场景只写一套最细步骤，由投影合并到上层、同一子模块内部的步骤折叠为「内部活动」（推荐）。备选：允许为不同层次分别写步骤。"
        - "**步骤与结构的一致性**：步骤引用 relation 时端点必须一致（error）；没引用且两端之间没有任何结构关系时报 warning（推荐）。备选：二期完全不校验，留到治理阶段。"
        - "**alt 分支回放**：按书写顺序把各分支依次回放、每步标出所在分支（推荐）。备选：回放前让用户选择走哪个分支。"
        - "**场景文件位置与格式**：`model/<项目>/scenarios/*.yaml`，顶层键 `scenario` / `scenarios`，步骤格式沿用技术选型 §4.4（推荐，接入层零改动）。"
      feedback: |
        1. 上下分屏，后续演化成可自由推拽布局的分屏
        2. 这个我需要再斟酌下，给我分析下利弊，给我一个建议
        3. 写一套，各层投影合并
        4. 要报错或提醒
        5. 到 alt 分支时展开全部选项，用户选择其中一个继续
        6. 和结构文件放在同级，yaml 和 json 都可，格式无所谓，我只关注数据结构

        后续澄清与裁决（2026-10-20 对话）：
        - 第 2 点采用 C+：视图状态是一个值；全部转移规则（一期导航 + 二期回放 + 跨域规则）抽成纯函数、单测穷举；
          状态与 UI 分离；DeskState 只做协调（持有、派生、dispatch），与外界的交互放进同步适配器（路由、时钟、模型源、布局）。
        - 打开场景不自动换层；场景不写默认层次，最适合的层次由帧端点的最近公共祖先算出，由用户决定是否跳转。
        - 新增外部参与者：在模块树之外单独声明，作为系统上下文常驻静态视图；只建主动发起交互的外部实体。
        - 领域规则盘点裁决：单步按本层可见消息前进；回放位置与选中解绑；引用 event 关系时按反向比对；
          步骤可选 id、没写时用路径；ref 内联、loop 走一遍、par 串行并标注维持；泳道按结构图横坐标、参与者固定最左；
          触发者由第一帧推出；「只看现状」隐藏当前层次时退到最近的现状祖先；其余我加的规则按建议保留。
    - id: r2
      date: '2026-10-20'
      summary: |
        按 r1 的评审意见与后续裁决修改（对比「上一轮」可只看本轮改动）：

        - **视图状态层按 C+ 重组**：新增核心模块「视图状态转移」（导航规则 / 回放规则 / URL 编解码，全部纯函数）；
          DeskState 收缩为协调者（持有视图状态、dispatch、派生），与外界的交互拆成四个同步适配器：路由、时钟、模型源、布局。
          r1 的「回放」子模块拆进转移规则与时钟同步。
        - **回放**：单步按本层可见消息前进（下钻后变细）；到 alt 停下展开全部选项、选定后继续（场景投影拆出「回放路径」）；
          回放位置与选中解绑，无选中时面板显示当前步骤；打开场景不自动换层，提供「跳到场景所在层次」。
        - **外部参与者**：新增 ds.ActorDef，作为系统上下文常驻静态视图；投影、布局、节点、时序图泳道、面板各自支持；触发者由第一条消息推出。
        - **场景格式**：与 modules/ 同级的 scenarios/，YAML / JSON 都可；去掉 level，加可选步骤 id 与 cause；event 关系反向比对。
        - **分屏容器**：画布区交给按布局树（ds.PaneLayout）排布的分屏容器，二期上下分屏，后续演化为自由拖拽。

        ### 领域规则清单

        来源：**你定** = 需求定档或你确认的；**推论** = 由你定的规则直接推出；**我提 · 已认可** = 我提出、你在 r1 评审中认可的。每条规则至少一个单测。

        **导航（视图状态转移 · 导航规则）**

        | # | 规则 | 来源 |
        |---|---|---|
        | N1 | 只有有子模块的模块可下钻 | 你定 C-4 |
        | N2 | 下钻后清空选中 | 你定 架构 §5.2 |
        | N3 | 定位关系：跳到两端最近公共祖先并选中 | 你定 架构 §5.3 |
        | N4 | 定位模块（搜索）：跳到其父模块并选中 | 你定 C-11 |
        | N5 | 重新加载保留层次与选中；层次失效退到最近仍存在的上级，选中失效则清空 | 你定 §4.4 / 架构 §5.4 |
        | N6 | 层次、选中写进 URL | 你定 C-10 |
        | N7 | 根层 Backspace 回项目列表 | 你定 H-3 |
        | N8 | 返回上级时选中刚离开的模块 | 我提 · 已认可 |
        | N9 | Esc 先取消选中，无选中再返回上级 | 我提 · 已认可 |
        | N10 | 下钻进浏览器历史，选中只替换地址 | 我提 · 已认可 |
        | N11 | 切换版本保留层次与选中（失效按 N5 回退） | 我提 · 已认可 |
        | N12 | 「只看现状」隐藏了当前层次时，退到最近的现状祖先 | 我提 · 已认可（补一期缺口） |

        **场景数据与校验**

        | # | 规则 | 来源 |
        |---|---|---|
        | S1 | 一切动态表达基于场景；不选场景即纯结构视图 | 你定 |
        | S2 | 步骤类型 call / return / async / alt / loop / par / ref | 你定 §5.1 |
        | S3 | 每个场景只写一套最细步骤，各层投影合并 | 你定 评审 3 |
        | S4 | 消息端点写能表达清楚的最深模块（或参与者） | 推论 |
        | S5 | 步骤与结构不一致要报错或提醒 | 你定 评审 4 |
        | S5a | 引用了关系而端点不一致 → error（event 关系反向比对）；未引用且两端结构上无任何关系 → warning | 我提 · 已认可 |
        | S6 | ref 目标存在且无循环引用 | 推论 |
        | S7 | （删除）ref 展开深度上限 | — |
        | S8 | 场景文件与 modules/ 同级，YAML / JSON 均可，以数据结构为准 | 你定 评审 6 |
        | S9 | 不写默认层次；场景所在层次 = 所有帧端点的最近公共祖先 | 你定 |
        | S10 | return 可省略，由 call 隐含 | 你定 §5.1 |
        | S11 | 消息步骤可写 id，场景内唯一 | 我提 · 已认可 |

        **外部参与者**

        | # | 规则 | 来源 |
        |---|---|---|
        | A1 | 参与者在模块树之外单独声明，可作关系与消息的端点 | 你定 |
        | A2 | 作为系统上下文常驻静态视图 | 你定 |
        | A3 | 只建主动发起交互的外部实体 | 你定 |
        | A4 | 类别 user / system / time | 我提 · 已认可 |
        | A5 | 事件不是一类发起者，只是异步交互方式 | 我提 · 已认可 |
        | A6 | 触发者 = 第一条消息的发送方，不单独声明 | 你定 |
        | A7 | 位置固定：用户在内部结构上方，外部系统与时间在右侧；时序图中在最左并隔出系统边界 | 我提 · 已认可 |

        **展开（回放计划与路径）**

        | # | 规则 | 来源 |
        |---|---|---|
        | F1 | 一条消息步骤 = 一帧；组合步骤只给帧打标签 | 推论 |
        | F2 | 帧 ID = 场景 ID + 步骤 id，未写 id 时用树中路径 | 你定 |
        | F3 | ref 内联并画 ref 组合框 | 你定（维持） |
        | F4 | loop 展开一遍并标注条件 | 你定（维持） |
        | F5 | par 各分支按书写顺序串行并标注并行 | 你定（维持） |
        | F6 | 到 alt 展开全部选项，用户选一个后继续 | 你定 评审 5 |
        | F6a | 自动播放到 alt 暂停 | 推论 |
        | F6b | 退回分支点之前再前进沿用已选分支；在分支点可改选，改选丢弃其后的选择 | 我提 · 已认可 |
        | F6c | 已选分支写进 URL | 我提 · 已认可 |
        | F6d | 分支点之后未定时进度显示「≥ N」 | 我提 · 已认可 |

        **投影（帧在当前层次）**

        | # | 规则 | 来源 |
        |---|---|---|
        | P1 | 帧端点按结构图同一套规则投影 | 你定 D-4 |
        | P2 | 一端在本层外 → 走到边界节点的边 | 你定 §3.5-4 |
        | P3 | 两端在同一子模块 → 内部活动（只高亮节点） | 我提 · 已认可 |
        | P4 | 两端都在本层外 → 本层不可见 | 推论 |
        | P5 | 连续落在同一条边或同一节点内部的帧合并为一条可见消息 | 我提 · 已认可 |
        | P6 | 组合框内消息全部合并为内部活动时，框缩成一行 | 我提 · 已认可 |
        | P7 | 分层总览中帧可落在核心跨层边上，届时临时显示该边 | 推论 |
        | P8 | （删除）关系类型筛选不作用于回放 | 你定 |
        | P9 | 泳道按结构图中节点横坐标排序，参与者固定最左 | 你定 |

        **回放**

        | # | 规则 | 来源 |
        |---|---|---|
        | R1 | 单步前进 / 后退、自动播放、跳到任意位置 | 你定 D-3 |
        | R2 | 同步与异步视觉可区分 | 你定 D-6 |
        | R3 | 时序图与结构图联动 | 你定 D-7 |
        | R4 | 场景列表可按层次筛选 | 你定 D-1 |
        | R4a | 默认只列与当前层次相关的场景（有帧端点在当前子树内），可切全部、可按发起者筛选 | 我提 · 已认可 |
        | R5 | 打开场景不改层次；当前层次看不到任何帧时提示并提供跳到场景所在层次 | 你定 |
        | R6 | 下钻 / 返回后停在同一帧 | 推论 |
        | R7 | 单步按本层可见消息前进 | 你定 |
        | R8 | 回放位置与选中解绑；无选中时面板显示当前步骤 | 你定 |
        | R9 | 切换层次不停止自动播放 | 我提 · 已认可 |
        | R10 | 打开场景进浏览器历史；单步、跳转、选分支只替换地址 | 我提 · 已认可 |
        | R11 | 当前帧在本层不可见时提示「下钻 / 到上一层查看」 | 我提 · 已认可 |
        | R12 | 速度 0.5 / 1 / 2 倍，每条可见消息一个节拍 | 我提 · 已认可 |
      questions:
        - "**参与者在哪些层次出现**：与本层子树有关系（或有帧经过）的参与者才出现，根层为全部有关系的参与者。备选：每层都显示全部参与者。推荐前者，避免无关参与者占位。"
        - "**隐含返回**：时序图只画显式 return，call 隐含的返回不画。备选：每个同步 call 都补画虚线返回。推荐不画，消息数减半、更易读。"
        - "**视图状态转移放在视图状态层**（而非模型层）：模型层的知识是「描述是什么、怎么投影」，转移规则的知识是「用户在工作台上怎么看」，两者都是纯函数。是否同意这一划分？"
        - "**时序图单击消息**：跳到这条消息并取消选中，使面板显示该步骤（R8 下唯一会改选中的回放交互）。备选：只跳转、不动选中。推荐前者，单击消息的意图就是看这一步。"
        - "**分屏比例不进视图状态与 URL**：作为本地偏好按项目记住，分享链接不带布局。推荐如此。"
      feedback: |
        待确认问题：
        1. 参与者出现层次：按推荐（与本层子树有关系或有帧经过的才出现）
        2. 隐含返回：按推荐（只画显式 return）
        3. 视图状态转移的归属：采用**按知识划分**——关于被描述系统、脱离工作台仍成立的知识（最近存在 / 可见的祖先、本层的下一步、分支选择的组合等）下沉模型层；
           关于一次浏览会话的规则（焦点、指针关系、浏览器历史与 URL、开关）留在视图状态层
        4. 讨论后重新定义面板与回放的关系：
           - 视角：结构视角（系统由什么组成、怎么连接）与运行视角（某个场景这一次怎么走）；视角由是否打开场景决定，顶部「结构 ｜ 运行：<场景名>」显式展示并作为入口
           - 焦点：面板只有一个主语。结构视角 = 选中，否则当前父模块；运行视角 = 跟随（播放头所在步骤）或钉住（用户指向的对象）二选一，
             不变式「播放中 ⇒ 跟随」；用户指向任何对象（单击、双击下钻、搜索跳转、点消息或步骤序号；悬停不算）即暂停并钉住；只有播放控制恢复播放并回到跟随
           - 指向某一步 = 播放头前进或后退到这一步并暂停，画面等同从头播放到这一步（R13）；结构图单击保持一期含义
           - 运行视角下面板先回答「在这次流程中做了什么」，结构信息折叠在下方
           - 从头打开场景自动播放；从带步骤的链接进入停在该步
           - 结构图作为舞台：本层参与的节点与走过的边突出，其余变淡不隐藏
           - 步骤是运行时关系的一次发生：只对应 calls / dataflow / event（S12）；没写 relation 时唯一的运行时关系自动认定并标明「推断」（S13）；
             消息按步骤自己的方向流动（P10）；本层找不到对应边时回放期间画「结构中未建模」虚线（P11）
        5. 分屏比例：按建议（本地偏好，不进视图状态与 URL）
    - id: r3
      date: '2026-10-20'
      summary: |
        按 r2 的评审意见与后续讨论修改（对比「上一轮」可只看本轮改动）：

        - **按知识划分**：两层的抽象原则各补一句判别法——模型层是「关于被描述系统的知识，脱离工作台仍成立」，视图状态层是「关于一次浏览会话的规则」。
          r2 视图状态转移里的定位类知识下沉模型层作为**架构查询**：最近仍存在的祖先（Indexer）、最近可见层次（Projector）、
          本层下一步 / 上一步与指向落点（场景投影 · 帧的层次投影）、分支选择的组合（回放路径），新增「参与查询」。视图状态转移因此只剩会话规则。
        - **视角与焦点**：新增「视角切换」（结构 ｜ 运行：<场景名>，场景列表从这里进入）与「视角与焦点规则」；面板改为显示唯一的焦点，
          运行视角下跟随或钉住二选一，不变式「播放中 ⇒ 无选中」；新增面板一节「运行信息」，结构信息折叠在下方；结构图在运行视角下作为舞台。
        - **指向一步（R13）**：时序图消息、结构图步骤序号、步骤目录、运行信息里的步骤，都是把播放头前进或后退到该步并暂停，画面等同从头播放到这一步。
        - **步骤与关系**：步骤是运行时关系的一次发生；只对应 calls / dataflow / event（S12）；唯一的运行时关系自动认定并标「推断」（S13，Validator 与回放共用 bindRelation）；
          消息按自己的方向流动（P10）；本层找不到对应边时画「结构中未建模」虚线（P11）。
        - 采纳 r2 待确认问题 1、2、5：参与者只在有关系或有帧经过的层次出现（A8）；只画显式 return（S10a）；分屏比例为本地偏好。

        ### 领域规则清单

