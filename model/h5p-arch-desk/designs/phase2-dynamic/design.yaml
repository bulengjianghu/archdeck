design:
  id: phase2-dynamic
  name: 二期 · 动态视角
  status: reviewing
  goal: |
    在一期「看见结构」之上叠加「看见运行」（需求 §5）：一条有名字的执行链路（场景）由有序步骤组成，
    以**时序图**和**结构图上的回放**两种方式呈现，并且与一期的层次规则一致——高层看粗步骤，下钻看细步骤。

    **范围**：需求 D-1 ~ D-7 的架构落点（场景数据模型、场景展开与按层投影、时序图、回放状态与控制、面板、URL）。
    **不在本设计内**：D-8 h5player 场景内容的录入与 blueprint 时序图迁移（实现后按生成规范补写场景描述即可）；场景的画布内编辑。

    **总体判断**：不动一期骨架。新增 1 个模型层核心模块「场景投影」，与 Projector 并列、共用端点映射；
    视图状态层在 DeskState 内加「回放」、在 Layout 内加「时序图排布」；呈现层加时序图、场景列表、回放控制条和两个面板。
    接入层零改动（场景文件与模块描述在同一目录、走同一条加载流水线）。
  base:
    commit: 72d288e76394a5620ab24ad4d17c3a03f1714065
    generatedAt: '2026-10-20'
  revisions:
    - id: r1
      date: '2026-10-20'
      summary: |
        在当前版本上做的扩展与调整（共 4 层，按依赖方向从内到外）：

        - **模型层**：新增核心模块「场景投影」（展开 → 帧的层次投影 → 时序模型）；类型 / Loader / Validator / Indexer 支持场景；
          Projector 的端点映射抽成公共函数 `mapEndpoint`，结构图与时序图用同一套层次规则。
        - **视图状态层**：DeskState 新增子模块「回放」（当前场景、帧、播放 / 暂停、速度，写进 URL 的 `sc` / `step`）；
          视图派生多两步（帧投影、时序布局）；Layout 新增「时序图排布」，泳道左右顺序取自结构图布局。
        - **呈现层**：新增「时序图」（核心）、「场景列表」、「回放控制条」，面板新增场景、步骤两种；
          画布与边组件增加回放叠加（当前步骤流动、走过的边标序号、内部活动只高亮节点）；工作台打开场景时上下分屏。
        - **接入层**：不变。

        建议从根层看「场景投影」与 Projector 的关系，再下钻到 视图状态层 → DeskState → 回放、呈现层 → 时序图。
      questions:
        - "**同屏方式**：打开场景时画布区上下分屏（结构图在上、时序图在下，可拖、可收起）。备选：结构 / 时序标签切换。推荐分屏——D-7 联动需要两图同时可见。"
        - "**回放状态归属**：作为 DeskState 的子模块（推荐，保持唯一状态持有者与唯一一组操作）。备选：独立的 PlaybackState store。"
        - "**下钻粒度（D-4）**：每个场景只写一套最细步骤，由投影合并到上层、同一子模块内部的步骤折叠为「内部活动」（推荐）。备选：允许为不同层次分别写步骤。"
        - "**步骤与结构的一致性**：步骤引用 relation 时端点必须一致（error）；没引用且两端之间没有任何结构关系时报 warning（推荐）。备选：二期完全不校验，留到治理阶段。"
        - "**alt 分支回放**：按书写顺序把各分支依次回放、每步标出所在分支（推荐）。备选：回放前让用户选择走哪个分支。"
        - "**场景文件位置与格式**：`model/<项目>/scenarios/*.yaml`，顶层键 `scenario` / `scenarios`，步骤格式沿用技术选型 §4.4（推荐，接入层零改动）。"
