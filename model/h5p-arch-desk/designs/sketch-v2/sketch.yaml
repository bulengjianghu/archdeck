# 草图：草图编辑 v2（ADR-0025）。一期格式手写；按 v2 是挂在「呈现层」上的一张（mount: present），只画呈现层里与草图编辑有关的三个模块。
# 钉住的：草图画布独立于模型画布（present.sketch）、草图面板在属性面板之下（present.panel.sketch）、信息条三区仍归版本切换（present.version）。
# 模型层（合并 / 拆分 / 血缘 / 两级校验）、视图状态层（设计级会话、草图布局）与接入层（多草图写回）的变化由 AI 按 ADR-0025 与 02 X9–X20 展开。
# 已知偏差（T0 登记时）：present.sketch 是骨架封闭的「呈现层」的新直接子模块，sketch-check 报 contradiction:present.sketch。
# 不声明 supersedes: skeleton——一期晋升会用这张三模块的草图整份替换骨架。按 v2 的归属（X10），呈现层的直接子模块属根草图：
# 应在本设计加一张根挂载的草图（sketches/root.yaml，supersedes: skeleton，底稿从基线复制），由实现 v2 的会话（T1 / T2）迁移时处理。
sketch:
  id: sketch-v2
  lifetime: until-implemented
  modules:
    - id: present.sketch
      parent: present
      name: 草图画布
      kind: subsystem
      responsibility: 独立于模型画布的草图编辑画布：一张草图一个挂载点一个层次，自由布局、直线边、引用节点，合并 / 拆分 / 降级 / 升级手势与下钻；只发编辑操作（SK-15、SK-16）。
    - id: present.panel.sketch
      parent: present.panel
      name: 草图面板
      kind: component
      responsibility: 草图画布下的属性面板：父模块原则、模块（ID 与血缘）、关系、引用节点、元信息，顶部两级校验、待重连与本张的两个核验数（SK-17）。
    - id: present.version
      parent: present
      name: 版本切换与设计信息条
      kind: subsystem
      responsibility: 信息条三区（身份 / 动作 / 对比）；草图下一条挂载点面包屑，也是升级的落点；保存并交给 AI（SK-20）。
  relations:
    - { id: rel.sketch-panel, from: present.sketch, to: present.panel.sketch, type: notifies, description: 选中变化时面板跟随 }
    - { id: rel.version-sketch, from: present.version, to: present.sketch, type: calls, description: 面包屑返回、升级落点、撤销重做与保存 }
