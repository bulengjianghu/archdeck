# 设计 sketch-v2 挂在「属性面板」present.panel 上的一层（ADR-0025）：底稿从基线 5285286 复制（X18），新增「草图面板」present.panel.sketch 与它和草图画布之间的关系。
sketch:
  id: sketch-v2
  mount: present.panel
  lifetime: until-implemented
  modules:
    - id: present.panel.dispatch
      name: 面板分派
    - id: present.panel.module
      name: 模块面板
    - id: present.panel.relation
      name: 关系面板
    - id: present.panel.edge
      name: 聚合边面板
    - id: present.panel.system
      name: 系统面板
    - id: present.panel.design
      name: 设计面板
    - id: present.panel.content
      name: 内容组件
    - id: present.panel.edit
      name: 编辑表单
      kind: component
    - id: present.panel.governance
      name: 架构治理面板
    - id: present.panel.dep
      name: 代码依赖面板
    - id: present.panel.scenario
      name: 场景面板
    - id: present.panel.step
      name: 步骤面板
    - id: present.panel.run
      name: 运行信息
    - id: present.panel.actor
      name: 参与者面板
    - id: present.panel.file
      name: 文件面板
    - id: present.panel.module-source
      name: 模块的源代码
    - id: present.panel.sketch
      name: 草图面板
      kind: component
      responsibility: 草图画布下的属性面板：父模块原则、模块（ID 与血缘）、关系、引用节点、元信息，顶部两级校验、待重连与本张的两个核验数（SK-17）。
