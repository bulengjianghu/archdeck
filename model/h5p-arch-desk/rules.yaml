# 架构规则（U1–U5、Y3）：架构师的意图，AI 重新生成当前版本时不改动（ADR-0015，docs/04-description-format.md §3.8）。
# 层规则来自骨架 modules/layers.yaml 的 mayDependOn。
rules:
  modules:
    - module: state.layout
      mayDependOn: [model]
      reason: Layout 只把模型层的视图排成坐标，不知道 DeskState 与会话规则（03 §3.5「Projector 不知道坐标，Layout 不知道层次规则」）
    - module: model.governance
      mayDependOn: [model.types, model.pipeline, model.projector, model.source]
      reason: 架构治理只复用索引、端点映射与归属，不依赖场景与版本对比
    - module: access.agent
      mayDependOn: [model, access.reader, access.source, access.deps, access.governance-store]
      reason: agent 接口只是查询核心加两层外壳，不经开发服务器
