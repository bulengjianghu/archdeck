  - { id: rel.gv.desk-facts-intent, from: state.desk.facts, to: model.intent.check, type: queries, description: 架构治理派生（desk.facts）向草图核验与生命周期取：没有代码事实时调用 sketchLifetime、flattenSketch 把活动草图里层的 mayDependOn 接进允许依赖图（U16） }
