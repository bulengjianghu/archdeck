  - { id: rel.gv.structure-cycles, from: model.governance.structure, to: model.governance.cycles, type: queries, description: 结构视图向环与环度取：「只看值依赖」时调用 valueDeps 去掉只引类型的模块依赖（K15、K16） }
  - { id: rel.gv.structure-ownership, from: model.governance.structure, to: model.source.ownership, type: queries, description: 结构视图向归属与入口取：影响面调用 moduleFiles 数闭包内模块的源码文件（K15） }
