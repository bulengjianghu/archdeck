  - { id: rel.gv.structure-level, from: model.governance.structure, to: model.governance.level, type: queries, description: 结构视图向本层投影取：调用 nodeOf 把模块依赖、影响面与允许依赖的两端映射到本层节点（L15、K15、U16） }
