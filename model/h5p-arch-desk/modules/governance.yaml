  - { id: rel.gv.canvas-structure-node, from: state.layout.canvas.structure, to: model.governance.level, type: queries, description: 结构视角的画布场景向本层投影取：调用 nodeOf 定位选中模块在本层所在的节点（K15） }
  - { id: rel.gv.canvas-structure-projector, from: state.layout.canvas.structure, to: model.projector, type: queries, description: 画布场景向 Projector 层次投影取：结构视角调用 shelfOf 取共用件架上的节点，决定共用件边的折叠（O13） }
  - { id: rel.gv.transition-structure-level, from: state.transition.mode, to: model.governance.level, type: queries, description: 视角模式与选中映射向本层投影取：切换结构 / 交互视角时调用 nodeOf 找关系两端在本层的节点（V12） }
  - { id: rel.gv.transition-structure-edge, from: state.transition.mode, to: model.governance.structure, type: queries, description: 视角模式与选中映射向结构视图取：依赖边切到交互视角时调用 interactionEdgeBetween 取同一对节点的交互边（V12） }
