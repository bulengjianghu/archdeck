  - { id: rel.gv.panel-structure-read, from: present.panel.structure, to: state.desk.facts, type: queries, description: 结构视图面板向架构治理派生（desk.facts）取：metricsOf、impactOf、againstOf、isolatedOf、edgeFiles、structure、relationFact 显示指标、影响面、逆稳定、交互图互查与依赖边明细（K14–K17、U15、U17） }
