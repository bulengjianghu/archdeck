  - { id: rel.gv.dep-gov, from: present.panel.dep, to: present.panel.governance, type: commands, description: 代码依赖面板交给架构治理面板：渲染文件证据列表（FileDepList）与这对节点之间的子类、组装（StructureFacts） }
