  - { id: rel.gv.evolution-ownership, from: model.evolution, to: model.source.ownership, type: queries, description: 演化事实向归属与入口取：按归属调用 moduleFiles / moduleLines 把文件的改动提升为模块（J2） }
  - {id: rel.gv.desk-evolution-model, from: state.desk.evolution, to: model.evolution, type: queries, description: 演化事实派生（desk.evolution）向演化事实取：evolutionStats、levelEvolution：热度与耦合的派生（J5）}
