  - { id: rel.gv.module-structure, from: present.panel.module, to: present.panel.structure, type: commands, description: 模块面板交给结构视图面板：结构视角下渲染模块的「结构」一节 ModuleStructure（K15、K16、K17、U17） }
  - { id: rel.gv.dep-structure, from: present.panel.dep, to: present.panel.structure, type: commands, description: 代码依赖面板交给结构视图面板：结构视角选中依赖边时渲染这对节点的结构边、交互覆盖、规则与稳定性 DepStructure（K14、K17、U15、U17） }
  - { id: rel.gv.structure-content, from: present.panel.structure, to: present.panel.content, type: commands, description: 结构视图面板交给内容组件：渲染分节组件 Section }
  - { id: rel.gv.structure-gov, from: present.panel.structure, to: present.panel.governance, type: commands, description: 结构视图面板交给架构治理面板：渲染结构边的文件依赖清单 FileDepList }
  - { id: rel.gv.structure-prefs, from: present.panel.structure, to: present.canvas.legend, type: commands, description: 结构视图面板交给显示面板：经 useStructurePrefs 读写影响面方向与「只看值依赖」的显示偏好（画布同读，K15） }
