# 骨架：4 个层 + 第二级模块。依赖方向：呈现 → 视图状态 → 模型 ← 接入（docs/03-architecture.md §2–§3）。

modules:
  - id: present
    name: 呈现层
    kind: layer
    order: 1
    abstraction: 把状态画出来、把用户操作上交：只读 DeskState、只调它的操作，不做投影与布局计算
    responsibility: 应用外壳与路由、项目列表、项目视图（含分屏与副栏）、导航树（模块 / 文件 / 步骤）、画布（含回放与文件高亮）、时序图、源代码预览、场景列表与回放控制、属性面板、导航与问题提示。
    includes: [Vue 组件, 路由, 交互事件, 样式]
    excludes: [层次投影规则, 布局算法, 文件读取]
    mayDependOn: [state, model]
    docRefs: [docs/03-architecture.md]
    children:
      - id: present.shell
        name: 应用外壳与路由
        kind: subsystem
        responsibility: 应用入口与 hash 路由：`/` 是项目列表，`/p/<项目>` 是项目当前版本，`/p/<项目>/d/<设计>/<轮次>` 是设计版本；切换项目或版本时重建视图。
        codeRefs: [index.html, env.d.ts, src/main.ts, src/App.vue, src/styles.css]
      - id: present.project-list
        name: 项目列表主页
        kind: subsystem
        core: true
        responsibility: 列出模型根目录下的全部项目（简介、分层、规模、生成来源、问题数）及各项目推进中的设计版本（已实现、已放弃的设计归档，只注明个数，DV-6），点击进入项目当前版本或设计的最新一轮。
        codeRefs: [src/components/ProjectList.vue]
      - id: present.desk-view
        name: 项目视图
        kind: subsystem
        core: true
        responsibility: 单个项目某个版本的工作台：按项目 + 版本创建并注入一份 DeskState，布置左侧导航树、中间画布区、设计信息条与右侧属性面板（两侧宽度可拖动、可折叠，宽度与折叠状态记在本地；「专注」一键收起两侧栏，W-1）；创建并注入舞台显示（静态关系显示方式、在画布上显示，V8、V9）；处理键盘意图；打开场景后画布区交给分屏容器放入结构图与时序图（默认左右，可切换为上下），底部出现回放控制条。
        codeRefs: [src/components/DeskView.vue]
      - id: present.version
        name: 版本切换与设计信息条
        kind: subsystem
        responsibility: 在当前版本与各设计的各轮之间切换（保留层次与选中）；设计版本下显示设计名、轮次、状态，选择对比基线（当前版本 / 上一轮），显示变更计数、标出变更开关与基线漂移提示。
        codeRefs: [src/components/VersionSwitcher.vue, src/components/DesignBar.vue]
        docRefs: [docs/adr/0002-design-versions.md]
      - id: present.scenarios
        name: 场景列表
        kind: subsystem
        responsibility: 列出项目的场景（D-1）：默认只列与当前层次相关的（有帧端点落在当前父模块子树内，规则 R4a），可切到全部，可按发起者（外部参与者）筛选；显示名称、触发者、消息数；选定即进入运行视角（不改层次，规则 R5）。
        codeRefs: [src/components/ScenarioList.vue]
      - id: present.perspective
        name: 视角切换
        kind: subsystem
        responsibility: 顶部显式展示当前视角「结构 ｜ 运行：<场景名>」（V1）：结构视角下点「运行」弹出场景列表；运行视角下可换场景或「退出场景」回到结构视角（保留层次与选中）。
        codeRefs: [src/components/PerspectiveSwitch.vue]
      - id: present.sequence
        name: 时序图
        kind: subsystem
        core: true
        responsibility: 运行视角下把定位好坐标的时序模型画成 SVG（D-2）：泳道为当前层次的参与者，互不包含（P14），按层次顺序排列，同一父模块的泳道有分组框（P9、P13），泳道头固定在顶部、底部另有一份（D-2），外部参与者固定在最左并以竖线隔开系统边界；消息自上而下，alt / loop / par / ref 画成组合框；同步实线实心箭头、异步虚线开放箭头（D-6），只画显式 return（S10a）；选中突出：只有选中的步骤用选中样式、配对返回加浅色标记，选中模块等对象时突出相关泳道（R15、R16）；单击消息 = 指向这一步即选中它（R13），单击 alt 的分支条件 = 改走这一支（F6e）；只在用户移动进度后滚动（D-7）；不做悬停弹出（W-1）；当前层次看不到任何帧时提示并提供「跳到场景所在层次」。
        codeRefs: [src/components/sequence/**]
        docRefs: [docs/02-tech-selection.md]
      - id: present.player
        name: 回放控制条
        kind: subsystem
        responsibility: 回放控制（D-3）：回放只由用户驱动，不提供自动播放（R1）。上一步 / 下一步（按本层可见消息，规则 R7；在第一步后退回到开头）、进度条拖动到已走路径上任意位置（拖到 0 即回到开头）；显示「第 i / N 步」（停在开头为 0，分支点之后未定时为「≥ N」）；常驻路线总览，可逐个分支点改选（F6f）；到达 alt 分支点时展开全部选项（条件 + 首条消息）供选择，未选时「下一步」不可用；键盘 ← → 单步，数字键选分支。
        codeRefs: [src/components/PlayerBar.vue, src/components/BranchChooser.vue]
      - id: present.nav-tree
        name: 导航树
        kind: subsystem
        responsibility: 工作台左侧的全局目录（W-7、T1）：「模块」页签列出模块树，「文件」页签列出被描述项目的源码文件树，「步骤」页签（只在运行视角出现）列出步骤树；进入运行视角切到步骤页签，退出切回模块页签，选中文件切到文件页签。层次、选中、参与模块、当前步骤、选中模块的文件在树上同步展开与高亮；单击 / 双击 / 悬停复用画布与时序图的同一套操作，不新增会话规则。
        principle: 页签、展开 / 折叠状态只属于这块界面，不进视图状态与 URL；树上显示的「谁参与了场景」「步骤怎样嵌套」「文件属于哪个模块」由模型层回答（scenarioModules、outlineScenario、assignFiles），呈现层只画。
        codeRefs: [src/components/tree/NavTree.vue, src/components/tree/types.ts]
        docRefs: [docs/adr/0006-workbench-navigation.md, docs/adr/0007-source-files.md]
      - id: present.source
        name: 源代码预览
        kind: subsystem
        responsibility: 在副栏只读预览选中的源码文件（SR-8、G17）：路径、归属模块（可定位）、行数，按扩展名语法高亮（Shiki，与签名高亮共用）并带行号；过大、二进制、文件不存在、源码不在本地、构建态时只给提示。没有编辑、保存等 IDE 功能。
        codeRefs: [src/components/source/**]
        docRefs: [docs/adr/0007-source-files.md]
      - id: present.canvas
        name: 画布
        kind: subsystem
        core: true
        responsibility: 把带坐标的视图画成节点和边；处理平移、缩放、单击、双击、悬停；聚焦时只显示相关的边、其余变淡；运行视角下结构图作为舞台：默认只显示参与本场景的节点与走过的边，不参与的节点与静态边按显示方式隐藏 / 淡显 / 全显，布局不变（V5、V8），「在画布上显示」的对象的静态边照常（V9）；叠加回放；选中步骤时其余走过的边变灰（D-3、R15）。
        codeRefs: [src/components/GraphCanvas.vue, src/components/nodes/**, src/components/edges/**, src/components/stage/**]
      - id: present.panel
        name: 属性面板
        kind: subsystem
        core: true
        responsibility: 显示**选中**（唯一的主语，ADR-0012）的对象：结构视角下为选中的对象，无选中时为当前父模块；运行视角下选中步骤时为步骤（作用、输入、输出在前），选中场景时为场景概览，选中模块 / 关系 / 边 / 参与者时先回答「在这次流程中做了什么」，结构信息折叠在下方，可在画布上显示（V9）。对象种类：系统（设计版本另含设计说明与变更清单）、模块、关系、聚合边、外部参与者、场景、步骤；设计版本中标出新增 / 修改与设计说明。
        codeRefs: [src/components/panel/**]
      - id: present.nav
        name: 导航
        kind: subsystem
        responsibility: 面包屑（含返回项目列表）、搜索跳转、显示开关与关系类型筛选、图例。
        codeRefs: [src/components/Breadcrumb.vue, src/components/Toolbar.vue, src/components/Legend.vue]
      - id: present.issues
        name: 问题提示
        kind: subsystem
        responsibility: 列出架构描述的错误与提醒，定位到文件与行号。
        codeRefs: [src/components/IssueBanner.vue]

  - id: state
    name: 视图状态层
    kind: layer
    order: 2
    abstraction: 关于**一次浏览会话**的规则与协调：「现在看哪里、选中了什么、走到哪一步、怎么摆」。视图状态是一个值，会话规则是纯函数，一个协调者负责持有、派生与和外界同步；关于被描述系统的问题一律问模型层
    responsibility: 会话规则（视图状态转移，纯函数）决定视角、选中与进度的关系、浏览器历史与 URL；DeskState 持有视图状态、派生要画的数据、经同步适配器与路由 / 描述文件 / 布局保持一致；Layout 把层次视图与时序模型排成坐标与走线。
    includes: [视图状态与会话规则, URL 编解码, 协调与同步适配器, 布局与缓存]
    excludes: [DOM 渲染, 关于被描述系统的知识（投影、最近祖先、本层下一步等，属于模型层）, 文件读取]
    mayDependOn: [model]
    children:
      - id: state.desk
        name: DeskState
        kind: subsystem
        core: true
        responsibility: 当前项目当前版本的唯一状态持有者：层次、选中（含文件）、悬停、显示开关、加载状态，当前场景与回放进度，设计版本的对比基线与差异，被描述项目的源码清单与文件归属；对外提供唯一一组操作，并经同步适配器与路由、描述文件、布局、源码保持一致。对外核心平铺，运行视角、源码、版本的派生分为 run / files / versions 三组（ADR-0013）。
        codeRefs: [src/state/useDeskState.ts, src/state/inject.ts]
      - id: state.transition
        name: 视图状态转移
        kind: subsystem
        core: true
        responsibility: 会话规则的纯函数：给定视图状态、动作与上下文，算出下一个视图状态及是否进浏览器历史。管视角与选中（V）、选中与进度（播放头）、悬停的关系、开关、浏览器历史与 URL 编解码；凡是关于被描述系统的问题（最近存在 / 可见的祖先、本层的下一步、到达某帧需要的分支选择、谁参与了哪一步）都调用模型层的架构查询，自己不实现。不依赖 Vue、路由、计时器。
        principle: |
          - **一个事实一个值**：层次、选中、开关、场景、进度、已选分支互相约束，是同一个视图状态（ds.ViewState），不拆成多个有状态模块。
          - **一个主语**：选中是唯一且排他的主语，含步骤与场景；进度只是内部的「走到哪一步」，选中的步骤就是进度所在的一步（ADR-0012）；回放只由用户驱动，状态里没有「播放中」（ADR-0006）。
          - **规则即知识**：每条规则编号、注明来源与所在模块（见设计说明的「领域规则清单」），单测按清单穷举。
        codeRefs: [src/state/transition/**]
      - id: state.layout
        name: Layout
        kind: subsystem
        core: true
        responsibility: 给层次视图算坐标与边的走线：分层总览按层序分带规则排布，普通层次用 elkjs；给时序模型算泳道与步骤坐标；舞台叠加与舞台显示；画布场景（节点与边的数据、显隐、变淡、回放态，ADR-0013）；结果按视图内容缓存。
        codeRefs: [src/layout/**]
        docRefs: [docs/02-tech-selection.md]

  - id: access
    name: 接入层
    kind: layer
    order: 3
    abstraction: 把磁盘上的 YAML 交给页面与命令行：只搬运文本与做摘要，不解释描述的含义
    responsibility: Vite 插件提供项目列表与项目描述（开发态实时读取并推送变更，构建态固化为静态文件），开发态读取被描述项目的源码（文件清单、文件、导出），命令行校验。
    includes: [文件读取, 源码清单与导出解析, 开发服务器端点, 变更通知, 构建产物, 命令行]
    excludes: [解析规则与文件归属（交给模型层）, 界面]
    mayDependOn: [model]
    children:
      - id: access.model-source
        name: ModelSource 插件
        kind: subsystem
        core: true
        responsibility: 开发态提供 /projects.json、/models/<项目>.json、/models/<项目>/designs/<设计>/<轮次>.json 并按项目推送 arch-model:changed（含设计版本的变化）；开发态另提供 /source/<项目>.json、/source/<项目>/file.json、/source/<项目>/exports.json（源码清单短暂缓存）；构建态只输出描述的同名静态文件，不含源码。
        codeRefs: [vite/archModelPlugin.ts, vite.config.ts]
      - id: access.reader
        name: 描述读取
        kind: subsystem
        core: true
        responsibility: 约定「模型根目录下含 system.yaml 的子目录即项目、其下 designs/<设计>/ 是设计版本」，读取项目当前版本（跳过 designs/）或设计某一轮的描述文件（YAML / JSON）及对比基线，读 design.yaml，并跑一遍模型层生成项目摘要。
        codeRefs: [vite/readModelDir.ts]
      - id: access.source
        name: 源码读取
        kind: subsystem
        responsibility: 按 system.source.repo 解析被描述项目的源码根目录（工作区根目录 + repo，环境变量可覆盖；不在本地时给出原因与尝试的路径，G1）；列出文件清单（git 仓库内按 git 的忽略规则，否则排除依赖与产物目录，G2）与各 package.json 的入口字段；读取单个文件（必须在清单中，过大或二进制只给提示，G17）；用 TypeScript 语法树解析导出的名称、类别与签名，顺着相对路径的再导出往下找（G11）。不判断文件属于哪个模块；统计 TS / JS / Vue 文件的物理行数，按修改时间与大小缓存（G19）。
        codeRefs: [vite/readSource.ts]
        docRefs: [docs/architecture/source.md]
      - id: access.lint
        name: 命令行校验
        kind: subsystem
        responsibility: npm run lint:model：校验全部项目或指定目录（含各设计版本的每一轮与 design.yaml），源码在本地时附带当前版本的源码归属警告（G9），按文件:行号输出问题，有错误时非零退出，可接入 CI。
        codeRefs: [scripts/lint-model.ts]

  - id: model
    name: 模型层
    kind: layer
    order: 4
    abstraction: 关于**被描述系统**的知识，脱离工作台仍成立：输入描述、输出数据，不依赖 Vue / DOM / 布局库，可在 Node 中纯输入输出测试
    responsibility: 把多个描述文件变成校验过的模型与索引（含参与者与场景），按层次投影出要画的节点与边，把场景展开、按层次投影成回放帧与时序模型，并回答关于被描述系统的架构查询（最近存在 / 可见的祖先、本层的下一步、到达某帧需要的分支选择、谁参与了哪一步）。
    includes: [文件格式与类型, 解析与合并, 引用校验, 索引, 层次投影, 场景展开与投影, 架构查询, 版本对比, 源码归属]
    excludes: [Vue, DOM, elkjs, 文件系统]
    mayDependOn: []
    docRefs: [docs/03-architecture.md]
    children:
      - id: model.types
        name: 类型与 Schema
        kind: subsystem
        core: true
        responsibility: 描述文件的形状（JSON Schema 与对应的 TS 类型；顶层键含 actors、scenario / scenarios 与步骤树），以及加载、索引、投影、场景各阶段的数据类型。
        codeRefs: [src/model/types.ts, src/model/project-summary.ts, src/model/design.ts, schema/arch-file.schema.json]
      - id: model.pipeline
        name: 加载流水线
        kind: subsystem
        core: true
        responsibility: 文本 → 模型 → 索引：Loader 解析与单文件格式检查，Validator 跨文件引用检查，Indexer 建查询结构；入口 loadModel 串起三步并汇总问题。模块、关系与场景走同一条流水线。
        codeRefs: [src/model/load.ts, src/model/validate.ts, src/model/indexer.ts, src/model/index.ts]
      - id: model.projector
        name: Projector 层次投影
        kind: subsystem
        core: true
        responsibility: 给定当前父模块，算出这一层的节点、直接边、聚合边、边界节点、外部参与者；子模块都是层时算出分层总览（带、核心模块、核心跨层边）。
        codeRefs: [src/model/project.ts]
        docRefs: [docs/01-requirements.md]
      - id: model.scenario
        name: 场景投影
        kind: subsystem
        core: true
        responsibility: 运行视角的核心规则：把场景的步骤树展开成回放计划（帧树，alt 处分叉），按已选分支求出回放路径，再按当前层次投影——每帧落到本层哪条边（或「结构中未建模」）、哪个节点（内部活动）或不可见，合并出本层的可见消息；产出本层的时序模型与场景所在层次；回答场景相关的架构查询：本层的下一步 / 上一步、到达某帧需要的分支选择、某个模块 / 关系 / 边在本场景中参与了哪些步骤。
        principle: |
          - **术语**：**步骤**是描述里的树（消息步骤为叶子，组合步骤为容器，时序图上画成组合框）；**帧**是一条消息步骤展开后的回放单位；
            **回放计划**是展开后的帧树；**回放路径**是按已选分支走出的线性帧序列；**可见消息**是本层投影后合并出的单步单位，一条覆盖一段连续的帧。
          - **步骤与关系**：关系是静态的「会这样交互」，步骤是场景里按时间发生的**一次**交互——运行时关系（calls / dataflow / event）的一次发生（S12）；
            一条关系可被多次经过，一个步骤最多对应一条关系，也可能没有对应（S5a、S13）。两条投影链平行：关系 → 视图边，帧 → 可见消息；可见消息画在连接同一对节点的视图边上，按步骤自己的方向流动（P10）。
          - **与结构投影同一套端点规则**：帧端点用 Projector 的端点映射提升到当前层次（D-4，规则 P1）。
          - **只写一套最细步骤**（S3）：各层投影合并；时序图与单步粒度都随层次变化，下钻后变细（规则 R7）。
          - **不知道坐标**：输出纯数据，坐标交给 Layout。
        codeRefs: [src/model/scenario/**]
        docRefs: [docs/01-requirements.md]
      - id: model.diff
        name: 版本对比
        kind: subsystem
        responsibility: 设计版本相对对比基线新增 / 修改 / 删除了哪些模块、关系、接口、数据结构（逐字段比较），以及每个模块涉及多少处变更。
        principle: |
          - 按实体 ID 对齐；出处与 designNote 不算修改，缺省与空数组视为相同。
          - 「涉及变更」：子树内模块的增删改计入各祖先；关系的增删改计入两端及其祖先；接口 / 数据结构计入提供方与持有它的模块。删除项按基线中的位置计入目标模型里仍存在的祖先。
        codeRefs: [src/model/diff.ts]
        docRefs: [docs/adr/0002-design-versions.md]
      - id: model.source
        name: 源码归属
        kind: subsystem
        responsibility: 被描述项目的源码文件与模块对上：文件按 codeRefs 归属模块（祖先与后代同时匹配取最深的，互不包含的模块同时匹配为冲突），未归属与忽略清单，模块的文件（子树并集）与入口文件，入口导出与模块接口的对应，选中文件在当前层次的投影，目录树，以及归属警告。输入是模型索引与接入层给的文件清单，不碰文件系统。
        codeRefs: [src/model/source/**]
        docRefs: [docs/architecture/source.md, docs/adr/0007-source-files.md]
