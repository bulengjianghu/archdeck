  - {id: rel.v4.flow-design-here, from: present.canvas.flow, to: present.version.new-design, type: commands, description: 视图转换与交互交给新建设计与「在此设计」：节点右键「在此设计」打开新建设计对话框（designHere，F-10）, purpose: 从画布节点发起「在此设计」 }
  - { id: rel.v4.flow-sketch-menu, from: present.canvas.flow, to: present.sketch.dialogs, type: commands, description: 视图转换与交互交给菜单与对话框：画布右键时渲染草图右键菜单（SketchMenu）, purpose: 右键时弹出草图右键菜单 }
  - {id: rel.v4.tree-design-here, from: present.nav-tree.modules, to: present.version.new-design, type: commands, description: 模块树交给新建设计与「在此设计」：右键「在此设计」（designHere，F-10）, purpose: 从模块树发起「在此设计」 }
  - { id: rel.v4.tree-sketch-menu, from: present.nav-tree.modules, to: present.sketch.dialogs, type: commands, description: 模块树交给菜单与对话框：右键时渲染草图右键菜单（SketchMenu）, purpose: 右键时弹出草图右键菜单 }
  - {id: rel.v4.module-panel-design-here, from: present.panel.module, to: present.version.new-design, type: commands, description: 模块面板交给新建设计与「在此设计」：「在此设计」（designHere，F-10）, purpose: 从模块面板发起「在此设计」 }
  # ── 模型层：意图内部 ──
  - {id: rel.ed.layers-locate, from: model.intent.edit.layers, to: model.intent.edit.locate, type: queries, description: 层操作向草图寻址与 ID 生成取：寻址与 ID 生成, purpose: 找到层并给新层生成 ID }
  - {id: rel.ed.modules-locate, from: model.intent.edit.modules, to: model.intent.edit.locate, type: queries, description: 模块操作向草图寻址与 ID 生成取：寻址、ID 生成、子树范围, purpose: 找到模块、生成 ID、圈定子树 }
  - {id: rel.ed.move-locate, from: model.intent.edit.move, to: model.intent.edit.locate, type: queries, description: 单张草图内的改 ID 向草图寻址与 ID 生成取：寻址、子树的全部 ID, purpose: 找到模块并取子树全部 ID }
  - { id: rel.ed.relations-types, from: model.intent.edit.relations, to: model.types, type: queries, description: 关系与接口操作向类型与 Schema 取：写修饰时调用 relationMode 判同步性，同步的 mode 不记（M13、X23）, purpose: 判同步性，同步的不记 mode }
  - {id: rel.ed.relations-locate, from: model.intent.edit.relations, to: model.intent.edit.locate, type: queries, description: 关系与接口操作向草图寻址与 ID 生成取：关系与接口 ID 生成, purpose: 给新关系与接口生成 ID }
  - {id: rel.ed.layers-modules, from: model.intent.edit.layers, to: model.intent.edit.modules, type: commands, description: 层操作交给模块操作：删层 = 删除模块的级联, purpose: 删层时连子树一起级联删除 }
  - {id: rel.ed.move-modules, from: model.intent.edit.move, to: model.intent.edit.modules, type: commands, description: 单张草图内的改 ID 交给模块操作：placeModule：按新父模块的写法安放, purpose: 按新父的写法安放被移的模块 }
  - { id: rel.ed.validate-check, from: model.intent.validate, to: model.intent.check, type: queries, interface: if.intent.sketchCheck, description: 草图校验向草图核验与生命周期取：语义校验调用核验的 sketchContradictions 与血缘映射（prefixMap、unmapId）查同挂载点矛盾, purpose: 查同挂载点草图之间的矛盾 }
  - {id: rel.ed.validate-locate, from: model.intent.validate, to: model.intent.edit.locate, type: queries, description: 草图校验向草图寻址与 ID 生成取：带位置的平铺：问题定位到草图里的条目, purpose: 把问题定位到草图里的条目 }
  - {id: rel.ed.check-locate, from: model.intent.check, to: model.intent.edit.locate, type: queries, description: 草图核验与生命周期向草图寻址与 ID 生成取：flattenSketch 调用寻址的平铺, purpose: 把草图平铺成可比对的模块表 }
  - {id: rel.ed.validate-schema, from: model.intent.validate, to: model.pipeline.loader, type: queries, description: 草图校验向 Loader 取：sketchShapeIssues：复用 Loader 的 JSON Schema 校验检查草图形状, purpose: 按 JSON Schema 检查草图形状 }
  - {id: rel.ed.check-load, from: model.intent.check, to: model.pipeline.loader, type: queries, description: 草图核验与生命周期向 Loader 取：parseDesignSketches：载荷附带的设计草图经 load 解析, purpose: 解析载荷附带的设计草图 }
  - {id: rel.ed.validate-types, from: model.intent.validate, to: model.types, type: queries, description: 草图校验向类型与 Schema 取：isSharedRole、mountOfSketchFile, purpose: 认出共用件与草图文件的挂载点 }
  - {id: rel.ed.check-types, from: model.intent.check, to: model.types, type: queries, description: 草图核验与生命周期向类型与 Schema 取结果, purpose: 取草图与模型的类型定义来比对 }
  # ── 视图状态层：编辑规则 ──
  - {id: rel.ed.follow-existing, from: state.transition.edit, to: model.pipeline.indexer, type: queries, interface: if.model.buildIndex, description: 编辑规则向 Indexer 取：nearestExisting：删除后层次退到草图里最近仍存在的祖先, purpose: 删除后退到最近仍存在的祖先 }
  - {id: rel.ed.edit-navigation, from: state.transition.edit, to: state.transition.navigation, type: queries, description: 编辑规则向导航规则取：withLevel：跟随后的层次与选中, purpose: 算跟随后的层次与选中 }
  # ── 视图状态层：编辑中的草图 ──
  - {id: rel.ed.commands-session, from: state.desk.edit.commands, to: state.desk.edit.session, type: commands, interface: if.desk.editSession, description: 编辑操作交给编辑会话：apply / open / undo / redo / replay / discard / reloaded, purpose: 应用、撤销、切张并改变会话 }
  - {id: rel.ed.commands-mode, from: state.desk.edit.commands, to: state.transition.edit, type: queries, interface: if.state.editMode, description: 编辑操作向编辑规则取：leaveGuard：离开前是否要确认, purpose: 判断离开前是否要确认 }
  - {id: rel.ed.commands-dispatch, from: state.desk.edit.commands, to: state.desk.actions, type: commands, via: 'channel:callback@state.desk.edit.commands', interface: if.desk.actions, description: 编辑操作交给 dispatch 与操作：dispatch(enterEdit / exitEdit / edited), purpose: 让视图状态进出草图并跟随编辑 }
  - {id: rel.ed.commands-save, from: state.desk.edit.commands, to: state.desk.edit.save, type: commands, description: 编辑操作交给草图写回同步：save / createDesign 交给写回同步, purpose: 保存设计或新建设计 }
  - {id: rel.ed.commands-derive, from: state.desk.edit.commands, to: state.desk.edit.derive, type: queries, description: 编辑操作向编辑会话的派生取：设计的索引与编辑的上下文（editContext）, purpose: 取设计索引与编辑上下文 }
  - {id: rel.ed.save-session, from: state.desk.edit.save, to: state.desk.edit.session, type: commands, interface: if.desk.editSession, description: 草图写回同步交给编辑会话：写入结果 → saved / 已过时, purpose: 把写回结果记进会话 }
  - {id: rel.ed.derive-session, from: state.desk.edit.derive, to: state.desk.edit.session, type: queries, description: 编辑会话的派生向编辑会话取：isDirty、sketchDirty, purpose: 取会话与各张是否有改动 }
  - {id: rel.ed.reload-edit, from: state.desk.actions, to: state.desk.edit.commands, type: commands, interface: if.desk.edit, description: dispatch 与操作交给编辑操作：重新加载后 onReloaded：认出刚保存的或标为已过时，给出要显示的索引（编辑态下为草图的索引）, purpose: 重新加载后认出保存或标为过时 }
  - {id: rel.ed.session-apply, from: state.desk.edit.session, to: model.intent.edit, type: queries, interface: if.intent.applyEdit, description: 编辑会话向草图编辑取：applyDesignEdit：应用一个设计级操作得到新的草图集合与影响；open 时推出下一层（deriveChildSketch）, purpose: 算出一步编辑后的草图与影响 }
  - {id: rel.ed.commands-preview, from: state.desk.edit.commands, to: model.intent.edit, type: queries, description: 编辑操作向草图编辑取：referenceNodes、locateAll、shortName：删除引用节点与切张时的本层模块, purpose: 取引用节点与本层模块供切张删除 }
  - {id: rel.ed.commands-load, from: state.desk.edit.commands, to: model.pipeline.loader, type: queries, description: 编辑操作向 Loader 取：从载荷原文读出草图定义, purpose: 从载荷原文读出草图定义 }
  - {id: rel.ed.derive-validate, from: state.desk.edit.derive, to: model.intent.validate, type: queries, interface: if.intent.validateSketch, description: 编辑会话的派生向草图校验取：每次操作后逐张两级校验（与写入端点同一函数）, purpose: 每步编辑后逐张校验草图 }
  - {id: rel.ed.derive-check, from: state.desk.edit.derive, to: model.intent.check, type: queries, interface: if.intent.compareDesign, description: 编辑会话的派生向草图核验与生命周期取：compareDesign：两个对比（相对基线 / 相对当前版本）的全设计计数与本张清单（X17）, purpose: 算两个对比的计数与本张清单 }
  - {id: rel.ed.derive-load, from: state.desk.edit.derive, to: model, type: queries, interface: if.model.loadModel, description: 编辑会话的派生向 loadModel 入口取：各张草图序列化为 sketches/<mount>.yaml，与 system.yaml、持久草图、引用的外部模块一起加载成设计的索引, purpose: 把编辑中的草图加载成设计索引 }
  - {id: rel.ed.derive-edit, from: state.desk.edit.derive, to: model.intent.edit, type: queries, description: 编辑会话的派生向草图编辑取：sketchText：草图交给加载流水线, purpose: 把草图转成文本交给加载流水线 }
  # ── 接入层：草图写回 ──
  - { id: rel.ed.sketch-types, from: access.writer.sketch, to: model.types, type: queries, description: 草图写回向类型与 Schema 取：写回草图时调用 designSketchPath / isSketchFile 定位与识别草图文件, purpose: 定位与识别草图文件 }
  - { id: rel.ed.commands-check, from: state.desk.edit.commands, to: model.intent.check, type: queries, description: 编辑操作向草图核验与生命周期取：编辑命令调用 checkSketches / archiveVerdict 核验草图、parseDesignSketches 解析设计的草图、sketchLifetime 判生命周期, purpose: 核验草图、解析设计草图 }
  - id: rel.ed.save-writer
    from: state.desk.edit.save
    to: access.writer.sketch
    type: commands
    via: 'channel:http'
    mode: async
    interface: if.writer.saveSketch
    purpose: 把设计的草图写进文件
    description: 草图写回同步交给草图写回：按设计保存（各张整份写回，带读取时的指纹、改名与删除）与新建设计，经开发服务器端点
  - {id: rel.ed.source-sketch, from: access.model-source, to: access.writer.sketch, type: commands, interface: if.writer.saveSketch, description: ModelSource 插件交给草图写回：挂载 POST /write/<项目>/sketch、/write/<项目>/designs/<设计>/sketches、/write/<项目>/designs, purpose: 把草图写回端点挂到开发服务器 }
  - { id: rel.ed.sketch-append, from: access.writer.sketch, to: access.writer.append, type: commands, description: 草图写回交给追加写入：写回草图调用 openDoc / save 打开与保存 YAML 文档，projectDir 定位项目目录, purpose: 打开与保存 YAML 文档、定位项目 }
  - {id: rel.ed.sketch-validate, from: access.writer.sketch, to: model.intent.validate, type: queries, interface: if.intent.validateSketch, description: 草图写回向草图校验取：写前在服务端逐张再校验一遍（与页面同一函数）, purpose: 写前在服务端再校验一遍 }
  - {id: rel.ed.sketch-load, from: access.writer.sketch, to: model.pipeline.loader, type: queries, description: 草图写回向 Loader 取：读持久草图作为校验上下文, purpose: 读持久草图作校验上下文 }
  - { id: rel.ed.sketch-reader, from: access.writer.sketch, to: access.reader, type: queries, description: 草图写回向描述读取取：写回草图前调用 isProjectId 校验项目、readModelDir 读描述、sketchHash 算指纹, purpose: 校验项目、读描述、算指纹 }
  - {id: rel.ed.sketch-store, from: access.writer.sketch, to: access.governance-store, type: commands, description: 草图写回交给治理存储：更新指纹（touchOwned）、记拦截记录一行, purpose: 写后更新指纹、记拦截记录 }
  - {id: rel.ed.sketch-intent, from: access.writer.sketch, to: model.intent, type: queries, description: 草图写回向意图取：sketchLifetime、sketchText, purpose: 取草图生命期与序列化文本 }
  # ── 草图格式 v2（ADR-0025）：设计级编辑、两个对比与多草图读写的依赖 ──
  - { id: rel.v2.seed-check, from: model.intent.edit.seed, to: model.intent.check, type: queries, description: 草图底稿与元信息向草图核验与生命周期取：生成底稿时调用 mountScope 取挂载点下基线的一层，按血缘（sketchLineage、prefixMap）推出下一层草图, purpose: 取基线一层并按血缘推出下一层 }
  - { id: rel.v2.design-check, from: model.intent.edit.design, to: model.intent.check, type: queries, description: 设计级编辑向草图核验与生命周期取：分配 ID 时调用 sketchLineage / lineageSources 排除被血缘带走的基线模块, purpose: 分配 ID 时排除被血缘带走的模块 }
  - { id: rel.v2.design-layout, from: model.intent.edit.design, to: model.intent.edit.layout, type: queries, description: 设计级编辑向位置与引用节点取：降级、升级写入下一层草图时调用 gridLayout 取网格里的空位, purpose: 在下一层草图的网格里找空位 }
  - { id: rel.v2.design-locate, from: model.intent.edit.design, to: model.intent.edit.locate, type: queries, description: 设计级编辑向草图寻址与 ID 生成取：编辑命令调用 locate / locateAll 寻址模块、shortName 取短名, purpose: 寻址模块、取短名 }
  - {id: rel.v2.design-seed, from: model.intent.edit.design, to: model.intent.edit.seed, type: queries, description: 设计级编辑向草图底稿与元信息取：降级 / 升级的目标草图不存在时推出（X18）, purpose: 目标草图还没有时先推出来 }
  - { id: rel.v2.seed-locate, from: model.intent.edit.seed, to: model.intent.edit.locate, type: queries, description: 草图底稿与元信息向草图寻址与 ID 生成取：合并结果的子模块 ID 调用 shortName 取来源短名, purpose: 给合并结果的子模块取来源短名 }
  - { id: rel.v2.layout-locate, from: model.intent.edit.layout, to: model.intent.edit.locate, type: queries, description: 位置与引用节点向草图寻址与 ID 生成取：草图布局调用 locateAll 取本草图的模块与引用节点, purpose: 取本草图的模块与引用节点 }
  - { id: rel.v2.diff-check, from: model.diff, to: model.intent.check, type: queries, description: 版本对比向草图核验与生命周期取：调用 lineageKind、mapId / unmapId 与 prefixMap 按血缘读改 ID、合并、拆分、移动, purpose: 按血缘读出改 ID、合并、拆分、移动 }
  - {id: rel.v2.lint-validate, from: access.lint, to: model.intent.validate, type: queries, description: 命令行校验向草图校验取：设计的各张草图逐张两级校验（X14）, purpose: 命令行里逐张校验设计的草图 }
  - {id: rel.v2.reader-loader, from: access.reader, to: model.pipeline.loader, type: queries, description: 描述读取向 Loader 取：读设计草图的挂载点与是否需要初始布局（load）, purpose: 读草图挂载点、判是否要初始布局 }
  - {id: rel.v4.commands-sketch-layout, from: state.desk.edit.commands, to: state.layout.sketch, type: queries, description: 编辑操作向草图布局取：sketchPositions：写位置时补齐当前显示的位置（X15）, purpose: 写位置时补齐当前显示的位置 }
  - {id: rel.v4.derive-sketch-layout, from: state.desk.edit.derive, to: state.layout.sketch, type: queries, description: 编辑会话的派生向草图布局取：sketchScene：当前张的节点、直线边、引用列与框线（层顺序与所属层取设计的索引）, purpose: 算出当前张的画布场景 }
  - {id: rel.v4.save-layout, from: state.desk.edit.save, to: model.intent.edit.layout, type: queries, description: 草图写回同步向位置与引用节点取：layoutForSave：保存前去掉引用节点的位置、丢掉没有关系的引用（X19、X22）, purpose: 保存前剔除引用节点的位置 }
  - {id: rel.v4.sketch-layout-model, from: state.layout.sketch, to: model.intent.edit.layout, type: queries, description: 草图布局向位置与引用节点取：gridLayout、referenceNodes、foldReference：按中心区可用区域的初始网格、引用节点与引用列的重心, purpose: 取初始网格与引用节点来布局 }
  - {id: rel.v4.sketch-layout-locate, from: state.layout.sketch, to: model.intent.edit.locate, type: queries, description: 草图布局向草图寻址与 ID 生成取：locateAll：本层模块, purpose: 取本层模块来布局 }
  - {id: rel.v4.versions-lineage, from: state.desk.versions, to: model.intent.check, type: queries, description: 版本与对比基线（desk.versions）向草图核验与生命周期取：parseDesignSketches、sketchLineage：设计版本的差异按血缘表述（X11）, purpose: 让设计版本的差异按血缘表述 }
  - {id: rel.v2.writer-entry, from: access.writer.sketch, to: model, type: queries, description: 草图写回向 loadModel 入口取：按设计写回时以当前版本为校验的引用范围（loadModel）, purpose: 以当前版本作校验的引用范围 }

interfaces:
  - id: if.intent.applyEdit
    name: applyEdit / applyDesignEdit
    owner: model.intent.edit
    signature: |
      applyDesignEdit(design: SketchSet, op: DesignEditOp, ctx: DesignEditContext): DesignEditResult   // 一个设计的全部草图（按挂载点）
      applyEdit(sketch: SketchDef, op: EditOp, ctx: EditContext): EditResult                           // 一张草图
      // DesignEditContext: { design: string; persistent: readonly SketchEntity[]; baseline?: ModelIndex | null }
      // EditContext: { persistent; designSketch: boolean; known?: (id) => boolean }   // known：范围外可引用的模块（X19）
      sketchText(def: SketchDef): string   // 顶层键 sketch 的 YAML，会话里的草图交给加载流水线
    semantics: |
      - 纯函数，不修改输入；生成的 ID 只取决于草图内容
      - 只拒绝不成立的操作（X7b），结构合法性交给 validateSketch
      - ID 变了一律前缀级联，设计里已有的下一层草图同一步改挂载点（X12）；from 一律指向基线 ID（X11）
  - id: if.intent.idImpact
    name: idImpact
    owner: model.intent.edit.move
    signature: |
      idImpact(sketch: SketchDef, ctx: EditContext, id: string, newParent: string, newId?: string, current?: ModelIndex | null): IdImpact
  - id: if.intent.seedFromBaseline
    name: seedFromBaseline / deriveChildSketch
    owner: model.intent.edit.seed
    signature: |
      seedFromBaseline(mount: string, baseline: ModelIndex, opts: { id: string; lifetime? }): SketchDef   // 挂载点一层的结构 + 本层关系；根挂载 supersedes skeleton
      deriveChildSketch(mount: string, baseline: ModelIndex, design: SketchSet, opts): SketchDef          // 基线子树 + 血缘指向的模块（前缀级联换 ID）
    semantics: X18：底稿一律从基线复制，不带职责、接口、原则；复制后相对基线为 0
  - id: if.intent.validateSketch
    name: validateSketch
    owner: model.intent.validate
    signature: |
      validateSketch(sketch: SketchDef, ctx: { persistent: readonly SketchEntity[]; file: string; index?: ModelIndex | null; design?: SketchSet }): SketchValidation
    semantics: 纯函数；两级（X14）——ok 为没有格式错误（能保存），ready 为也没有语义提示（能交给 AI 与定稿）；页面每次操作后、保存前、写入端点与 lint:model 调用同一函数
  - id: if.intent.sketchCheck
    name: sketchCheck
    owner: model.intent.check
    signature: |
      sketchCheck(sketch: SketchEntity, index: ModelIndex, opts?: { persistent?; accepted?; lineage?; baseline? }): SketchCheck
      checkSketches(index: ModelIndex, sketches: readonly SketchEntity[], accepted?: Map<string, AcceptedDeviation[]>, baselines?: Map<string, ModelIndex | null>): SketchCheck[]
      sketchContradictions(sketch: SketchEntity, persistent: readonly SketchEntity[]): SketchDeviation[]
      archiveVerdict(check: SketchCheck): ArchiveVerdict; sketchModules(sketch: SketchEntity, index: ModelIndex): string[]
      compareOwned(record: OwnedRecord | null, hashes: Record<string, string>): Issue[]
    semantics: 纯函数；页面、lint:model、sketch-check、归档与写入端点同一套结果（X4）；按挂载点取范围（X9），血缘与封闭按全设计
  - id: if.intent.compareDesign
    name: compareDesign
    owner: model.intent.check
    signature: |
      compareSketch(sketch: SketchEntity, target: ModelIndex, opts: { mode: 'baseline' | 'current'; lineage?; names? }): SketchComparison
      compareDesign(sketches: readonly SketchEntity[], target: ModelIndex, mode: CompareMode): { sketches: SketchComparison[]; counts: Record<ChangeKind, number>; pending: number }
      changeSummary(comparisons: readonly SketchComparison[]): string   // 按血缘措辞：「合并 A、B 为 N」「移动 X 到 Y 之下」
    semantics: |
      - X17：同一个函数换对象——相对基线比结构与写了的文字，相对当前版本只比结构
      - 「删除」只算范围内的主动删除；前缀级联与合并带走的来源被吸收（absorbed），不另列
  - id: if.writer.saveSketch
    name: saveDesignSketches / saveSketch / createDesign
    owner: access.writer.sketch
    signature: |
      saveDesignSketches(modelRoot, project, design: string, req: SaveDesignRequest, root): SaveDesignResult
      saveSketch(modelRoot, project, req: { target: SketchTarget; sketch: SketchDef; baseHash: string }, root): { file: string; hash: string }
      createDesign(modelRoot, project, req: { id; name; goal?; mount?; sketch?; sketches? }, root, opts?: { base?: (dir) => { commit; files } | null }): { file: string; files: string[] }
      // HTTP：POST /write/<项目>/designs/<设计>/sketches → 200 SaveDesignResult | 409（任一指纹不符）| 422 { error, issues }（格式错误）
      //       POST /write/<项目>/sketch | /write/<项目>/designs/<设计>/sketch → 200 { file, hash } | 409 | 422
      //       POST /write/<项目>/designs → 200 { file, files } | 409（设计已存在）
    semantics: |
      - 写前全部比对指纹、再逐张校验，任一不过即整次拒绝，文件不动（X7i、X14、X20）
      - 合并进 YAML 文档：未改动的节点（连同注释）原样保留；级联改名写到新文件名并删旧文件、删掉的草图删文件，只限 designs/<设计>/sketches/*（B7）
      - 写后更新 owned.json 的指纹（X6），ledger.jsonl 每个文件记一行（tool: sketch）
  - id: if.reader.sketchPrompt
    name: sketchPrompt
    owner: access.reader
    signature: |
      sketchPrompt(design: string, sketches: { path; text }[], docsRoot: string, changes?: string, lineage?: string): string
      intentPrompt(id: string, sketch: { path; text }, docsRoot: string, vsCurrent?: string): string
      baselineChanges(baselineFiles: RawFile[], sketches: SketchEntity[]): string   // 各张草图相对基线的变更摘要（按血缘）
      intentChanges(currentFiles: RawFile[], file: RawFile): string                  // 持久草图交给 AI 时的改动摘要：相对「去掉它贡献后的当前版本」（不是偏差）
    semantics: |
      - 「交给 AI」的指令（X20、F-52）：各张草图全文 + 相对基线的变更摘要（按血缘：合并 / 拆分 / 改 ID / 移动、待重连）+ 草图相对上一次提交的改动 + 04 §5「按草图扩展」一节
      - 持久草图：草图全文 + 交给 AI 时的改动摘要（对象是去掉这张草图贡献后的当前版本；不是偏差，偏差相对完整的当前版本，X17）
  - id: if.desk.edit
    name: 编辑操作（desk.edit）
    owner: state.desk.edit.commands
    signature: |
      enter(): boolean; exit(force?: boolean): 'confirm' | 'done'               // 打开草图版本即进入（X7a）
      run(ops: DesignEditOp | DesignEditOp[]): EditOutcome; edit(op: EditOp): EditOutcome   // EditOutcome = { ok: true; effects } | { ok: false; reason }
      addModule(name, short, at?, layer?); connect(from, to, type, description?)
      merge(ids, name, short); split(id, parts); demote(id, onto); promote(id); moveIn(id, layer, at?); rename(id, newId)
      updateModule(id, patch); moveNode(positions); relabel(id, label); autoArrange(); addReference(id); setAbstraction(text); hideReferences / toggleReferences()（X22，只在会话里）
      remove(ids); previewRemove(ids): { removed; sketches } | { rejected }
      openChild(id); openMount(mount); undo(): boolean; redo(): boolean
      save(): Promise<SaveOutcome>; saveAndHandToAi(): Promise<{ ok: true; prompt } | { ok: false; reason }>
      discard(): Promise<void>; replayOnReload(): Promise<{ failed: DesignEditOp[] }>
      createDesign(input: { id; name; goal?; mount }): Promise<WriteOutcome>; canLeave(): 'free' | 'confirm'
      // 只读：editable、target、session、active、stale、sketch、mount、scene、validations、validation、designErrors、designWarnings、overSeven、pending、
      //       vsBaseline、vsCurrent、comparison、compareMode、twoBases、baselineFallback、dirty、dirtySketches、canUndo、canRedo、breadcrumb、sheets、parent、notice、saving、serverIssues
    semantics: |
      操作本身不含规则：编辑规则在 model.intent.edit，会话规则在 state.transition.edit，撤销栈在 state.desk.edit.session；单张操作包装成 { op: 'edit', sketch: <当前张> }。
  - id: if.desk.editSession
    name: 编辑会话函数
    owner: state.desk.edit.session
    signature: |
      begin(target: SketchTarget, id: string, read: Record<mount, ReadSketch>, mount?): EditSession
      apply(s, ops: DesignEditOp | DesignEditOp[], ctx: DesignEditContext): { ok: true; session; effects } | { ok: false; code; reason }
      undo(s) / redo(s): { session; effects } | null
      open(s, mount, ctx): { ok: true; session } | { ok: false; reason }        // 会话里没有的按 X18 推出，不进撤销栈
      isDirty(s, baseline?): boolean; sketchDirty(s, mount, baseline?): boolean; removedMounts(s): string[]
      saved(s, written, removed): EditSession; reloaded(s, read): EditSession; discard(s, read?): EditSession
      replay(s, read, ctx): { session: EditSession; failed: DesignEditOp[] }
    semantics: 纯函数；设计级一条撤销栈，深度上限 200，超出丢最早的（X7g）。
  - id: if.state.editMode
    name: 编辑规则
    owner: state.transition.edit
    signature: |
      // 经 transition(state, action, ctx) 分派：{ type: 'enterEdit'; target; level } | { type: 'exitEdit' } | { type: 'openSketch'; level }
      //   | { type: 'edited'; effects; previousPath; level }
      leaveGuard(dirty: boolean): 'free' | 'confirm'
      isEditing(state: ViewState): boolean; blocked(state, action): boolean
    semantics: 纯函数（X7a、X7h）；草图画布下 openScenario、模型画布的层次导航、选中文件、打开代码事实与演化叠加为无效动作，返回原状态。

dataStructures:
  - id: ds.SketchDef
    name: SketchDef
    definition: |
      interface SketchDef {
        id: string                     // 持久草图有固定 ID（骨架为 skeleton）；设计的草图即设计 ID
        mount: string                  // X9：模块 ID 或 'root'；不能是层
        lifetime?: 'persistent' | 'until-implemented'
        closed?: string[]
        supersedes?: string            // 晋升时替换的持久草图（同挂载点已有时必须声明，X4）
        abstraction?: string           // X10：挂载点模块对内的原则（根挂载不用）
        modules?: ModuleDef[]          // 挂载点的直接子节点（根挂载为层与层的 children）；可带 from: string[]（血缘，指向基线 ID，X11）
        relations?: RelationDef[]      // 显式写在本层（两端在本层，或一端为外部模块——引用节点，X19）
        interfaces?: InterfaceDef[]; dataStructures?: DataStructureDef[]
        layout?: { modules?: Record<id, { x; y }>; relations?: Record<id, { label?: { x; y } }> }   // X15；只记本层模块，非根草图相对中心区的内容原点、引用不记（X22）；根草图带内 y 相对带顶（X21）
      }
    description: 草图定义（格式 v2，04 §3.10，已在 src/model/types.ts）；会话里的每张草图就是这样一个值。
  - id: ds.EditOp
    name: EditOp
    definition: |
      type EditOp =
        | { op: 'addLayer'; name; id?; at } | { op: 'reorderLayer'; id; to } | { op: 'setMayDependOn'; id; layers }   // 只在根草图
        | { op: 'addModule'; parent; name; id?; kind? } | { op: 'updateModule'; id; patch: ModulePatch } | { op: 'setClosed'; id; closed }
        | { op: 'moveModule'; id; parent; newId? } | { op: 'renameModule'; id; newId } | { op: 'removeModule'; id }
        | { op: 'connect'; from; to; type; description?; interface? } | { op: 'updateRelation'; id; patch } | { op: 'removeRelation'; id }
        | { op: 'addInterface'; owner; name; signature? } | { op: 'updateInterface'; id; patch } | { op: 'removeInterface'; id }
        | { op: 'setMeta'; patch: { lifetime?; supersedes? } } | { op: 'setAbstraction'; text }
        | { op: 'moveNode'; positions: Record<id, SketchPoint> } | { op: 'relabel'; id; label: SketchPoint | null } | { op: 'autoArrange'; area?: { w; h? } }
        | { op: 'addReference'; id } | { op: 'removeReference'; id }
    description: 一张草图上的编辑操作；设计级操作的 edit 一类包装它。可序列化，文件已变后可重放。
  - id: ds.DesignEditOp
    name: DesignEditOp
    definition: |
      type DesignEditOp =
        | { op: 'edit'; sketch: string; edit: EditOp }                                  // 单张草图上的操作（sketch = 挂载点）
        | { op: 'merge'; sketch; ids: string[]; name; id; kind? }                        // X7j：来源降为新模块的子模块
        | { op: 'split'; sketch; id; parts: { name; id }[] }                             // X7k：原模块删除，关系待重连
        | { op: 'demote'; sketch; id; target } | { op: 'promote'; sketch; id }            // X7d：降级 / 升级
        | { op: 'moveIn'; id; layer }                                                    // X7d：根草图里换层
        | { op: 'rename'; sketch; id; newId } | { op: 'remove'; sketch; id }             // X12 前缀级联；X7e 连同下一层草图
      // ID 可给完整 ID 或短名（短名时补挂载点前缀，X7c）
    description: 设计级的编辑操作 = 一次用户意图 = 设计级撤销的一步（X7b、X7g）；一个操作可以改多张草图。
  - id: ds.EditResult
    name: EditResult
    definition: |
      type DesignEditResult = { ok: true; design: SketchSet; effects: DesignEditEffects } | { ok: false; code: EditRejectCode; reason: string }
      type EditResult = { ok: true; sketch: SketchDef; effects: EditEffects } | { ok: false; code: EditRejectCode; reason: string }
      // EditRejectCode: not-found | id-taken | id-prefix | id-format | duplicate-relation | ancestor | persistent | invalid | root-only | too-few
      interface EditEffects { created: string[]; renamed: [from, to][]; removed: string[] }
      interface DesignEditEffects extends EditEffects {
        sketches: string[]                    // 改动过的草图（操作后的挂载点）：设计级撤销的一步记它们
        renamedSketches: [from, to][]         // 挂载点改了的草图（写回时改文件名）
        removedSketches: string[]; createdSketches: string[]
      }
    description: 编辑的结果；effects 供选中跟随（state.transition.edit.follow）、撤销切张与二次确认的提示。
  - id: ds.IdImpact
    name: IdImpact
    definition: |
      interface IdImpact {
        renamed: [from: string, to: string][]        // 草图内改写的模块 ID（自身与后代）
        references: number                           // 草图内改写的引用条数（关系两端、接口 owner、closed、mayDependOn）
        outside: { modules: number; relations: number; interfaces: number; messages: number }   // 当前版本里仍引用旧 ID 的（AI 生成）
        rejected?: string                            // 不能移动的原因（如设计草图移动持久草图的模块）
      }
    description: 改 ID 前的影响预览。
  - id: ds.EditSession
    name: EditSession
    definition: |
      interface EditSession {
        target: SketchTarget                    // { kind: 'design'; design } | { kind: 'persistent'; id }
        id: string                              // 草图 ID：设计 ID 或持久草图 ID
        read: Record<mount, { file: string; hash: string; def: SketchDef }>   // 读自文件的各张与读取时的指纹
        doc: {
          sketches: SketchSet                   // 设计的全部草图（文件里的与会话里推出的），按挂载点
          origin: Record<mount, mount>          // 当前挂载点 → 读取时的挂载点（级联改名后跟着换键）
          born: Record<mount, SketchDef>        // 会话里出现的草图出现时的样子：未改动的不算脏、不写文件（X20）
        }
        mount: string                           // 当前张
        past: Step[]; future: Step[]            // Step: { ops: DesignEditOp[]; before; after: doc; effects; mountBefore; mountAfter }，深度上限 200
        stale: boolean                          // 文件已在外部改动（重新加载时指纹不同，或保存被拒绝）
      }
      // 脏 = 任一张与读取时不同（推出且未改动的不算），推出，不存
    description: 按设计的编辑会话（X7g、X20）：一个值，由 DeskState 的编辑分组持有。
  - id: ds.SketchValidation
    name: SketchValidation
    definition: |
      interface SketchValidation {
        ok: boolean                             // 没有 error：能保存
        ready: boolean                          // 也没有 warning：能交给 AI 与定稿
        errors / warnings / hints: SketchValidationIssue[]; issues: SketchValidationIssue[]
        pending: string[]                       // X16：待重连的关系
      }
      interface SketchValidationIssue {
        severity: 'error' | 'warning' | 'hint'
        code: 'sketch.schema' | 'sketch.id' | 'sketch.id-dup' | 'sketch.id-prefix' | 'sketch.mount' | 'sketch.file' | 'sketch.nested' | 'sketch.parent'
            | 'sketch.scope' | 'sketch.name' | 'sketch.ref' | 'sketch.ancestor'            // error
            | 'sketch.layer-cycle' | 'sketch.contradiction' | 'sketch.pending'   // warning
            | 'sketch.over-seven' | 'sketch.empty'                                       // hint
        message: string; target: { module?; relation?; interface? }; path?: string
      }
    description: 草图本身的两级校验结果（X14）；与核验的偏差（SketchCheck）、对比（SketchComparison）是两回事。
  - id: ds.SaveDesignRequest
    name: SaveDesignRequest
    definition: |
      interface SaveDesignRequest {
        sketches: { mount: string; sketch: SketchDef; baseHash: string | null; renamedFrom?: string }[]   // baseHash null = 新文件
        removed?: { mount: string; baseHash: string }[]                                                    // B7：删掉的草图
      }
      interface SaveDesignResult { files: { mount; file; hash }[]; removed: string[]; dropped: { mount; ids: string[] }[] }
    description: 按设计写回的请求正文（JSON，X20）与结果；dropped 为保存时丢掉的没有关系的引用节点（X19）。
  - id: ds.SketchComparison
    name: SketchComparison
    definition: |
      interface SketchComparison {
        sketch: string; mount: string; design?: string; mode: 'baseline' | 'current'
        changes: { kind: ChangeKind; entity: 'module' | 'relation' | 'interface'; id; name; from?: string[]; to?: string[]; fields?: string[]; message: string }[]
        counts: Record<ChangeKind, number>      // ChangeKind: added | changed | merged | split | renamed | moved | removed
        absorbed: string[]                      // 被血缘吸收、不另列的模块
        pending: string[]                       // 待重连的关系
      }
    description: 一张草图相对对象版本（基线或当前版本）的变更，按挂载点取范围、按血缘表述（X17）；信息条与面板的计数为六类（改 ID 并入修改）。
  - id: ds.SketchCheck
    name: SketchCheck
    definition: |
      interface SketchCheck {
        sketch: string; design?: string; mount?: string; lifetime: 'persistent' | 'until-implemented'; supersedes?: string
        deviations: SketchDeviation[]        // 稳定键 <种类>:<实体 ID>，已认可的降为 info
        counts: { error: number; warning: number; info: number }
        consistent: boolean                  // 没有 error 与未认可的 warning：可以归档
      }
    description: 一张草图对一个版本的核验结果（X4，已在 src/model/intent/types.ts）；进返工清单「草图偏差」，归档门槛。
