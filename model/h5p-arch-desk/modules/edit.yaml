# 草图的编辑与校验（ADR-0024）：意图下的子模块、编辑规则、草图写回、画布与面板的编辑态。
# 规则编号（X7、X7a–X7i、B6、E8）见 docs/02-domain.md §2.21；机制见 docs/architecture/governance.md §4.4、view-state.md §7、workbench.md §12。

modules:
  - id: model.intent.check
    name: 草图核验与生命周期
    parent: model.intent
    kind: component
    responsibility: |
      意图计算（格式 v2，ADR-0025）：同挂载点矛盾 sketchContradictions（供草图校验共用，X4、X10）；两个对比共用的 compareSketch / compareDesign——按挂载点取对象版本的同一范围（mountScope，X9），
      按血缘（from 指向基线、前缀映射，X11、X12）把差别读作新增 / 修改 / 合并 / 拆分 / 改 ID / 移动 / 删除，相对基线比结构与写了的文字、相对当前版本只比结构（X17），changeSummary 按血缘措辞；
      相对当前版本的偏差 sketchCheck / checkSketches（缺模块、结构字段、封闭子树多出、血缘未落实、关系与接口的对应，应用认可偏差，X2、X4）；
      归档判定 archiveVerdict 与草图覆盖的模块 sketchModules（X3，交给确认层写确认记录）；人拥有文件的指纹比对 compareOwned（X6）。输入是草图定义与模型索引，不碰文件系统。
    codeRefs: [src/model/intent/check.ts, src/model/intent/lifecycle.ts, src/model/intent/owned.ts, src/model/intent/lineage.ts, src/model/intent/scope.ts]
  - id: model.intent.edit
    name: 草图编辑
    parent: model.intent
    kind: component
    responsibility: |
      对草图定义的纯函数编辑：输入一份草图（ds.SketchDef）、一个编辑操作（ds.EditOp）与上下文（持久草图、当前版本索引），输出新草图与这次编辑的影响（新建、改名、删除了哪些 ID），或拒绝原因。
      操作族：层（加、删、排序、可依赖的层）、模块（加、删、改字段、核心与封闭）、移动与改 ID（ID 前缀级联到后代、关系两端、接口 owner、closed 与 mayDependOn 中的引用）、关系与接口（连、改、删；接口 owner 固定为所在模块）、草图元信息（lifetime、supersedes）、新建草图的底稿。
      不碰文件、YAML 文本与界面；不判断草图整体是否合法（那是校验的事）。
    principle: |
      - **只拒绝不成立的操作**：目标不存在、新 ID 已被占用、显式给的 ID 不以父 ID 为前缀（X5）、同一对模块同类型的关系已存在（C-8）、连祖先与后代（M6）——这些操作做了也没有意义，直接拒绝并给原因；
        其余结构问题（层依赖成环、与持久草图矛盾、封闭子树多了子模块）照常应用，交给校验即时报出，允许架构师经过中间不合法的状态（如先加后连）。
      - **保持作者的写法**：草图里的模块可以嵌套在 children 里，也可以平铺并写 parent；新模块跟随父模块的写法（父模块在本草图里就嵌进它的 children，否则平铺并写 parent），移动时按新父模块的写法重新安放，其余条目的顺序与形状不动，写回时未改动的节点才能保住注释。
      - **值进值出**：不修改输入，在副本上按操作族修改（structuredClone）；草图只有几十个实体，撤销栈存快照的代价可以忽略。
    codeRefs: [src/model/intent/edit/index.ts, src/model/intent/edit/apply.ts, src/model/intent/edit/shared.ts]
  - id: model.intent.edit.locate
    name: 草图寻址与 ID 生成
    parent: model.intent.edit
    responsibility: 在嵌套或平铺写法的草图里按 ID 找到模块并给出它在草图里的位置（所在列表与下标、是嵌套还是平铺）；平铺展开带父 ID 与位置；新 ID 的生成——模块 ID 为父 ID 加名称转成的 kebab-case 短名（中文名无可转写时为 m1、m2…，可改，C-4），关系 ID 为 rel.<from 短名>-<to 短名>，已被占用（同一对模块已有别的类型的关系，L5 允许）时加类型后缀 rel.<from 短名>-<to 短名>-<type>，仍冲突时再加序号（X7c，C-8），接口 ID 为 if.<owner 短路径>.<名称>（04 §3.3）。
    codeRefs: [src/model/intent/edit/locate.ts]
  - id: model.intent.edit.layers
    name: 层操作
    parent: model.intent.edit
    responsibility: 加层（C-1：按插入位置给 order，其后的层顺延；只在草图根下或持久草图的根下）、层排序（C-2：重排 order，保持连续）、删层（C-3：连子树一起删，级联同删除模块）、改可依赖的层（C-9：mayDependOn 集合，元素必须是层）；层的抽象原则、包含 / 不包含经模块的改字段。
    codeRefs: [src/model/intent/edit/layers.ts]
  - id: model.intent.edit.modules
    name: 模块操作
    parent: model.intent.edit
    responsibility: 新建模块（C-4：在层或父模块下，名称必填，ID 缺省由名称生成）、改字段（名称、职责、kind、代码落点、抽象原则、包含 / 不包含，P-1、P-2）、标核心与封闭（C-7：core 字段；closed 列表增删该 ID）、删除模块（C-6：删子树，级联删除两端落在子树内的关系、owner 落在子树内的接口，并从 closed、mayDependOn 中去掉）；影响里列出级联删掉的实体，供二次确认的提示。
    codeRefs: [src/model/intent/edit/modules.ts]
  - id: model.intent.edit.move
    name: 移动与改 ID
    parent: model.intent.edit
    responsibility: 移动模块（C-5、P-2 所属父）与改 ID：新 ID 缺省为新父 ID 加原短名；级联改写后代的 ID、关系两端、接口 owner、closed 与 mayDependOn 中的引用（关系与接口自身的 ID 不改，保持引用稳定）；移动的影响预览 idImpact——草图内要改写的 ID 与引用条数，以及当前版本里还引用旧 ID 的实体条数（AI 生成的子模块、关系、场景消息），供「移动会改 ID」的二次确认（X5：移动只经草图）。
    principle: |
      - 移动 = 改父 + 改 ID，一个操作完成，撤销一步即全部回到原样。
      - 不跨到持久草图：设计草图不能移动持久草图里的模块（那是改骨架，要 supersedes），拒绝并说明。
      - 当前版本里的旧 ID 不由这里改：那些是 AI 生成的文件，保存后经「交给 AI」由 AI 按新草图重新生成；预览里给出条数让架构师知道代价。
    codeRefs: [src/model/intent/edit/move.ts]
  - id: model.intent.edit.relations
    name: 关系与接口操作
    parent: model.intent.edit
    responsibility: 连关系（C-8：两端、类型、说明、经由接口；同一对同类型已存在时拒绝）、改关系（C-10、P-3：类型、说明、经由接口）、删关系；加接口（P-4：名称、签名，owner 固定为所在模块，ID 自动生成）、改接口、删接口（同时去掉关系上对它的引用）。
    codeRefs: [src/model/intent/edit/relations.ts]
  - id: model.intent.edit.seed
    name: 草图底稿与元信息
    parent: model.intent.edit
    responsibility: 底稿从基线复制（X18）seedFromBaseline：挂载点一层的 ID、名称、kind、core、closed 与显式写在本层的关系，不复制职责、接口、原则，根挂载 supersedes 骨架；下一层草图不存在时由「基线子树 + 血缘」推出 deriveChildSketch；改草图元信息（P-5：lifetime、supersedes）。
    codeRefs: [src/model/intent/edit/seed.ts]
  - id: model.intent.edit.design
    name: 设计级编辑
    parent: model.intent.edit
    responsibility: applyDesignEdit——输入输出为一个设计的全部草图（X7b）：合并（X7j）、拆分（X7k）、降级 / 升级 / 移入（X7d）、改 ID、删除（连同挂在它与后代上的草图，X7e），一律前缀级联（X12：子草图改挂载点与模块 ID、被改写的记 from），from 沿血缘求闭包（X11）；单张草图上的操作转给 applyEdit；影响里列出涉及的草图、改挂载点的草图与删掉的草图（设计级撤销的一步与写回层的改名据此）。
    codeRefs: [src/model/intent/edit/design.ts]
  - id: model.intent.edit.layout
    name: 位置与引用节点
    parent: model.intent.edit
    responsibility: 布局节的编辑（X15）：拖动节点、拖动关系标签、重新排列（网格 gridLayout）；引用节点（X19）由关系派生、只在布局里记位置，addReference 放上画布，保存前 dropOrphanReferences 丢掉没有关系的；挂载点的原则 setAbstraction（X10）。
    codeRefs: [src/model/intent/edit/layout.ts]
  - id: model.intent.validate
    name: 草图校验
    parent: model.intent
    kind: component
    responsibility: |
      草图的两级校验（X14，ADR-0025）：格式错误拦保存、语义提示（层 / 本层依赖成环、同挂载点矛盾、待重连）拦交给 AI 与定稿、超七与没写职责只提示；
      以下为二期写法，格式 v2 另加挂载点约束（X9：模块是挂载点的直接子节点、挂载点不能是层、文件名与 mount 一致、关系只写本层）。编辑态每次操作后与保存前（页面与写入端点）共用同一函数：
      格式（按 JSON Schema 检查草图的形状，未知字段即错）；ID 规则（格式、在本草图与持久草图中唯一、子模块 ID 以父 ID 为前缀，X5）；引用完整（parent、关系两端、接口 owner、关系的经由接口、closed 与 mayDependOn 的元素都要在本草图或持久草图中找到；草图之间不引用 AI 生成的实体）；
      关系不连祖先与后代（M6）；层依赖无环；与持久草图的矛盾（复用 model.intent.check 的矛盾检查，只有一份）。
      输出按实体定位的问题列表（error 拒绝保存，warning 只提示），不改草图。
    principle: |
      - **只看草图本身**：不对照任何版本（那是核验 sketchCheck 的事），所以设计草图编辑中「实现后将有 N 处偏差」另由核验算。
      - **引用的范围**：本草图 ∪ 持久草图。设计草图可以引用骨架里的层与第二级模块，不能引用只在当前版本里出现的 AI 模块——草图是尺子，尺子不能依赖被量的东西。
    codeRefs: [src/model/intent/validate.ts]
  - id: state.transition.edit
    name: 编辑规则
    parent: state.transition
    kind: component
    responsibility: |
      草图画布的会话规则（纯函数，X7a、X7h）：进入草图即进入编辑画布（只在草图版本上；层次换成当前张的挂载点）与退出；草图画布与运行视角、文件选中、代码事实互斥（进入时退出场景、清掉文件选中，其下打开场景、选中文件 / 依赖线 / 耦合线、开代码事实与演化叠加为无效动作）；
      层次只由当前张决定：模型画布的下钻、返回上级、跳转、按 URL 恢复为无效动作，下钻与面包屑返回经 openSketch 切换且不进浏览器历史；Esc 只取消选中；有未保存改动时离开要确认；编辑后层次与选中怎么跟随。
    codeRefs: [src/state/transition/edit.ts]
  - id: state.transition.edit.mode
    name: 进入、退出与互斥
    parent: state.transition.edit
    responsibility: enterEdit（版本不是草图版本时无效；进入时关闭场景、清掉文件选中，层次为当前张的挂载点，保留仍在的模块与关系选中）、exitEdit、openSketch（切到另一张草图：层次换成它的挂载点、清空选中）；blocked 列出草图画布下无效的动作；leaveGuard(是否脏) → 放行 / 需要确认；编辑目标不进 URL。
  - id: state.transition.edit.follow
    name: 改名与删除的跟随
    parent: state.transition.edit
    responsibility: edited 动作（携带编辑的影响与编辑后当前张的层次）：选中的被改名（含前缀级联）→ 换成新 ID；被删除 → 清空；新建、合并、拆分 → 选中结果；层次为编辑后的当前张（不在索引里时退到旧路径上最近仍存在的祖先）；撤销 / 重做同样跟随。不进浏览器历史。
  - id: state.desk.edit
    name: 编辑中的草图
    parent: state.desk
    kind: component
    responsibility: |
      DeskState 的编辑分组（desk.edit，X7、X20）：持有按设计的编辑会话（ds.EditSession，一个值：设计的全部草图、当前张、设计级撤销 / 重做栈、各张读取时的指纹），由纯函数改变；画布多选与对比口径（相对基线 / 相对当前版本）也在这里；
      对外提供草图画布的操作（每个手势一个，经 model.intent.edit 的 applyDesignEdit 应用）、下钻与面包屑、撤销 / 重做、保存（整个设计）、保存并交给 AI、退出、新建设计；
      打开草图版本即进入：各张草图连同 system.yaml、持久草图与引用的外部模块加载成设计的索引，作为 DeskState 的 index；并派生当前张的画布数据、两级校验、两个对比的计数、超七提示、待重连、脏与面包屑。
    principle: |
      - **一个值**：各张草图、撤销栈、读取时的指纹互相约束（撤销回到读取时即不脏），合成一个 EditSession；「脏」由文档与读取时的草图推出，不另存（原则 6）。
      - **按设计**（X20）：撤销、脏、保存、交给 AI 都以设计为单位；会话里推出的草图未改动不算脏、不写文件。
      - **只对草图版本开启**（X7）：设计的草图（/d/<设计>/sketch）与持久草图（/i/<ID>，只有这一张）；当前版本、设计轮次、提交版本上没有会话。
    codeRefs: [src/state/desk/edit.ts]
  - id: state.desk.edit.session
    name: 编辑会话
    parent: state.desk.edit
    responsibility: 编辑会话的值与纯函数：begin（以读到的各张草图与指纹开始，当前张为根挂载或第一张）、apply（一步 = 一个或几个设计级操作，原子；成功压撤销栈、清空重做栈，记前后的当前张；当前张被改名或删除时跟着走）、undo / redo（撤销的一步在别的草图上时切过去）、open（下钻 / 面包屑：会话里没有的草图按 X18 推出，不进撤销栈）、sketchDirty / isDirty（读自文件的与读取时比；推出的与此刻推出的结果比结构、与出现时比位置）、saved、reloaded、replay、discard；撤销栈深度上限 200；持久草图不能下钻、不能改动下一层草图。
    principle: |
      - 撤销栈存「编辑前后的会话文档 + 操作 + 前后的当前张」：快照让撤销与重做是值替换（降级 / 升级一步回滚两张）；操作让 stale 之后能重放到新文件上。
      - **撤销粒度（X7g）**：一个手势一步（双击空白新建 = 新建 + 落位）；拖位置、拖标签、重新排列各一步；文本字段失焦或回车提交一次即一步。
      - **重放失败的兜底**：replay 列出失败的操作，会话仍为 stale；可「放弃本次改动」以新读到的草图重新开始。
    codeRefs: [src/state/desk/edit/session.ts]
  - id: state.desk.edit.derive
    name: 编辑态派生
    parent: state.desk.edit
    responsibility: 由编辑会话派生（computed）：设计的索引（各张草图序列化后与 system.yaml、持久草图、引用的外部模块一起加载，草图画布下作为 DeskState 的 index）；当前张的画布数据（草图布局 sketchScene，图上标出变更时带角标）；各张的两级校验 validateSketch 与全设计的格式错误 / 语义提示、超七提示、待重连；两个对比 compareDesign（相对基线、相对当前版本）的全设计计数与本张清单；是否脏、改过的草图、能否撤销 / 重做；面包屑；编辑的上下文（持久草图与设计的基线）。
    principle: 草图只有几十个实体，每次操作重算一遍的代价可以忽略；位置与校验都调同一组模型层函数，与写入端点、命令行一致。
    codeRefs: [src/state/desk/edit/derive.ts]
  - id: state.desk.edit.commands
    name: 编辑操作
    parent: state.desk.edit
    responsibility: 对呈现层的唯一一组编辑操作（if.desk.edit）：enter / exit、edit(单张操作，包装成设计级操作)、addModule（新建 + 落位一步）、connect、merge、split、demote、promote、moveIn、rename、updateModule、moveNode（写位置时补齐还没写进 layout 的节点）、relabel、autoArrange、addReference、setAbstraction、remove（模块级联 / 关系 / 引用节点）与 previewRemove、openChild（下钻）、goUp（面包屑）、undo / redo、save、saveAndHandToAi、discard、replayOnReload、createDesign（按挂载点从基线复制底稿并初始布局）、canLeave、onReloaded。每次成功后经 dispatch 交给编辑规则跟随。操作本身不含规则。
    codeRefs: [src/state/desk/edit/commands.ts]
  - id: state.desk.edit.save
    name: 草图写回同步
    parent: state.desk.edit
    responsibility: 同步适配器：保存整个设计（X20）——saveRequest 列出要写的草图（读自文件且改过的带读取时的指纹，级联改名的带 renamedFrom，会话里推出且改过的为新文件，删掉的列入 removed），写前丢掉没有关系的引用节点并给出清单（X19）；经注入的 ModelWriter POST 给按设计写回的端点（持久草图走单张写回）；成功则会话 saved（新指纹），指纹不符则 stale，校验不过则把服务端的问题交给面板。新建设计时 POST 设计 ID、名称、目标与底稿。
    codeRefs: [src/state/desk/edit/save.ts]
  - id: access.writer.append
    name: 追加写入
    parent: access.writer
    kind: component
    responsibility: |
      一期已有的写入（草图修订后归这里）：人拥有文件的追加写入——评审意见（B2）、例外（B3）、忽略项（B4）、确认记录（Z1、Z6，同一模块更新那一条）、认可偏差（X4）——与归档 / 晋升（X3）；
      YAML 文档模型的打开（openDoc：解析失败拒绝写）与保存（save：写回并更新指纹，X6）这两个件供草图写回共用。只追加、不删改。
    codeRefs: [vite/writeModel.ts]
  - id: access.writer.sketch
    name: 草图写回
    parent: access.writer
    kind: component
    responsibility: |
      人拥有的草图的整份写回（B6）与新建设计：
      saveSketch——目标为持久草图 intent/<ID>.yaml 或设计的草图 designs/<设计>/sketch.yaml；先比对文件当前指纹与读取时的指纹（X6 同一算法），不同即拒绝（409，「文件已变，重新加载后再改」，S-3）；再从磁盘读持久草图、用 validateSketch 校验，有 error 即拒绝（422，附问题列表，S-2）；
      然后用 YAML 文档模型把新草图合并进原文档：映射逐键、带 id 的列表按 id 对齐、标量只在值变了才替换，没变的节点原样保留（连同注释）；写回后更新 owned.json 的指纹并在 ledger.jsonl 记一行（来源 page、种类 sketch）。
      createDesign——设计 ID 合法且目录不存在；写 design.yaml（名称、目标、status: draft、base.commit 取当前版本 system.source.commit）与 sketch.yaml（底稿），两者都登记指纹。
      端点由 ModelSource 插件挂载：POST /write/<项目>/sketch（持久草图，正文带草图 ID）、/write/<项目>/designs/<设计>/sketch、/write/<项目>/designs（新建），只收同源 JSON（B5）。
    principle: |
      - **注释的限度**（负责人裁决接受）：注释挂在节点上，节点没变注释就在；改过的标量保留其行尾注释，删掉的条目注释随之消失，新条目没有注释。写进 04 §3.10。
      - **服务端再校验一遍**：页面的即时校验只是提示，写入端点是最后一道；两边调用同一个 validateSketch，结果一致。
      - **只写草图**：路径只由项目、草图 ID、设计 ID 拼出（isProjectId），不接受任意路径；AI 生成的文件一律不写。
    codeRefs: [vite/writeSketch.ts]
  - id: present.canvas.sketch
    name: 草图画布
    parent: present.canvas
    kind: component
    responsibility: |
      草图版本打开即进入的编辑画布（ADR-0025，SK-15、SK-16）：Vue Flow 自由模式，不走 elk、不走分层投影——节点（本层模块、根草图里的层、灰色虚线的只读引用节点）与两端之间的直线边来自草图布局，位置来自草图的 layout；
      拖节点（多选一起拖）松手 = moveNode 一步，拖到同层节点上 = 降级（根草图里拖到层上 = 移入），拖到面包屑父级 = 升级；框选 / ⇧ 多选；右键合并为新模块（≥2）、拆分、进入下一层、删除（有级联时二次确认）；双击空白或「＋ 模块」就地输入名称与 ID 短名（英文自动、中文必填）；
      从节点右侧连线柄拖到另一节点松手选类型 + 一句说明；选中的边可拖标签；双击模块下钻；工具条（＋ 模块、引用外部模块、重新排列、本层数与超七提示）；⌘Z / ⇧⌘Z、Delete / Backspace、⌘S、Esc；图上标出变更时的角标与图例；
      画布顶部的临时面包屑（返回与升级落点）、草图下的导航树（只列本张的模块与引用）、最小的草图面板（两级校验、选中模块的名称 / ID / 职责）。
    principle: |
      - **每个手势只发编辑分组的一个操作**：撤销一步恰好撤回用户的一个动作；画布不自己算规则与布局，被拒绝时就地提示原因。
      - 目标位置是呈现层下的第二级模块 present.sketch（设计 sketch-v2 的根草图），骨架晋升前暂挂在画布之下。
    codeRefs: [src/components/sketch/**]
  - id: present.version.edit
    name: 编辑信息条
    parent: present.version
    kind: component
    responsibility: |
      草图版本的信息条上出现「编辑」；编辑态下信息条变为「编辑草图：<名>」、未保存标记 ●、「保存」「放弃」「校验」、撤销 / 重做（E-2）；「放弃」有未保存改动时二次确认（E-3）；保存成功后停留在编辑态，保存失败显示原因（文件已变时给「重新加载并重放改动」；重放有失败时列出失败的操作，并给「放弃本次改动」）。
      当前版本上「编辑骨架」打开持久草图 /i/skeleton 并进入编辑态（E-1）；版本切换旁的「新建设计」对话框：ID、名称、目标一句话、底稿（缺省「空草图」；另一选项「改骨架（定稿后晋升替换骨架）」，选中时说明后果：复制骨架的层与第二级并声明 supersedes，定稿实现后整份替换 intent/skeleton.yaml，而不是归档，S-4、L-3），创建后进入新设计的草图编辑。
    codeRefs: [src/components/edit/EditBar.vue, src/components/edit/NewDesignDialog.vue, src/components/edit/designHere.ts, src/components/edit/EditDialog.vue, src/components/edit/useEditDialog.ts, src/components/edit/leave.ts]

