  - id: present.sketch.tree
    name: 草图模块树
    summary: 列出本张草图的模块，与画布同步选中与下钻
    parent: present.sketch
    kind: component
    responsibility: 草图画布下侧栏的「模块」页：只列本张草图的模块（根草图里层下列第二级）与引用节点，单击选中与画布同步、⇧ 单击多选、双击下钻；不另列路径（面包屑只在信息条身份区，#15）。
    codeRefs: [src/components/sketch/SketchTree.vue]
  - id: present.panel.sketch
    name: 草图面板
    summary: 显示草图的校验与核验数，编辑选中的属性
    adrs: [25]
    parent: present.panel
    kind: component
    responsibility: |
      草图画布下视图区「描述」标签里的草图面板（SK-17、SK-18）：顶部两级校验（红色格式错误、黄色语义提示，单击定位，跨草图也能定位）、常驻「待重连 N 条」、不进两级的提示、本张的两个核验数（相对当前版本 N 处偏差 / 相对基线改了 N 处，可展开清单；持久草图只有前者）与面板内提示；
      无选中时为父模块——原则可编辑、「带入现有原则」，名称与职责只读（上一层没写时显示当前版本的文字并标出来源）；根草图无选中时为设计概览（全设计计数与各张草图）；多选时合并 / 删除所选；
      层：名称、ID、抽象原则、包含 / 不包含、可依赖的层、删层；模块：名称、ID（前缀与唯一校验；改 ID 前列出影响——级联条数、子草图文件名、当前版本引用数——并二次确认，X7d）、职责、相关决策 adrs（E9）、角色（下拉：普通 / 核心 / 共用件 / 事件总线，SK-22）、封闭、代码落点、对外接口、原则、血缘只读（来自 A、B · 合并 / 拆分 / 改 ID / 移动）、「进入下一层 →」、端口的实现者（增删，写进接口的 implementedBy，X24）；关系：类型（查 / 托 / 通知 / 流）与修饰（机制、异步、拉取；表单 RelationKindFields，新建连线也用，X23）、说明、经由接口，待分类（迁移期的 calls）与待重连标出；引用节点：当前版本里的职责与位置、折叠进来的精确关系、「在模型里查看」「打开挂在它身上的草图」；元信息：挂载点、lifetime、supersedes。
    principle: 面板只发编辑分组的操作；合并 / 拆分 / 删除这类要对话框的，经 sketchRequest 交给画布。
    codeRefs: [src/components/sketch/SketchPanel.vue, src/components/sketch/panel/**]
  - id: present.version.identity
    name: 身份区
    summary: 显示版本身份与挂载点面包屑，点击切张
    parent: present.version
    kind: component
    responsibility: 信息条的身份区与三区的组合（F-60、F-63）：kind 标签 + 名称（只出现一次）+ 状态 chip / 轮次 / 提交日期；草图下唯一一条挂载点面包屑「挂在：视图状态层 › DeskState」——点一级切到那张草图（openMount，会话里没有时推出），父级带 data-parent 是升级的落点（画布拖动经过时高亮），下钻后随当前张变；「编辑中 ●」（按设计算）。按版本把动作区与对比区放在右侧。
    codeRefs: [src/components/infobar/InfoBar.vue]
  - id: present.version.actions
    name: 动作区
    summary: 提供保存、撤销、交给 AI 与退出等动作
    parent: present.version
    kind: component
    responsibility: |
      信息条的动作区（F-61）：提交版本与设计轮次为「说明」；草图（打开即编辑）为保存（⌘S）、撤销 / 重做图标、保存并交给 AI（没有未保存改动时为「交给 AI」；全设计有格式错误或语义提示时禁用并悬停说明原因，F-52）、说明（全设计变更清单按血缘分组的弹层，F-53）、退出（有未保存改动时三选保存 / 放弃 / 取消，回到进入草图之前的版本，#20b）；保存结果与失败原因的提示；
      文件已在外部改动时整个动作区换成横幅「重新加载并重放 / 放弃本次改动」，重放有失败时列出失败的操作；窄屏只剩图标。另含全设计变更清单的分组组件（ChangeGroups，对比弹层共用）与草图下共用的确认 / 三选对话框（useEditDialog）。
      设计的草图上（波 3，DL-38）：保存 · 放弃（本次未保存的改动）· 撤销 / 重做 · 校验（全设计的格式错误与语义提示）· 认可 ▾——先开认可前总览（AcceptDialog：带号的改动、影响面按当前描述估、涉及的场景），确认才写；下拉保留「交给 AI 展开一轮」作可选预览；已认可时只剩「回到起草」（二次确认）；已实现 / 已放弃只看。持久草图仍是「保存并交给 AI」。
      已认可时（波 4，DL-50）：「回到起草 · 归档」，三关全绿「归档」才亮、灰时悬停给第一道没过的关；ArchiveDialog 归档预览——三关、「认可时估牵动 N · 实际改了 N′」与差、将写确认记录的模块数、晋升的持久草图，确认后写入。
    codeRefs: [src/components/infobar/ActionZone.vue, src/components/infobar/AcceptDialog.vue, src/components/infobar/ArchiveDialog.vue, src/components/infobar/ChangeGroups.vue, src/components/edit/EditDialog.vue, src/components/edit/useEditDialog.ts, src/components/edit/leave.ts]
  - id: present.version.compare
    name: 对比区
    summary: 选择对比基线并显示六类变更计数
    parent: present.version
    kind: component
    responsibility: 信息条的对比区（F-62）：一个按钮「对比 <基线> · 计数」，点开弹层——提交版本选基线提交（E6，经路由）、设计轮次选当前版本或上一轮（E3）、草图选相对基线 / 相对当前版本（持久草图只有后者）；草图的按钮上新增 / 修改始终显示、合并 / 拆分 / 移动 / 删除只在非 0 时显示，弹层列六类计数与全设计清单；「图上标出变更」、没有基线提交的提示、基线漂移警告；点外面或 Esc 关闭。
    codeRefs: [src/components/infobar/CompareZone.vue]
  - id: present.version.new-design
    name: 新建设计与「在此设计」
    summary: 从选中模块发起新设计或加入已有设计
    parent: present.version
    kind: component
    responsibility: 「在此设计」（F-10，SK-14）：侧栏模块树、模型画布节点右键与模块面板的模块上发起，挂载点不能是层、不能是系统根，只在当前版本上；打开新建设计对话框——设计 ID、名称、目标一句话、挂载点（入口带入可改；从设计面板「改骨架」为根挂载），有草稿设计时可选「加到设计 <名>」：打开那个设计的草图，进入草图画布后切到挂在该模块上的一张（pendingSheet，会话里没有时按基线推出）；创建后进入新设计的草图。
    codeRefs: [src/components/edit/NewDesignDialog.vue, src/components/edit/designHere.ts]

