interfaces:
  - id: if.intent.applyEdit
    name: applyEdit
    owner: model.intent.edit
    signature: |
      applyEdit(sketch: SketchDef, op: EditOp, ctx: EditContext): EditResult
      // EditContext: { persistent: readonly SketchEntity[]; designSketch: boolean }
      sketchText(def: SketchDef): string   // 顶层键 sketch 的 YAML，编辑中的草图交给加载流水线
    semantics: |
      - 纯函数，不修改输入；生成的 ID 只取决于草图内容
      - 只拒绝不成立的操作（X7b），结构合法性交给 validateSketch
  - id: if.intent.idImpact
    name: idImpact
    owner: model.intent.edit.move
    signature: |
      idImpact(sketch: SketchDef, ctx: EditContext, id: string, newParent: string, newId?: string, current?: ModelIndex | null): IdImpact
  - id: if.intent.seedSketch
    name: seedSketch
    owner: model.intent.edit.seed
    signature: |
      seedSketch(id: string, from: 'empty' | { persistent: SketchEntity }): SketchDef   // 复制时声明 supersedes
  - id: if.intent.validateSketch
    name: validateSketch
    owner: model.intent.validate
    signature: |
      validateSketch(sketch: SketchDef, ctx: { persistent: readonly SketchEntity[]; file: string }): SketchValidation
    semantics: 纯函数；页面每次操作后、保存前与写入端点调用同一函数（X7f）；引用范围为本草图 ∪ 持久草图
  - id: if.intent.sketchCheck
    name: sketchCheck
    owner: model.intent.check
    signature: |
      sketchCheck(sketch: SketchEntity, index: ModelIndex, opts?: { persistent?; accepted? }): SketchCheck
      checkSketches(index: ModelIndex, sketches: readonly SketchEntity[], accepted?: Map<string, AcceptedDeviation[]>): SketchCheck[]
      sketchContradictions(sketch: SketchEntity, persistent: readonly SketchEntity[]): SketchDeviation[]
      archiveVerdict(check: SketchCheck): ArchiveVerdict; sketchModules(sketch: SketchEntity, index: ModelIndex): string[]
      compareOwned(record: OwnedRecord | null, hashes: Record<string, string>): Issue[]
    semantics: 纯函数；页面、lint:model、sketch-check 与写入端点同一套结果（X4）
  - id: if.writer.saveSketch
    name: saveSketch
    owner: access.writer.sketch
    signature: |
      saveSketch(modelRoot: string, project: string, req: SaveSketchRequest, root: string): { file: string; hash: string }
      createDesign(modelRoot: string, project: string, req: { id: string; name: string; goal?: string; sketch: SketchDef }, root: string): { file: string; files: string[] }
      // HTTP：POST /write/<项目>/sketch | /write/<项目>/designs/<设计>/sketch → 200 { file, hash } | 409（指纹不符）| 422 { error, issues }（校验不过）
      //       POST /write/<项目>/designs → 200 { file, files } | 409（设计已存在）
    semantics: |
      - 写前比对指纹、再校验，任一不过即拒绝，文件不动（X7i、X7f）
      - 合并进 YAML 文档：未改动的节点（连同注释）原样保留；新条目跟随同一列表已有条目的写法
      - 写后更新 owned.json 的指纹（X6），ledger.jsonl 记一行（tool: sketch）
  - id: if.desk.edit
    name: 编辑操作（desk.edit）
    owner: state.desk.edit.commands
    signature: |
      enterEdit(): boolean                                   // 只在草图版本上有效（X7a）
      exitEdit(force?: boolean): 'confirm' | 'done'           // 有未保存改动且未 force 时返回 confirm
      edit(op: EditOp): { ok: true } | { ok: false; reason: string }
      undo(): boolean; redo(): boolean
      previewMove(id: string, parent: string, newId?: string): IdImpact
      save(): Promise<{ ok: true } | { ok: false; error: string; conflict?: true; issues?: SketchValidationIssue[] }>
      discard(): Promise<void>                                // 放弃本次改动；已过时时先重新加载
      replayOnReload(): Promise<{ failed: EditOp[] }>         // X7i
      createDesign(input: { id; name; goal?; base: 'empty' | 'copy' }): Promise<WriteOutcome>
      canLeave(): 'free' | 'confirm'
      // 只读：editable、target、session、active、draft、stale、canUndo、canRedo、dirty、validation、check、changes、promotion、saving、lastSave、serverIssues
    semantics: 操作本身不含规则：编辑规则在 model.intent.edit，会话规则在 state.transition.edit，撤销栈在 state.desk.edit.session。
  - id: if.desk.editSession
    name: 编辑会话函数
    owner: state.desk.edit.session
    signature: |
      begin(target: SketchTarget, file: string, sketch: SketchDef, hash: string): EditSession
      apply(s: EditSession, op: EditOp, ctx: EditContext): { session: EditSession; result: EditResult }
      undo(s): { session; effects } | null; redo(s): { session; effects } | null
      saved(s, hash): EditSession; reloaded(s, sketch, hash): EditSession; discard(s, sketch?, hash?): EditSession
      replay(s, sketch, hash, ctx): { session: EditSession; failed: EditOp[] }
      isDirty(s): boolean
    semantics: 纯函数；撤销栈深度上限 200，超出丢最早的（X7g）。
  - id: if.state.editMode
    name: 编辑规则
    owner: state.transition.edit
    signature: |
      // 经 transition(state, action, ctx) 分派：{ type: 'enterEdit'; target } | { type: 'exitEdit' } | { type: 'edited'; effects; previousPath }
      leaveGuard(dirty: boolean): 'free' | 'confirm'
      isEditing(state: ViewState): boolean
    semantics: 纯函数（X7a、X7h）；编辑态下 openScenario、选中文件、打开代码事实与演化叠加为无效动作，返回原状态。

dataStructures:
  - id: ds.SketchDef
    name: SketchDef
    definition: |
      interface SketchDef {
        id: string
        lifetime?: 'persistent' | 'until-implemented'
        closed?: string[]
        supersedes?: string
        modules?: ModuleDef[]          // 可嵌套 children，也可平铺写 parent
        relations?: RelationDef[]
        interfaces?: InterfaceDef[]
        dataStructures?: DataStructureDef[]
      }
    description: 草图定义（已在 src/model/types.ts）；编辑中的草图就是这样一个值。
  - id: ds.EditOp
    name: EditOp
    definition: |
      type EditOp =
        | { op: 'addLayer'; name: string; id?: string; at: number }            // at：插入位置（第几条带之前）
        | { op: 'reorderLayer'; id: string; to: number }
        | { op: 'setMayDependOn'; id: string; layers: string[] }
        | { op: 'addModule'; parent: string; name: string; id?: string; kind?: ModuleKind }
        | { op: 'updateModule'; id: string; patch: ModulePatch }                // name / responsibility / kind / codeRefs / abstraction / includes / excludes / core
        | { op: 'setClosed'; id: string; closed: boolean }
        | { op: 'moveModule'; id: string; parent: string; newId?: string }    // 缺省新 ID = 新父 ID + 原短名
        | { op: 'renameModule'; id: string; newId: string }                   // = 父不变的 moveModule（只改短名），原地改写，同一级联与确认
        | { op: 'removeModule'; id: string }                                   // 层也用它
        | { op: 'connect'; from: string; to: string; type: RelationType; description?: string; interface?: string }
        | { op: 'updateRelation'; id: string; patch: { type?; description?; interface? } }
        | { op: 'removeRelation'; id: string }
        | { op: 'addInterface'; owner: string; name: string; signature?: string }
        | { op: 'updateInterface'; id: string; patch: { name?; signature? } }
        | { op: 'removeInterface'; id: string }
        | { op: 'setMeta'; patch: { lifetime?: SketchLifetime; supersedes?: string | null } }
    description: 一个编辑操作 = 一次用户意图 = 撤销栈的一步。可序列化，stale 后可重放。
  - id: ds.EditResult
    name: EditResult
    definition: |
      type EditResult =
        | { ok: true; sketch: SketchDef; effects: EditEffects }
        | { ok: false; code: 'not-found' | 'id-taken' | 'id-prefix' | 'id-format' | 'duplicate-relation' | 'ancestor' | 'persistent' | 'invalid'; reason: string }
      interface EditEffects {
        created: string[]                   // 新建的模块 / 关系 / 接口 ID
        renamed: [from: string, to: string][]   // 移动与改 ID 的级联（含后代）
        removed: string[]                   // 级联删除的全部 ID
      }
    description: applyEdit 的结果；effects 供选中跟随（state.transition.edit.follow）与二次确认的提示。
  - id: ds.IdImpact
    name: IdImpact
    definition: |
      interface IdImpact {
        renamed: [from: string, to: string][]        // 草图内改写的模块 ID（自身与后代）
        references: number                           // 草图内改写的引用条数（关系两端、接口 owner、closed、mayDependOn）
        outside: { modules: number; relations: number; interfaces: number; messages: number }   // 当前版本里仍引用旧 ID 的（AI 生成）
        rejected?: string                            // 不能移动的原因（如设计草图移动持久草图的模块）
      }
    description: 移动前的影响预览，「移动会改 ID」确认框的内容（C-5）。
  - id: ds.EditSession
    name: EditSession
    definition: |
      interface EditSession {
        target: SketchTarget                                  // { kind: 'design'; design } | { kind: 'persistent'; id }
        file: string                                          // 草图在载荷里的路径（设计的草图为 sketch.yaml）
        base: { sketch: SketchDef; hash: string }             // 读取时（或上次保存后）的草图与文件指纹
        draft: SketchDef                                      // 编辑中的草图
        past: { op: EditOp; before: SketchDef; after: SketchDef; effects: EditEffects }[]   // 撤销栈（深度上限 200）
        future: { op: EditOp; before: SketchDef; after: SketchDef; effects: EditEffects }[] // 重做栈
        stale: boolean                                        // 文件已在外部改动（重新加载时指纹不同，或保存被拒绝）
      }
      // 脏 = draft 与 base.sketch 不同（推出，不存）
    description: 编辑中的草图连同撤销栈与读取时的指纹，一个值，由 DeskState 的编辑分组持有。
  - id: ds.SketchValidation
    name: SketchValidation
    definition: |
      interface SketchValidation {
        ok: boolean                                           // 没有 error
        issues: {
          severity: 'error' | 'warning'
          code: 'sketch.schema' | 'sketch.id' | 'sketch.id-dup' | 'sketch.id-prefix' | 'sketch.ref' | 'sketch.ancestor'
              | 'sketch.layer-cycle' | 'sketch.contradiction' | 'sketch.empty'   // empty：warning，模块没写职责
          message: string
          target: { module?: string; relation?: string; interface?: string }   // 定位到实体（P-6）
          path?: string                                       // 草图里的位置，如 modules[2].children[0]
        }[]
      }
    description: 草图本身的校验结果（能不能保存）；与核验的偏差（SketchCheck）是两回事。
  - id: ds.SaveSketchRequest
    name: SaveSketchRequest
    definition: |
      interface SaveSketchRequest {
        target: { kind: 'persistent'; id: string } | { kind: 'design'; design: string }
        sketch: SketchDef
        baseHash: string                                      // 读取时的文件指纹（SHA-1，与 owned.json 同一算法）
      }
    description: 草图整份写回的请求正文（JSON）。
  - id: ds.SketchCheck
    name: SketchCheck
    definition: |
      interface SketchCheck {
        sketch: string; design?: string; lifetime: 'persistent' | 'until-implemented'; supersedes?: string
        deviations: SketchDeviation[]        // 稳定键 <种类>:<实体 ID>，已认可的降为 info
        counts: { error: number; warning: number; info: number }
      }
    description: 一张草图对一个版本的核验结果（X4，已在 src/model/intent/types.ts）；编辑态下对当前版本实时算，面板显示「实现后将有 N 处偏差」（L-1）。
