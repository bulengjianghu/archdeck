# 草图的编辑与校验（ADR-0024、ADR-0025）：意图下的子模块、草图画布与草图面板、设计级编辑会话、按设计写回、信息条三区。
# 规则编号（X7、X7a–X7k、X9–X21、B6、B7、E8）见 docs/02-domain.md §2.21；机制见 docs/architecture/governance.md §4.4、view-state.md §7、workbench.md §12。

modules:
  - id: access.writer
    name: 描述写入
    summary: 只追加写入人拥有的文件，并整份写回草图
    abstraction: 按写法切分：追加只增不删，草图整份写回先比指纹再校验；两者共用同一份 YAML 文档的打开与保存。
  - id: model.intent.check
    name: 草图核验与生命周期
    summary: 比对草图与基线或当前版本，按血缘读出改动与偏差
    parent: model.intent
    kind: component
    responsibility: |
      意图计算（格式 v2，ADR-0025）：同挂载点矛盾 sketchContradictions（供草图校验共用，X4、X10）；两个对比共用的 compareSketch / compareDesign——按挂载点取对象版本的同一范围（mountScope，X9），
      按血缘（from 指向基线、前缀映射，X11、X12）把差别读作新增 / 修改 / 合并 / 拆分 / 改 ID / 移动 / 删除，相对基线比结构与写了的文字、相对当前版本只比结构（X17），changeSummary 按血缘措辞；
      相对当前版本的偏差 sketchCheck / checkSketches（缺模块、结构字段、封闭子树多出、血缘未落实、给了基线时范围内删掉的仍在、关系与接口的对应，应用认可偏差，X2、X4）；
      四类交互与端口（ADR-0029）：关系按两端与类型对应——相同，或迁移期的未分类对查询 / 委托视为对应（X23）；草图声明的端口实现者在版本的 implementedBy 与代码事实的实现者（K5c，给了时）里都没有即偏差 sketch.missing-implementer（X24）；相对基线另比关系的机制（via）、同步性、拉取与接口的实现者（写了才比，X17），相对当前版本不比类型与机制；
      归档判定 archiveVerdict 与草图覆盖的模块 sketchModules（X3，交给确认层写确认记录）；人拥有文件的指纹比对 compareOwned（X6）。输入是草图定义与模型索引，不碰文件系统。
      设计的认可与状态迁移（approval.ts，DL-32–DL-35）：07 §3.1 迁移表（designTransition：每行去向或拒绝原因，「评审中」按起草中迁移、不再产生）、锁定判定（editLock）、认可指纹比对（approvalDrift：改了 / 新加 / 删了的草图，没有认可记录即不一致，归档第三关的前置）。
    principle: |
      - **一个函数换对象**：相对基线（我改了什么）与相对当前版本（实现还差什么）共用 compareSketch，只差对象版本与要不要比文字；页面、命令行与交给 AI 的摘要同一套结果。
      - **血缘一律指向基线 ID**：读血缘不必沿链求闭包；前缀级联推出的子树改名、合并带走的来源被「合并 / 移动」吸收，不另列。
    codeRefs: [src/model/intent/check.ts, src/model/intent/lifecycle.ts, src/model/intent/approval.ts, src/model/intent/archive.ts, src/model/intent/owned.ts, src/model/intent/lineage.ts, src/model/intent/scope.ts]
  - id: model.intent.edit
    name: 草图编辑
    summary: 把一个编辑操作应用到草图，产出新草图与影响
    parent: model.intent
    kind: component
    responsibility: |
      对草图的纯函数编辑，两级入口：applyEdit 编辑一张草图（ds.SketchDef，一个 ds.EditOp，上下文为持久草图与范围外可引用的模块）；applyDesignEdit 编辑一个设计的全部草图（ds.DesignEditOp，一个操作可以改多张，X7b）。
      操作族：层（只在根草图）、模块与字段、关系与接口、位置与引用节点（X15、X19）、挂载点的原则（X10）、合并 / 拆分 / 降级 / 升级 / 移入 / 改 ID / 删除（跨草图、前缀级联、血缘，X7d、X7e、X7j、X7k、X11、X12）、底稿从基线复制与推出下一层（X18）。
      输出新草图（集合）与这次编辑的影响（新建、改名、删除了哪些 ID，涉及、改挂载点、新出现与删掉的草图），或拒绝原因。不碰文件、YAML 文本与界面；不判断草图整体是否合法（那是校验的事）。
    abstraction: 先寻址再编辑：单张草图的操作族各自成件，设计级编辑在其上做跨草图级联；只输出新草图与影响，不判合法。
    invariants:
      - 入口先深拷贝输入再改，调用方给的草图不被修改
      - 设计级编辑依赖单张草图的操作，单张操作不反向引用设计级
      - 不调用草图校验、不碰文件系统与 Vue，只拒绝做不成的操作
    principle: |
      - **只拒绝不成立的操作**（X7b）：目标不存在、新 ID 已被占用或格式不对、显式给的 ID 不以挂载点为前缀、同一对模块同类型的关系已存在、连祖先与后代、层操作不在根草图、合并少于两个——做了也没有意义，直接拒绝并给原因；
        其余结构问题（层 / 本层依赖成环、与持久草图矛盾、待重连、超七）照常应用，交给两级校验即时报出，允许架构师经过中间不合法的状态。
      - **ID 变了一律前缀级联**（X12）：改 ID、合并、降级、升级、移入都改写整棵子树的前缀，设计里挂在它或后代上的草图同一步改挂载点；被改写的模块记 from，一律指向基线 ID（X11）。
      - **保持作者的写法**：根草图里层的直接子模块嵌在 children 里，非根草图平铺在挂载点下；其余条目的顺序与形状不动，写回时未改动的节点才能保住注释。
      - **值进值出**：不修改输入，在副本上修改（structuredClone）；一个设计只有几十到几百个实体，撤销栈存快照的代价可以忽略。
    codeRefs: [src/model/intent/edit/index.ts, src/model/intent/edit/apply.ts, src/model/intent/edit/shared.ts]
  - id: model.intent.edit.locate
    name: 草图寻址与 ID 生成
    summary: 在草图里找到模块，生成不冲突的新 ID
    parent: model.intent.edit
    responsibility: 在草图里按 ID 找到模块与它的位置（根草图嵌在层的 children 里，非根草图平铺在挂载点下）；挂载点与是否根草图（mountOf、isRootSketch）；新 ID 的生成与检查——模块 ID 为挂载点（或层）加 ID 短名（名称能转写时为 kebab-case，中文名必须手填，不用拼音，X7c），关系 ID 为 rel.<from 短名>-<to 短名>（同一对已有别的类型时加类型后缀，仍冲突时加序号），接口 ID 为 if.<owner 短路径>.<名称>（04 §3.3）；已占用的 ID（本草图与持久草图）。草图里的分层寻址与级联（strata.ts，ADR-0052）：父模块的层、子模块所属的层、根草图的层带即根的子模块，删除与改 ID 时成员与层一并级联。
    codeRefs: [src/model/intent/edit/locate.ts, src/model/intent/edit/strata.ts]
  - id: model.intent.edit.layers
    name: 层操作
    summary: 在根草图上增删、排序层并设定层间可依赖
    parent: model.intent.edit
    responsibility: 只在根草图（层是带不是层次，X9）：加层（按插入位置给 order，其后的层顺延）、层排序（重排 order，保持连续）、删层（连子树一起删，级联同删除模块）、改可依赖的层（mayDependOn 集合，元素必须是层）；层的名称、抽象原则、包含 / 不包含经模块的改字段。
    codeRefs: [src/model/intent/edit/layers.ts]
  - id: model.intent.edit.modules
    name: 模块操作
    summary: 新建、改写与删除草图里的模块并列出级联
    parent: model.intent.edit
    responsibility: 新建模块（在挂载点下，根草图里在层下；名称必填，ID 短名可显式给出，X7c）、改字段（名称、职责、kind、代码落点、原则、包含 / 不包含、核心）、标封闭、删除模块（删子树，级联删除两端落在子树内的关系、owner 落在子树内的接口，并从 closed、mayDependOn、layout 中去掉）；影响里列出级联删掉的实体，供二次确认的提示（X7e）。
    codeRefs: [src/model/intent/edit/modules.ts]
  - id: model.intent.edit.move
    name: 单张草图内的改 ID
    summary: 在一张草图里改父或改 ID，引用随之改写
    parent: model.intent.edit
    responsibility: 一张草图里的改父与改 ID（moveModule、renameModule，设计级的改 ID、降级、升级、移入在其上做跨草图的级联）：级联改写后代的 ID、关系两端、接口 owner、closed 与 mayDependOn 中的引用（关系与接口自身的 ID 不改，保持引用稳定）；影响预览 idImpact——草图内要改写的 ID 与引用条数，以及当前版本里还引用旧 ID 的实体条数（AI 生成的子模块、关系、场景消息）。
    principle: |
      - 设计的草图不能动持久草图里的模块（那是改骨架，要画根挂载的设计草图并 supersedes），拒绝并说明。
      - 当前版本里的旧 ID 不由这里改：那些是 AI 生成的文件，保存后经「保存并交给 AI」由 AI 按草图与血缘摘要重新生成。
    codeRefs: [src/model/intent/edit/move.ts]
  - id: model.intent.edit.relations
    name: 关系与接口操作
    summary: 连、改、删草图里的关系与接口，拒绝重复
    parent: model.intent.edit
    responsibility: 连关系（两端、类型——四类交互、说明、经由接口与修饰；同一对同类型已存在、连自己、两端都是引用时拒绝，X7c、X23）、改关系（类型、修饰、说明、经由接口；改成同对同类型重复时拒绝）、删关系；写修饰（X23、M13）——via 空串为直接（去掉），mode 只留在查询 / 委托上且只记 async（同步缺省，经 relationMode 判定），pull 只留在流上，改了类型后不再适用的修饰一并去掉；加接口（名称、签名，owner 固定为所在模块，ID 自动生成）、改接口、删接口（同时去掉关系上对它的引用）；声明 / 撤销端口的实现者 implement（X24：写进本草图接口的 implementedBy，实现者是本层模块或引用节点、不能是定义模块自己）。
    codeRefs: [src/model/intent/edit/relations.ts]
  - id: model.intent.edit.seed
    name: 草图底稿与元信息
    summary: 从基线生成草图底稿，推出还没写的下一层
    parent: model.intent.edit
    responsibility: 底稿从基线复制（X18）seedFromBaseline：挂载点一层的 ID、名称、kind、core、closed（根挂载时层的 order 与 mayDependOn）与显式写在本层的关系，不复制职责、接口、原则，同挂载点已有持久草图时声明 supersedes（根挂载即 supersedes skeleton）；复制后相对基线为 0。下一层草图不存在时由「基线子树 + 血缘」推出 deriveChildSketch（基线里该模块的直接子模块，加上 from 收进它的模块、按前缀级联换 ID）；改草图元信息（lifetime、supersedes）。
    codeRefs: [src/model/intent/edit/seed.ts]
  - id: model.intent.edit.design
    name: 设计级编辑
    summary: 用一个操作跨多张草图合并、拆分、升降级
    parent: model.intent.edit
    responsibility: applyDesignEdit——输入输出为一个设计的全部草图（X7b）：合并（X7j：来源降为新模块的子模块并写入它的下一层草图，关系重指向新模块、同对同类型去重，位置取重心，from 为来源的基线 ID 闭包）、拆分（X7k：同层生成若干模块、from 指向原模块，原模块删除，它的关系列为待重连，下一层草图随删）、降级 / 升级 / 移入（X7d：降级写入目标的下一层草图并重指向关系，升级写入父层、下一层的关系不带上来留作待重连，移入是根草图里换层）、改 ID、删除（连同挂在它与后代上的草图，X7e）；一律前缀级联（X12），from 沿血缘求闭包（X11）；单张草图上的操作转给 applyEdit。影响里列出涉及的草图、改挂载点的草图、新出现与删掉的草图（设计级撤销的一步与写回层的改名、删文件据此）。
    codeRefs: [src/model/intent/edit/design.ts]
  - id: model.intent.edit.layout
    name: 位置与引用节点
    summary: 记下节点与标签位置、排网格、派生引用节点
    parent: model.intent.edit
    responsibility: 布局节的编辑（X15、X22）：拖动节点（多选一起是一步，只记本层模块——引用节点的位置由规则算，只拖引用时拒绝）、拖动关系标签、重新排列（网格 gridLayout：非根草图按中心区的可用区域排、整块居中，坐标相对中心区的内容原点，引用不进 layout；根草图按层带折行，X21）；引用节点（X19）由关系派生、按与挂载点同深度的祖先折叠显示（foldReference、referenceNodes、referenceRelations），addReference 放上画布（会话里在 layout 占位）、removeReference 连同它的关系删掉，保存前 layoutForSave 去掉全部引用的键并列出没有关系而丢掉的；挂载点的原则 setAbstraction（X10）。
    codeRefs: [src/model/intent/edit/layout.ts]
  - id: model.intent.validate
    name: 草图校验
    summary: 校验草图的格式错误与语义提示，各处共用
    parent: model.intent
    kind: component
    responsibility: |
      草图的两级校验 validateSketch（X14，ADR-0025），画布每次操作后、保存前与写入端点、lint:model 共用同一函数：
      格式错误（error，拦保存）——按 JSON Schema 检查草图形状（未知字段即错）、ID 格式与重复、模块不是挂载点的直接子节点（父、前缀、嵌套不对，X9）、挂载点是层或不存在、设计草图的文件名与 mount 不一致、引用不存在、缺名称、关系不在本层（两端都不在本草图，或另一端是本层模块的后代）、连祖先与后代；连线的类型与修饰（X23：类型取四类，via 合四形态、port:<P> 的 P 是已知接口、bus:<M> 的 M 是已知模块，mode 只用于查询 / 委托、pull 只用于流，sketch.relation-type / sketch.via）、端口实现者是已知模块（X24）；
      语义提示（warning，拦「保存并交给 AI」与定稿）——根草图的层依赖成环、同挂载点与持久草图矛盾（复用 model.intent.check 的矛盾检查，X4、X10）、待重连（X16）；
      只提示（hint，不进两级）——超七（X13，SKETCH_SOFT_LIMIT）、没写职责、迁移期的 calls「待分类」与旧的平铺 via（X23）。输出 ok（能保存）、ready（能交给 AI）、三级问题列表（按实体定位）与待重连的关系，不改草图。
    principle: |
      - **只看草图本身**：不对照版本的偏差（那是核验 sketchCheck 的事）；只有矛盾检查两边都有，同一函数与稳定键。
      - **引用的范围**：本草图 ∪ 持久草图 ∪ 同一设计的其他草图 ∪ 范围外的模块（当前版本或基线，作为引用节点的端点，X19）；前缀推出的后代认作存在（X12）。
    codeRefs: [src/model/intent/validate.ts]
  - id: state.transition.edit
    name: 编辑规则
    summary: 规定草图画布的进出、互斥与编辑后的跟随
    parent: state.transition
    kind: component
    responsibility: |
      草图画布的会话规则（纯函数，X7a、X7h，ADR-0025）：打开草图版本即进入草图画布（没有「查看态」；层次换成当前张的挂载点）与退出；草图画布与回放、文件选中、代码事实互斥（进入时退出场景、清掉文件选中，其下打开场景、选中文件 / 依赖线 / 耦合线 / 聚合边 / 端口、开代码事实与演化、组装叠加为无效动作——草图不对应代码）；
      层次只由当前张决定：模型画布的下钻、返回上级、跳转、按 URL 恢复为无效动作，下钻与面包屑返回经 openSketch 切换且不进浏览器历史；Esc 只取消选中；有未保存改动时离开要确认；编辑后层次与选中怎么跟随。
    abstraction: 按关注点分两件：进入退出与互斥管草图画布能做什么，跟随管编辑后选中与层次去哪。
    codeRefs: [src/state/transition/edit.ts]
  - id: state.transition.edit.mode
    name: 进入、退出与互斥
    summary: 决定能否进入、退出、切换草图及离开前确认
    parent: state.transition.edit
    responsibility: enterEdit（版本不是草图版本时无效；进入时关闭场景、清掉文件选中，层次为当前张的挂载点——根挂载为系统根，保留仍在的模块与关系选中）、exitEdit、openSketch（切到另一张草图：层次换成它的挂载点、清空选中）；blocked 列出草图画布下无效的动作；leaveGuard(是否脏) → 放行 / 需要确认；编辑目标不进 URL。
  - id: state.transition.edit.follow
    name: 改名与删除的跟随
    summary: 让选中与层次跟随改名、删除与撤销
    parent: state.transition.edit
    responsibility: edited 动作（携带编辑的影响与编辑后当前张的层次）：选中的被改名（含前缀级联）→ 换成新 ID；被删除 → 清空；新建、合并、拆分 → 选中结果；层次为编辑后的当前张（不在索引里时退到旧路径上最近仍存在的祖先）；撤销 / 重做同样跟随，撤销的一步在别的草图上时切到那张。不进浏览器历史。
  - id: state.desk.edit
    name: 编辑中的草图
    summary: 持有编辑会话，向界面提供编辑、撤销与保存
    adrs: [24, 25]
    parent: state.desk
    kind: component
    responsibility: |
      DeskState 的编辑分组（desk.edit，X7、X20，ADR-0025）：持有按设计的编辑会话（ds.EditSession，一个值：设计的全部草图、当前张、设计级撤销 / 重做栈、各张读取时的指纹），由纯函数改变；画布多选、对比口径（相对基线 / 相对当前版本）、面板内提示与「隐藏外部引用」（hideReferences，只在会话里、不进 URL、不写文件，X22）也在这里；
      对外提供草图画布的操作（每个手势一个，经 model.intent.edit 的 applyDesignEdit 应用）、下钻与切张、撤销 / 重做、保存（整个设计）、保存并交给 AI、退出、新建设计；
      打开草图版本即进入：各张草图连同 system.yaml、持久草图与引用的外部模块加载成设计的索引，作为 DeskState 的 index；并派生当前张的画布数据、两级校验、两个对比的计数、超七提示、待重连、脏与面包屑；面板用的查询（当前张里的条目、父模块对外的一面、模块的原则与血缘读法、各张草图、引用外部模块的候选；连线「经端口」可选的端口——本张写的接口与当前版本的接口，「经总线」可选的 role: bus 模块，X23）。
    abstraction: 按会话值、只读派生、编辑操作、写回同步四件切分：改会话、读会话与落盘各归一件。
    invariants:
      - { text: 会话是一个值：只整值替换不原地改，撤销 / 重做是快照替换, adr: 24 }
      - 会话只在编辑操作与写回同步两处赋值，派生只读不写
      - 写文件只经注入的 ModelWriter，本组不直接发请求
    principle: |
      - **一个值**：各张草图、撤销栈、读取时的指纹互相约束（撤销回到读取时即不脏），合成一个 EditSession；「脏」由文档与读取时的草图推出，不另存（原则 6）。
      - **按设计**（X20）：撤销、脏、保存、交给 AI 都以设计为单位；会话里推出的草图未改动不算脏、不写文件。
      - **只对草图版本开启**（X7）：设计的草图（/d/<设计>/sketch）与持久草图（/i/<ID>，只有这一张，不能下钻）；当前版本、设计轮次、提交版本上没有会话。
      - **持久草图只有一个对比**（X17）：它不属于设计、没有基线，只有相对当前版本（偏差，与 sketchCheck 同一口径，骨架一致时为 0）；交给 AI 时的改动摘要另算（对象是去掉它贡献后的当前版本，同服务端），只在「说明」里单列、不进计数。
    codeRefs: [src/state/desk/edit.ts]
  - id: state.desk.edit.session
    name: 编辑会话
    summary: 以一个值记下设计的全部草图与撤销栈
    parent: state.desk.edit
    responsibility: 编辑会话的值与纯函数（X7g、X7i、X20）：begin（以读到的各张草图与指纹开始，当前张为根挂载或主草图）、apply（一步 = 一个或几个设计级操作，原子；成功压撤销栈、清空重做栈，记前后的当前张；当前张被改名或删除时跟着走）、undo / redo（撤销的一步在别的草图上时切过去）、open（下钻 / 切张：会话里没有的草图按 X18 推出，不进撤销栈）、splitImpact（X7k：拆分前的二次确认范围，不改会话——随原模块删掉的下一层草图与模块数，下一层还没出现时按基线推出计入）、sketchDirty / isDirty（读自文件的与读取时比；推出的与此刻推出的结果比结构、与出现时比位置）、removedMounts、saved、reloaded（指纹相同不变、已过时的解除，内容与会话一致接上新指纹，否则标为已过时）、replay、discard；撤销栈深度上限 200；持久草图不能下钻、不能改动下一层草图。
    principle: |
      - 撤销栈存「编辑前后的会话文档 + 操作 + 前后的当前张」：快照让撤销与重做是值替换（降级 / 升级一步回滚两张）；操作让文件已变之后能重放到新文件上。
      - **撤销粒度（X7g）**：一个手势一步（双击空白新建 = 新建 + 落位）；拖位置、拖标签、重新排列各一步；文本字段失焦或回车提交一次即一步。
      - **重放失败的兜底**：replay 列出失败的操作，会话仍为已过时；可「放弃本次改动」以新读到的草图重新开始。
    codeRefs: [src/state/desk/edit/session.ts]
  - id: state.desk.edit.derive
    name: 编辑会话的派生
    summary: 从编辑会话算出索引、画布数据、校验与对比
    parent: state.desk.edit
    responsibility: 由编辑会话派生（computed）：设计的索引（各张草图序列化后与 system.yaml、持久草图、引用的外部模块一起加载，草图画布下作为 DeskState 的 index）；当前张的画布数据（草图布局 sketchScene，图上标出变更时带角标；层的顺序、模块所属的层与系统名取设计的索引，给引用按层成列与框线，X22）；各张的两级校验 validateSketch 与全设计的格式错误 / 语义提示、超七提示、待重连；两个对比 compareDesign（相对基线、相对当前版本——持久草图只有后者，即偏差，与 sketchCheck 同一口径）的全设计计数与本张清单；持久草图交给 AI 时的改动摘要（handoff：与去掉它贡献后的当前版本比，不进计数）；是否脏、改过的草图、能否撤销 / 重做；面包屑（层的名称作第二级的前缀）；编辑的上下文（持久草图与设计的基线）。
    principle: 草图只有几十个实体，每次操作重算一遍的代价可以忽略；校验与对比都调同一组模型层函数，与写入端点、命令行一致。
    codeRefs: [src/state/desk/edit/derive.ts]
  - id: state.desk.edit.commands
    name: 编辑操作
    summary: 为呈现层提供全部草图编辑操作
    parent: state.desk.edit
    responsibility: 对呈现层的唯一一组编辑操作（if.desk.edit）：enter / exit、run（设计级操作）与 edit（单张操作，包装成设计级操作）、addModule（新建 + 落位一步）、connect（类型取四类、带修饰——机制 via、异步、拉取，X23）、merge、split、demote、promote、moveIn（换层 + 落位一步）、rename、updateModule、moveNode（写位置时补齐还没写进 layout 的节点）、relabel、autoArrange、addReference、setAbstraction、remove（模块级联 / 关系 / 引用节点）与 previewRemove、previewSplit（X7k）、openChild（下钻）、openMount（切到挂在某个模块上的草图：面包屑、设计面板、「加到设计」）、undo / redo、save、saveAndHandToAi、discard、replayOnReload、createDesign（只发挂载点，底稿由服务端从基线复制）、canLeave（X7a：有未保存改动时离开要确认）、onReloaded（描述重新加载后认出刚保存的或标为已过时；保存进行中到达的推迟到保存完再比对，X7i）。每次成功后经 dispatch 交给编辑规则跟随。操作本身不含规则。
    codeRefs: [src/state/desk/edit/commands.ts]
  - id: state.desk.edit.save
    name: 草图写回同步
    summary: 把改过的草图整份写回，处理冲突与校验失败
    parent: state.desk.edit
    responsibility: 同步适配器：保存整个设计（X20）——saveRequest 列出要写的草图（读自文件且改过的带读取时的指纹，级联改名的带 renamedFrom，会话里推出且改过的为新文件，删掉的列入 removed，B7），写前丢掉没有关系的引用节点并给出清单（X19）；经注入的 ModelWriter POST 给按设计写回的端点（持久草图走单张写回）；成功则会话 saved（新指纹），指纹不符则已过时，校验不过则把服务端的问题交给面板。新建设计时 POST 设计 ID、名称、目标与挂载点。
    codeRefs: [src/state/desk/edit/save.ts]
  - id: access.writer.append
    name: 追加写入
    summary: 追加写入意见、例外、确认记录并执行归档
    parent: access.writer
    kind: component
    responsibility: |
      人拥有文件的追加写入——评审意见（B2）、例外（B3）、忽略项（B4）、确认记录（Z1、Z6，同一模块更新那一条）、认可偏差（X4）——与归档 / 晋升（X3：逐张核验当前版本一致才执行，晋升连 layout 整份替换持久草图，归档把草图覆盖的模块写入确认记录、来源 sketch:<设计>）；
      YAML 文档模型的打开（openDoc：解析失败拒绝写）与保存（save：写回并更新指纹，X6）这两个件供草图写回共用。只追加、不删改。
    codeRefs: [vite/writeModel.ts]
  - id: access.writer.sketch
    name: 草图写回
    summary: 按指纹整份写回设计的草图，冲突整次拒绝
    parent: access.writer
    kind: component
    responsibility: |
      人拥有的草图的整份写回（B6、B7、X20）与新建设计：
      saveDesignSketches——一次写一个设计的若干张草图（designs/<设计>/sketches/<mount>.yaml，文件名 = 挂载点）：先全部比对指纹（新文件不得已存在、级联改名的比旧文件、删掉的比读取时），任一不符整次拒绝（409）；再逐张两级校验，只拦格式错误（422，附问题列表）；写前去掉引用节点的位置、丢掉没有关系的引用并列出（layoutForSave，X19、X22）；
      用 YAML 文档模型把每张合并进原文档（映射逐键、带 id 的列表按 id 对齐、标量只在值变了才替换，没变的节点连同注释原样保留）；级联改名写到新文件名并删旧文件、删掉的草图删文件，只限 designs/<设计>/sketches/*（B7）；写后更新 owned.json 的指纹，ledger.jsonl 每个文件记一行（来源 page、种类 sketch，改名带 renamedFrom、删除带 removed）。
      saveSketch——持久草图 intent/<ID>.yaml 单张写回（同一套指纹、校验与合并）；设计的一张转给 saveDesignSketches。
      createDesign——设计 ID 合法且目录不存在；写 design.yaml（名称、目标、status: draft、base.commit = 仓库 HEAD，读不到时省略）与草图：给挂载点时在这里从基线（HEAD 那一版描述，没有时为当前版本）复制底稿（不写 layout：画布按中心区宽度排一次，X22），与「相对基线」读的是同一份（X18）；全部登记指纹。
      端点由 ModelSource 插件挂载：POST /write/<项目>/sketch（持久草图）、/write/<项目>/designs/<设计>/sketch（设计的一张）、/write/<项目>/designs/<设计>/sketches（按设计）、/write/<项目>/designs（新建），只收同源 JSON（B5）。
      设计状态（designStatus.ts，DL-33、DL-34）：POST /write/<项目>/designs/<设计>/status——认可时比对页面读到的各张草图指纹并在磁盘草图上重跑校验，写 status: accepted 与 approval（日期、各张草图指纹）；回到起草去掉指纹、记 withdrawnAt；放弃只改状态；去向与拒绝原因问意图的迁移表。已认可 / 已实现 / 已放弃的设计不再接受草图写回（409）。
    principle: |
      - **注释的限度**（负责人裁决接受）：注释挂在节点上，节点没变注释就在；改过的标量保留其行尾注释，删掉的条目注释随之消失，新条目没有注释。写进 04 §3.10。
      - **服务端再校验一遍**：页面的即时校验只是提示，写入端点是最后一道；两边调用同一个 validateSketch，结果一致。
      - **只写草图**：路径只由项目、草图 ID、设计 ID 与挂载点拼出（isProjectId），不接受任意路径；改名与删除只在本设计的 sketches/ 下；AI 生成的文件一律不写。
    codeRefs: [vite/writeSketch.ts, vite/designNotes.ts, vite/designStatus.ts]

  # ── 呈现层：草图画布、草图面板与信息条三区（ADR-0025）──
  # present.sketch 是第二级模块（名称、kind、职责属骨架，设计 sketch-v2 晋升后写在 intent/skeleton.yaml）；这里只补实现原理与子模块（X1）
  - id: present.sketch
    name: 草图画布
    summary: 让人在一层上自由画草图并发出编辑操作
    abstraction: 每个手势只发编辑分组的一个操作，画布自己不算规则与布局；节点、对话框与侧栏经共用约定互通。
    adrs: [24, 25]
    parent: present
    kind: subsystem
    principle: |
      - 草图版本打开即进入（SK-15、SK-16），Vue Flow 自由模式，不走 elk、不走分层投影：节点与直线边来自草图布局（state.layout.sketch），位置来自草图的 layout；模型画布上没有编辑态。
      - **每个手势只发编辑分组的一个操作**：撤销一步恰好撤回用户的一个动作；画布不自己算规则与布局，被拒绝时就地提示原因。
      - **对话框都在画布里**：面板经 sketchRequest 请求合并 / 拆分 / 删除，画布打开名称 + ID 对话框或级联确认；升级的落点在信息条的面包屑与中心区之外，经 dragOverParent 让面包屑与系统框一起高亮。
      - **引用是按规则排布的边界**（X22）：引用列、框线与中心区都由草图布局算出，画布不让人摆引用；引用线在模块之上、不接收指针，本层的线在模块之下。
  - id: present.sketch.canvas
    name: 画布与手势
    summary: 把草图画布上的拖、连、右键手势变成编辑操作
    parent: present.sketch
    kind: component
    responsibility: |
      把草图布局写入 Vue Flow 并把手势转成编辑操作：拖节点（多选一起拖）松手 = moveNode 一步（位置换成相对中心区内容原点的坐标），拖到同层节点上 = 降级（根草图里拖到另一条层带 = 移入），拖到信息条面包屑父级或拖出中心区 = 升级（X22）；引用节点不可拖；框选（空白处拖动）/ ⇧ 多选；按住空格拖动 = 平移（节点暂不可拖，焦点在输入框时不拦截），Ctrl + 滚轮 = 缩放；
      右键合并为新模块（≥2）、拆分（原模块有下一层草图时二次确认，X7k）、进入下一层、删除（有级联时二次确认），没有「在此设计」（#20c）；双击空白、空白处右键或「＋ 模块」就地输入名称与 ID 短名；从连线柄拖到另一节点松手选类型、机制与修饰 + 一句说明（X23），拖到端口记号上松手 = 声明实现者（implement，写进接口的 implementedBy、不建关系，X24）；双击模块下钻；
      层级：框线在最底、本层的线在模块之下、引用线在模块之上（不接收指针，相关节点选中或悬停时实色）；工具条（＋ 模块、引用外部模块、隐藏外部引用——只在会话里、隐藏后适应画布、重新排列——按中心区可用区域、本层数与超七提示）；⌘Z / ⇧⌘Z、Delete / Backspace、⌘S、Esc（只取消选中）；图上标出变更时的图例。
    codeRefs: [src/components/sketch/SketchCanvas.vue]
  - id: present.sketch.elements
    name: 节点与边
    summary: 画出草图的模块、引用节点、层带与连线
    parent: present.sketch
    kind: component
    responsibility: '草图画布的节点（模块：名称、ID、下一层标识、变更角标；引用：紧凑一行的名字 + ID + ×N，淡色虚线只读，列缩小时内容整体缩放，连线柄只在悬停时出现；框线：系统框、中心区、带层名与「同层」标注的引用列，拖出中心区时系统框高亮「松手 = 升级」；根草图的层带：带头可改名称与原则、「＋ 模块」「删层」、超七标记）与边（本层：两端中心连线裁到边框、同对多条平移错开、类型色、可拖动的标签与条数；引用线：从模块朝引用列一侧的端口到引用节点、水平切线的曲线，细、半透明、无标签，hot 时实色）。核心模块画成大块，共用件画成架上的紧凑块，非根草图的共用件架有标「共用件」的浅框（SK-22）。四类交互与边界（ADR-0029、ADR-0030）：本层的线按四类着色、查询淡，经端口的线终点画插座（L12、X23）；模块定义的接口画成端口记号（同 L13，本张写了的都画，供拖线落点，X24）；role: port / adapter 的模块名后带边界角色记号（RimTag，L14）。'
    codeRefs: [src/components/sketch/SketchNode.vue, src/components/sketch/StraightEdge.vue]
  - id: present.sketch.contracts
    name: 画布的约定与显示名
    summary: 提供画布与面板间的约定和变更显示名
    parent: present.sketch
    kind: component
    responsibility: 草图画布与节点、草图面板、信息条之间的约定（actions.ts：注入给节点的层带头动作 SKETCH_ACTIONS、面板请求画布打开对话框的 sketchRequest、升级落点高亮 dragOverParent）；变更角标、六类计数与变更清单分组的显示名（labels.ts，对比区、动作区与面板共用）。
    principle: 画布、面板、信息条是并列的组件，彼此不互相引用：共同的约定与显示名放在这里，依赖都指向它，避免组件之间成环。
    codeRefs: [src/components/sketch/actions.ts, src/components/sketch/labels.ts]
  - id: present.sketch.dialogs
