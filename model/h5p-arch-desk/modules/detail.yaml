    parent: present.panel
    responsibility: 列出聚合边背后的原始关系与各类型条数，点击任一条跳到它所在的层次并选中。三卡（PC-10）：理解卡为原始关系（每条先给目的）；核对卡为方向（K22 向上却不是控制反转）与证实两行（rowsFromNotices）。
    codeRefs: [src/components/panel/EdgePanel.vue]
  - id: present.panel.system
    name: 系统面板
    summary: 展示系统简介、生成来源、规模与顶层模块
    parent: present.panel
    responsibility: 系统面板（PC-10，ADR-0053；第十八轮走查修订 ADR-0059）：理解卡为简介与分层 / 顶层模块（各一句话职责）；核对卡三行——证实（未证实 + 未解释，与模块同口径）、治理（「违规 新增 N · 存量 M · 模块环 K」，新增在前；口径、基线、环度趋势在行悬停；条目按严重度：新增违规或存量违规、模块环、共用件反向依赖、端口无实现者 / 无使用者、查询副作用、疑似共用件、共用件体量、已消除可收紧基线，条目只写信号与数字、口径进悬停，PC-7）、确认（系统的确认徽标 · 核心模块已确认 N / M，需复核为提示级，Z5）；清单全部折叠带计数、为 0 不出现、按严重度排（V15c、PC-13）：治理证据清单（GovernanceSection）、意图（IntentSection）、演化、规模与来源（来源仓库 / 提交 / 生成时间，描述规模，代码事实的库存数：文件依赖——未归属与冲突不计的条数在悬停、模块依赖、端口、子类、组装与组装根、外部依赖前 8）、拦截记录（agent 接口：写前判定、按规则拒绝、重新扫描）、自上次确认以来的改动、确认。加载中的措辞「代码事实读取中」与模块核对卡同文。

    codeRefs: [src/components/panel/SystemPanel.vue]
  - id: present.panel.design
    name: 设计面板
