    responsibility: 画布右下角的「显示」面板，分上「设置」下「图例」两块；图例行只读、一行不兼两职，开关与筛选全在设置块、两侧互指（L45，第十五轮 G13）；图例按视角整组替换、不混列（L19、D-26，ADR-0031 裁决 D）。设置块按对象分组（NodeSettings 为容器）：边界与现状（边界节点、只看现状）；关系筛选（交互视角，L8，邐藏的类在画布角留痕）；代码事实与组装（交互视角，K9、O12）；结构筛选与表面（结构视角：只引类型 / 只看交互使用 / 只看未解释 / 总是展开表面，带收起计数）；演化（热度、时间耦合，J5）；运行视角只有交互关系显示方式（V8）与一行 L9 说明。图例块：关系 · 三问四修饰（类型行纯图例，迁移期未分类单列）、节点、代码事实 · 标签、组装、演化 · 角标与波浪线（各组标题旁标对应开关）；结构视角换成结构视图的几组（子模块「结构视图图例」）；运行视角为回放。共享通道的说明三处同文（L18，SharedLegend）。图例按上下文显示（L47，第十五轮 G14）：这里调用 state.desk.legend 算一次出现集合传给各组，没出现的记号行不列，临时（聚焦 / 悬停 / 回放才出现）记号归各组尾部「临时可见」小节常列。一行一项，示意线由 LineSwatch 按与边组件共用的 edgeStyle 画出，与画布同款。折叠时摘要列出非默认的设置（运行视角缺省折叠，摘要总是「交互关系：<方式>」）；面板展开与各组折叠按视角记在本机（useDisplayPrefs），运行视角默认只展开「回放」。
    abstraction: 图例按视角整组替换、不混列，每组一个子组件；示意线与画布共用同一套样式映射；出现集合在状态层一处派生（L47）。
