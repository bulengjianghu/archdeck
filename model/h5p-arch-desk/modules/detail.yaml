    parent: present.canvas
    adrs: [56, 58]
    responsibility: 画布显示的控件按「有没有画布记号」分两处，一个开关只出现在一处（L45，ADR-0056）。图例（Legend）在画布右上角那一列的顶端，收起为「图例 ▾」、展开为一张卡，第一次进入项目时展开、之后按本机记住，卡高上限为画布高度的一半，画布角的留痕排在它下面（L48）。正文按读者看到的视觉通道分节、不按数据来源分组（ADR-0058，L19）：线（RelationLegend——颜色 = 关系类型的开关行、粗细 WidthRow、箭头、线型；结构视角换成 StructureLegend，子模块「结构视图图例」）、节点、规则与指标（结构视角）、叠加（OverlayLegend：代码事实、组装、演化热度、时间耦合四个开关行，开着时只在下面列非文字记号）、脚注「临时可见」（TempLegend：悬停 / 选中 / 回放才出现的记号，缺省折叠、按视角列条目）。节只是一行标题、不折叠。有开关也有记号的项图例行就是开关（LegendToggle：勾选态 + 示意 + 名称，单击切换，关着的行淡色常列；回放的类型行只读 L9）。进正文的行过准入三问（L47）：画布上写了字的记号不列、此刻不在画面上的不列、只解码不讲解——类型定义、机制词表、标签位格式在帮助与悬停（L51），线一节标题旁「?」经 OPEN_GUIDE 打开帮助的「读一条线」。图例按上下文显示（L47）：这里调用 state.desk.legend 算一次出现集合传给各节，没出现的记号行不列。共享通道（L18）的行三个视角同一位置、同一句话，文字只在 labels 一处（C1）。「显示 ▾」（DisplayMenu）在工具栏，放没有记号的设置：边界节点、只看现状、热度口径；结构视角另有只看交互使用、只看未解释（带收起计数）、总是展开表面；回放为交互关系的显示方式（V8）；有非默认设置时按钮上一个点、悬停提示列出它们（L49、TB-3）。悬停释义（gloss）按记号给出图例里的那一句，由画布并进边的悬停说明（L50）。开关在视图状态里、不进 URL，组装与演化的开关按项目记在本机（useAssemblyPrefs、useEvolutionPrefs）。
    abstraction: 图例按视觉通道分节、每节一个子组件；开关行与解码行分开写，开关行即开关；没有记号的设置另成一个菜单；临时记号单独一个脚注组件；图例行、悬停释义的文字只在 labels 一处。
    invariants:
      - { text: 一个开关只出现在一处：有画布记号的在图例行上，没有的在「显示 ▾」, adr: 56 }
      - { text: 图例行与悬停释义的文字只取自 labels 一份词表，不各写一遍, adr: 56 }
      - { text: 进图例正文的行过准入三问——画布上写了字的不列、此刻不在画面上的不列、只解码不讲解；一行一个记号一个短语, adr: 58 }
      - 出现集合只在状态层派生一次，各节只按它显隐行、不重排（L47）
    codeRefs: [src/components/display/**]
  - id: present.canvas.legend.structure
    name: 结构视图图例
    summary: 说明结构视角下依赖边的形态、醒目度、规则与指标记号
    parent: present.canvas.legend
    adrs: [31, 58]
    responsibility: 结构视角下图例的几节（L19、D-26，ADR-0031，ADR-0058）：「线」（StructureLegend）——元素级边四种形态的端点记号（全部虚线，ADR-0035）、醒目度（例外深色加宽、骨架安静中灰，L43）、「只引类型」开关行（浅色点线，带本层收起条数，L45；交互使用与值使用在画布上同画、没有记号可解码，不列）、粗细（WidthRow）；「规则」（RuleLegend）——违规红晕、本层环编号 ↻N，有才列；「指标」（MetricLegend）——入 Ca · 出 Ce 角标、不稳定度三档色条，口径在悬停（K16、L17）。束的概念在帮助；收起与例外的计数、表面 W、越过入口、逆稳定、共用件折叠、表面元素四类与 +N 是写字的角标或悬停 / 选中才画出的线，归脚注（TempLegend）。只看交互使用 / 只看未解释 / 总是展开表面没有自己的记号，在「显示 ▾」。示意线由 StructureSwatch 按与边组件共用的 depStyle 画出、颜色取 styles.css 的同一套变量；没有代码事实时只说明允许依赖图（U16）。
    codeRefs: [src/components/display/StructureLegend.vue, src/components/display/StructureSwatch.vue, src/components/display/RuleLegend.vue, src/components/display/MetricLegend.vue]

  # ── 视图状态层 ──────────────────────────────────────────
  - id: state.desk.loading
    name: 模型源同步
    summary: 取回描述并加载成模型，描述变化时重新加载
    parent: state.desk
    responsibility: 同步适配器之一：取回项目描述并调用 loadModel，把加载结果作为动作交给 dispatch（首次加载 / 重新加载）；监听本项目的变更通知触发重新加载。「保留层次与选中、失效时退到上级」不在这里，是转移规则。
    codeRefs: [src/state/sync/modelSource.ts]
  - id: state.desk.writer
    name: 描述写入同步
    summary: 把人拥有文件的写入与草图写回交给注入的实现
    parent: state.desk
    responsibility: 同步适配器之一（B1–B6，ADR-0019、ADR-0023）：定义写入来源 ModelWriter 并把「记录评审意见」「加例外」「加入忽略」「确认」「认可偏差」「归档」交给注入的实现（开发服务器的 HTTP 端点），只追加人拥有的文件；ModelWriter 另有 saveSketch / saveDesignSketches / createDesign，由编辑分组的草图写回同步调用（B6、B7、X20：持久草图单张、设计按设计整份写回，新建设计只发挂载点）。写后不改视图状态，结果由文件变化推送回来，按 N5 重新加载。
    codeRefs: [src/state/sync/writer.ts]
  # 分组派生在 src/state/desk/（ADR-0013）；dispatch 与操作是 useDeskState.ts 内的概念划分，不写 codeRefs，文件归 DeskState（避免归属冲突，G6）
  - id: state.desk.versions
    name: 版本与对比基线（desk.versions）
    summary: 给出设计版本相对对比基线的差异与基线漂移
    parent: state.desk
    responsibility: 设计版本下持有设计信息与本轮、对比基线（当前版本 / 上一轮）的索引；派生差异与基线漂移（载荷带的基线——base.commit 那一版描述——与当前版本的 source.commit 不一致；没带基线时不判断，E4）。
    codeRefs: [src/state/desk/versions.ts]
  - id: state.desk.projection
    name: 视图派生（核心与 desk.run）
    summary: 派生画布、时序图与面板要画的数据
    parent: state.desk
    responsibility: 由视图状态与模型派生要画的数据（全部是 computed，调用纯函数）。核心平铺在 DeskState 上：层次视图与坐标、选中（selectedOf）、视角。回放的派生归 desk.run（ADR-0013）：回放计划、调用与返回的配对、回放路径与路线、本层的帧投影与可见消息、选中突出（emphasisOf）、舞台叠加与参与节点、时序模型与时序图坐标，导航树用的步骤大纲与参与模块，以及场景列表（全部场景的触发者与消息数）与当前场景的触发者、ref 引用与被引用（呈现层不再自己遍历场景）。源码与版本的派生另见 desk.files、desk.versions。
    abstraction: 按视角分组：核心派生平铺在 DeskState 上，回放的派生收进 desk.run 一组。
    invariants:
      - 只有 computed：不建可写状态、不 watch、不调 dispatch
      - 只引用模型层、Layout 与视图状态转移，不引用同步适配器
    codeRefs: [src/state/desk/run.ts]
  - id: state.desk.legend
    name: 图例的出现集合派生（desk.legend，L47）
    summary: 算出当前画面上实际出现的图例记号集合
    parent: state.desk
    responsibility: 图例的出现集合（L47，第十五轮 G14）：按当前视角与层次的静息态画面算画布上出现的记号——交互视角与回放扫层次视图的边与节点（边界边聚焦才画、不计入，只出现在边界边上的类型单列临时键）、代码事实读 K9 的本层投影、组装读 O12 的投影、热度读 J5 的本层投影；结构视角读与画布同一份 structureDisplay 过滤后的束（形态、档、醒目度、收起计数、越过入口）。没有代码事实等加载态按空集合处理。呈现层（display/Legend）实例化一次、把集合传给各节；节结构与行序按固定词表，行只显隐、不重排；聚焦 / 悬停 / 回放才出现的临时记号归整张图例一个缺省折叠的脚注（TempLegend，ADR-0058），不进出现集合（只出现在边界边 / 核心跨层边上的类型单列 rel:temp:type 前缀的键供脚注用）。
    abstraction: 按记号来源分别扫描（交互边与节点、代码事实、组装、热度、结构束），再并成一个集合。
    codeRefs: [src/state/desk/legend.ts]
  - id: state.desk.actions
    name: dispatch 与操作
    summary: 提供视图状态唯一的写入口与对外操作
    parent: state.desk
    responsibility: 视图状态唯一的写入口 dispatch(action)：调用视图状态转移得到新状态并写入，层次变化时通知画布适应；对外的一组操作（下钻、跳转、返回上级、选中、定位、悬停、打开 / 关闭场景、单步、指向某一步或回到开头、选分支）都只是构造动作并 dispatch。工作区（desk.workspace，ADR-0054）同一做法：持有工作区状态，dispatch 经工作区规则算出新值；把打开场景（变为另一个）、退出场景、选中另一个文件翻译成打开时序图、关闭时序图、打开源代码预览（WS-8、G15）。
    abstraction: 一种用户意图一个操作，操作只负责构造动作，规则统一留给视图状态转移。
    invariants:
      - 对外操作都只构造一个动作交给 dispatch，不直接写状态
      - dispatch 是视图状态唯一的赋值处，写入前先经视图状态转移
    principle: 本身不含领域规则：所有「给定状态与动作，下一个状态是什么」都在视图状态转移里；这里只把派生的上下文（索引、本层帧投影等）交给转移函数。
  - id: state.desk.url-sync
    name: 路由同步
    summary: 让地址始终反映视图状态，并把地址变化交回状态
    parent: state.desk
    responsibility: 同步适配器之一：让地址始终等于 encode(视图状态)；外部的后退 / 前进 / 改地址 / 打开分享链接时，decode 成动作交给 dispatch。进不进浏览器历史由转移结果标注（规则 N10、R10）。
    principle: |
      路由导航是异步的：自己发起的导航完成前，路由变化一律视为回声、不回写状态，避免双击（两次选中 + 一次下钻）时旧地址覆盖新层次；
      离开本项目或本版本的路由时也不回写。
    codeRefs: [src/state/sync/router.ts]
  - id: state.desk.layout-sync
    name: 布局同步
    summary: 异步布局最新的层次视图并丢弃过期结果
    parent: state.desk
    responsibility: 同步适配器之一：层次视图变化后调用异步布局，按序号丢弃过期结果，把定位好的视图回填给派生数据；交出有没有进行中的布局（desk.layoutPending，画布首次适应等它，WS-3）。
    codeRefs: [src/state/sync/layout.ts]

  - id: state.layout.runner
    name: 布局入口与缓存
    summary: 按视图模式排出层次视图的坐标并缓存结果
    parent: state.layout
    responsibility: Layout 的入口（layout.ts，对外只经它引用）：layoutView 按视图模式分派给分层总览或普通层次排布；并集布局（L15）：结构边（StructureLinks）经 unionView 并入视图边、共用件的边与核心跨层边，与交互边一起交给排布，两个视角共用同一份布局与走线；表面展开不进排布（L20a②，ADR-0036）：先取收起态的布局，再由 expandSurface 在固定的节点上排端口点（surfaceDots）、散开的束在节点前分叉、每个点一支并停在点的边缘（tapRoute、fanLevels，dots.ts），换选中节点不动；结果按视图内容、结构边 ID 与布局算法版本（LAYOUT_VERSION）缓存；几何类型（点、盒子、走线、带坐标的视图与它的父模块框 parentFrame、系统框 frame）、节点尺寸与内容外框 contentBounds（含两种框，geometry.ts）。
    abstraction: 对外只经一个入口、按视图模式分派给两种排布，框外元素在排布后按方位另摆；两个视角共用同一份布局与缓存。
    codeRefs: [src/layout/layout.ts, src/layout/geometry.ts, src/layout/dots.ts]
  - id: state.layout.runner.layered
    name: 分层总览排布
    summary: 把分层总览按层分带排布并走好层间连线
    parent: state.layout.runner
    codeRefs: [src/layout/layered.ts]
    responsibility: '按层序自上而下分带，带内核心模块横向排开（含 +N 占位）；相邻层间的边走带间空隙里块与块之间的竖巷，跨多层的边走右侧通道；核心模块之间相邻层的跨层边画成曲线、跨多层的经空隙里自己的轨道到右侧核心车道（O3b）。带间空隙按穿过它的横段撑开（gapTracks：每条横段一条轨道，向上离开的、框外边的、向下离开的依次排，同车道号共用一条，O14、O15）；父模块框（根层即系统框）包住全部带与右侧通道；框外元素（用户在上、外部系统与时间在左、边界节点在下）按方位摆放，右侧只留层间关系线（O16），它们的边由 outsideRouter 正交走线：带按对端方位取顶边 / 左边 / 底边，核心模块上进下出、短桩到空隙里自己的轨道，再一起分轨（allocateTracks，L32）。标签按实际尺寸沿线挑不压块、文字区与同时画出的标签的位置（placeLabelBoxes，L33）。带内的共用件排在带底一行的共用件架（带随之加高，O9）。边界角色（L14）：role: port 的块一半压在带的上边（核心模块行随之下让），role: adapter 在带内最左一列、紧贴左侧标题栏（外部系统一侧）；关系边一律在该侧的前半错开，后半留给端口记号（L11、L13）。'
  - id: state.layout.runner.graph
    name: 普通层次排布
    summary: 用 elkjs 排布普通层次的子模块与连线
    parent: state.layout.runner
    codeRefs: [src/layout/graph.ts]
    responsibility: 用 elkjs layered 算法只排父模块框内的子模块与它们之间的边：正交走线、标签内联；每条边两端各有固定朝向的端口——上进下出（自左向右时左进右出），同一侧左动右静（动态关系在前半、静态在后半，FIXED_ORDER，L11）；框外边在内部节点那一端给不连线的占位端口一起排序，端口位置随布局给出；父模块框包住内部节点与走线并留出内边距，框外的元素在布局后按方位摆放（placeOutside，A7、L4）；elk 在浏览器的 Worker 中运行（无 Worker 环境用同步打包版）；结果过于狭长时再试自左向右，取宽高比更接近画布者。共用件不参与 elk，布局后由 placeShelf 收进父模块框底部一行的共用件架（框随之撑开，O9）；核心模块与「+N」占位按各自尺寸参与布局。关系全是交互（ADR-0029），出入点都排在该侧的前半：每个内部节点在进边一侧的末尾占一个半边长的保留端口（不连边，FIXED_ORDER 固定），留给端口记号（L11、L13）。边界角色（L14）不交给 elk，布局后由 placeRims 压在父模块框线上——port 一行横跨上边、adapter 一列横跨左边，按所连节点的位置排序，框线先向外让出半个节点；它们的边同框外边按需走线。布局后内部边的中间段再分一次轨（allocateTracks，L32），标签按画布实际写的把手角标估宽重新挑位置（placeLabelBoxes，L33）。
  - id: state.layout.runner.boundaries
    name: 框外元素与手工走线
    summary: 按方位摆放框外元素并给框外边手工走线
    parent: state.layout.runner
    codeRefs: [src/layout/routes.ts, src/layout/labels.ts]
    responsibility: 方位表示角色（A7、L4）：用户在系统框上方、外部系统与时间在系统框左侧（placeActors，ADR-0039），边界节点在父模块框下方一行、按视图给出的层次顺序（与时序图泳道一致），系统框包住父模块框与边界节点行（placeOutside）；方位固定在屏幕上，不随布局方向改变。普通层次中框外元素的边（参与者的边、边界边）不参与布局，要画时由 edgeRoute 按需正交绕行（routing 的 detour：用户底边、外部系统右边、边界节点顶边出入，选通道时避开已占的竖段（BusyLines），短桩不伸进对面的节点（clampStub），不穿节点，从目标的入口侧进入，同一节点上的多条边错开、同一起点的边各走一条横线；内部节点那一端取 elk 的占位端口，框外元素自身的端口同样左动右静）。画布每次只对当前画出来的那组框外边一起走线并分配轨道（outsideRoutes + routing 的 allocateTracks：走廊里重合或挨得太近的中间段按边 ID 分轨，内部边与框线只占不动、分轨后不穿节点，L32；placeLabelBoxes 按实际尺寸放标签，L33），按布局与可见集记忆。手工走线与编码工具也在这里（routes.ts）：回放临时线与叠加线的曲线 linkRoute、edgeLabel 只给聚合条数 ×N、edgeWeight 线宽档、标签位的词表与组装（labels.ts：EDGE_TAGS 分异常与修饰两级，composePill 画成至多两段、标签至多两个其余「+k」，labelWidth / pillWidth 估宽，L26、ADR-0041）、视图边的机制标签 mechTags（L35）、标签尺寸 labelSize（按两段的实际文字）与 elk 标签槽 slotSize（只按把手角标，机制标签不改走线，L33）、parallelOffsets 平行曲线错开、spreadEnds 平行边终点错开、elk 标签槽与离走线太远的标签坐标作废、isBoundaryEdge（L10），供排布与画布场景使用。L14：placeRims 把普通层次的边界角色压在父模块框线上；框线上的 port 对端在上方（用户）时走顶边、否则走底边，adapter 对端在左侧（外部系统）时走左边、否则走右边；关系边的出入点在该侧前半错开，后半留给端口记号（L11、L13）。

  # ── 模型层 ──────────────────────────────────────────────
  - id: model.pipeline.loader
    name: Loader
    summary: 解析描述文件、检查单文件格式并合并成模型
    parent: model.pipeline
    responsibility: 解析 YAML / JSON、按 JSON Schema 检查单文件格式（未知字段即报错）、把多个文件合并成一个模型并记录每个实体的出处（文件 / 路径 / 行号）；解析外部参与者、场景与嵌套步骤树（每个步骤记录路径与出处）；sourceLimits 只取第一处声明，重复时提醒（G20）；关系类型的旧名 event / dataflow 映射为 notifies（翻转两端）/ streams 并逐条提醒迁移（M12）；类型为 depends（M15，ADR-0026）与 implements（M17，ADR-0029：实现者已改写在接口的 implementedBy）的关系在格式检查前丢弃并逐条提醒——供读历史提交，文件不整份跳过；via 原样带入，旧的平铺取值由 Validator 读成四形态（M20）；场景的 kind 由 schema 校验（M19）。图解文件 explainers/*.html 不按 YAML 解析，原样记进模型（EX-1）。
    codeRefs: [src/model/load.ts]
  - id: model.pipeline.validator
    name: Validator
    summary: 跨文件检查引用、层次与场景的一致性
    parent: model.pipeline
    responsibility: '跨文件检查：ID 唯一、父模块存在且父链无环、关系端点有效、不连祖先与后代、接口 / 数据结构引用存在、层字段完整；检查外部参与者（ID 与模块不重复）与场景：消息端点是模块或参与者、引用的关系 / 接口 / 数据结构存在且与端点一致、步骤 id 在场景内唯一、ref 指向的场景存在且无循环引用；关系的机制与修饰（ADR-0029）：via 按四形态——旧的平铺取值读成 channel:<同名> / bus:<唯一的总线> / 端口未指明并提醒（M20），port:<P> 的 P 须是已声明的接口、bus:<M> 的 M 须是 role: bus 的模块，否则提醒并去掉（M11）；mode 只用于查询与委托、pull 只用于 streams，用错的提醒并去掉（M13）；notifies 的端点不得是角色为 bus 的总线（M14）；迁移期的 calls 读作未分类（info relation.unclassified，M17）；接口的 implementedBy 每项须是存在的模块，坏引用提醒并去掉、重复去重（M18）；被 via: port: 引用或写了实现者的接口标为端口（T0 裁决 4）；场景消息与对应关系的形态不一致时提醒（查询与委托按 mode、通知一律 async，S19）；查询的场景闭包里有委托或通知时提醒查询有副作用（U13，一对只报一次）。'
    principle: |
      不抛异常：error 级问题的实体被剔除，warning 级只去掉坏引用，返回一份可以安全建索引的模型和问题列表。

      步骤与结构一致性（规则 S5 / S5a）：
      - 引用了 relation：端点与方向必须与关系一致，否则 error；运行时关系的箭头是控制流方向，与消息同向，只有 return 反向比对（S12、ADR-0022）。
      - 没引用 relation：按 S13 推断（两端之间恰好一条运行时关系即认定）；推断不到且两端（及其祖先之间）结构上没有任何关系时报 warning「交互图中没有对应关系」。
      - 只对应四类交互（迁移期的未分类同查询 / 委托，S12）。
      - 消息形态与关系类型不一致（查询、委托与未分类按 mode：同步为 call、异步为 async；通知一律 async；return 与流不比）：warning，不改绑定（S19）。
    codeRefs: [src/model/validate.ts]
  - id: model.pipeline.indexer
    name: Indexer
    summary: 建立按 ID 与层次查询的索引结构
    parent: model.pipeline
    responsibility: 建立按 ID 查询的结构：模块 / 关系 / 接口 / 数据结构 / 参与者 / 场景表、子模块表（层按 order 排序）、根到模块的路径、出入边表、模块 → 涉及它的场景、参与者 → 由它触发的场景（触发者 = 第一条消息的发送方，规则 A6）；提供最近公共祖先、最近仍存在的祖先等查询。
    codeRefs: [src/model/indexer.ts]
  # 以下三个是 project.ts 内的概念划分，文件归 Projector
  - id: model.projector.endpoints
    name: 端点映射
    summary: 把关系两端映射到当前层次的节点
    parent: model.projector
    responsibility: 把关系两端映射到「当前父模块下的直接子模块」、系统内的边界节点或系统外的参与者，并按开关（只看现状、关系类型）过滤可见性；导出为公共函数 mapEndpoint，供场景投影映射帧端点。
    principle: |
      - 两端落在不同子模块：恰好是子模块本身 → 直接边，否则 → 聚合边；
      - 两端落在同一子模块：属于更深层次，不画；
      - 一端在外部：提升为「最近公共祖先下、它那一侧的子模块」作为边界节点。
  - id: model.projector.collector
    name: 边汇总
    summary: 把映射后的关系汇总成按类型聚合的视图边
    parent: model.projector
    responsibility: 把映射后的关系按 (from, to, type) 收集成视图边（L5）：同一对节点之间不同类型（四类交互，迁移期的未分类单成一类）的关系各成一条，同类型内聚合并记条数（L2）；汇总同步 / 异步（通知一律异步）；按 mechanismOf 记每个机制的条数（mechs，L35，ADR-0041）。
  - id: model.projector.overview
    name: 分层总览
    summary: 为全是层的父模块产出带与核心跨层边
    parent: model.projector
    responsibility: '子模块全是层时产出带（层序、核心模块、隐藏数）与核心跨层边（端点落到核心模块，否则落到层）；role: port / adapter 的第二级模块同核心模块常显在带内、不折叠进「+N」，视图节点带边界角色（L14）。'
  - id: model.projector.hierarchy
    name: 层次顺序与公共祖先
    summary: 给出模块的层次排序键与最近公共祖先
    parent: model.projector
    responsibility: 模块在层次中的排序键 hierarchyKey（P9、L4）：从根下到模块的路径上每一级一项，层按 order、其他按描述顺序；逐项比较即得层次顺序，同一父模块的模块相邻、上层在前、祖先在后代之前。投影按它排边界节点，时序模型按它排泳道；两个模块的最近公共祖先 lowestCommonAncestor（N3 定位关系、S9 场景所在层次）。

