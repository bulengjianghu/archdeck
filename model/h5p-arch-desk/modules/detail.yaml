  - id: present.canvas.edges
    name: 边组件
    summary: 按统一的视觉编码画出关系边与箭头
    parent: present.canvas
    responsibility: 按 Layout 给出的走线画边：折线带圆角或竖向 S 形曲线；颜色、线宽、线型的映射在 edgeStyle，箭头 marker 在 ArrowMarker（大小随线宽档，线在箭头处回缩），都与图例的示意线共用；折线在跳点处插半圆小桥（L11）。一个视觉通道只表一个维度（L10、ADR-0018、ADR-0029）：颜色 = 关系类型（四类各一色相——查询低饱和且半透明，只「淡」不「细」；委托实色；迁移期的未分类中性灰）；线型 = 行为还是依赖（L18、ADR-0035：交互与回放临时线实线，代码依赖叠加线、组装叠加、承载缺段虚线并用依赖的端点记号 UmlMarker）；箭头自画 marker——同步实心、异步空心「V」；插座 = 经端口（L12，目标端与箭头叠放）；线宽 = 聚合条数三档；标签位（L26）画成 pill，含异常时用警示色。晕：违规红晕优先于设计变更底色，选中为强调色窄晕（不改线宽），回放当前步骤为宽晕并沿方向流动（P10）；走过的边不加粗。结构视角的边见子模块「结构边」（UML 惯例，ADR-0031 裁决 D）。临时线：经由上层关系为关系类型色的虚线（P15），未建模为红色虚线（P11）；组装叠加线为组装专用色的点划线（O12）。
    abstraction: 一个视觉通道只表一个维度，样式映射集中一处、与图例示意线共用；结构边与插座记号各自成件。
    codeRefs: [src/components/edges/**]
