  - id: present.panel.dispatch
    name: 面板分派
    summary: 按当前选中挑出唯一一张对象面板
    parent: present.panel
    responsibility: 按选中选择面板（V2）：结构 / 交互视角下为选中的对象，无选中时为当前父模块（根层为系统）；第二十二轮起面板住视图区（抽屉已删，LY-16）：「描述」标签里是核对卡以外的部分（面板头是一行操作，不写名称与 ID），「核对」标签里只留核对卡与系统 / 层的汇总卡（PANEL_PART 注入给各面板与卡片，LY-13）；回放中选中步骤 / 场景时不渲染步骤 / 场景面板（它们住描述标签的步骤节），只给一行指向步骤节；选中模块 / 关系 / 聚合边 / 参与者 / 文件时为该对象的面板；没有「已钉住」之类的提示（ADR-0012）。选中端口（L13）时为端口面板（K11）；结构视角下选中依赖边（sel=d:）时为代码依赖面板，其下是这对节点的结构边（present.panel.structure，ADR-0031）。回放中选中模块、关系、聚合边、参与者、端口或系统时，把运行信息注入各对象理解卡的首节（RUN_FIRST，V6），对象面板不引用运行信息。属性栏的卡片样式（卡里的节去掉面板级分隔、头部粘顶）在这里统一。草图画布下整个面板换成草图面板（present.panel.sketch）。
    codeRefs: [src/components/panel/Panel.vue]
  - id: present.panel.module
    name: 模块面板
    summary: 用五问讲清一个模块，并核对它的描述与健康
    parent: present.panel
    abstraction: 头部、理解、核对、相关资料各一个组件：理解卡只读契约字段与协作查询，核对卡只组合现有派生，证据节原样做核对卡的清单。
    responsibility: 模块面板（ADR-0053；第十八轮走查修订 ADR-0060）：头部（名称、进入 / 在此设计、徽标槽位表 V15a、设计说明）；理解卡（ModuleUnderstand）按六问、意图在先——是什么（summaryOf，回退标「待提炼」，职责全文行内展开）、不是什么（excludesOf 一行，去向是链接，M33）、怎么分（原则全文；声明了分层时每层「层名 · 层的问题」加归属判定一句与成员名；未声明时写明并按 desk.facts.childTiers 的依赖深度分组列成员名，只列名字、一句话在悬停；层模块另有「层的问题与包含」折叠与可依赖链接）、守住什么（invariantsOf，ADR 链接在资料区预览）、对外表面（接口名全文一行，用途在悬停，单击展开 InterfaceItem，超 5 收「+N」）、协作（缺省折叠为一行「← N · → M」；ModuleCollab：desk.facts.collaborations 按方向与对端合并，目的全文、类型在悬停，单击目的逐条展开，悬停写 hoverRelations 让画布高亮承载的边，PC-4、PC-5）；标题的视觉权重不低于正文、界面不截字（PC-13）；回放中理解卡首节为分派注入的运行信息（V6）；核对卡（ModuleCheck）六行——证实、治理、表面、拆分（含子模块超七个未声明分层的 ST-1 提示）、演化、确认（moduleCheckRows，条目文字按名称写好、单击跳到清单或选中关系；条目全卡缺省至多 8 条，其余一键全部），清单整块收进「证据与清单 · N」缺省折叠（CheckCard），里面为交互证据、源代码文件、提交历史、结构指标与表面元素（结构视角）、端口、架构治理、拆分信号、代码事实 · 知识、相关决策、实现原理、核心数据结构、代码与文档引用、确认改动与确认表单（PC-6–PC-8）；画布单击本模块的表面元素时展开核对卡与「表面元素」清单（C9，跳转自动打开祖先折叠）；相关资料卡列图解与参与的场景，多于 3 份时缺省收起（PC-9）。卡片与折叠块的展开态不跨选中保持。
    codeRefs: [src/components/panel/ModulePanel.vue, src/components/panel/ModuleUnderstand.vue, src/components/panel/ModuleCollab.vue, src/components/panel/ModuleCheck.vue]
  - id: present.panel.relation
    name: 关系面板
    summary: 按维度说明一条关系的两端、语义与机制
    parent: present.panel
    responsibility: 关系的两端与类型；「关系」一节按维度各一行——控制流、知识（由代码事实给出：同向 / 反向 / 经端口——发起方只知道端口、接收方是它的实现者 / 不判定，K5b；旁标两端之间的子类与组装事实，K12、K13）、语义（查询 / 委托 / 通知 / 流，ADR-0029）、同步性（通知一律异步，查询与委托按 mode）、机制（直接 / 端口 / 总线 / 通道，标题处另标「经 …」与拉取）、平面（ADR-0022）；经由接口、交换的数据结构；不在当前视图时提供「定位到所在层次」。三卡（PC-10）：理解卡先给目的（purposeOf，回退标待提炼），再是说明与上述维度、接口与数据；核对卡为证实与承载两行，清单为代码事实与承载；相关资料卡列经过它的场景（desk.run.scenariosOfRelation）。
