# 第二级之下的子模块、关系、接口与数据结构。

modules:
  - id: model
    name: 模型层
    summary: 把描述变成校验过的模型，并回答被描述系统的架构查询
    invariants:
      - 外部依赖只有 yaml 与 ajv，不依赖 Vue、DOM、布局库与 Node 文件系统
      - 不引用视图状态层、布局与呈现层的任何文件
      - loadModel 依次串起 Loader、Validator、Indexer 并合并各步的问题
  - id: access
    name: 接入层
    summary: 把磁盘上的描述、源码与治理数据交给页面和命令行
    invariants:
      - 只引用模型层，不引用视图状态层、布局与呈现层
      - 调用外部命令只经 execFileSync 调 git，不经 shell
  - id: state
    name: 视图状态层
    summary: 决定一次浏览看哪里、选中什么、走到哪步、怎么摆
  - id: present
    name: 呈现层
    summary: 把架构描述画成可下钻、可点选、可回放的工作台界面
    invariants:
      - DeskState 全仓只由项目视图创建并 provide，其余组件经 inject 取用
      - 只有项目列表、项目视图与 httpSource 发 HTTP 请求，其余组件不碰网络
      - 组件不给视图状态赋值，改状态只调 DeskState 的操作
  # ── 骨架模块的代码落点（04 §3.10：骨架只写目录级，细到文件的由 AI 在这里补充，X1）──
  - id: present.shell
    name: 应用外壳与路由
    summary: 按地址打开项目列表或某个项目的某个版本
    abstraction: 外壳只按路由选页，切换项目或版本时整块重建视图，自身不持有任何浏览状态。
    principle: 全局样式里有一组卡片设计变量（--card-*）与 .desk-card / .desk-pill（CD-1，ADR-0057）：属性卡片、图例、画布角与缩放、回放胶囊都用它。
    codeRefs: [index.html, env.d.ts, src/main.ts, src/App.vue, src/styles.css]
  - id: present.project-list
    name: 项目列表主页
    summary: 列出全部项目的健康度与推进中的设计，点击进入
    abstraction: 只读接入层附好健康度的项目摘要，健康度在前、规模在后，自身不加载任何项目的描述。
    invariants:
      - 只请求 projects.json 一个端点，不加载任何项目的描述
      - 不注入 DeskState，与项目视图的会话状态无关
    codeRefs: [src/components/ProjectList.vue]
  - id: present.version
    name: 版本切换与设计信息条
    summary: 标明当前版本，提供切换、对比与新建设计的入口
    abstraction: 项目菜单收「对项目做什么」（版本、编辑骨架、新建设计、所有项目），信息条按「这是哪个版本、能做什么、和谁比」三问分区；各区只调 DeskState 的操作。
    principle: 项目菜单（ProjectMenu）在导航顶部（TB-6，ADR-0057）：项目名 ▾，菜单里版本切换（VersionSwitcher）的下拉原样沿用——选中后只显示名称，kind 用图标，草图选项为「✎ 名称」（F-63）——另有编辑骨架、新建设计（经 openNewDesign 打开同一个对话框）、所有项目；信息条按三区拆成子模块（身份、动作、对比，F-60–F-62），另有「在此设计」的新建设计对话框。
    codeRefs: [src/components/VersionSwitcher.vue, src/components/ProjectMenu.vue]
  - id: present.canvas
    name: 画布
    summary: 把当前层次画成可平移缩放点选的结构图并叠加回放
    abstraction: 画什么全由画布场景给出，画布只渲染并上交手势；节点、边与图例按视觉元素切分，共用同一套样式映射。
    excludes: [算节点与边的位置 → state.layout, 持有选中与视图状态 → state.desk]
    invariants:
      - { text: 节点与边全由 Layout 的 canvasScene 纯函数产出，组件不自己算位置与显隐, adr: 13 }
      - 单击、双击、悬停只转成 DeskState 的操作，不直接改视图状态
    codeRefs: [src/components/GraphCanvas.vue, src/components/nodes/**, src/components/edges/**, src/components/stage/**]
  - id: present.nav
    name: 导航
    summary: 在画布左上角标出所在层次与状态，并按名称搜索跳转模块
    abstraction: 画布标题行管「我在哪」（面包屑与问题、源码、版本胶囊），搜索面板管「跳到哪」，都只发导航意图，不持有状态。
    principle: 「我在哪」贴着画布放（C6，ADR-0057）：标题行在模型画布左上角，面包屑以「根层」开头；搜索由工具栏的 ⌕ 或 ⌘K 打开，在工具栏中央下拉（TB-4、TB-7）。
    codeRefs: [src/components/Breadcrumb.vue, src/components/SearchPalette.vue, src/components/CanvasTitle.vue]
  - id: state.desk
    name: DeskState
    summary: 持有一个项目版本的视图状态并提供唯一一组操作
    abstraction: 一个协调者持有视图状态，dispatch 是唯一写入口；派生按领域分组且只读，与外界的往来全放在同步适配器里。写入口与派生按接线端口（desk/ports.ts：写入、对比基线、源码同步的形状）读写外界，端口归协调者、由同步适配器实现（ADR-0052 的分层：同步适配器 → 写入口 → 派生）。
    excludes: [读写文件与网络 → access.model-source, 布局与几何 → state.layout, 改状态的规则 → state.transition]
    invariants:
      - 视图状态只在 dispatch 一处赋值，新值由视图状态转移算出
      - { text: 派生与写入口不引用同步适配器，只经 desk/ports 的端口与外界往来, adr: 52 }
      - 只在路由同步里调用路由，协调者只引用它的类型
    # sync/workspaceMemory.ts（工作区的本机记忆，ADR-0064）暂归协调者本身：成为「同步适配器」层的成员要改人拥有的 intent/strata.yaml（arch own，留给人）
    codeRefs: [src/state/useDeskState.ts, src/state/inject.ts, src/state/desk/intent.ts, src/state/desk/ports.ts, src/state/sync/workspaceMemory.ts]
  - id: access.model-source
    name: ModelSource 插件
    summary: 以同源端点提供描述与源码，并按项目推送变更
    abstraction: 只把读取、写入、源码与治理各模块挂成同源端点并按项目推送变更，自身不解析描述。
    invariants:
      - { text: 写端点只收同源的 JSON POST：异源 403、非 JSON 415, adr: 19 }
      - 自身不读写磁盘，读取、写入、源码与治理都委托给各存取件
      - 变更推送按项目区分，载荷只带项目名
    codeRefs: [vite/archModelPlugin.ts, vite/readHealth.ts, vite.config.ts]
  - id: access.reader
    name: 描述读取
    summary: 发现项目与版本，读出描述原文与项目摘要
    abstraction: 按目录约定发现项目与版本、只搬运文本，描述的含义一律交给模型层的 loadModel 解释。
    invariants:
      - 只读：读描述与读 git 快照都不写任何文件
      - git 经 execFileSync 调用、提交号只收十六进制，不经 shell
      - 读当前版本时跳过 designs/ 与 governance/，随描述带上的只有 YAML / JSON 与图解 explainers/*.html（EX-1）
    codeRefs: [vite/readModelDir.ts, vite/readGit.ts]
  - id: access.lint
    name: 命令行校验
    summary: 在命令行校验全部描述与治理门禁，出错时非零退出
    abstraction: 与页面共用同一套模型层函数，命令行只负责遍历目录、输出位置与退出码，不另立规则。
    principle: 摘要给出未分类关系的条数与其中核心之间的条数（M17），以及有实现者的端口、子类、组装与组装根（K5c、K12、K13）；设计版本没有代码事实（K8），端口孤立只按描述判定（U14）。
    codeRefs: [scripts/lint-model.ts]
  - id: model.types
    name: 类型与 Schema
    summary: 定义描述的形状、数据类型与契约字段的取值
    abstraction: 按「形状 / 查表谓词 / 单实体取值」切分：只看一个实体或一张表，不含跨实体的计算，是呈现层唯一可依赖的模型层契约。
    invariants:
      - types.ts 不引用任何模块，契约文件之间只互相引用
      - 不引用加载、投影、治理等计算模块
    adrs: [22, 26]
    codeRefs: [src/model/types.ts, src/model/names.ts, src/model/project-summary.ts, src/model/design.ts, src/model/scenario/types.ts, src/model/source/types.ts, src/model/governance/types.ts, src/model/intent/types.ts, src/model/rework/types.ts, src/model/review/types.ts, src/model/evolution/types.ts, src/model/contract.ts, schema/arch-file.schema.json]
  - id: model.pipeline
    name: 加载流水线
    summary: 把描述文本解析、校验并建成可查询的索引
    abstraction: 按阶段单向串联：Loader 只管单文件、Validator 只管跨文件、Indexer 只建查询结构；各步自报问题，汇总在模型层入口。场景的步骤与绑定取场景语义，与校验共用同一份语义。
    invariants:
      - Loader 与 Indexer 不引用其他阶段，只有 Validator 借 Indexer 做跨文件查询
      - { text: 校验与建索引只依赖场景语义，不依赖场景投影, adr: 51 }
      - 各步只返回问题、不抛异常，问题汇总在 loadModel
    codeRefs: [src/model/load.ts, src/model/validate.ts, src/model/indexer.ts]
  - id: model.projector
    name: Projector 层次投影
    summary: 算出当前层次要画的节点、边与分层总览
    abstraction: 按投影步骤切分：先映射端点、再汇总成边，层次顺序作共用查询；只产出 LevelView，不知道坐标。
    invariants:
      - 只依赖类型与名称查询，不引用场景、治理等其他模型子模块
      - 产出的 LevelView 只有节点、边与带，不含坐标
    principle: 边界角色（L14，ADR-0030）：role 为 port / adapter 的模块同核心常显、不折叠进「+N」也不算普通模块，视图节点带 rim 标记，由 Layout 压在框的上边 / 左边（adapter 随外部系统在左，ADR-0039）；视图边仍按 (from, to, type) 分（L5），类型为四类交互。
    codeRefs: [src/model/project.ts]
  - id: model.diff
    name: 版本对比
    summary: 逐字段比出设计版本相对对比基线的增删改
    abstraction: 只按 ID 逐字段比对两份索引，输出差异与涉及数，不读文件、不解释变更原因。
    codeRefs: [src/model/diff.ts]
  - id: present.panel
    name: 属性面板
    summary: 显示选中对象的详情并发起人拥有文件的写入
    abstraction: 选中是唯一主语：按选中只挑一张对象面板，每张都是头部加理解、核对、相关资料三卡；三卡骨架归面板自身，各面板只读派生数据、共用内容块，写入只经 DeskState 发起。
    invariants:
      - { text: 对象面板只由 Panel.vue 按 desk.selected 挑一张，别处不挂对象面板, adr: 12 }
      - { text: 写入人拥有的文件只经 desk.write 发起，面板不直接发请求, adr: 19 }
      - { text: 核对卡的分项与计数只取现有派生，不新算, adr: 53 }
    principle: 卡片直接立在画布上（CD-1–CD-6，ADR-0057）：每个对象面板的头部是身份卡（.id-card，名称 / ID 与徽标 / 动作三行，粘在选中抽屉滚动区上沿，ADR-0061 / ADR-0062），面板是实底抽屉：缺省收起、宽度够时挤压画布、不够时浮在画布右侧（第二十轮读先版式取代 CD-2「卡片立在画布上」）；理解叙述在辅助栏的理解页（ModuleDoc：事实卡 + 故事），原抽屉理解卡与名称胶囊 / CD-4 已移除。卡片外观取共用样式的 --card-* 变量，设计说明、出处等散块也成卡。三卡骨架（ADR-0053）由面板自身持有、各对象面板共用——卡片 PanelCard（卡头结论、缺省展开态、定位请求时展开；理解卡首节渲染分派经 RUN_FIRST 注入的运行信息，V6）、核对卡 CheckCard（分项一行一个状态加结论，⚠ 行下平铺条目至多 5 条、单击跳到清单或选中关系，清单插槽）、相关资料卡 RelatedCard（图解与场景，单击预览、双击固定、已打开标记；图解有无由 HAS_EXPLAINER 注入，W5 接入）、ADR 编号链接 AdrLink；分项的纯函数在 panelCheck（checkSummary、moduleCheckRows、rowsFromNotices、relationTypeLabel，PC-2、PC-6、PC-10），注入键在 related。层面板与环面板也直接归面板自身。
  - id: present.shared
    name: 呈现共用件
    summary: 为各呈现子系统提供共用文案、代码高亮与注入入口
    abstraction: 只放被多个呈现子系统共用的叶子，自身不依赖任何呈现子系统，避免取用方与提供方成环。
  - id: state.layout
    name: Layout
    summary: 给层次视图与时序模型算出坐标与走线
    abstraction: 按画什么切分排布，入口唯一并按内容缓存；只算坐标与画面数据，不知道层次规则。
    invariants:
      - 只引用模型层与 elkjs，不依赖 Vue 与视图状态层
      - 布局结果按视图内容的键缓存，同一输入复用同一份结果
      - 浏览器里 elk 在 Worker 中运行，无 Worker 环境退回同步版

  # ── 呈现层 ──────────────────────────────────────────────
  - id: present.canvas.flow
    name: 视图转换与交互
    summary: 把画布场景交给 Vue Flow 渲染，并把手势转成操作
    parent: present.canvas
    responsibility: 把 Layout 的画布场景（canvasScene：节点与边的数据、显隐、变淡、回放态与选中突出）写入 Vue Flow 的 store；把单击 / 双击 / 悬停转成 DeskState 操作；切换层次后按布局外框适应画布。画什么不在这里算（ADR-0013）。单击「+N」临时展开 / 收起（分层总览与普通层次同一手势，O6、O8）；普通层次没有核心而普通模块超过七个时在画布角提示「N 个模块，考虑标出核心」。画布角另有「隐藏必留痕」（L45，第十五轮 G13）：关系类型筛选「隐藏 N 类关系」（交互视角）、「只看现状」「目标态 N 个模块已隐藏」、「代码事实」已关「隐藏 N 处标记」（desk.facts.hiddenFacts）、「只看现状」（desk.facts.hiddenByCurrentOnly，波 3 起 经状态层取数，呈现层不直接调模型层的计算，U10）等计数按钮，单击撤销对应开关（结构视角既有的只引类型 / 值使用 / 已解释三钮同区）。把端口记号（L13）、组装叠加线与组装根（O12）交给画布场景；单击组装叠加线落到这对节点的代码依赖（K10）。
    principle: |
      - **写 store 而非传属性**：节点与边通过 setNodes / setEdges 写入；属性同步在「上一层有选中、切回总览」时会被跳过。
      - **适应画布**：内容外框直接取自布局结果，不依赖 Vue Flow 对节点尺寸的测量，只等画布容器有尺寸；回放隐藏静态内容时只取画布场景给出的可见节点；切换层次、画布容器尺寸变化（进入回放、切换分屏方向、拖动分隔条、折叠两侧栏）、代码事实读到后（结构边进布局重排一次，L15）重新适应。首次适应（WS-3）：布局同步没有进行中的请求、代码事实不在读取中、容器尺寸与悬浮避让连续两帧不变之前画布透明，满足后只适应一次再显示（4 秒兜底）。
      - **点击含义**：单击节点 / 边 = 选中（回放同样，V3）；双击 = 下钻或跳到边界节点所在层次；单击边上的步骤序号 = 指向这一步，即选中它（R13）；单击分支预览序号 = 选这一支。
      - **交互关系显示方式**：在工具栏「显示 ▾」切换隐藏 / 淡显 / 全显（V8、L49），值来自舞台显示（按项目记在本地）。
    codeRefs: [src/components/GraphCanvas.vue]
  - id: present.canvas.nodes
    name: 节点组件
    summary: 按种类画出模块、边界、参与者、带等节点与角标
    parent: present.canvas
    responsibility: '七种节点：模块（职责摘要、可下钻标识、目标态虚线）、边界（系统内、本层外的模块与所在路径）、外部参与者（用户 / 外部系统 / 时间图标，系统外）、边界框（系统框与当前父模块框，FrameNode）、带（层名、抽象原则、可依赖层）、核心模块小块、「+N 个其他模块」占位；设计版本中新增 / 修改描边与「△N」变更角标。分级（ADR-0027）：普通层次的核心模块画成大块，共用件画成架上的紧凑块（SharedNode，O9），用到共用件的节点右上角「共用 ×N」角标（O10），父模块框与带右上角常驻「共用件 N · 折叠 M」并标出架的「共用件」字样（O11）；普通层次的「+N」占位双击无动作（O8）。边界与端口（ADR-0029、ADR-0030）：role: port / adapter 的模块名后带边界角色记号（L14），模块、核心小块与边界节点骑着端口记号（L13）；节点角标统一布局（DiffMark）——上边框左侧为新增 / 修改、「△N」与「组装根」角标（O12），上边框右半为端口记号，顶边有端口记号时环编号与「共用 ×N」移到下边框、热度色块让到左下角。；有图解的模块（模块、核心、带）名称行加一枚 ▣，单击以预览打开图解、双击固定、不改选中，回放与草图编辑态不显示（EX-5）'
    abstraction: 一种节点一个组件，角标共用统一的布局；只画画布场景给的数据，指标与端口不自己算。
    codeRefs: [src/components/nodes/**]
  - id: present.canvas.nodes.ports
    name: 端口记号
    summary: 在节点上标出端口并支持单击选中端口
    parent: present.canvas.nodes
    adrs: [29]
    responsibility: 节点定义的端口记号（L13，ADR-0029）：骑在进边一侧（顶边，普通层次自左向右布局时为左边）的后半，每个端口一个小记号（插座半圆 + 实现者数，没有实现者的标出），超过 3 个合成一个「端口 ×N」；单击端口即选中它（V2，URL sel=p:<接口 ID>），单击合成的记号选中定义模块（面板「端口」一节逐个列出）。不参与布局：位置是布局在进边一侧后半留出的保留端口（L11）。
    codeRefs: [src/components/nodes/PortMarks.vue]
  - id: present.canvas.nodes.rim
    name: 边界角色记号
