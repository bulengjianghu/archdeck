    responsibility: 结构视角下「显示」面板的图例组（L19、D-26，ADR-0031）：「依赖 · 形态与档」——元素级边四种形态的端点记号（全部虚线，ADR-0035）与醒目度（例外深色加宽、骨架安静中灰，L43），依赖的三档在画布上不区分明度——只引类型用点线（L43），交互使用与值使用悬停与面板写明；只引类型 / 只看交互使用 / 只看未解释 / 总是展开表面四个开关（带收起计数）在设置块「结构筛选与表面」组（L45，第十五轮 G13 迁出），组标题旁互指；收起与例外的计数——跨界折叠（B2）、例外照画、环按组、「另直连 N」（L42）；表面一段——表面 W 角标、元素四类、+N 封顶、越过入口、界外（L20）；「规则叠加」——违规红晕、允许边浅虚线（U15、U16）；「指标 · 不稳定度与共用件」——入 Ca · 出 Ce 角标、不稳定度三档色条与阈值、共用件折叠（K16、L17、O13）。示意线由 StructureSwatch 按与边组件共用的 depStyle 画出、颜色取 styles.css 的同一套变量；没有代码事实时只说明允许依赖图（U16）。
