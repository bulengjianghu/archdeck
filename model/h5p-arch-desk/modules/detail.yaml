# 第二级之下的子模块、关系、接口与数据结构。

modules:
  # ── 骨架模块的代码落点（04 §3.10：骨架只写目录级，细到文件的由 AI 在这里补充，X1）──
  - id: present.shell
    name: 应用外壳与路由
    abstraction: 外壳只按路由选页，切换项目或版本时整块重建视图，自身不持有任何浏览状态。
    codeRefs: [index.html, env.d.ts, src/main.ts, src/App.vue, src/styles.css]
  - id: present.project-list
    name: 项目列表主页
    abstraction: 只读接入层附好健康度的项目摘要，健康度在前、规模在后，自身不加载任何项目的描述。
    codeRefs: [src/components/ProjectList.vue]
  - id: present.version
    name: 版本切换与设计信息条
    abstraction: 信息条按「这是哪个版本、能做什么、和谁比」三问分区，新建设计另成入口；各区只调 DeskState 的操作。
    principle: 版本切换（VersionSwitcher）在这一级：选中后只显示名称，kind 用图标，草图选项为「✎ 名称」（F-63）；信息条按三区拆成子模块（身份、动作、对比，F-60–F-62），另有「在此设计」的新建设计对话框。
    codeRefs: [src/components/VersionSwitcher.vue]
  - id: present.canvas
    name: 画布
    abstraction: 画什么全由画布场景给出，画布只渲染并上交手势；节点、边与图例按视觉元素切分，共用同一套样式映射。
    codeRefs: [src/components/GraphCanvas.vue, src/components/DisplayPanel.vue, src/components/nodes/**, src/components/edges/**, src/components/stage/**]
  - id: present.nav
    name: 导航
    abstraction: 面包屑管「在哪一层」、工具栏管「跳到哪」，两者都只发导航意图，不持有状态。
    codeRefs: [src/components/Breadcrumb.vue, src/components/Toolbar.vue]
  - id: state.desk
    name: DeskState
    abstraction: 一个协调者持有视图状态，dispatch 是唯一写入口；派生按领域分组且只读，与外界的往来全放在同步适配器里。写入口与派生按接线端口（desk/ports.ts：写入、对比基线、源码同步的形状）读写外界，端口归协调者、由同步适配器实现（ADR-0052 的分层：同步适配器 → 写入口 → 派生）。
    codeRefs: [src/state/useDeskState.ts, src/state/inject.ts, src/state/desk/intent.ts, src/state/desk/ports.ts]
  - id: access.model-source
    name: ModelSource 插件
    abstraction: 只把读取、写入、源码与治理各模块挂成同源端点并按项目推送变更，自身不解析描述。
    codeRefs: [vite/archModelPlugin.ts, vite/readHealth.ts, vite.config.ts]
  - id: access.reader
    name: 描述读取
    abstraction: 按目录约定发现项目与版本、只搬运文本，描述的含义一律交给模型层的 loadModel 解释。
    codeRefs: [vite/readModelDir.ts, vite/readGit.ts]
  - id: access.lint
    name: 命令行校验
    abstraction: 与页面共用同一套模型层函数，命令行只负责遍历目录、输出位置与退出码，不另立规则。
    principle: 摘要给出未分类关系的条数与其中核心之间的条数（M17），以及有实现者的端口、子类、组装与组装根（K5c、K12、K13）；设计版本没有代码事实（K8），端口孤立只按描述判定（U14）。
    codeRefs: [scripts/lint-model.ts]
  - id: model.types
    name: 类型与 Schema
    abstraction: 只放形状与只查表的小谓词、不含计算，是呈现层唯一可依赖的模型层契约。
    adrs: [22, 26]
    codeRefs: [src/model/types.ts, src/model/names.ts, src/model/project-summary.ts, src/model/design.ts, src/model/scenario/types.ts, src/model/source/types.ts, src/model/governance/types.ts, src/model/intent/types.ts, src/model/rework/types.ts, src/model/review/types.ts, src/model/evolution/types.ts, schema/arch-file.schema.json]
  - id: model.pipeline
    name: 加载流水线
    abstraction: 按阶段单向串联：Loader 只管单文件、Validator 只管跨文件、Indexer 只建查询结构；各步自报问题，汇总在模型层入口。场景的步骤与绑定取场景语义，与校验共用同一份语义。
    codeRefs: [src/model/load.ts, src/model/validate.ts, src/model/indexer.ts]
  - id: model.projector
    name: Projector 层次投影
    abstraction: 按投影步骤切分：先映射端点、再汇总成边，层次顺序作共用查询；只产出 LevelView，不知道坐标。
    principle: 边界角色（L14，ADR-0030）：role 为 port / adapter 的模块同核心常显、不折叠进「+N」也不算普通模块，视图节点带 rim 标记，由 Layout 压在框的上边 / 左边（adapter 随外部系统在左，ADR-0039）；视图边仍按 (from, to, type) 分（L5），类型为四类交互。
    codeRefs: [src/model/project.ts]
  - id: model.diff
    name: 版本对比
    abstraction: 只按 ID 逐字段比对两份索引，输出差异与涉及数，不读文件、不解释变更原因。
    codeRefs: [src/model/diff.ts]
  - id: present.panel
    name: 属性面板
    abstraction: 选中是唯一主语：按选中只挑一张对象面板；各面板只读派生数据、共用内容块，写入只经 DeskState 发起。
  - id: present.shared
    name: 呈现共用件
    abstraction: 只放被多个呈现子系统共用的叶子，自身不依赖任何呈现子系统，避免取用方与提供方成环。
  - id: state.layout
    name: Layout
    abstraction: 按画什么切分排布，入口唯一并按内容缓存；只算坐标与画面数据，不知道层次规则。

  # ── 呈现层 ──────────────────────────────────────────────
  - id: present.canvas.flow
    name: 视图转换与交互
    parent: present.canvas
    responsibility: 把 Layout 的画布场景（canvasScene：节点与边的数据、显隐、变淡、回放态与选中突出）写入 Vue Flow 的 store；把单击 / 双击 / 悬停转成 DeskState 操作；切换层次后按布局外框适应画布。画什么不在这里算（ADR-0013）。单击「+N」临时展开 / 收起（分层总览与普通层次同一手势，O6、O8）；普通层次没有核心而普通模块超过七个时在画布角提示「N 个模块，考虑标出核心」。画布角另有「隐藏必留痕」（L45，第十五轮 G13）：关系类型筛选「隐藏 N 类关系」（交互视角）、「只看现状」「目标态 N 个模块已隐藏」、「代码事实」已关「隐藏 N 处标记」（desk.facts.hiddenFacts）、「只看现状」（desk.facts.hiddenByCurrentOnly，波 3 起 经状态层取数，呈现层不直接调模型层的计算，U10）等计数按钮，单击撤销对应开关（结构视角既有的只引类型 / 值使用 / 已解释三钮同区）。把端口记号（L13）、组装叠加线与组装根（O12）交给画布场景；单击组装叠加线落到这对节点的代码依赖（K10）。
    principle: |
      - **写 store 而非传属性**：节点与边通过 setNodes / setEdges 写入；属性同步在「上一层有选中、切回总览」时会被跳过。
      - **适应画布**：内容外框直接取自布局结果，不依赖 Vue Flow 对节点尺寸的测量，只等画布容器有尺寸；运行视角隐藏静态内容时只取画布场景给出的可见节点；切换层次、画布容器尺寸变化（进入运行视角、切换分屏方向、拖动分隔条、折叠两侧栏）、代码事实读到后（结构边进布局重排一次，L15）重新适应。
      - **点击含义**：单击节点 / 边 = 选中（运行视角同样，V3）；双击 = 下钻或跳到边界节点所在层次；单击边上的步骤序号 = 指向这一步，即选中它（R13）；单击分支预览序号 = 选这一支。
      - **交互关系显示方式**：在「显示」面板切换隐藏 / 淡显 / 全显（V8），值来自舞台显示（按项目记在本地）。
    codeRefs: [src/components/GraphCanvas.vue]
  - id: present.canvas.nodes
    name: 节点组件
    parent: present.canvas
    responsibility: '七种节点：模块（职责摘要、可下钻标识、目标态虚线）、边界（系统内、本层外的模块与所在路径）、外部参与者（用户 / 外部系统 / 时间图标，系统外）、边界框（系统框与当前父模块框，FrameNode）、带（层名、抽象原则、可依赖层）、核心模块小块、「+N 个其他模块」占位；设计版本中新增 / 修改描边与「△N」变更角标。分级（ADR-0027）：普通层次的核心模块画成大块，共用件画成架上的紧凑块（SharedNode，O9），用到共用件的节点右上角「共用 ×N」角标（O10），父模块框与带右上角常驻「共用件 N · 折叠 M」并标出架的「共用件」字样（O11）；普通层次的「+N」占位双击无动作（O8）。边界与端口（ADR-0029、ADR-0030）：role: port / adapter 的模块名后带边界角色记号（L14），模块、核心小块与边界节点骑着端口记号（L13）；节点角标统一布局（DiffMark）——上边框左侧为新增 / 修改、「△N」与「组装根」角标（O12），上边框右半为端口记号，顶边有端口记号时环编号与「共用 ×N」移到下边框、热度色块让到左下角。'
    abstraction: 一种节点一个组件，角标共用统一的布局；只画画布场景给的数据，指标与端口不自己算。
    codeRefs: [src/components/nodes/**]
  - id: present.canvas.nodes.ports
    name: 端口记号
    parent: present.canvas.nodes
    adrs: [29]
    responsibility: 节点定义的端口记号（L13，ADR-0029）：骑在进边一侧（顶边，普通层次自左向右布局时为左边）的后半，每个端口一个小记号（插座半圆 + 实现者数，没有实现者的标出），超过 3 个合成一个「端口 ×N」；单击端口即选中它（V2，URL sel=p:<接口 ID>），单击合成的记号选中定义模块（面板「端口」一节逐个列出）。不参与布局：位置是布局在进边一侧后半留出的保留端口（L11）。
    codeRefs: [src/components/nodes/PortMarks.vue]
  - id: present.canvas.nodes.rim
    name: 边界角色记号
    parent: present.canvas.nodes
    adrs: [30]
    responsibility: '边界角色的记号（L14，ADR-0030）：role: port 的模块名后标「端口」（对外端口，压在框上边、用户一侧），role: adapter 的标「适配器」（接外部技术，贴框左边、外部系统一侧），悬停说明位置的含义；模型画布的模块与核心小块、草图画布的模块节点共用。'
    codeRefs: [src/components/nodes/RimTag.vue]
  - id: present.canvas.nodes.metrics
    name: 指标与影响面角标
    parent: present.canvas.nodes
    adrs: [31]
    responsibility: 结构视角下节点上的角标（ADR-0031）：「入 Ca · 出 Ce」与左缘的不稳定度三档色条（L17）；面板查询影响面时闭包里节点的方向（牵动 / 依赖 / 双向）与距离，外圈按距离实 / 虚 / 点线，可能波及的浅一档（K15b、K15d）；本层环编号（Y4，结构视角常显）。只读画布场景给出的数据（StructMarks），不自己算指标。
    codeRefs: [src/components/nodes/StructMarks.vue]
  - id: present.canvas.edges
    name: 边组件
    parent: present.canvas
    responsibility: 按 Layout 给出的走线画边：折线带圆角或竖向 S 形曲线；颜色、线宽、线型的映射在 edgeStyle，箭头 marker 在 ArrowMarker（大小随线宽档，线在箭头处回缩），都与「显示」面板的示意线共用；折线在跳点处插半圆小桥（L11）。一个视觉通道只表一个维度（L10、ADR-0018、ADR-0029）：颜色 = 关系类型（四类各一色相——查询低饱和且半透明，只「淡」不「细」；委托实色；迁移期的未分类中性灰）；线型 = 行为还是依赖（L18、ADR-0035：交互与回放临时线实线，代码依赖叠加线、组装叠加、承载缺段虚线并用依赖的端点记号 UmlMarker）；箭头自画 marker——同步实心、异步空心「V」；插座 = 经端口（L12，目标端与箭头叠放）；线宽 = 聚合条数三档；标签位（L26）画成 pill，含异常时用警示色。晕：违规红晕优先于设计变更底色，选中为强调色窄晕（不改线宽），回放当前步骤为宽晕并沿方向流动（P10）；走过的边不加粗。结构视角的边见子模块「结构边」（UML 惯例，ADR-0031 裁决 D）。临时线：经由上层关系为关系类型色的虚线（P15），未建模为红色虚线（P11）；组装叠加线为组装专用色的点划线（O12）。
    abstraction: 一个视觉通道只表一个维度，样式映射集中一处、与图例示意线共用；结构边与插座记号各自成件。
    codeRefs: [src/components/edges/**]
  - id: present.canvas.edges.socket
    name: 插座记号
    parent: present.canvas.edges
    adrs: [29]
    responsibility: 经端口的线在目标端的插座记号（L12，ADR-0029）：开口半圆凸向目标、开口朝发起方，顶点略过箭头尖端，把箭头「插」在里面——与箭头叠放、不替换箭头；半径随箭头大小。画布的关系边与「显示」面板的示意线共用同一个 marker。
    codeRefs: [src/components/edges/SocketMarker.vue]
  - id: present.canvas.edges.dep
    name: 结构边
    parent: present.canvas.edges
    adrs: [31]
    responsibility: 结构视角的边（L16，ADR-0031 裁决 D、ADR-0035）：依赖一律虚线（L18 共享通道），允许边（U16）浅一档的虚线；形态只靠端点记号（结构视图私有的通道）：使用开口箭头，子类在被依赖方一端空心三角，端口实现在被依赖方一端空心菱形 ◇，组装在依赖方一端实心菱形（UmlMarker，线在记号处回缩）；色相中性，依赖的档用明度（交互使用深、值使用中、只引类型浅），不用透明度；线宽 = 聚合的模块依赖条数（共享通道，与交互边同一套档）；违规红晕、选中窄晕、聚焦变淡同交互边（L18）。颜色、线型与记号的映射在 depStyle，与「显示」面板的 StructureSwatch 共用；按 Layout 给的直连走线画（L15）。
    codeRefs: [src/components/edges/DepEdge.vue, src/components/edges/UmlMarker.vue, src/components/edges/depStyle.ts]

  - id: present.panel.dispatch
    name: 面板分派
    parent: present.panel
    responsibility: 按选中选择面板（V2）：结构 / 交互视角下为选中的对象，无选中时为当前父模块（根层为系统）；运行视角下选中步骤时为步骤面板、选中场景时为场景面板，选中模块 / 关系 / 聚合边 / 参与者 / 文件时为该对象的面板；没有「已钉住」之类的提示（ADR-0012）。选中端口（L13）时为端口面板（K11）；结构视角下选中依赖边（sel=d:）时为代码依赖面板，其下是这对节点的结构边（present.panel.structure，ADR-0031）。运行视角下模块、关系、聚合边面板顶部加「运行信息」，模块信息折叠在下方（V6）。草图画布下整个面板换成草图面板（present.panel.sketch）。
    codeRefs: [src/components/panel/Panel.vue]
  - id: present.panel.module
    name: 模块面板
    parent: present.panel
    responsibility: 模块的职责、实现原理、对外接口、核心数据结构、子模块、出入边、「端口」一节（声明的每个端口一份端口面板，K11，渲染端口面板的 ModulePorts）、代码事实里的子类 / 基类与组装 / 被组装于（K12、K13）、代码与文档引用；结构视角下另有「结构」一节（指标、影响面、交互图互查，present.panel.structure）；层额外显示抽象原则、包含 / 不包含、可依赖的层。说明长文超 4 行收起带「展开 N 字」，对外接口与子模块清单超 4 个收「+N」（悬停看全量、单击展开，与头部标签同款），交互图互查先列 8 条（L46 波 3 收敛）——展开态不跨选中保持，换选中即回缺省。
    codeRefs: [src/components/panel/ModulePanel.vue]
  - id: present.panel.relation
    name: 关系面板
    parent: present.panel
    responsibility: 关系的两端与类型；「关系」一节按维度各一行——控制流、知识（由代码事实给出：同向 / 反向 / 经端口——发起方只知道端口、接收方是它的实现者 / 不判定，K5b；旁标两端之间的子类与组装事实，K12、K13）、语义（查询 / 委托 / 通知 / 流，ADR-0029）、同步性（通知一律异步，查询与委托按 mode）、机制（直接 / 端口 / 总线 / 通道，标题处另标「经 …」与拉取）、平面（ADR-0022）；经由接口、交换的数据结构；不在当前视图时提供「定位到所在层次」。
    codeRefs: [src/components/panel/RelationPanel.vue]
  - id: present.panel.edge
    name: 聚合边面板
    parent: present.panel
    responsibility: 列出聚合边背后的原始关系与各类型条数，点击任一条跳到它所在的层次并选中。
    codeRefs: [src/components/panel/EdgePanel.vue]
  - id: present.panel.system
    name: 系统面板
    parent: present.panel
    responsibility: 系统简介、生成来源（仓库 / 提交 / 时间）、规模统计与顶层模块列表。
    codeRefs: [src/components/panel/SystemPanel.vue]
  - id: present.panel.design
    name: 设计面板
    parent: present.panel
    responsibility: 设计版本与提交版本的根层：设计目标与范围、定稿结论的 ADR 链接（E7）、本轮做了什么、待评审确认的问题、按实体分组的变更清单（点击跳转，删除项只列出；与提交版本共用 ChangeList）、各轮评审意见与轮次切换、「记录评审意见」（B2）；提交版本为提交说明与变更清单（E5、E6）；设计的各张草图（挂载点、模块数、推出 / 脏标记，点击切张）与「改骨架」（DesignSketches，草图面板里也用，F-2）。
    codeRefs: [src/components/panel/DesignSection.vue, src/components/panel/DesignSketches.vue, src/components/panel/CommitSection.vue, src/components/panel/ChangeList.vue]
  - id: present.panel.content
    name: 内容组件
    parent: present.panel
