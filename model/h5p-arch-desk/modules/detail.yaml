    description: 项目列表主页向 ModelSource 插件取：GET projects.json 取项目摘要列表
  - {id: rel.ad.list-changed, from: access.model-source, to: present.project-list, type: notifies, via: 'channel:hmr', interface: if.source.endpoints, description: 任一项目描述变化后刷新摘要, purpose: 让列表在描述变化后刷新摘要 }
  - id: rel.ad.desk-fetch
    from: present.desk-view
    to: access.model-source
    type: queries
    via: 'channel:http'
    mode: async
    interface: if.source.endpoints
    purpose: 取本项目描述原文交给会话加载
    payload: [ds.ModelPayload]
    description: 项目视图向 ModelSource 插件取：GET models/<项目>.json 取该项目全部 YAML 原文
  - {id: rel.ad.desk-changed, from: access.model-source, to: present.desk-view, type: notifies, via: 'channel:hmr', interface: if.source.endpoints, description: 只响应本项目的 arch-model:changed，触发重新加载, purpose: 让工作台在本项目描述变化后重载 }

  # 呈现 → 视图状态
  - {id: rel.ad.desk-create, from: present.desk-view, to: state.desk.loading, type: commands, interface: if.desk.createDeskState, description: 项目视图交给模型源同步：进入项目时创建并注入 DeskState，调用 init；变更通知时调用 reload, purpose: 进入项目时加载描述、变化时重载 }
  - {id: rel.ad.desk-keys, from: present.desk-view, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 项目视图交给 dispatch 与操作：Esc 只取消选中，Backspace 返回上级（N7、N9）, purpose: 把 Esc 与退格键交给会话规则 }
  - {id: rel.ad.flow-act, from: present.canvas.flow, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 视图转换与交互交给 dispatch 与操作：单击 → select，双击 → drillInto / revealModule，悬停 → setHover, purpose: 把单击、双击、悬停变成选中与下钻 }
  - {id: rel.ad.flow-bounds, from: present.canvas.flow, to: state.layout.runner, type: queries, interface: if.layout.contentBounds, description: 视图转换与交互向布局入口与缓存取：适应画布时取内容外框, purpose: 适应画布时取内容外框 }
  - {id: rel.ad.panel-read, from: present.panel.dispatch, to: state.desk.projection, type: queries, payload: [ds.Selection], description: 面板分派向视图派生（核心与 desk.run）取结果, purpose: 取当前选中以挑面板 }
  - {id: rel.ad.edgepanel-read, from: present.panel.edge, to: state.desk.projection, type: queries, payload: [ds.LevelView], description: 聚合边面板向视图派生（核心与 desk.run）取：在当前视图里查找聚合边, purpose: 在当前视图里找到聚合边 }
  - {id: rel.ad.module-act, from: present.panel.module, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 模块面板交给 dispatch 与操作：子模块点击、进入、可依赖层跳转, purpose: 跳到子模块或可依赖的层 }
  - {id: rel.ad.relation-act, from: present.panel.relation, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 关系面板交给 dispatch 与操作：端点跳转、定位到所在层次, purpose: 跳到端点或关系所在层次 }
  - {id: rel.ad.content-act, from: present.panel.content, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 内容组件交给 dispatch 与操作：关系行点击 → revealRelation, purpose: 单击关系行时定位到关系 }
  - {id: rel.ad.crumb-act, from: present.nav.breadcrumb, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 面包屑让 dispatch 与操作接手处理, purpose: 点击路径返回某一级 }
  - {id: rel.ad.toolbar-act, from: present.nav.toolbar, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 工具栏交给 dispatch 与操作：搜索结果 → revealModule；显示开关写入 toggles, purpose: 把搜索结果跳转到模块 }
  - {id: rel.x1.title-source, from: present.nav.canvas-title, to: present.source, type: commands, description: 画布标题行交给源代码预览：渲染源码胶囊（SourceDeltaChip），交给它描述与源码树的提交差或读取失败的原因（G22、TB-8）, purpose: 在标题行标出描述落后多少 }
  - {id: rel.x1.title-labels, from: present.nav.canvas-title, to: present.shared, type: queries, description: 画布标题行向呈现共用件取：持久草图的显示名（intentName）, purpose: 给版本胶囊取草图的显示名 }
  - {id: rel.x1.title-versions, from: present.nav.canvas-title, to: state.desk.versions, type: queries, payload: [ds.DesignInfo], description: 画布标题行向版本与对比基线（desk.versions）取：设计名与提交，写版本胶囊（TB-9）, purpose: 写出非当前版本的名称 }
  - {id: rel.x1.title-rework, from: present.nav.canvas-title, to: state.desk.loading, type: queries, payload: [ds.Issue], description: 画布标题行向模型源同步取：返工清单的错误与提醒计数（W-6）, purpose: 写出 ⚠ 问题数 }
  - {id: rel.x1.title-files, from: present.nav.canvas-title, to: state.desk.files, type: queries, description: 画布标题行向源码派生（desk.files）取：源码清单里的提交差 commitDelta 或读取失败的原因, purpose: 判断源码胶囊写什么 }
  - {id: rel.x1.title-shell, from: present.nav.canvas-title, to: present.shell, type: commands, via: 'channel:router', description: 画布标题行交给应用外壳与路由：版本胶囊的 × 导航到当前版本的路由，带上当前 level / sel, purpose: 一键回到当前版本 }
  - {id: rel.ad.issues-read, from: present.issues, to: state.desk.loading, type: commands, payload: [ds.Issue], description: 问题页签让模型源同步接手处理, purpose: 取加载后汇总的返工清单 }
  - {id: rel.ad.version-read, from: present.version, to: state.desk.versions, type: commands, payload: [ds.DesignInfo, ds.ModelDiff], description: 版本切换与设计信息条交给版本与对比基线（desk.versions）：设计、轮次、对比基线、变更计数；对比基线与标出变更写入 toggles, purpose: 切换对比基线与标出变更 }
  - {id: rel.ad.flow-diff, from: present.canvas.flow, to: state.desk.versions, type: queries, payload: [ds.ModelDiff], description: 视图转换与交互向版本与对比基线（desk.versions）取：节点与边的变更标记, purpose: 给节点与边标出新增与修改 }
  - {id: rel.ad.design-read, from: present.panel.design, to: state.desk.versions, type: queries, payload: [ds.DesignInfo, ds.ModelDiff], description: 设计面板向版本与对比基线（desk.versions）取结果, purpose: 取设计信息与变更清单 }
  - {id: rel.ad.design-act, from: present.panel.design, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 设计面板交给 dispatch 与操作：变更清单点击 → revealModule / revealRelation, purpose: 从变更清单跳到实体 }
  - {id: rel.ad.content-diff, from: present.panel.content, to: state.desk.versions, type: queries, payload: [ds.ModelDiff], description: 内容组件向版本与对比基线（desk.versions）取：新增 / 修改标记与改了哪些字段, purpose: 标出新增、修改与改动字段 }

  # 呈现 → 模型（只依赖契约「类型与 Schema」，U10）
  - {id: rel.ad.crumb-name, from: present.nav.breadcrumb, to: model.types, type: queries, description: 面包屑向类型与 Schema 取：moduleName 取显示名, purpose: 取模块显示名 }

  # 视图状态内部与 → 模型
  - {id: rel.ad.loading-entry, from: state.desk.loading, to: model, type: queries, interface: if.model.loadModel, payload: [ds.ModelIndex, ds.Issue], description: 模型源同步向 loadModel 入口取：loadModel, purpose: 把描述原文加载成模型索引 }
  - {id: rel.ad.loading-baselines, from: state.desk.loading, to: state.desk.versions, type: streams, pull: true, payload: [ds.ModelPayload], description: 设计版本的载荷附带设计信息与对比基线原文, purpose: 把设计信息与基线原文交给版本派生 }
  - {id: rel.ad.versions-diff, from: state.desk.versions, to: model.diff, type: queries, interface: if.model.diffModels, payload: [ds.ModelDiff], description: 版本与对比基线（desk.versions）向版本对比取：切换对比基线或重新加载时重算, purpose: 算设计版本相对基线的差异 }
  - {id: rel.ad.loading-keep, from: state.desk.loading, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 模型源同步交给 dispatch 与操作：加载完成 → dispatch(loaded / reloaded)，层次回退由转移规则决定, purpose: 把加载结果作为动作写入状态 }
  - {id: rel.ad.url-actions, from: state.desk.url-sync, to: state.desk.actions, type: commands, via: 'channel:callback@state.desk.url-sync', interface: if.desk.actions, description: 路由同步交给 dispatch 与操作：外部路由变化 → decode → dispatch, purpose: 把外部地址变化交给 dispatch }
  - {id: rel.ad.actions-url, from: state.desk.actions, to: state.desk.url-sync, type: streams, payload: [ds.ViewState], description: 状态改变后写地址（router.write），地址 = encode(状态), purpose: 让地址跟上新的视图状态 }
  - {id: rel.ad.actions-lca, from: state.transition.navigation, to: model.projector.hierarchy, type: queries, interface: if.model.lowestCommonAncestor, description: 导航规则向层次顺序与公共祖先取：定位关系用最近公共祖先, purpose: 定位关系时取两端最近公共祖先 }
  - id: rel.ad.projection-project
    from: state.desk.projection
    to: model.projector
    type: queries
    interface: if.model.projectLevel
    purpose: 投影出当前层次的节点与边
    payload: [ds.ProjectOptions, ds.LevelView]
    description: 视图派生（核心与 desk.run）向 Projector 层次投影取：索引、层次或开关变化时重新投影
  - id: rel.ad.projection-layout
    from: state.desk.projection
    to: state.layout.runner
    type: queries
    mode: async
    interface: if.layout.layoutView
    purpose: 给层次视图布局取坐标
    payload: [ds.LevelView, ds.PositionedView]
    description: 视图派生（核心与 desk.run）向布局入口与缓存取：视图变化后异步布局，用序号丢弃过期结果
  - {id: rel.ad.graph-boundaries, from: state.layout.runner.graph, to: state.layout.runner.boundaries, type: queries, description: 普通层次排布向框外元素与手工走线取：placeOutside、compassOf、edgeLabel、spreadEnds：框外元素按方位摆放、端口方向与标签, purpose: 布局后摆放框外元素与标签 }
  - {id: rel.ad.layered-boundaries, from: state.layout.runner.layered, to: state.layout.runner.boundaries, type: queries, description: 分层总览排布向框外元素与手工走线取：placeOutside、portFor、slotOf、parallelOffsets：分层总览中框外元素的位置、正交走线的端口与错开、核心跨层边的平行曲线, purpose: 摆放总览的框外元素并走线 }

  # 接入层
  - {id: rel.ad.source-reader, from: access.model-source, to: access.reader, type: queries, interface: if.reader.projects, payload: [ds.ProjectSummary, ds.ModelPayload], description: ModelSource 插件向描述读取取：resolveModelRoot、isModelFile、listProjects、readProject, purpose: 列出项目并读出描述供端点返回 }
  - {id: rel.ad.lint-reader, from: access.lint, to: access.reader, type: queries, interface: if.reader.projects, description: 命令行校验向描述读取取：resolveModelRoot、listProjectIds、listDesigns、designSketches, purpose: 遍历全部项目与设计轮次做校验 }
  - {id: rel.ad.lint-entry, from: access.lint, to: model, type: queries, interface: if.model.loadModel, payload: [ds.Issue], description: 命令行校验向 loadModel 入口取：loadModel, purpose: 加载描述以校验 }
  - {id: rel.ad.reader-entry, from: access.reader, to: model, type: queries, interface: if.model.loadModel, description: 描述读取向 loadModel 入口取：生成项目摘要时跑一遍模型层, purpose: 跑一遍模型层生成项目摘要 }

  # 模型层内部
  - {id: rel.ad.flow-validate-index, from: model.pipeline.validator, to: model.pipeline.indexer, type: streams, payload: [ds.ArchModel], description: 剔除坏实体后的模型交给建索引, purpose: 把剔除坏实体的模型交去建索引 }
  - {id: rel.ad.loader-schema, from: model.pipeline.loader, to: model.types, type: queries, payload: [ds.ArchFileDef, ds.RawFile], description: Loader 向类型与 Schema 取：isSketchFile, purpose: 识别草图文件 }
  - {id: rel.ad.overview-endpoints, from: model.projector.overview, to: model.projector.endpoints, type: queries, description: 分层总览向端点映射取结果, purpose: 把关系端点落到核心模块或层 }
  - {id: rel.ad.endpoints-collector, from: model.projector.endpoints, to: model.projector.collector, type: queries, description: 端点映射向边汇总取结果, purpose: 把映射后的关系汇成视图边 }
  - {id: rel.ad.overview-collector, from: model.projector.overview, to: model.projector.collector, type: queries, description: 分层总览向边汇总取：核心跨层边单独汇总, purpose: 单独汇总核心跨层边 }
  # 模型层入口的再导出与名称、标签（K7 按代码补齐）
  - {id: rel.ad.indexer-steps, from: model.pipeline.indexer, to: model.scenario-semantics, type: queries, description: Indexer 向回放计划取：messagesOf：建索引时收集场景消息, purpose: 建索引时收集场景消息 }
  - { id: rel.ad.content-labels, from: present.panel.content, to: present.shared, type: commands, description: 内容组件交给呈现共用件：渲染变更角标与代码块时调用 useOpenPreview 在资料区预览文件、useNavTab 切页签、highlightTs 高亮签名, purpose: 预览文件、切页签与高亮签名 }
  - { id: rel.ad.relation-type-labels, from: present.panel.relation, to: present.shared, type: commands, description: 关系面板交给呈现共用件：经 useOpenPreview / useNavTab 打开证据文件与切换页签, purpose: 打开证据文件并切换页签 }
  - { id: rel.ad.edge-type-labels, from: present.panel.edge, to: present.shared, type: commands, description: 聚合边面板交给呈现共用件：经 useOpenPreview / useNavTab 打开证据文件与切换页签, purpose: 打开证据文件并切换页签 }
  - { id: rel.gv.ports-type-labels, from: present.panel.governance, to: present.shared, type: commands, description: 架构治理面板交给呈现共用件：治理面板经 useOpenPreview / useNavTab 打开证据文件与切换页签, purpose: 打开证据文件并切换页签 }
  - { id: rel.ad.design-labels, from: present.panel.design, to: present.shared, type: commands, description: 设计面板交给呈现共用件：调用 intentName 显示持久草图名，经 useOpenPreview 在资料区预览 ADR 与草图文件, purpose: 显示草图名并预览 ADR 与草图 }
  - { id: rel.ad.actor-labels, from: present.panel.actor, to: present.shared, type: commands, description: 参与者面板交给呈现共用件：经 useOpenPreview / useNavTab 打开证据文件与切换页签, purpose: 打开证据文件并切换页签 }
  - {id: rel.ad.nodes-act, from: present.canvas.nodes, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 节点组件交给 dispatch 与操作：分支预览选这一支（chooseBranch）、步骤序号指向这一步（seek）, purpose: 从分支预览选分支、从序号指向步骤 }
  - { id: rel.ad.port-marks-act, from: present.canvas.nodes.ports, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 端口记号交给 dispatch 与操作：单击端口 select 端口（L13），单击合成的「端口 ×N」select 定义模块, purpose: 单击记号选中端口或定义模块 }
  - {id: rel.ad.system-read, from: present.panel.system, to: state.desk.projection, type: queries, description: 系统面板向视图派生（核心与 desk.run）取：读索引、层次视图与版本, purpose: 取索引、层次视图与版本信息 }
  - {id: rel.ad.system-act, from: present.panel.system, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 系统面板交给 dispatch 与操作：选中模块或问题, purpose: 跳到选中的模块或问题 }
  - { id: rel.ad.projection-names, from: state.desk.projection, to: model.pipeline.indexer, type: queries, description: 视图派生（核心与 desk.run）向 Indexer 取：派生场景列表时调用 triggerOf 取每个场景的触发者, purpose: 取每个场景的触发者 }
  - id: rel.pd.abandon-ask
    from: present.panel.design
    to: present.version.actions
    type: commands
    description: '设计面板的「放弃设计」借动作区的二次确认对话框（ask）问人，确认后才放弃'
    purpose: '放弃前二次确认'

interfaces:
  - id: if.model.loadModel
    name: loadModel
    owner: model
    signature: |
      loadModel(files: readonly RawFile[]): { index: ModelIndex; issues: Issue[] }
    semantics: 纯函数，不抛异常；有问题的实体被剔除或修剪，问题按 error / warning 汇总。
  - id: if.model.load
    name: load
    owner: model.pipeline.loader
    signature: |
      load(files: readonly RawFile[]): { model: ArchModel; issues: Issue[] }
    semantics: 按路径排序后逐个解析；YAML 语法错误或格式错误的文件整份跳过。
  - id: if.model.validate
    name: validate
    owner: model.pipeline.validator
    signature: |
      validate(model: ArchModel): { model: ArchModel; issues: Issue[] }
  - id: if.model.buildIndex
    name: buildIndex
    owner: model.pipeline.indexer
    signature: |
      buildIndex(model: ArchModel): ModelIndex
      nearestExisting(index: ModelIndex, path: readonly string[]): string   // 旧路径中最深的、在本索引中仍存在的模块（否则根）
    semantics: 输入必须来自 validate()。
  - id: if.model.names
    name: moduleName
    owner: model.types
    signature: |
      moduleName(index: ModelIndex, id: string): string   // 模块、参与者或系统根的显示名
      isLong(lines: number | undefined, maxLines: number): boolean   // G20
      isArchived(status: DesignStatus): boolean   // DV-6
      RULE_LABELS: Record<RuleKind, string>
    semantics: 契约里的名称查询与小谓词（U10）：只按 ID 或枚举查表，不做投影与计算；呈现层、命令行与模型层内部共用。
  - id: if.model.projectLevel
    name: projectLevel
    owner: model.projector
    signature: |
      projectLevel(index: ModelIndex, parentId: string, opts?: ProjectOptions): LevelView
      nearestVisibleLevel(index: ModelIndex, levelId: string, opts: ProjectOptions): string   // N12
    semantics: 层次不存在或被「只看现状」隐藏时抛错（调用方先用 nearestVisibleLevel 取合法层次）；同样的输入得到同样的输出（边 ID 稳定）。
  - id: if.model.lowestCommonAncestor
    name: lowestCommonAncestor
    owner: model.projector.hierarchy
    signature: |
      lowestCommonAncestor(index: ModelIndex, a: string, b: string): string   // 两个模块路径的最近公共祖先；不存在的模块按根算
    semantics: 纯函数；定位关系（N3）与场景所在层次（S9）共用。
  - id: if.model.hierarchyKey
    name: hierarchyKey
    owner: model.projector.hierarchy
    signature: |
      hierarchyKey(index: ModelIndex, id: string): number[]   // 每级两项：[0, order]（层）或 [1, 描述顺序]；参与者为空
      compareKeys(a: number[], b: number[]): number          // 逐项比较，前缀较短者在前
    semantics: 纯函数；画布边界节点行与时序图泳道共用，两张图的外部模块顺序一致。
  - id: if.model.diffModels
    name: diffModels
    owner: model.diff
    signature: |
      diffModels(base: ModelIndex, target: ModelIndex, opts?: { lineage?: Lineage }): ModelDiff   // lineage：设计草图的 from（X11）
    semantics: 纯函数；变更按实体类别（模块、关系、接口、数据结构）与变更类别排序；给了血缘时条目带 kind（合并 / 拆分 / 改 ID / 移动）与 from / to，前缀级联与合并带走的来源被吸收。
  - id: if.layout.layoutView
    name: layoutView
    owner: state.layout.runner
    signature: |
      layoutView(view: LevelView): Promise<PositionedView>
    semantics: 结果按视图内容缓存；layered 同步计算，graph 走 elk。
  - id: if.layout.contentBounds
    name: contentBounds
    owner: state.layout.runner
    signature: |
      contentBounds(pv: PositionedView): Box | null
  - id: if.desk.createDeskState
    name: createDeskState
    owner: state.desk
    signature: |
      createDeskState(fetchModel: () => Promise<ModelPayload>, options?: { project?: string; version?: VersionRef; source?: SourceFetcher }): DeskState
      // DeskState（ADR-0013）：核心平铺 { state（只读）, status, index, issues, allIssues, levelId, levelPath, selection, selected, hoverId,
      //   viewpoint, playing, toggles, view, positioned, levelVersion, playback, dispatch, init, attachRouter, …操作（见 if.desk.actions） }
      //   + run：{ scenario, plan, path, scenarioView, currentIndex, walked, frame, overlay, sequence, positionedSequence, emphasis, participation, outline, … }
      //   + files：{ payload, ownership, tree, lines, maxLines, selected, owners, hits, moduleFiles, warnings, filesOf, entryOf, file(path), exports(path), refresh }
      //   + versions：{ designs, design, revision, sketch, sketchPrompt, baselines, baseline, diff, drift }
      //   + edit：{ session, active, dirty, scene, validation, vsBaseline, vsCurrent, comparison, breadcrumb, …操作（见 if.desk.edit） }   // 只在草图版本上有会话
    semantics: 每个项目的每个版本一份；在组件 setup 中创建，其 watch 与同步适配器随组件销毁。草图画布下核心的 index 为设计的索引（各张草图连同 system.yaml、持久草图与引用的外部模块）。
  - id: if.desk.actions
    name: DeskState 操作
    owner: state.desk.actions
    signature: |
      dispatch(action: ViewAction): boolean                   // 唯一写入口；返回状态是否改变
      // 以下都是构造动作并 dispatch 的便捷包装
      drillInto(moduleId: string): boolean
      goTo(levelId: string, select?: Selection | null): void
      goUp(): void
      select(selection: Selection | null): void
      revealRelation(relationId: string): void
      revealModule(moduleId: string): void
      setHover(id: string | null): void
      setToggles(patch: Partial<Toggles>): void
      openScenario(id: string): void                          // 进入回放，停在开头（R12）
      closeScenario(): void
      next(): void
      prev(): void
      seek(frameId: string | null): void                      // null = 回到开头
      chooseBranch(pointId: string, option: number): number   // 返回被丢弃的其他分支选择个数（F6f）
      selectFile(path: string): void                          // 源码（G）
      refreshSource(): Promise<void>
      sourceFile(path: string): Promise<SourceFile | null>
      sourceExports(path: string): Promise<ExportedSymbol[] | null>
    semantics: 操作本身不含规则；同一动作在任何状态下的效果由视图状态转移决定。
  - id: if.source.endpoints
    name: 模型端点
    owner: access.model-source
    signature: |
      GET projects.json            → ProjectSummary[]
      GET models/<项目>.json       → ModelPayload        // 当前版本；不存在时 404
      GET models/<项目>/designs/<设计>/<轮次>.json → ModelPayload  // 设计版本某一轮，附 compare 对比基线
      GET models/<项目>/designs/<设计>/sketch.json → ModelPayload  // 设计的草图版本：各张 sketches/<mount>.yaml + 引用的外部模块，附 sketchFiles（各自指纹）、基线与「交给 AI」的指令，以及设计目录下的编号表、设计说明与落盘的对话（transcript，贴图读成 data URL，DL-51）
      GET models/<项目>/intent/<草图 ID>.json → ModelPayload  // 持久草图版本（system.yaml + intent/**），附 sketch { file, hash } 与指令
      POST write/<项目>/sketch                 { target, sketch, baseHash } → { file, hash } | 409 | 422   // B6，持久草图
      POST write/<项目>/designs/<设计>/sketch  { target, sketch, baseHash } → { file, hash } | 409 | 422   // B6，设计的一张草图
      POST write/<项目>/designs/<设计>/sketches SaveDesignRequest → SaveDesignResult | 409 | 422          // X20、B7，按设计写回（多张、改名、删除）
      POST write/<项目>/designs                { id, name, goal?, mount?, sketch? } → { file, files } | 409   // 新建设计：给挂载点时底稿从基线（仓库 HEAD）复制（X18）
      ws  arch-model:changed       → { project: string }  // 仅开发态，按项目合并 150ms 内的变化
    semantics: 开发服务器实时读取（本地开发工具，没有构建态输出，ADR-0020）。写端点只收同源 JSON（B5）。
  - id: if.reader.projects
    name: 项目读取
    owner: access.reader
    signature: |
      listProjectIds(modelRoot: string): string[]
      readProject(modelRoot: string, id: string, projectRoot: string): ModelPayload | null
      listProjects(modelRoot: string, projectRoot: string): ProjectSummary[]
      listDesigns(projectDir: string): DesignInfo[]
      readDesignRevision(modelRoot, project, design, revision, projectRoot): ModelPayload | null
      readSketchVersion(modelRoot, project, design, projectRoot, docsRoot?, opts?): ModelPayload | null   // 设计的草图版本（X9、X19、X20）
      readIntentVersion(modelRoot, project, sketchId, projectRoot): ModelPayload | null   // 持久草图版本，附 sketch { file, hash }
      designSketches(projectDir, design): { design; file: RawFile }[]; designSketchFiles(projectDir, design): { mount; file; hash; needsLayout? }[]   // sketches/*.yaml，根挂载在前
      readRevisionNote(designDir: string, revision: string): { date?: string; summary?: string; questions?: string[]; problems: string[] }   // r<N>/revision.yaml（AI 拥有）
      listRevisionDirs(designDir: string): string[]   // 含 system.yaml 的 r<N>/，按 N 的数字排序
    semantics: 含 system.yaml 的子目录才算项目；项目 ID、设计 ID、轮次 ID 只允许目录名安全字符。design.yaml 的问题记入 DesignInfo.problems，不抛错；只有草图、没有轮次的设计不算问题。

dataStructures:
  - id: ds.ArchFileDef
    name: ArchFileDef
    definition: |
      interface ArchFileDef {
        system?: SystemDef
        module?: ModuleDef          // 可带 parent 挂到已有模块下
        modules?: ModuleDef[]
        relations?: RelationDef[]
        interfaces?: InterfaceDef[]
        dataStructures?: DataStructureDef[]
        actors?: ActorDef[]          // 外部参与者
        scenario?: ScenarioDef
        scenarios?: ScenarioDef[]
        sourceIgnore?: string[]      // 忽略清单（G8）
      }
    description: 一个 YAML 文件的顶层形状，与 schema/arch-file.schema.json 对应。
  - id: ds.RawFile
    name: RawFile
    definition: |
      interface RawFile { path: string; text: string }
    description: 一份描述文件的原文，path 相对项目的描述目录。
  - id: ds.ArchModel
    name: ArchModel
    definition: |
      interface ArchModel {
        system: SystemDef
        modules: ModuleEntity[]       // 扁平化，带 parentId / seq / src
        relations: RelationEntity[]
        interfaces: InterfaceEntity[]
        dataStructures: DataStructureEntity[]
        actors: ActorEntity[]
        scenarios: ScenarioEntity[]
        sourceIgnore: string[]        // 各文件 sourceIgnore 的合并，不参与版本对比
      }
    description: 多个文件合并后的模型，每个实体记录出处 src { file, path, line }。
  - id: ds.Issue
    name: Issue
    definition: |
      interface Issue {
        severity: 'error' | 'warning'
        code: string
        message: string
        file?: string; path?: string; line?: number
      }
    description: 描述文件中的问题；error 表示实体被剔除，warning 表示只去掉了坏引用或缺内容。
  - id: ds.ModelIndex
    name: ModelIndex
    definition: |
      interface ModelIndex {
        rootId: string
        modules: Map<string, ModuleEntity>
        relations: Map<string, RelationEntity>
        childrenOf: Map<string, string[]>   // 层按 order 排序
        pathOf: Map<string, string[]>       // 从根到模块
        outRelations / inRelations: Map<string, string[]>
        scenarios: Map<string, ScenarioEntity>
        scenariosOf: Map<string, string[]>       // 模块 → 有帧端点落在其子树内的场景
        actors: Map<string, ActorEntity>
        triggeredBy: Map<string, string[]>       // 参与者 → 由它触发的场景（第一条消息的发送方）
        // …
      }
    description: 按 ID 查询的索引。
  - id: ds.ProjectOptions
    name: ProjectOptions
    definition: |
      interface ProjectOptions {
        showBoundaries: boolean
        relationTypes?: RelationType[]
        currentOnly?: boolean
        scenarioEnds?: { from: string; to: string }[]
      }
    description: 投影开关。
  - id: ds.LevelView
    name: LevelView
    definition: |
      interface LevelView {
        mode: 'graph' | 'layered'
        parentId: string
        nodes: ViewNode[]            // role: module | boundary | layer | core | actor
        edges: ViewEdge[]
        bands?: Band[]               // 仅 layered
        coreEdges?: ViewEdge[]       // 仅 layered，聚焦时显示
      }
    description: 一个层次要画的节点与边。
  - id: ds.ViewEdge
    name: ViewEdge
    definition: |
      interface ViewEdge {
        id: string                   // from->to:type（L5），重新加载后不变
        kind: 'direct' | 'aggregate'
        from: string; to: string
        type: RelationType           // queries | commands | notifies | streams（迁移期另有 calls = 未分类，M17）
        relationIds: string[]        // 条数即其长度
        mode: 'sync' | 'async' | 'mixed'
      }
    description: 视图中的一条边，可能聚合了多条原始关系。
  - id: ds.Band
    name: Band
    definition: |
      interface Band { layerId: string; order: number; coreModuleIds: string[]; hiddenCount: number }
    description: 分层总览中的一条带。
  - id: ds.PositionedView
    name: PositionedView
    definition: |
      interface PositionedView {
        view: LevelView
        nodes: Map<string, Box>          // { x, y, w, h }
        edges: Map<string, EdgeRoute>    // { points, curve?, label? }
        coreEdges: Map<string, EdgeRoute>
      }
    description: 布局结果：每个节点的位置尺寸与每条边的走线。
  - id: ds.Selection
    name: Selection
    definition: |
      type Selection =
        | { kind: 'module'; id: string }
        | { kind: 'relation'; id: string }
        | { kind: 'edge'; id: string }     // 视图中的边（多为聚合边）
        | { kind: 'actor'; id: string }
        | { kind: 'file'; id: string }     // 源码文件，id 为相对源码根目录的路径（G16）
        | { kind: 'port'; id: string }     // 端口，id 为接口 ID（L13）
        // … 另有代码依赖叠加线 dep、耦合线 couple
      // 推出的选中（selectedOf，ADR-0012）：Selected = Selection | { kind: 'step'; id: frameId } | { kind: 'scenario'; id }
    description: "显式选中的对象，编码进 URL 的 sel 参数（m: / r: / e: / a: / f: / d: / c: / p: 前缀）。回放中为空即选中进度所在的步骤（URL 只有 step），进度在开头时选中场景（sel 与 step 都没有）。"
  - id: ds.ModelPayload
    name: ModelPayload
    definition: |
      interface ModelPayload {
        project?: string; dir: string; files: RawFile[]
        designs?: DesignInfo[]                       // 本项目的全部设计版本
        version?: { design: string; revision: string } // 设计版本时给出
        compare?: { current: CompareSource; previous?: CompareSource; baseline?: CompareSource } // { label, dir, files }；baseline 为设计 base.commit 那一版描述（X17）
        sketch?: { file: string; hash: string; path?: string }   // 草图版本的主草图（根挂载在前）与读取时的指纹（X6 同一算法），保存时带回（X7i）
        sketchFiles?: { mount; file; path?; hash; needsLayout? }[]   // 设计的全部草图（X9、X20）
        sketches?: { design; file: RawFile }[]       // 对本版本有约束力的设计草图（X4）
        sketchPrompt?: string                        // 「交给 AI」的指令（DV-10、X20）
      }
      // version 另有 { design, revision: 'sketch' }：设计的草图版本；{ intent: string }：持久草图版本
    description: 一个项目某个版本的全部描述原文，由 ModelSource 交给页面；设计版本附带对比基线原文。
  - id: ds.ProjectSummary
    name: ProjectSummary
    definition: |
      interface ProjectSummary {
        id: string; name: string; description?: string
        source?: { repo?: string; commit?: string; generatedAt?: string }
        layered: boolean
        top: { id: string; name: string; abstraction?: string }[]
        counts: { modules: number; relations: number; interfaces: number; dataStructures: number }
        errors: number; warnings: number
        designs: DesignInfo[]
      }
    description: 项目列表页展示的摘要，由接入层在 Node 侧跑模型层算出。
  - id: ds.DesignInfo
    name: DesignInfo
    definition: |
      interface DesignInfo {
        id: string; name: string
        status: 'draft' | 'reviewing' | 'accepted' | 'implemented' | 'abandoned'
        goal?: string
        base?: { commit?: string; generatedAt?: string }
        revisions: { id: string; date?: string; summary?: string; questions?: string[]; feedback?: string }[]
        sketch?: boolean; sketches?: { mount: string; file: string; needsLayout?: boolean }[]   // designs/<设计>/sketches/*.yaml（X9）
        deviations?: { errors: number; warnings: number }   // 有草图、未归档的设计的偏差计数（X4）
        // 轮次 = 目录 r<N>/（按 N 排序）；date / summary / questions 来自 r<N>/revision.yaml（AI 拥有）；feedback 来自 design.yaml 的 revisions[]（人拥有，按 id 对上）；旧设计的 revisions[] 兼容
        problems: string[]
      }
    description: 设计版本的元信息，来自 designs/<设计>/design.yaml 与各轮的 revision.yaml。
  - id: ds.ModelDiff
    name: ModelDiff
    definition: |
      interface ModelDiff {
        changes: Change[]       // { entity, id, kind: added|changed|merged|split|renamed|moved|removed, name, fields?, from?, to? }
        module / relation / interface / dataStructure: Map<string, Change>  // 仅新增与修改
        touched: Map<string, number>  // 模块 → 涉及的变更条数
        counts: Record<ChangeKind, number>   // 七类；没有血缘时只有新增 / 修改 / 删除
      }
    description: 设计版本相对对比基线的差异。
