  # ── 视图状态层 ──────────────────────────────────────────
  - id: state.desk.loading
    name: 模型源同步
    parent: state.desk
    responsibility: 同步适配器之一：取回项目描述并调用 loadModel，把加载结果作为动作交给 dispatch（首次加载 / 重新加载）；监听本项目的变更通知触发重新加载。「保留层次与选中、失效时退到上级」不在这里，是转移规则。
    codeRefs: [src/state/sync/modelSource.ts]
  - id: state.desk.writer
    name: 描述写入同步
    parent: state.desk
    responsibility: 同步适配器之一（B1–B6，ADR-0019、ADR-0023）：定义写入来源 ModelWriter 并把「记录评审意见」「加例外」「加入忽略」「确认」「认可偏差」「归档」交给注入的实现（开发服务器的 HTTP 端点），只追加人拥有的文件；ModelWriter 另有 saveSketch / saveDesignSketches / createDesign，由编辑分组的草图写回同步调用（B6、B7、X20：持久草图单张、设计按设计整份写回，新建设计只发挂载点）。写后不改视图状态，结果由文件变化推送回来，按 N5 重新加载。
    codeRefs: [src/state/sync/writer.ts]
  # 分组派生在 src/state/desk/（ADR-0013）；dispatch 与操作是 useDeskState.ts 内的概念划分，不写 codeRefs，文件归 DeskState（避免归属冲突，G6）
  - id: state.desk.versions
    name: 版本与对比基线（desk.versions）
    parent: state.desk
    responsibility: 设计版本下持有设计信息与本轮、对比基线（当前版本 / 上一轮）的索引；派生差异与基线漂移（载荷带的基线——base.commit 那一版描述——与当前版本的 source.commit 不一致；没带基线时不判断，E4）。
    codeRefs: [src/state/desk/versions.ts]
  - id: state.desk.projection
    name: 视图派生（核心与 desk.run）
    parent: state.desk
    responsibility: 由视图状态与模型派生要画的数据（全部是 computed，调用纯函数）。核心平铺在 DeskState 上：层次视图与坐标、选中（selectedOf）、视角。运行视角的派生归 desk.run（ADR-0013）：回放计划、调用与返回的配对、回放路径与路线、本层的帧投影与可见消息、选中突出（emphasisOf）、舞台叠加与参与节点、时序模型与时序图坐标，导航树用的步骤大纲与参与模块，以及场景列表（全部场景的触发者与消息数）与当前场景的触发者、ref 引用与被引用（呈现层不再自己遍历场景）。源码与版本的派生另见 desk.files、desk.versions。
    abstraction: 全部是调用纯函数的 computed，只读不写；核心平铺在 DeskState 上，运行视角的派生收进 desk.run。
    codeRefs: [src/state/desk/run.ts]
  - id: state.desk.legend
    name: 图例的出现集合派生（desk.legend，L47）
    parent: state.desk
    responsibility: 「显示」面板图例的出现集合（L47，第十五轮 G14）：按当前视角与层次的静息态画面算画布上出现的记号——交互视角与运行视角扫层次视图的边与节点（边界边聚焦才画、不计入，只出现在边界边上的类型单列临时键）、代码事实读 K9 的本层投影、组装读 O12 的投影、热度读 J5 的本层投影；结构视角读与画布同一份 structureDisplay 过滤后的束（形态、档、醒目度、收起计数、越过入口）。没有代码事实等加载态按空集合处理。呈现层（DisplayPanel）实例化一次、把集合传给各图例组；组结构与行序按固定词表，行只显隐、不重排；聚焦 / 悬停 / 回放才出现的临时记号归各组尾部固定的「临时可见」小节常列，不进出现集合（reviews/r3.md 的 G14 补充口径）。
    abstraction: 一处派生（唯一 computed），图例组件不再各自判断记号是否出现。
    codeRefs: [src/state/desk/legend.ts]
  - id: state.desk.actions
    name: dispatch 与操作
    parent: state.desk
    responsibility: 视图状态唯一的写入口 dispatch(action)：调用视图状态转移得到新状态并写入，层次变化时通知画布适应；对外的一组操作（下钻、跳转、返回上级、选中、定位、悬停、打开 / 关闭场景、单步、指向某一步或回到开头、选分支）都只是构造动作并 dispatch。
    abstraction: dispatch 是视图状态唯一的写入口，对外操作只构造动作，规则全在视图状态转移。
    principle: 本身不含领域规则：所有「给定状态与动作，下一个状态是什么」都在视图状态转移里；这里只把派生的上下文（索引、本层帧投影等）交给转移函数。
  - id: state.desk.url-sync
    name: 路由同步
    parent: state.desk
    responsibility: 同步适配器之一：让地址始终等于 encode(视图状态)；外部的后退 / 前进 / 改地址 / 打开分享链接时，decode 成动作交给 dispatch。进不进浏览器历史由转移结果标注（规则 N10、R10）。
    principle: |
      路由导航是异步的：自己发起的导航完成前，路由变化一律视为回声、不回写状态，避免双击（两次选中 + 一次下钻）时旧地址覆盖新层次；
      离开本项目或本版本的路由时也不回写。
    codeRefs: [src/state/sync/router.ts]
  - id: state.desk.layout-sync
    name: 布局同步
    parent: state.desk
    responsibility: 同步适配器之一：层次视图变化后调用异步布局，按序号丢弃过期结果，把定位好的视图回填给派生数据。
    codeRefs: [src/state/sync/layout.ts]

  - id: state.layout.runner
    name: 布局入口与缓存
    parent: state.layout
    responsibility: Layout 的入口（layout.ts，对外只经它引用）：layoutView 按视图模式分派给分层总览或普通层次排布；并集布局（L15）：结构边（StructureLinks）经 unionView 并入视图边、共用件的边与核心跨层边，与交互边一起交给排布，两个视角共用同一份布局与走线；表面展开不进排布（L20a②，ADR-0036）：先取收起态的布局，再由 expandSurface 在固定的节点上排端口点（surfaceDots）、散开的束在节点前分叉、每个点一支并停在点的边缘（tapRoute、fanLevels，dots.ts），换选中节点不动；结果按视图内容、结构边 ID 与布局算法版本（LAYOUT_VERSION）缓存；几何类型（点、盒子、走线、带坐标的视图与它的父模块框 parentFrame、系统框 frame）、节点尺寸与内容外框 contentBounds（含两种框，geometry.ts）。
    abstraction: 对外只经一个入口、按视图模式分派给两种排布，框外元素在排布后按方位另摆；两个视角共用同一份布局与缓存。
    codeRefs: [src/layout/layout.ts, src/layout/geometry.ts, src/layout/dots.ts]
  - id: state.layout.runner.layered
    name: 分层总览排布
    parent: state.layout.runner
    codeRefs: [src/layout/layered.ts]
    responsibility: '按层序自上而下分带，带内核心模块横向排开（含 +N 占位）；相邻层间的边走带间空隙里块与块之间的竖巷，跨多层的边走右侧通道；核心模块之间相邻层的跨层边画成曲线、跨多层的经空隙里自己的轨道到右侧核心车道（O3b）。带间空隙按穿过它的横段撑开（gapTracks：每条横段一条轨道，向上离开的、框外边的、向下离开的依次排，同车道号共用一条，O14、O15）；父模块框（根层即系统框）包住全部带与右侧通道；框外元素（用户在上、外部系统与时间在左、边界节点在下）按方位摆放，右侧只留层间关系线（O16），它们的边由 outsideRouter 正交走线：带按对端方位取顶边 / 左边 / 底边，核心模块上进下出、短桩到空隙里自己的轨道，再一起分轨（allocateTracks，L32）。标签按实际尺寸沿线挑不压块、文字区与同时画出的标签的位置（placeLabelBoxes，L33）。带内的共用件排在带底一行的共用件架（带随之加高，O9）。边界角色（L14）：role: port 的块一半压在带的上边（核心模块行随之下让），role: adapter 在带内最左一列、紧贴左侧标题栏（外部系统一侧）；关系边一律在该侧的前半错开，后半留给端口记号（L11、L13）。'
  - id: state.layout.runner.graph
    name: 普通层次排布
    parent: state.layout.runner
    codeRefs: [src/layout/graph.ts]
    responsibility: 用 elkjs layered 算法只排父模块框内的子模块与它们之间的边：正交走线、标签内联；每条边两端各有固定朝向的端口——上进下出（自左向右时左进右出），同一侧左动右静（动态关系在前半、静态在后半，FIXED_ORDER，L11）；框外边在内部节点那一端给不连线的占位端口一起排序，端口位置随布局给出；父模块框包住内部节点与走线并留出内边距，框外的元素在布局后按方位摆放（placeOutside，A7、L4）；elk 在浏览器的 Worker 中运行（无 Worker 环境用同步打包版）；结果过于狭长时再试自左向右，取宽高比更接近画布者。共用件不参与 elk，布局后由 placeShelf 收进父模块框底部一行的共用件架（框随之撑开，O9）；核心模块与「+N」占位按各自尺寸参与布局。关系全是交互（ADR-0029），出入点都排在该侧的前半：每个内部节点在进边一侧的末尾占一个半边长的保留端口（不连边，FIXED_ORDER 固定），留给端口记号（L11、L13）。边界角色（L14）不交给 elk，布局后由 placeRims 压在父模块框线上——port 一行横跨上边、adapter 一列横跨左边，按所连节点的位置排序，框线先向外让出半个节点；它们的边同框外边按需走线。布局后内部边的中间段再分一次轨（allocateTracks，L32），标签按画布实际写的把手角标估宽重新挑位置（placeLabelBoxes，L33）。
  - id: state.layout.runner.boundaries
    name: 框外元素与手工走线
    parent: state.layout.runner
    codeRefs: [src/layout/routes.ts, src/layout/labels.ts]
    responsibility: 方位表示角色（A7、L4）：用户在系统框上方、外部系统与时间在系统框左侧（placeActors，ADR-0039），边界节点在父模块框下方一行、按视图给出的层次顺序（与时序图泳道一致），系统框包住父模块框与边界节点行（placeOutside）；方位固定在屏幕上，不随布局方向改变。普通层次中框外元素的边（参与者的边、边界边）不参与布局，要画时由 edgeRoute 按需正交绕行（routing 的 detour：用户底边、外部系统右边、边界节点顶边出入，选通道时避开已占的竖段（BusyLines），短桩不伸进对面的节点（clampStub），不穿节点，从目标的入口侧进入，同一节点上的多条边错开、同一起点的边各走一条横线；内部节点那一端取 elk 的占位端口，框外元素自身的端口同样左动右静）。画布每次只对当前画出来的那组框外边一起走线并分配轨道（outsideRoutes + routing 的 allocateTracks：走廊里重合或挨得太近的中间段按边 ID 分轨，内部边与框线只占不动、分轨后不穿节点，L32；placeLabelBoxes 按实际尺寸放标签，L33），按布局与可见集记忆。手工走线与编码工具也在这里（routes.ts）：回放临时线与叠加线的曲线 linkRoute、edgeLabel 只给聚合条数 ×N、edgeWeight 线宽档、标签位的词表与组装（labels.ts：EDGE_TAGS 分异常与修饰两级，composePill 画成至多两段、标签至多两个其余「+k」，labelWidth / pillWidth 估宽，L26、ADR-0041）、视图边的机制标签 mechTags（L35）、标签尺寸 labelSize（按两段的实际文字）与 elk 标签槽 slotSize（只按把手角标，机制标签不改走线，L33）、parallelOffsets 平行曲线错开、spreadEnds 平行边终点错开、elk 标签槽与离走线太远的标签坐标作废、isBoundaryEdge（L10），供排布与画布场景使用。L14：placeRims 把普通层次的边界角色压在父模块框线上；框线上的 port 对端在上方（用户）时走顶边、否则走底边，adapter 对端在左侧（外部系统）时走左边、否则走右边；关系边的出入点在该侧前半错开，后半留给端口记号（L11、L13）。

  # ── 模型层 ──────────────────────────────────────────────
  - id: model.pipeline.loader
    name: Loader
    parent: model.pipeline
    responsibility: 解析 YAML / JSON、按 JSON Schema 检查单文件格式（未知字段即报错）、把多个文件合并成一个模型并记录每个实体的出处（文件 / 路径 / 行号）；解析外部参与者、场景与嵌套步骤树（每个步骤记录路径与出处）；sourceLimits 只取第一处声明，重复时提醒（G20）；关系类型的旧名 event / dataflow 映射为 notifies（翻转两端）/ streams 并逐条提醒迁移（M12）；类型为 depends（M15，ADR-0026）与 implements（M17，ADR-0029：实现者已改写在接口的 implementedBy）的关系在格式检查前丢弃并逐条提醒——供读历史提交，文件不整份跳过；via 原样带入，旧的平铺取值由 Validator 读成四形态（M20）；场景的 kind 由 schema 校验（M19）。
    codeRefs: [src/model/load.ts]
  - id: model.pipeline.validator
    name: Validator
    parent: model.pipeline
    responsibility: '跨文件检查：ID 唯一、父模块存在且父链无环、关系端点有效、不连祖先与后代、接口 / 数据结构引用存在、层字段完整；检查外部参与者（ID 与模块不重复）与场景：消息端点是模块或参与者、引用的关系 / 接口 / 数据结构存在且与端点一致、步骤 id 在场景内唯一、ref 指向的场景存在且无循环引用；关系的机制与修饰（ADR-0029）：via 按四形态——旧的平铺取值读成 channel:<同名> / bus:<唯一的总线> / 端口未指明并提醒（M20），port:<P> 的 P 须是已声明的接口、bus:<M> 的 M 须是 role: bus 的模块，否则提醒并去掉（M11）；mode 只用于查询与委托、pull 只用于 streams，用错的提醒并去掉（M13）；notifies 的端点不得是角色为 bus 的总线（M14）；迁移期的 calls 读作未分类（info relation.unclassified，M17）；接口的 implementedBy 每项须是存在的模块，坏引用提醒并去掉、重复去重（M18）；被 via: port: 引用或写了实现者的接口标为端口（T0 裁决 4）；场景消息与对应关系的形态不一致时提醒（查询与委托按 mode、通知一律 async，S19）；查询的场景闭包里有委托或通知时提醒查询有副作用（U13，一对只报一次）。'
    principle: |
      不抛异常：error 级问题的实体被剔除，warning 级只去掉坏引用，返回一份可以安全建索引的模型和问题列表。

      步骤与结构一致性（规则 S5 / S5a）：
      - 引用了 relation：端点与方向必须与关系一致，否则 error；运行时关系的箭头是控制流方向，与消息同向，只有 return 反向比对（S12、ADR-0022）。
      - 没引用 relation：按 S13 推断（两端之间恰好一条运行时关系即认定）；推断不到且两端（及其祖先之间）结构上没有任何关系时报 warning「交互图中没有对应关系」。
      - 只对应四类交互（迁移期的未分类同查询 / 委托，S12）。
      - 消息形态与关系类型不一致（查询、委托与未分类按 mode：同步为 call、异步为 async；通知一律 async；return 与流不比）：warning，不改绑定（S19）。
    codeRefs: [src/model/validate.ts]
  - id: model.pipeline.indexer
    name: Indexer
    parent: model.pipeline
    responsibility: 建立按 ID 查询的结构：模块 / 关系 / 接口 / 数据结构 / 参与者 / 场景表、子模块表（层按 order 排序）、根到模块的路径、出入边表、模块 → 涉及它的场景、参与者 → 由它触发的场景（触发者 = 第一条消息的发送方，规则 A6）；提供最近公共祖先、最近仍存在的祖先等查询。
    codeRefs: [src/model/indexer.ts]
  # 以下三个是 project.ts 内的概念划分，文件归 Projector
  - id: model.projector.endpoints
    name: 端点映射
    parent: model.projector
    responsibility: 把关系两端映射到「当前父模块下的直接子模块」、系统内的边界节点或系统外的参与者，并按开关（只看现状、关系类型）过滤可见性；导出为公共函数 mapEndpoint，供场景投影映射帧端点。
    principle: |
      - 两端落在不同子模块：恰好是子模块本身 → 直接边，否则 → 聚合边；
      - 两端落在同一子模块：属于更深层次，不画；
      - 一端在外部：提升为「最近公共祖先下、它那一侧的子模块」作为边界节点。
  - id: model.projector.collector
    name: 边汇总
    parent: model.projector
    responsibility: 把映射后的关系按 (from, to, type) 收集成视图边（L5）：同一对节点之间不同类型（四类交互，迁移期的未分类单成一类）的关系各成一条，同类型内聚合并记条数（L2）；汇总同步 / 异步（通知一律异步）；按 mechanismOf 记每个机制的条数（mechs，L35，ADR-0041）。
  - id: model.projector.overview
    name: 分层总览
    parent: model.projector
    responsibility: '子模块全是层时产出带（层序、核心模块、隐藏数）与核心跨层边（端点落到核心模块，否则落到层）；role: port / adapter 的第二级模块同核心模块常显在带内、不折叠进「+N」，视图节点带边界角色（L14）。'
  - id: model.projector.hierarchy
    name: 层次顺序与公共祖先
    parent: model.projector
    responsibility: 模块在层次中的排序键 hierarchyKey（P9、L4）：从根下到模块的路径上每一级一项，层按 order、其他按描述顺序；逐项比较即得层次顺序，同一父模块的模块相邻、上层在前、祖先在后代之前。投影按它排边界节点，时序模型按它排泳道；两个模块的最近公共祖先 lowestCommonAncestor（N3 定位关系、S9 场景所在层次）。

relations:
  # 呈现层内部
  - {id: rel.ad.desk-canvas, from: present.desk-view, to: present.canvas.flow, type: commands, description: 项目视图交给视图转换与交互：渲染 GraphCanvas}
  - {id: rel.ad.desk-panel, from: present.desk-view, to: present.panel.dispatch, type: commands, description: 项目视图交给面板分派：渲染 Panel}
  - {id: rel.ad.flow-nodes, from: present.canvas.flow, to: present.canvas.nodes, type: commands, description: 视图转换与交互交给节点组件：渲染 ModuleNode、BoundaryNode、BandNode、CoreNode}
  - {id: rel.ad.flow-edges, from: present.canvas.flow, to: present.canvas.edges, type: commands, description: 视图转换与交互交给边组件：渲染 RouteEdge}
  - { id: rel.ad.flow-legend, from: present.canvas.flow, to: present.canvas.legend, type: commands, description: 视图转换与交互交给显示面板（显示设置与图例）：画布渲染右下角的图例与显示面板（DisplayPanel） }
  - { id: rel.ad.legend-presence, from: present.canvas.legend, to: state.desk.legend, type: queries, payload: [ds.ViewState, ds.LevelView], description: 显示面板向图例的出现集合派生取：按当前视角与层次的静息态画面算出现的记号集合（L47），传给各图例组过滤行 }
  - { id: rel.ad.legend-edge-style, from: present.canvas.legend, to: present.canvas.edges, type: queries, description: 显示面板（显示设置与图例）向边组件取：图例的示意线调用画布边的 edgeStyle 与箭头、插座组件，按同一套颜色、线宽、线型与查询的半透明绘制（L10、L12） }
  - {id: rel.ad.panel-module, from: present.panel.dispatch, to: present.panel.module, type: commands, description: 面板分派交给模块面板：渲染 ModulePanel}
  - {id: rel.ad.panel-relation, from: present.panel.dispatch, to: present.panel.relation, type: commands, description: 面板分派交给关系面板：渲染 RelationPanel}
  - {id: rel.ad.panel-edge, from: present.panel.dispatch, to: present.panel.edge, type: commands, description: 面板分派交给聚合边面板：渲染 EdgePanel}
  - {id: rel.ad.panel-system, from: present.panel.dispatch, to: present.panel.system, type: commands, description: 面板分派交给系统面板：渲染 SystemPanel}
  - {id: rel.ad.module-content, from: present.panel.module, to: present.panel.content, type: commands, description: 模块面板交给内容组件：渲染 Markdown、Section、InterfaceItem、DataStructureItem}
  - {id: rel.ad.relation-content, from: present.panel.relation, to: present.panel.content, type: commands, description: 关系面板交给内容组件：渲染 Markdown、Section、InterfaceItem、DataStructureItem}
  - {id: rel.ad.edge-content, from: present.panel.edge, to: present.panel.content, type: commands, description: 聚合边面板交给内容组件：渲染 Section、RelationRow}
  - {id: rel.ad.system-content, from: present.panel.system, to: present.panel.content, type: commands, description: 系统面板交给内容组件：渲染 Markdown、Section}
  - { id: rel.ad.system-design, from: present.panel.system, to: present.panel.design, type: commands, description: 系统面板交给设计面板：设计版本的根层由系统面板先渲染设计面板与提交信息（DesignSection、CommitSection） }
  - {id: rel.ad.design-content, from: present.panel.design, to: present.panel.content, type: commands, description: 设计面板交给内容组件：渲染 Section、ChangeBadge、Markdown}
  - {id: rel.ad.version-shell, from: present.version, to: present.shell, type: commands, via: 'channel:router', description: 版本切换与设计信息条交给应用外壳与路由：切换版本即导航到对应路由，带上当前 level / sel}

  # 呈现 ↔ 接入（HTTP 请求；变更通知 notifies 由接入层发往页面，控制流方向）
  - id: rel.ad.list-fetch
    from: present.project-list
    to: access.model-source
    type: queries
    via: 'channel:http'
    mode: async
    interface: if.source.endpoints
    payload: [ds.ProjectSummary]
    description: 项目列表主页向 ModelSource 插件取：GET projects.json 取项目摘要列表
  - {id: rel.ad.list-changed, from: access.model-source, to: present.project-list, type: notifies, via: 'channel:hmr', interface: if.source.endpoints, description: 任一项目描述变化后刷新摘要}
  - id: rel.ad.desk-fetch
    from: present.desk-view
    to: access.model-source
    type: queries
    via: 'channel:http'
    mode: async
    interface: if.source.endpoints
    payload: [ds.ModelPayload]
    description: 项目视图向 ModelSource 插件取：GET models/<项目>.json 取该项目全部 YAML 原文
  - {id: rel.ad.desk-changed, from: access.model-source, to: present.desk-view, type: notifies, via: 'channel:hmr', interface: if.source.endpoints, description: 只响应本项目的 arch-model:changed，触发重新加载}

  # 呈现 → 视图状态
  - {id: rel.ad.desk-create, from: present.desk-view, to: state.desk.loading, type: commands, interface: if.desk.createDeskState, description: 项目视图交给模型源同步：进入项目时创建并注入 DeskState，调用 init；变更通知时调用 reload}
  - {id: rel.ad.desk-keys, from: present.desk-view, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 项目视图交给 dispatch 与操作：Esc 只取消选中，Backspace 返回上级（N7、N9）}
  - {id: rel.ad.flow-act, from: present.canvas.flow, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 视图转换与交互交给 dispatch 与操作：单击 → select，双击 → drillInto / revealModule，悬停 → setHover}
  - {id: rel.ad.flow-bounds, from: present.canvas.flow, to: state.layout.runner, type: queries, interface: if.layout.contentBounds, description: 视图转换与交互向布局入口与缓存取：适应画布时取内容外框}
  - {id: rel.ad.panel-read, from: present.panel.dispatch, to: state.desk.projection, type: queries, payload: [ds.Selection], description: 面板分派向视图派生（核心与 desk.run）取结果}
  - {id: rel.ad.edgepanel-read, from: present.panel.edge, to: state.desk.projection, type: queries, payload: [ds.LevelView], description: 聚合边面板向视图派生（核心与 desk.run）取：在当前视图里查找聚合边}
  - {id: rel.ad.module-act, from: present.panel.module, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 模块面板交给 dispatch 与操作：子模块点击、进入、可依赖层跳转}
  - {id: rel.ad.relation-act, from: present.panel.relation, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 关系面板交给 dispatch 与操作：端点跳转、定位到所在层次}
  - {id: rel.ad.content-act, from: present.panel.content, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 内容组件交给 dispatch 与操作：关系行点击 → revealRelation}
  - {id: rel.ad.crumb-act, from: present.nav.breadcrumb, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 面包屑让 dispatch 与操作接手处理}
  - {id: rel.ad.toolbar-act, from: present.nav.toolbar, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 工具栏交给 dispatch 与操作：搜索结果 → revealModule；显示开关写入 toggles}
  - {id: rel.ad.issues-read, from: present.issues, to: state.desk.loading, type: commands, payload: [ds.Issue], description: 问题页签让模型源同步接手处理}
  - {id: rel.ad.version-read, from: present.version, to: state.desk.versions, type: commands, payload: [ds.DesignInfo, ds.ModelDiff], description: 版本切换与设计信息条交给版本与对比基线（desk.versions）：设计、轮次、对比基线、变更计数；对比基线与标出变更写入 toggles}
  - {id: rel.ad.flow-diff, from: present.canvas.flow, to: state.desk.versions, type: queries, payload: [ds.ModelDiff], description: 视图转换与交互向版本与对比基线（desk.versions）取：节点与边的变更标记}
  - {id: rel.ad.design-read, from: present.panel.design, to: state.desk.versions, type: queries, payload: [ds.DesignInfo, ds.ModelDiff], description: 设计面板向版本与对比基线（desk.versions）取结果}
  - {id: rel.ad.design-act, from: present.panel.design, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 设计面板交给 dispatch 与操作：变更清单点击 → revealModule / revealRelation}
  - {id: rel.ad.content-diff, from: present.panel.content, to: state.desk.versions, type: queries, payload: [ds.ModelDiff], description: 内容组件向版本与对比基线（desk.versions）取：新增 / 修改标记与改了哪些字段}

  # 呈现 → 模型（只依赖契约「类型与 Schema」，U10）
  - {id: rel.ad.crumb-name, from: present.nav.breadcrumb, to: model.types, type: queries, description: 面包屑向类型与 Schema 取：moduleName 取显示名}

  # 视图状态内部与 → 模型
  - {id: rel.ad.loading-entry, from: state.desk.loading, to: model, type: queries, interface: if.model.loadModel, payload: [ds.ModelIndex, ds.Issue], description: 模型源同步向 loadModel 入口取：loadModel}
  - {id: rel.ad.loading-baselines, from: state.desk.loading, to: state.desk.versions, type: streams, pull: true, payload: [ds.ModelPayload], description: 设计版本的载荷附带设计信息与对比基线原文}
  - {id: rel.ad.versions-diff, from: state.desk.versions, to: model.diff, type: queries, interface: if.model.diffModels, payload: [ds.ModelDiff], description: 版本与对比基线（desk.versions）向版本对比取：切换对比基线或重新加载时重算}
  - {id: rel.ad.loading-keep, from: state.desk.loading, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 模型源同步交给 dispatch 与操作：加载完成 → dispatch(loaded / reloaded)，层次回退由转移规则决定}
  - {id: rel.ad.url-actions, from: state.desk.url-sync, to: state.desk.actions, type: commands, via: 'channel:callback@state.desk.url-sync', interface: if.desk.actions, description: 路由同步交给 dispatch 与操作：外部路由变化 → decode → dispatch}
  - {id: rel.ad.actions-url, from: state.desk.actions, to: state.desk.url-sync, type: streams, payload: [ds.ViewState], description: 状态改变后写地址（router.write），地址 = encode(状态)}
  - {id: rel.ad.actions-lca, from: state.transition.navigation, to: model.projector.hierarchy, type: queries, interface: if.model.lowestCommonAncestor, description: 导航规则向层次顺序与公共祖先取：定位关系用最近公共祖先}
  - id: rel.ad.projection-project
    from: state.desk.projection
    to: model.projector
    type: queries
    interface: if.model.projectLevel
    payload: [ds.ProjectOptions, ds.LevelView]
    description: 视图派生（核心与 desk.run）向 Projector 层次投影取：索引、层次或开关变化时重新投影
  - id: rel.ad.projection-layout
    from: state.desk.projection
    to: state.layout.runner
    type: queries
    mode: async
    interface: if.layout.layoutView
    payload: [ds.LevelView, ds.PositionedView]
    description: 视图派生（核心与 desk.run）向布局入口与缓存取：视图变化后异步布局，用序号丢弃过期结果
  - {id: rel.ad.graph-boundaries, from: state.layout.runner.graph, to: state.layout.runner.boundaries, type: queries, description: 普通层次排布向框外元素与手工走线取：placeOutside、compassOf、edgeLabel、spreadEnds：框外元素按方位摆放、端口方向与标签}
  - {id: rel.ad.layered-boundaries, from: state.layout.runner.layered, to: state.layout.runner.boundaries, type: queries, description: 分层总览排布向框外元素与手工走线取：placeOutside、portFor、slotOf、parallelOffsets：分层总览中框外元素的位置、正交走线的端口与错开、核心跨层边的平行曲线}

  # 接入层
  - {id: rel.ad.source-reader, from: access.model-source, to: access.reader, type: queries, interface: if.reader.projects, payload: [ds.ProjectSummary, ds.ModelPayload], description: ModelSource 插件向描述读取取：resolveModelRoot、isModelFile、listProjects、readProject}
  - {id: rel.ad.lint-reader, from: access.lint, to: access.reader, type: queries, interface: if.reader.projects, description: 命令行校验向描述读取取：resolveModelRoot、listProjectIds、listDesigns、designSketches}
  - {id: rel.ad.lint-entry, from: access.lint, to: model, type: queries, interface: if.model.loadModel, payload: [ds.Issue], description: 命令行校验向 loadModel 入口取：loadModel}
  - {id: rel.ad.reader-entry, from: access.reader, to: model, type: queries, interface: if.model.loadModel, description: 描述读取向 loadModel 入口取：生成项目摘要时跑一遍模型层}

  # 模型层内部
  - {id: rel.ad.flow-validate-index, from: model.pipeline.validator, to: model.pipeline.indexer, type: streams, payload: [ds.ArchModel], description: 剔除坏实体后的模型交给建索引}
  - {id: rel.ad.loader-schema, from: model.pipeline.loader, to: model.types, type: queries, payload: [ds.ArchFileDef, ds.RawFile], description: Loader 向类型与 Schema 取：isSketchFile}
  - {id: rel.ad.overview-endpoints, from: model.projector.overview, to: model.projector.endpoints, type: queries, description: 分层总览向端点映射取结果}
  - {id: rel.ad.endpoints-collector, from: model.projector.endpoints, to: model.projector.collector, type: queries, description: 端点映射向边汇总取结果}
  - {id: rel.ad.overview-collector, from: model.projector.overview, to: model.projector.collector, type: queries, description: 分层总览向边汇总取：核心跨层边单独汇总}
  # 模型层入口的再导出与名称、标签（K7 按代码补齐）
  - {id: rel.ad.indexer-steps, from: model.pipeline.indexer, to: model.scenario-semantics, type: queries, description: Indexer 向回放计划取：messagesOf：建索引时收集场景消息}
  - { id: rel.ad.content-labels, from: present.panel.content, to: present.shared, type: commands, description: 内容组件交给呈现共用件：渲染变更角标与代码块时调用 useOpenPreview 在副栏预览文件、useNavTab 切页签、highlightTs 高亮签名 }
  - { id: rel.ad.relation-type-labels, from: present.panel.relation, to: present.shared, type: commands, description: 关系面板交给呈现共用件：经 useOpenPreview / useNavTab 打开证据文件与切换页签 }
  - { id: rel.ad.edge-type-labels, from: present.panel.edge, to: present.shared, type: commands, description: 聚合边面板交给呈现共用件：经 useOpenPreview / useNavTab 打开证据文件与切换页签 }
  - { id: rel.gv.ports-type-labels, from: present.panel.governance, to: present.shared, type: commands, description: 架构治理面板交给呈现共用件：治理面板经 useOpenPreview / useNavTab 打开证据文件与切换页签 }
  - { id: rel.ad.design-labels, from: present.panel.design, to: present.shared, type: commands, description: 设计面板交给呈现共用件：调用 intentName 显示持久草图名，经 useOpenPreview 在副栏预览 ADR 与草图文件 }
  - { id: rel.ad.actor-labels, from: present.panel.actor, to: present.shared, type: commands, description: 参与者面板交给呈现共用件：经 useOpenPreview / useNavTab 打开证据文件与切换页签 }
  - {id: rel.ad.nodes-act, from: present.canvas.nodes, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 节点组件交给 dispatch 与操作：分支预览选这一支（chooseBranch）、步骤序号指向这一步（seek）}
  - { id: rel.ad.port-marks-act, from: present.canvas.nodes.ports, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 端口记号交给 dispatch 与操作：单击端口 select 端口（L13），单击合成的「端口 ×N」select 定义模块 }
  - {id: rel.ad.system-read, from: present.panel.system, to: state.desk.projection, type: queries, description: 系统面板向视图派生（核心与 desk.run）取：读索引、层次视图与版本}
  - {id: rel.ad.system-act, from: present.panel.system, to: state.desk.actions, type: commands, interface: if.desk.actions, description: 系统面板交给 dispatch 与操作：选中模块或问题}
  - { id: rel.ad.projection-names, from: state.desk.projection, to: model.pipeline.indexer, type: queries, description: 视图派生（核心与 desk.run）向 Indexer 取：派生场景列表时调用 triggerOf 取每个场景的触发者 }

interfaces:
  - id: if.model.loadModel
    name: loadModel
    owner: model
    signature: |
      loadModel(files: readonly RawFile[]): { index: ModelIndex; issues: Issue[] }
    semantics: 纯函数，不抛异常；有问题的实体被剔除或修剪，问题按 error / warning 汇总。
  - id: if.model.load
    name: load
    owner: model.pipeline.loader
    signature: |
      load(files: readonly RawFile[]): { model: ArchModel; issues: Issue[] }
    semantics: 按路径排序后逐个解析；YAML 语法错误或格式错误的文件整份跳过。
  - id: if.model.validate
    name: validate
    owner: model.pipeline.validator
    signature: |
      validate(model: ArchModel): { model: ArchModel; issues: Issue[] }
  - id: if.model.buildIndex
    name: buildIndex
    owner: model.pipeline.indexer
    signature: |
      buildIndex(model: ArchModel): ModelIndex
      nearestExisting(index: ModelIndex, path: readonly string[]): string   // 旧路径中最深的、在本索引中仍存在的模块（否则根）
    semantics: 输入必须来自 validate()。
  - id: if.model.names
    name: moduleName
    owner: model.types
    signature: |
      moduleName(index: ModelIndex, id: string): string   // 模块、参与者或系统根的显示名
      isLong(lines: number | undefined, maxLines: number): boolean   // G20
      isArchived(status: DesignStatus): boolean   // DV-6
      RULE_LABELS: Record<RuleKind, string>
    semantics: 契约里的名称查询与小谓词（U10）：只按 ID 或枚举查表，不做投影与计算；呈现层、命令行与模型层内部共用。
  - id: if.model.projectLevel
    name: projectLevel
    owner: model.projector
    signature: |
      projectLevel(index: ModelIndex, parentId: string, opts?: ProjectOptions): LevelView
      nearestVisibleLevel(index: ModelIndex, levelId: string, opts: ProjectOptions): string   // N12
    semantics: 层次不存在或被「只看现状」隐藏时抛错（调用方先用 nearestVisibleLevel 取合法层次）；同样的输入得到同样的输出（边 ID 稳定）。
  - id: if.model.lowestCommonAncestor
    name: lowestCommonAncestor
    owner: model.projector.hierarchy
    signature: |
      lowestCommonAncestor(index: ModelIndex, a: string, b: string): string   // 两个模块路径的最近公共祖先；不存在的模块按根算
    semantics: 纯函数；定位关系（N3）与场景所在层次（S9）共用。
  - id: if.model.hierarchyKey
    name: hierarchyKey
    owner: model.projector.hierarchy
    signature: |
      hierarchyKey(index: ModelIndex, id: string): number[]   // 每级两项：[0, order]（层）或 [1, 描述顺序]；参与者为空
      compareKeys(a: number[], b: number[]): number          // 逐项比较，前缀较短者在前
    semantics: 纯函数；画布边界节点行与时序图泳道共用，两张图的外部模块顺序一致。
  - id: if.model.diffModels
    name: diffModels
    owner: model.diff
    signature: |
      diffModels(base: ModelIndex, target: ModelIndex, opts?: { lineage?: Lineage }): ModelDiff   // lineage：设计草图的 from（X11）
    semantics: 纯函数；变更按实体类别（模块、关系、接口、数据结构）与变更类别排序；给了血缘时条目带 kind（合并 / 拆分 / 改 ID / 移动）与 from / to，前缀级联与合并带走的来源被吸收。
  - id: if.layout.layoutView
    name: layoutView
    owner: state.layout.runner
    signature: |
      layoutView(view: LevelView): Promise<PositionedView>
    semantics: 结果按视图内容缓存；layered 同步计算，graph 走 elk。
  - id: if.layout.contentBounds
    name: contentBounds
    owner: state.layout.runner
    signature: |
      contentBounds(pv: PositionedView): Box | null
  - id: if.desk.createDeskState
    name: createDeskState
    owner: state.desk
    signature: |
      createDeskState(fetchModel: () => Promise<ModelPayload>, options?: { project?: string; version?: VersionRef; source?: SourceFetcher }): DeskState
      // DeskState（ADR-0013）：核心平铺 { state（只读）, status, index, issues, allIssues, levelId, levelPath, selection, selected, hoverId,
      //   perspective, toggles, view, positioned, levelVersion, playback, dispatch, init, attachRouter, …操作（见 if.desk.actions） }
      //   + run：{ scenario, plan, path, scenarioView, currentIndex, walked, frame, overlay, sequence, positionedSequence, emphasis, participation, outline, … }
      //   + files：{ payload, ownership, tree, lines, maxLines, selected, owners, hits, moduleFiles, warnings, filesOf, entryOf, file(path), exports(path), refresh }
      //   + versions：{ designs, design, revision, sketch, sketchPrompt, baselines, baseline, diff, drift }
      //   + edit：{ session, active, dirty, scene, validation, vsBaseline, vsCurrent, comparison, breadcrumb, …操作（见 if.desk.edit） }   // 只在草图版本上有会话
    semantics: 每个项目的每个版本一份；在组件 setup 中创建，其 watch 与同步适配器随组件销毁。草图画布下核心的 index 为设计的索引（各张草图连同 system.yaml、持久草图与引用的外部模块）。
  - id: if.desk.actions
    name: DeskState 操作
    owner: state.desk.actions
    signature: |
      dispatch(action: ViewAction): boolean                   // 唯一写入口；返回状态是否改变
      // 以下都是构造动作并 dispatch 的便捷包装
      drillInto(moduleId: string): boolean
      goTo(levelId: string, select?: Selection | null): void
      goUp(): void
      select(selection: Selection | null): void
      revealRelation(relationId: string): void
      revealModule(moduleId: string): void
      setHover(id: string | null): void
      setToggles(patch: Partial<Toggles>): void
      openScenario(id: string): void                          // 进入运行视角，停在开头（R12）
      closeScenario(): void
      next(): void
      prev(): void
      seek(frameId: string | null): void                      // null = 回到开头
      chooseBranch(pointId: string, option: number): number   // 返回被丢弃的其他分支选择个数（F6f）
      selectFile(path: string): void                          // 源码（G）
      refreshSource(): Promise<void>
      sourceFile(path: string): Promise<SourceFile | null>
      sourceExports(path: string): Promise<ExportedSymbol[] | null>
    semantics: 操作本身不含规则；同一动作在任何状态下的效果由视图状态转移决定。
  - id: if.source.endpoints
    name: 模型端点
    owner: access.model-source
    signature: |
      GET projects.json            → ProjectSummary[]
      GET models/<项目>.json       → ModelPayload        // 当前版本；不存在时 404
      GET models/<项目>/designs/<设计>/<轮次>.json → ModelPayload  // 设计版本某一轮，附 compare 对比基线
      GET models/<项目>/designs/<设计>/sketch.json → ModelPayload  // 设计的草图版本：各张 sketches/<mount>.yaml + 引用的外部模块，附 sketchFiles（各自指纹）、基线与「交给 AI」的指令
      GET models/<项目>/intent/<草图 ID>.json → ModelPayload  // 持久草图版本（system.yaml + intent/**），附 sketch { file, hash } 与指令
      POST write/<项目>/sketch                 { target, sketch, baseHash } → { file, hash } | 409 | 422   // B6，持久草图
      POST write/<项目>/designs/<设计>/sketch  { target, sketch, baseHash } → { file, hash } | 409 | 422   // B6，设计的一张草图
      POST write/<项目>/designs/<设计>/sketches SaveDesignRequest → SaveDesignResult | 409 | 422          // X20、B7，按设计写回（多张、改名、删除）
      POST write/<项目>/designs                { id, name, goal?, mount?, sketch? } → { file, files } | 409   // 新建设计：给挂载点时底稿从基线（仓库 HEAD）复制（X18）
      ws  arch-model:changed       → { project: string }  // 仅开发态，按项目合并 150ms 内的变化
    semantics: 开发服务器实时读取（本地开发工具，没有构建态输出，ADR-0020）。写端点只收同源 JSON（B5）。
  - id: if.reader.projects
    name: 项目读取
    owner: access.reader
    signature: |
      listProjectIds(modelRoot: string): string[]
      readProject(modelRoot: string, id: string, projectRoot: string): ModelPayload | null
      listProjects(modelRoot: string, projectRoot: string): ProjectSummary[]
      listDesigns(projectDir: string): DesignInfo[]
      readDesignRevision(modelRoot, project, design, revision, projectRoot): ModelPayload | null
      readSketchVersion(modelRoot, project, design, projectRoot, docsRoot?, opts?): ModelPayload | null   // 设计的草图版本（X9、X19、X20）
      readIntentVersion(modelRoot, project, sketchId, projectRoot): ModelPayload | null   // 持久草图版本，附 sketch { file, hash }
      designSketches(projectDir, design): { design; file: RawFile }[]; designSketchFiles(projectDir, design): { mount; file; hash; needsLayout? }[]   // sketches/*.yaml，根挂载在前
      readRevisionNote(designDir: string, revision: string): { date?: string; summary?: string; questions?: string[]; problems: string[] }   // r<N>/revision.yaml（AI 拥有）
      listRevisionDirs(designDir: string): string[]   // 含 system.yaml 的 r<N>/，按 N 的数字排序
    semantics: 含 system.yaml 的子目录才算项目；项目 ID、设计 ID、轮次 ID 只允许目录名安全字符。design.yaml 的问题记入 DesignInfo.problems，不抛错；只有草图、没有轮次的设计不算问题。

dataStructures:
  - id: ds.ArchFileDef
    name: ArchFileDef
    definition: |
      interface ArchFileDef {
        system?: SystemDef
        module?: ModuleDef          // 可带 parent 挂到已有模块下
        modules?: ModuleDef[]
        relations?: RelationDef[]
        interfaces?: InterfaceDef[]
        dataStructures?: DataStructureDef[]
        actors?: ActorDef[]          // 外部参与者
        scenario?: ScenarioDef
        scenarios?: ScenarioDef[]
        sourceIgnore?: string[]      // 忽略清单（G8）
      }
    description: 一个 YAML 文件的顶层形状，与 schema/arch-file.schema.json 对应。
  - id: ds.RawFile
    name: RawFile
    definition: |
      interface RawFile { path: string; text: string }
    description: 一份描述文件的原文，path 相对项目的描述目录。
  - id: ds.ArchModel
    name: ArchModel
    definition: |
      interface ArchModel {
        system: SystemDef
        modules: ModuleEntity[]       // 扁平化，带 parentId / seq / src
        relations: RelationEntity[]
        interfaces: InterfaceEntity[]
        dataStructures: DataStructureEntity[]
        actors: ActorEntity[]
        scenarios: ScenarioEntity[]
        sourceIgnore: string[]        // 各文件 sourceIgnore 的合并，不参与版本对比
      }
    description: 多个文件合并后的模型，每个实体记录出处 src { file, path, line }。
  - id: ds.Issue
    name: Issue
    definition: |
      interface Issue {
        severity: 'error' | 'warning'
        code: string
        message: string
        file?: string; path?: string; line?: number
      }
    description: 描述文件中的问题；error 表示实体被剔除，warning 表示只去掉了坏引用或缺内容。
  - id: ds.ModelIndex
    name: ModelIndex
    definition: |
      interface ModelIndex {
        rootId: string
        modules: Map<string, ModuleEntity>
        relations: Map<string, RelationEntity>
        childrenOf: Map<string, string[]>   // 层按 order 排序
        pathOf: Map<string, string[]>       // 从根到模块
        outRelations / inRelations: Map<string, string[]>
        scenarios: Map<string, ScenarioEntity>
        scenariosOf: Map<string, string[]>       // 模块 → 有帧端点落在其子树内的场景
        actors: Map<string, ActorEntity>
        triggeredBy: Map<string, string[]>       // 参与者 → 由它触发的场景（第一条消息的发送方）
        // …
      }
    description: 按 ID 查询的索引。
  - id: ds.ProjectOptions
    name: ProjectOptions
    definition: |
      interface ProjectOptions {
        showBoundaries: boolean
        relationTypes?: RelationType[]
        currentOnly?: boolean
        scenarioEnds?: { from: string; to: string }[]
      }
    description: 投影开关。
  - id: ds.LevelView
    name: LevelView
    definition: |
      interface LevelView {
        mode: 'graph' | 'layered'
        parentId: string
        nodes: ViewNode[]            // role: module | boundary | layer | core | actor
        edges: ViewEdge[]
        bands?: Band[]               // 仅 layered
        coreEdges?: ViewEdge[]       // 仅 layered，聚焦时显示
      }
    description: 一个层次要画的节点与边。
  - id: ds.ViewEdge
    name: ViewEdge
    definition: |
      interface ViewEdge {
        id: string                   // from->to:type（L5），重新加载后不变
        kind: 'direct' | 'aggregate'
        from: string; to: string
        type: RelationType           // queries | commands | notifies | streams（迁移期另有 calls = 未分类，M17）
        relationIds: string[]        // 条数即其长度
        mode: 'sync' | 'async' | 'mixed'
      }
    description: 视图中的一条边，可能聚合了多条原始关系。
  - id: ds.Band
    name: Band
    definition: |
      interface Band { layerId: string; order: number; coreModuleIds: string[]; hiddenCount: number }
    description: 分层总览中的一条带。
  - id: ds.PositionedView
    name: PositionedView
    definition: |
      interface PositionedView {
        view: LevelView
        nodes: Map<string, Box>          // { x, y, w, h }
        edges: Map<string, EdgeRoute>    // { points, curve?, label? }
        coreEdges: Map<string, EdgeRoute>
      }
    description: 布局结果：每个节点的位置尺寸与每条边的走线。
  - id: ds.Selection
    name: Selection
    definition: |
      type Selection =
        | { kind: 'module'; id: string }
        | { kind: 'relation'; id: string }
        | { kind: 'edge'; id: string }     // 视图中的边（多为聚合边）
        | { kind: 'actor'; id: string }
        | { kind: 'file'; id: string }     // 源码文件，id 为相对源码根目录的路径（G16）
        | { kind: 'port'; id: string }     // 端口，id 为接口 ID（L13）
        // … 另有代码依赖叠加线 dep、耦合线 couple
      // 推出的选中（selectedOf，ADR-0012）：Selected = Selection | { kind: 'step'; id: frameId } | { kind: 'scenario'; id }
    description: "显式选中的对象，编码进 URL 的 sel 参数（m: / r: / e: / a: / f: / d: / c: / p: 前缀）。运行视角下为空即选中进度所在的步骤（URL 只有 step），进度在开头时选中场景（sel 与 step 都没有）。"
  - id: ds.ModelPayload
    name: ModelPayload
    definition: |
      interface ModelPayload {
        project?: string; dir: string; files: RawFile[]
        designs?: DesignInfo[]                       // 本项目的全部设计版本
        version?: { design: string; revision: string } // 设计版本时给出
        compare?: { current: CompareSource; previous?: CompareSource; baseline?: CompareSource } // { label, dir, files }；baseline 为设计 base.commit 那一版描述（X17）
        sketch?: { file: string; hash: string; path?: string }   // 草图版本的主草图（根挂载在前）与读取时的指纹（X6 同一算法），保存时带回（X7i）
        sketchFiles?: { mount; file; path?; hash; needsLayout? }[]   // 设计的全部草图（X9、X20）
        sketches?: { design; file: RawFile }[]       // 对本版本有约束力的设计草图（X4）
        sketchPrompt?: string                        // 「交给 AI」的指令（DV-10、X20）
      }
      // version 另有 { design, revision: 'sketch' }：设计的草图版本；{ intent: string }：持久草图版本
    description: 一个项目某个版本的全部描述原文，由 ModelSource 交给页面；设计版本附带对比基线原文。
  - id: ds.ProjectSummary
    name: ProjectSummary
    definition: |
      interface ProjectSummary {
        id: string; name: string; description?: string
        source?: { repo?: string; commit?: string; generatedAt?: string }
        layered: boolean
        top: { id: string; name: string; abstraction?: string }[]
        counts: { modules: number; relations: number; interfaces: number; dataStructures: number }
        errors: number; warnings: number
        designs: DesignInfo[]
      }
    description: 项目列表页展示的摘要，由接入层在 Node 侧跑模型层算出。
  - id: ds.DesignInfo
    name: DesignInfo
    definition: |
      interface DesignInfo {
        id: string; name: string
        status: 'draft' | 'reviewing' | 'accepted' | 'implemented' | 'abandoned'
        goal?: string
        base?: { commit?: string; generatedAt?: string }
        revisions: { id: string; date?: string; summary?: string; questions?: string[]; feedback?: string }[]
        sketch?: boolean; sketches?: { mount: string; file: string; needsLayout?: boolean }[]   // designs/<设计>/sketches/*.yaml（X9）
        deviations?: { errors: number; warnings: number }   // 有草图、未归档的设计的偏差计数（X4）
        // 轮次 = 目录 r<N>/（按 N 排序）；date / summary / questions 来自 r<N>/revision.yaml（AI 拥有）；feedback 来自 design.yaml 的 revisions[]（人拥有，按 id 对上）；旧设计的 revisions[] 兼容
        problems: string[]
      }
    description: 设计版本的元信息，来自 designs/<设计>/design.yaml 与各轮的 revision.yaml。
  - id: ds.ModelDiff
    name: ModelDiff
    definition: |
      interface ModelDiff {
        changes: Change[]       // { entity, id, kind: added|changed|merged|split|renamed|moved|removed, name, fields?, from?, to? }
        module / relation / interface / dataStructure: Map<string, Change>  // 仅新增与修改
        touched: Map<string, number>  // 模块 → 涉及的变更条数
        counts: Record<ChangeKind, number>   // 七类；没有血缘时只有新增 / 修改 / 删除
      }
    description: 设计版本相对对比基线的差异。
