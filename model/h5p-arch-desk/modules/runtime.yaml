# 运行视角：场景投影、会话规则、时序图与回放相关的子模块、关系、接口与数据结构。
# 规则编号（V / N / S / A / F / P / R / T）见 docs/02-domain.md。

modules:
  # ── 骨架模块的代码落点（04 §3.10：骨架只写目录级，细到文件的由 AI 在这里补充，X1）──
  - id: present.desk-view
    name: 项目视图
    summary: 为一个项目版本搭好工作台并接通会话状态
    abstraction: 一个项目一个版本一份 DeskState，由这里创建并注入；自身只布置三列（导航树 | 工作列 | 资料区，ADR-0054），资料区另成一件。
    invariants:
      - 每个视图实例只调一次 createDeskState，并经 provide 注入子组件
      - 描述、源码与写入的 HTTP 实现由这里注入 DeskState，子组件不直接请求
      - { text: 属性栏并排还是悬浮只由工作列宽度推出（propsPlacement），不存状态, adr: 54 }
    principle: |
      - 工作列（WS-1）：工具栏只属于工作列、与资料区标签栏同高，保持一行——按钮不缩，版本选择、场景名、面包屑、搜索依次收窄；属性栏 330px 跟随选中，开关是工作区状态并按本机记住（WS-2）；宽度 − 330 ≥ 620 并排，否则悬浮在画布右侧，悬浮时经 CANVAS_INSET 把盖住的宽度交给画布（WS-3）。
      - 卡片直接立在画布上（CD-2，ADR-0057）：属性列没有底板与分隔线；悬浮时列与滚动区不接指针、卡片接指针，卡片之间的空隙落到画布。× 放在滚动区右上角、随身份卡滚走、悬停身份卡时显出（CD-3）。运行视角的回放胶囊浮在画布底部，位置由 playerPlacement 按画布宽、悬浮避让宽、胶囊宽与缩放胶囊右沿推出；放不下时悬浮卡片列底部让出胶囊（CD-8）。
      - 资料区从不显示变为显示时收起导航树（dockAppeared），导航树在「文件」页签或因打开场景而出现时除外；「专注」收起导航树与属性栏，再按恢复（WS-9）。面板的「预览」经 OPEN_PREVIEW 打开源代码预览标签（G15）。
      - 「怎么读这张图」（GuideDialog）按三问四修饰讲一条线（ADR-0029 §3）：三个判断题定类型，再读机制（插座 = 经端口）、异步、拉取；查询淡、委托实色，端口是方框进边一侧的小记号。
      - 「组装」叠加开关同演化叠加，按项目记在本机：模型加载后恢复，之后每次变化写回（useAssemblyPrefs，O12）。
      - 「显示 ▾」在工具栏视角切换之后（L49，ADR-0056）；窄工作列时它的摘要先让位，场景名与版本选择的最小宽度随之收窄，视角块不被压到盖住退出按钮。帮助经 OPEN_GUIDE 也可由图例关系组的「?」打开，并定位到「读一条线」（L51）。
    codeRefs: [src/components/DeskView.vue, src/components/GuideDialog.vue]
  - id: present.scenarios
    name: 场景列表
    summary: 列出与当前层次相关的场景，选定即进入运行视角
    abstraction: 只列出与筛选 DeskState 派生好的场景，选定即交给它进入运行视角，自身不遍历场景、不改层次。
    principle: 场景按类别筛选（R17，ADR-0030）：默认只列主流程（kind 缺省 main），可切到「全部类别」，切换记在本机、所有项目共用、不进 URL；非主流程项在名字后标「异常」/「维护」；类别筛选与层次、发起者筛选叠加（filterScenariosByKind）。
    codeRefs: [src/components/ScenarioList.vue]
  - id: present.perspective
    name: 视角切换
    summary: 显示当前视角，并提供进入或退出场景的入口
    abstraction: 视角由视图状态推出，这里只显示当前视角并发出切换意图，自身不存视角。
    principle: 画布顶部「结构 ｜ 交互 ｜ 运行：<场景名>」三段切换（V11，ADR-0031）：不开场景时单击「结构」「交互」切换画布模式（发 setMode，结构视角写 URL `v=s`，交互为缺省）；打开场景即运行视角，单击「结构」或「交互」即退出场景并进入那个视角，退出按钮回到进入前的视角；各段的 title 说明这种视角回答什么。
    codeRefs: [src/components/PerspectiveSwitch.vue]
  - id: present.player
    name: 回放控制条
    summary: 让用户逐步前进后退、拖动进度并选择分支
    abstraction: 回放只由用户驱动：胶囊与路线浮层只发单步、指向与选分支的意图，路径与路线都取派生数据。
    principle: 浮在画布底部的胶囊（CD-7，ADR-0057；位置由项目视图给，CD-8）：◀ 第 n / ≥N 步 ▶、进度条、路线按钮；路线平时只显示编号（各分支点所选选项的序号），停在未选的分支点时为「选路线 ▾」，单击展开上方浮层——分支选择与路线总览；停在一个新的分支点时浮层自动展开（CD-9）。
    codeRefs: [src/components/PlayerBar.vue, src/components/BranchChooser.vue]
  - id: model.scenario
    name: 场景投影
    summary: 把场景按已选分支与当前层次投影成可见消息与时序模型
    abstraction: 只做投影：读场景语义（回放计划与绑定）算路径、按本层投影出可见消息与时序模型，查询都建在其上；投影不反向依赖加载流水线（ADR-0051）。
    invariants:
      - { text: 场景投影不引用 Loader、Validator、Indexer，不反向依赖加载流水线, adr: 51 }
      - 帧端点映射复用 Projector 的 mapEndpoint，与结构投影同一套规则
    codeRefs: [src/model/scenario/index.ts, src/model/scenario/path.ts, src/model/scenario/level.ts, src/model/scenario/participation.ts, src/model/scenario/outline.ts, src/model/scenario/sequence.ts]
  - id: present.sequence
    name: 时序图
    summary: 把当前层次的场景画成可点选的时序图
    abstraction: 按画面区块切分，交互集中一处转成 DeskState 操作；坐标全取时序图排布，自身不排布。
    invariants:
      - 只有 SequenceView 取 DeskState 并发操作，泳道头、消息区、组合框只收属性
      - 坐标全取 desk.run 定位好的时序图，组件不调用排布函数
      - 只在播放头所在的帧变化时滚动，悬停、选中、换层次不滚动
  - id: state.transition
    name: 视图状态转移
    summary: 按会话规则由状态与动作算出下一个视图状态
    abstraction: 会话规则按话题拆成纯函数，输入状态与动作、输出新状态，不碰外界；被描述系统的问题一律问模型层；工作区规则（workspace.ts）是另一个值的转移，与视图状态互不约束。
    invariants:
      - 只引用模型层与自身文件，不依赖 Vue、路由与计时器
      - 视图状态的转移输入状态、动作与上下文，只返回新状态、是否进历史与被清空的选中
      - { text: 工作区状态是另一个值，只经 workspaceTransition 改变，不进 URL 与历史, adr: 54 }

  # ── 呈现层 ──────────────────────────────────────────────
  - id: present.desk-view.split
    name: 资料区
    summary: 以多标签打开时序图、源代码与图解，可预览、分屏、关闭
    parent: present.desk-view
    responsibility: 工作区右侧从顶到底的一列（原「副栏」，ADR-0054）：时序图、源代码与图解都以标签打开，每组的标签栏在第一行、与工具栏同高；预览标签斜体、被下一次不固定的打开替换，双击标签固定（WS-5）；「⊟ 分屏」最多上下两组、单击组内即聚焦、「取消分屏」并回，✕ 关闭全部（WS-6、WS-7）；时序图标签内容区顶部是本层不可见提示、「定位」「图例」（WS-10）；图解标签（EX-3、EX-4、EX-7）顶部是 ↑ ↓ 图解导航与「基于旧描述 · N 处改动」，内容是只给 allow-scripts 的沙箱 iframe：srcdoc 在 head 最前注入禁止网络请求的 CSP、body 末尾注入桥接脚本（填 data-field、附「图解 ›」、单击转 postMessage），父页只收来源是这个 iframe 的消息——arch:select 在画布上选中模块（资料区不动），arch:open 以预览打开另一份图解。不跟随选中：只读工作区状态、只发工作区意图（WS-8）。
    abstraction: 一列（DockPane）按组排、一组（DockGroup）是标签栏加活动标签的内容，标签内容按资料种类交给时序图、源代码预览或图解（ExplainerDoc）。
    invariants:
      - { text: 只读 desk.workspace 的状态、只经它的 dispatch 发意图，自身不存标签与分组, adr: 54 }
      - 选中、悬停、移动进度都不改资料区
      - { text: 图解在只给 allow-scripts 的 iframe 里显示，父页只接受来源是那个 iframe 窗口的消息, adr: 55 }
    codeRefs: [src/components/dock/**]

  - id: present.sequence.lanes
    name: 泳道与消息
    summary: 画出生命线、消息箭头与内部活动
    parent: present.sequence
    responsibility: 消息区：生命线、按序自上而下画消息箭头与标签；同步 / 异步 / 显式返回三种线型（隐含的返回不画）；内部活动画成生命线上的激活条；本层没有视图边的消息在标签后标「经由上层关系」（P15）或红色箭头「交互中未建模」（P11）；外部参与者泳道在最左，用竖线隔出系统边界；选中突出（R15、R16）：只有选中的步骤用选中样式，配对的调用 / 返回加浅色「配对」标记；选中模块等对象时突出相关泳道的生命线，进度所在的消息只在序号旁加小标记；不做悬停弹出（W-1）。经过共用件的内部活动在标签后标「共用 <名>」/「共用 ×N」，悬停列出共用件（P18）。
    codeRefs: [src/components/sequence/SequenceLanes.vue]
  - id: present.sequence.fragments
    name: 组合框
    summary: 画出 alt、loop、par、ref 组合框，可改选分支
    parent: present.sequence
    responsibility: 画 alt / loop / par / ref 组合框：左上角标类型，loop 标循环条件，par 标「并行（串行回放）」，ref 显示被引用场景名；alt 显示全部分支与条件，已选分支正常显示（条件加下划线）、未选分支淡化，未到达的分支点各分支都淡化；每个分支条件可单击，改走这一支（F6e）；框内消息在本层全部合并为内部活动时，框缩成一行。
    codeRefs: [src/components/sequence/SequenceFragments.vue]
  - id: present.sequence.interact
    name: 时序图交互
    summary: 把时序图上的单击与悬停转成回放操作，并按进度滚动
    parent: present.sequence
    responsibility: 单击消息 = 指向这一步（R13）：选中它，进度前进或后退到它；在未选分支上的消息同样可单击，先改选该分支再跳转；单击 alt 的分支条件 = chooseBranch（F6e）；只在用户移动进度后把进度所在的步骤滚到纵向中间，时序图标签顶部的「定位」调用这里暴露的方法，悬停、选中、切换层次都不滚动（D-7）；悬停消息时在交互图上预览对应的边；把选中突出（emphasis，R15）交给泳道头与消息区。
    codeRefs: [src/components/sequence/SequenceView.vue]
  - id: present.sequence.heads
    name: 泳道头
    summary: 在时序图顶部与底部固定显示泳道头与分组框
    parent: present.sequence
    responsibility: 泳道头固定在时序图顶部、底部另有一份，消息区夹在中间纵向滚动，三块按时序图自身宽度从左起排、不拉伸（D-2）；顶部另画同一父模块的分组框（P13）与系统边界线（A7）；选中模块、文件、关系、视图边、参与者时突出相关泳道（R15、R16）；与消息区同在一个滚动容器，横向滚动时一起移动。
    codeRefs: [src/components/sequence/SequenceHeads.vue]

  - id: present.panel.scenario
    name: 场景面板
    summary: 展示场景的说明、触发者、所在层次与参与模块
    parent: present.panel
    responsibility: 选中场景时（进度在开头且没有选中其他对象，V2、R12）显示：场景名称、说明、触发者（第一条消息的发送方）与触发原因、场景所在层次（可跳转）、参与模块；ref 引用了哪些场景、被哪些场景引用。步骤目录在导航树的步骤树里。三卡（PC-10）：理解卡为说明、触发、参与者；核对卡为证据一行，清单为证据与引用；相关资料卡为时序图。
    codeRefs: [src/components/panel/ScenarioPanel.vue]
  - id: present.panel.step
    name: 步骤面板
    summary: 回答选中的这一步做什么、输入输出与本层投影
    parent: present.panel
    responsibility: 先回答「这一步做什么」（D-5）：作用（标签与说明）；输入（携带的数据）与输出（配对返回的数据，本步是返回时为回应的调用，异步为「不等待返回」，没写显式返回时指向接口签名，F7）；数据结构；经由接口。其后是真实端点与本层投影（经由上层关系时注明对应关系建在上层，可「定位到这条关系」，P15）、本层一条可见消息覆盖的多帧；交互关系（对应关系与「推断」标记）默认折叠，可「在画布上显示」这条消息两端的交互关系（V9）；最后是出处。「代码证据」一节在证据等级之上补一行包含链（步骤 → 交互 → 依赖，缺哪一级标哪一级，D-25、S18a）：由步骤绑定的关系、关系的证实与依据的模块依赖组合而成（chain.ts）。三卡（PC-10）：理解卡为作用、输入输出、数据结构、经由接口与交互关系；核对卡为代码证据一行，清单为代码证据、端点与本层投影、覆盖的帧。
    codeRefs: [src/components/panel/StepPanel.vue, src/components/panel/chain.ts]
  - id: present.panel.run
    name: 运行信息
    summary: 回答选中对象在这次流程中做了什么
    parent: present.panel
    responsibility: 运行视角下选中模块、关系、聚合边、参与者时面板顶部的一节，回答「在这次流程中做了什么」（V6）：本场景中参与的步骤（按顺序，可单击选中，标出离进度最近的一步）、在本层投影下收发的消息、本场景中用到的接口与数据；模块与参与者可「在画布上显示」它在本层节点的交互关系（V9）；面板原有的模块信息折叠在其下方。第十七轮起它是各对象理解卡的首节，由面板分派经 RUN_FIRST 注入（V6），对象面板不直接引用它。
    codeRefs: [src/components/panel/RunSection.vue]
  - id: present.panel.actor
    name: 参与者面板
    summary: 展示外部参与者及由它触发的场景
    parent: present.panel
    responsibility: 外部参与者的名称、类别（用户 / 外部系统 / 时间）、说明；与系统的入口关系；由它触发的场景（可打开）。三卡（PC-10）：理解卡为说明与入口关系；相关资料卡列由它触发的场景。
    codeRefs: [src/components/panel/ActorPanel.vue]

  - id: present.player.route
    name: 路线总览
    summary: 常驻显示路线上的分支选择，并可逐个改选
    parent: present.player
    responsibility: 常驻显示路线（F6f）：路径上依次经过的分支点与所选条件、截止处待选的分支点；每项下拉列出全部条件，改选即 chooseBranch（F6e）；改选丢弃了其后的选择时提示丢弃的个数数秒。
    codeRefs: [src/components/RouteBar.vue]

  - id: present.nav-tree.modules
    name: 模块树
    summary: 以树显示完整模块层级，同步层次与选中
    parent: present.nav-tree
    responsibility: 系统为根的完整模块层级（T2：层按 order；结构 / 交互视角下「只看现状」开启时不列目标态模块，运行视角下不受开关影响）。状态 → 树：当前层次的祖先链展开并标出当前层次，选中的模块高亮、展开到它并滚到可见；运行视角下标出参与本场景的模块与进度所在步骤的两端（T3、T5）。树 → 意图：单击 = revealModule（N4），单击系统 = 回根层，双击有子模块的 = drillInto，悬停本层可见的模块 = setHover（T4）。
    codeRefs: [src/components/tree/ModuleTree.vue, src/components/tree/ModuleTreeNode.vue]
  - id: present.nav-tree.steps
    name: 步骤树
    summary: 以树显示步骤大纲，标出进度与本层可见性
    parent: present.nav-tree
    responsibility: 步骤大纲的逐行呈现（T6）：loop、par 分支、ref 为可折叠的分组，alt 列出全部分支与条件，空分支占位。状态 → 树：帧标出已走过 / 进度所在 / 未走到 / 未选分支 / 未到达；选中步骤时它的帧为选中样式，本层合并为同一条可见消息的其他帧为「同一步」并注明「本层合并为 1 步」，选中的不是步骤时进度所在的帧只加小标记；本层可见的帧显示本层可见消息序号（与时序图、控制条一致），不可见的标「本层不可见」，进度所在的帧滚到可见（T7）。树 → 意图：单击帧 = seek，即选中它（R13），单击分支标题 = chooseBranch（F6b、F6e），「开头」= seek(null)，悬停帧在交互图上预览落点（T8）。
    codeRefs: [src/components/tree/StepTree.vue, src/components/tree/StepTreeNode.vue]

  # ── 视图状态层 ──────────────────────────────────────────
  - id: state.transition.selection
    name: 视角与选中规则
    summary: 推出视角、唯一的选中与选中突出
    parent: state.transition
    responsibility: 视角（结构 / 交互 / 运行：打开场景即运行视角，否则按视图状态的模式 mode，缺省交互，V1、V11）与选中由视图状态推出（V1、V2、selectedOf）：选中是唯一且排他的主语——显式选中的对象，否则运行视角下为进度所在的步骤，进度在开头时为场景（ADR-0012）；运行视角下「指向」对象即选中它，下钻选中被下钻的模块（V3）；取消选中即回到进度所在的步骤（V4）。选中突出（emphasisOf，R15、R16）同样由状态推出：选中步骤时为它所在的可见消息与配对帧所在的消息；选中模块 / 文件 / 关系 / 视图边 / 参与者时为相关泳道（问模型层 lanesOf；选中端口时按它的定义模块，L13），不突出消息；选中场景不突出。影响面查询 impactQuery 是视图状态里的一次性值（queryImpact 只在结构视角、选中模块时生效），每个动作之后选中或视角变了即去掉（K15b、ADR-0037）。
    principle: |
      - 步骤与场景不存进 selection：运行视角下 selection 为空即「选中进度所在的步骤 / 场景」，不变式「选中的步骤就是进度所在的一步」（V7）由表示本身保证，不需要同步两个指针。
      - 「某个模块在本层是哪条泳道」是关于被描述系统的知识，归模型层时序模型；「选中什么就突出什么」是会话规则，归这里。
    codeRefs: [src/state/transition/selected.ts]
  - id: state.transition.navigation
    name: 导航规则
    summary: 决定下钻、跳转、返回与选中时层次和选中怎么变
    parent: state.transition
    responsibility: 层次与选中的会话规则：下钻、跳转、返回上级、选中（含端口——端口就是接口，选中后层次不变，L13、V2）、定位关系 / 模块时选中与层次怎么变、Esc 只取消选中、进不进浏览器历史（规则 N1–N13；跳转与定位只在层次改变时进历史，N10）；「重新加载后退到哪」「被『只看现状』隐藏时退到哪」等定位问题调用模型层的 nearestExisting / nearestVisibleLevel。
    codeRefs: [src/state/transition/navigation.ts]
  - id: state.transition.playback
    name: 回放规则
    summary: 决定打开场景、单步、指向与选分支时进度怎么变
    parent: state.transition
    responsibility: 回放的会话规则：回放只由用户驱动（R1）——打开场景停在开头并选中场景（R12，从带步骤的链接进入选中该步）、退出场景、前进 / 后退（在第一步后退回到开头）、指向某一步或回到开头、选分支（任何分支点，不在路径上时先补齐到达它的选择；进度不在新路径上时停在分支点之前，F6e；选中不变）（规则 R1、R5、R6、R10、R12、R13、F6、F6e、V7）。「下一步是哪一帧」「到达某帧需要哪些分支选择」「改选后保留哪些选择」都调用模型层的场景查询。
    principle: |
      - 进度（播放头）以**帧 ID** 记录，与层次无关；层次变化后仍是同一帧（R6）；为空表示在开头。
      - 指向某一步（R13）：选中它，进度移到该步（向前或向后）；所需的分支选择由模型层 choicesFor 给出；画面等同从头单步到这一步。
      - 单步、指向、拖动进度 = 选中那一步并移动进度（清空显式选中，V7）；选中其他对象时进度不动；停在未选分支的分支点时「下一步」无效，先选分支。
    codeRefs: [src/state/transition/playback.ts]
  - id: state.transition.url
    name: URL 编解码
    summary: 在视图状态与地址查询参数之间互相转换
    parent: state.transition
    responsibility: '视图状态与查询参数互相转换：`level` `sel`（m: / r: / e: / a: / f: / d: / c: / p: 前缀，p: 为端口，L13；结构视角选中依赖边为 d:）`v`（`v=s` 为结构视角，交互为缺省不写，运行视角下照写以便退出场景后回到它，V11）`sc` `step` `alt`（已选分支，按分支点有序编码）；「组装」等叠加开关不进 URL（O12）；选中步骤时只有 `step`，选中场景时两者都没有，选中其他对象时 `sel` 与表示进度的 `step` 并存（ADR-0012）；解码时丢弃无效值并给出最接近的合法状态；标注一次转移是否进浏览器历史（N10、R10）。'
    codeRefs: [src/state/transition/url.ts]
  - id: state.transition.mode
    name: 视角模式与选中映射
    summary: 切换结构与交互视角，并把选中映射到对面视图
    parent: state.transition
    adrs: [31]
    responsibility: 结构 / 交互视角的切换规则（V11、V12，ADR-0031）：setMode 改视图状态的 mode（打开场景时先退出场景，退出场景回到进入前的模式）；切换时把选中映射到对面视图的边——关系、交互边切到结构视角时，这对节点之间有结构边就换成依赖边（sel=d:<依赖方>-><被依赖方>），没有结构边或没有代码事实时清空并交给面板说明（droppedSelection）；端口换成定义模块；依赖边切到交互视角时，同一对节点有交互边就换成它（取关系类型声明顺序中的第一条），没有时保留代码依赖选中（K10）；节点、层次与模块选中不动。「这对节点之间有没有结构边 / 交互边」是关于被描述系统的知识，调用模型层（hasStructureEdge 经 desk.facts 给出，interactionEdgeBetween、nodeOf 直接调用）。
    codeRefs: [src/state/transition/mode.ts]

  - id: state.layout.sequence
    name: 时序图排布
    summary: 给时序模型算出泳道、消息与组合框的坐标
    parent: state.layout
    responsibility: 给时序模型算坐标：外部参与者泳道在最左，其余泳道按层次顺序（排序键）排列，同一父模块内的本层子模块改按画布中节点的横坐标（P9）；父模块相同的连续泳道成一组，分组框画在泳道头上方（P13）；泳道宽度按名称自适应；消息纵向累加；组合框包住其子消息并按嵌套深度内缩。结果由协调者按输入（层次、场景、已选分支、画布坐标）派生。
    principle: 规则简单、同步计算，不调用 elk（技术选型 §3.3）。
    codeRefs: [src/layout/sequence.ts]
  - id: state.layout.stage
    name: 舞台叠加
    summary: 算出回放在画布上的叠加数据与节点显隐
    parent: state.layout
    responsibility: 把本层帧投影与进度换成画布要画的数据与坐标：本层参与的节点、走过的边与步骤序号的位置、当前消息、本层没有视图边时的临时线（temps：经由上层关系带对应关系 P15、未建模 P11）的走线、停在分支点时各选项首条消息的预览位置、当前帧本层不可见（V5、P7、P10、P11、P15、R11）。舞台显示 stageDisplay：按参与节点、回放边、交互关系显示方式、「在画布上显示」的对象与悬停的节点，给出每个节点与视图边显示、淡化还是隐藏（V5、V8、V9、V10）。共用件架上的共用件在运行视角照常显示但淡化（P18）。
    principle: 纯函数，与时序图排布对称——呈现层只按它着色，不自己映射端点或算坐标。
    codeRefs: [src/layout/stage.ts]
  - id: state.layout.canvas
    name: 画布场景
    summary: 把带坐标的层次视图换成画布要画的节点与边
    parent: state.layout
    responsibility: 把带坐标的层次视图换成画布要画的节点与边（canvasScene，ADR-0013）：位置、类型、数据与类名、层级，以及运行视角下适应画布用的可见节点；框：根层只画系统框，下钻后外框为系统、内框为当前父模块，边界节点在两框之间（两框重合时外框外扩，A7、L4）；要写标签（×N 或 L26 标签）而走线没有标签位置时取走线中点（routeMidpoint）。边的层级：与聚焦对象相邻、选中、回放经过的边浮在节点之上（EDGE_Z）。框外边：先对当前画出来的这组调用 outsideRoutes 分配轨道，边与运行视角的步骤序号、分支预览都用分配后的走线。跳线：对画出来的折线关系边调用 routing 的 jumpsOf，交叉处的水平段标跳点（L11）。结构 / 交互视角：聚焦对象（悬停优先、其次选中）不相邻的节点与边变淡，分层总览中带不参与变淡；核心跨层边只在聚焦核心模块、被选中或回放落在其上时出现（O4、P7）；边界边只在聚焦其一端、被选中或回放经过时出现（L4）。运行视角：按舞台显示（stageDisplay）决定显隐与淡化（V5、V8、V9、V10）；回放叠加——当前消息的边带方向流动、端点节点为活动态、走过的边标步骤序号、临时线（经由上层关系取关系的类型色画虚线、标「经由上层」、随关系选中，P15；未建模画红色虚线，P11）、分支预览（P7、P10、P11、F6）；选中步骤时其余走过的边与步骤序号变灰（R15、R16）。边的视觉通道（L10、ADR-0029）：颜色取关系类型（查询再乘半透明，只「淡」不「细」）、标签位按 L26 组装（composePill，ADR-0041：异常段——×N、把手与违规、向上、未证实、未解释、缺段、未建模——警示色在前，修饰段——机制 L35（按关系现算，含散开段与经上层的临时线）、混合（只表同步 / 异步，L23）、经上层——中性在后，标签至多两个、其余「+k」并在悬停逐条列出，聚合边带条数；分层总览照写机制与向上、未证实只写在聚合边上；交互视角开启代码事实时才写未证实 / 未解释 / 违规，K9；「向上」取 desk.facts.upward（K22），结构视角不写机制与向上）、箭头取同步 / 异步（通知一律异步）、线宽档取条数，视图边（含聚合边、经由上层的临时线）里有一条经端口的关系即带插座（L12），标签只有 ×N 与异常；选中不改线宽。端口与边界（ADR-0029、ADR-0030）：节点带它定义的端口记号（L13：画在进边一侧的后半，超过 3 个合成「端口 ×N」，实现者数为描述与代码事实的并集，运行视角不画）与边界角色（L14）；交互视角开启「组装」时画组装叠加线（O12：组装事实投影到本层的虚线，同一对节点合并标 ×N，不参与布局，单击落到这对节点的代码依赖）与节点上的「组装根」角标。选中文件时投影节点加文件高亮（G14）；设计版本标出新增 / 修改与涉及变更数。结构视角（ADR-0031）的结构边与节点角标见子模块「结构视角的画布场景」，节点位置与交互视角相同（V12）。模型画布上没有编辑态（草图编辑在草图画布，ADR-0025）。分级（ADR-0027）：共用件的边（shelfEdges）默认不画、悬停或选中一端时画成曲线（O10）；本层框计数（levelCounts，O11）；运行视角下当前步骤经过的共用件高亮、不画共用件的临时线（P18）。
    abstraction: 只把带坐标的视图换成画布场景、不改布局；结构视角的场景单独成件，与交互视角共用节点位置。
    principle: 纯函数，与 stageOverlay、stageDisplay 对称：呈现层只按结果写入 Vue Flow，不自己判断显隐、变淡与回放态；节点与边的数据类型（NodeData、RouteEdgeData）因此归 Layout。
    codeRefs: [src/layout/canvas.ts, src/layout/canvas/**]
  - id: state.layout.canvas.structure
    name: 结构视角的画布场景
    summary: 给结构视角算出画布的依赖边与节点角标
    parent: state.layout.canvas
    adrs: [31]
    responsibility: 结构视角（ADR-0031）下画布要画的结构边与节点角标：结构边与交互边并集布局，节点位置与走线都取同一份布局（V12）：内部边取 elk 的正交走线，框外边与交互视角一样按画出来的这一组走线、分配轨道，共用件的边为曲线，分层总览取带间排布与核心跨层边的曲线（L15）；边的种类、档、条数、违规与「逆稳定」标记交给边组件按 UML 惯例编码（L16）；只引类型的依赖边缺省收起（偏好 typeOnly，画布角计数，基线外违规照画）；边界节点的边只在聚焦其一端时画（同 L4）；共用件与使用者之间的边缺省不画、聚焦任一端时画，反向依赖、违规、在环中的照画，「共用 ×N」按依赖计（O13）；分层总览带间画层间依赖、带内不画，核心模块与架上共用件的跨层依赖只在聚焦它时画（O13③，chipDeps）；选中给一跳底、悬停叠加一跳（L27）；面板查询影响面时按方向投影到本层，节点标方向与距离、闭包外变淡，悬停照常叠加（K15b，levelImpact）；节点标「入 Ca · 出 Ce」与不稳定度三档（L17），本层环编号常显（Y4）；没有代码事实时只画允许边并在画布角说明（U16）；悬停说明写种类、档、文件条数与允许或违规的规则。
    principle: 纯函数，与交互视角的画布场景同一入口（canvasScene）：呈现层只按结果画，不自己判断显隐、折叠与影响面。
    codeRefs: [src/layout/canvas/structure.ts]
  - id: state.layout.sketch
    name: 草图布局
    summary: 算出草图画布要画的节点、边与边界排布
    adrs: [25]
    parent: state.layout
    responsibility: 草图画布要画的节点与边（sketchScene，ADR-0025、X15、X19、X22）：本层模块（根草图里层与第二级）与由关系派生的引用节点。非根草图画成按规则排布的边界（X22）：系统框的尺寸随草图画布的可用区域（视口去掉面板、信息条后的宽高）自适应，可用区域变化时重算引用列与中心区、本层模块坐标不随之改写；连引用列加最小中心区都放不下时按视口宽高比放大再排；外部引用按所属层在骨架里的 order 成列（referenceColumns：靠前的层在左、同层的一列标「同层」紧贴中心区右侧、靠后的在右、不在任何层的在最右「外部」），每列单列不换列、放不下整列按比例缩小、列内按相连模块的平均高度排，引用位置只由规则算；中心区（挂载点框）可用宽度 = 画布宽 − 两侧引用列宽，本层模块的位置取 layout（相对中心区的内容原点 origin），没有 layout 时按中心区可用区域 gridArea 网格布局一次（只用于显示、不写回，标「需初始布局」），只缺几个位置的放到网格里不与已有节点重叠的空位（sketchPositions，写位置时补齐用同一函数）；框线（系统框、中心区、引用列）作为不接收指针的节点给出；隐藏外部引用时不出引用列与引用线、中心区占满画布宽；outsideCenter 判定拖出中心区（升级的落点）。本层之间的边是两端中心之间的直线，同一对节点的多条线垂直平移错开，标签位置取 layout.relations；引用线标出引用在哪一侧与哪一端（模块走那一侧的端口）；straightEdge 把直线裁到两端节点的边框。根草图为层带（X21）。带选中、待重连与变更角标。角色（SK-22）：核心画成大块；共用件（shared / bus）收进本层框底部一行的「共用件」架（非根草图在中心区底部、根草图在所属层带底部），位置由规则算；超七只数非共用件（X13）。四类交互与端口（X23、X24）：边上有一条经端口的关系时终点画插座（L12）；模块定义的接口（本张写的，接口写在定义模块所在的草图，X10）给出端口记号与实现者条数，供拖线声明实现者。
    principle: 不走 elk、不走分层投影：草图的布局由人拥有，自动布局只在初始与「重新排列」时各一次（X15）；纯函数，经 Layout 的入口 layout.ts 访问。
    codeRefs: [src/layout/sketch.ts]

  # ── 模型层 ──────────────────────────────────────────────
  - id: model.scenario-semantics
    name: 场景语义（步骤与回放计划）
    summary: 把场景文本变成绑定到关系、可回放的帧树
    abstraction: 把场景文本变成可信、可回放的语义模型：遍历步骤树、把消息绑定到关系、展开成回放计划（帧树）。加载流水线的 Validator / Indexer 只依赖这一半，不依赖场景投影；四层划分里属于 L2 描述层（ADR-0051）。把步骤树展开成回放计划（帧树）：ref 内联子场景并记为 ref 组合框（F3）；loop 展开一遍并标注循环条件（F4）；par 各分支按书写顺序串行并标注并行（F5）；alt 处分叉为分支点，每个选项一棵子树（F6）。每帧带 ID、所在组合框路径，以及对应的交互关系（显式引用或按 S13 推断，标明是否推断）；步骤没写的接口与数据取自对应关系（返回只取接口），并标明继承（S14）。调用与显式返回配对（pairReturns，F7）：按书写顺序以栈匹配（call 与 async 入栈，写了显式返回的 async 同样配对），alt 各分支从进入分支点时的栈开始。
    principle: |
      帧 ID = 场景 ID + 步骤 id；步骤没写 id 时用它在树中的路径（如 `sc.open#4.alt0.1`）（F2）。ref 内联时 ID 加上引用处前缀，同一子场景被引用两次也不冲突。
      绑定关系 bindRelation（S12、S13，ADR-0029）：显式引用优先；否则两端之间恰好一条与消息同向的交互关系（queries / commands / notifies / streams，迁移期的未分类同查询 / 委托；关系箭头是控制流方向，只有 return 反向比对，ADR-0022）即认定并标为推断，恰好连在两端上的优先于连在祖先上的；候选多条时消息形态与关系类型一致（查询与委托按 mode，通知一律 async，流不比）的恰好一条也认定（S19）；Validator 用同一个函数，校验与界面结果一致。
      查询有副作用 querySideEffects（U13，T0 裁决 14）：沿 alt 各选项展开全部线性帧序列（loop 一遍、par 串行、ref 内联，路径数有上限），从绑定到查询的一帧 A → B 起，闭包为其后发送方落在接收集合（从 B 的子树开始，闭包内每帧的接收方加入）的连续帧，到配对的 return 为止、没有显式返回时到第一条发送方不在集合中的帧为止；闭包里绑定到委托或通知的帧即副作用，一对（查询，副作用）一条。按场景判定，不按结构闭包。
    codeRefs: [src/model/scenario/semantics/index.ts, src/model/scenario/semantics/steps.ts, src/model/scenario/semantics/bind.ts, src/model/scenario/semantics/plan.ts]
  - id: model.scenario.path
    name: 回放路径
    summary: 按已选分支走出回放路径，并回答分支选择问题
    parent: model.scenario
    responsibility: 按已选分支从回放计划走出线性帧序列，遇到未选分支的分支点即截止并报告；回答分支选择的组合问题：在某个分支点改选后保留哪些选择（F6b）、到达某一帧需要哪些选择（R13）、直选任意分支点需要哪些选择与分支点之前的帧（choicesForBranch / pointPrefix，F6e）；给出路线（路径上的分支点与所选、待选的分支点，routeOf，F6f）。
    codeRefs: [src/model/scenario/path.ts]
  - id: model.scenario.level
    name: 帧的层次投影
    summary: 把路径上的帧投影到当前层次并合并成可见消息
    parent: model.scenario
    responsibility: 把路径上每一帧的 from / to 用 mapEndpoint 映射到当前层次：两个不同节点之间 → 对应的视图边 ID（P1、P2，含边界边、参与者边、核心跨层边 P7；按帧绑定关系的类型选边，P17）；两端在同一子模块 → 内部活动（P3）；分层总览中先看核心模块：同一核心模块才是它的内部活动，同一层的不同泳道之间带上两条泳道（lanes），时序图画成泳道间的消息、交互图按层的内部活动（P7、P14）；两端都在本层外 → 不可见（P4）。把连续的帧合并为本层的可见消息（同一对节点之间同方向的边——不论类型——或同一节点上的内部活动合并，P5），作为单步单位。算出场景所在层次（所有帧端点的最近公共祖先，S9）。共用件不开泳道（P18）：一端是本层共用件架上的共用件的帧按另一端的内部活动处理并记下共用件（合并时取并集），两端都是共用件的不可见；折叠进「+N」的模块落在占位上（viewNodeOf，O8）。
    principle: |
      视图边 ID 与 projectLevel 的边 ID 规则相同（edgeId），画布直接给已有的边加回放态；消息方向与边方向相反时标记 reverse（P10）；本层两节点之间没有视图边时按帧自身的关系绑定（显式或推断，与 S5a 同一口径）区分：已绑定为「经由上层关系」（upper，带 relationId，P15），未绑定为「未建模」（P11）；两者按两端节点照常合并，合并的帧中有未绑定的整条为未建模（P16）。关系类型筛选不作用于回放（P8 已删除）。
      「本层的下一步 / 上一步」（R7）与「指向某帧时进度落在哪条可见消息」（R13：落在其所在可见消息，合并时取这一段的第一帧）在这里回答。
    codeRefs: [src/model/scenario/level.ts]
  - id: model.scenario.participation
    name: 参与查询
    summary: 回答某个对象在本场景中参与了哪些步骤
    parent: model.scenario
    responsibility: 回答「某个模块 / 关系 / 视图边 / 参与者在本场景中做了什么」：按路径顺序列出它参与的帧（模块含其子树、视图边含其聚合的关系、关系含推断绑定），在本层投影下收发的消息，用到的接口与数据结构。另回答「哪些模块参与了这个场景」（scenarioModules：全部帧的模块端点及其祖先，T5）。
    codeRefs: [src/model/scenario/participation.ts]
  - id: model.scenario.outline
    name: 步骤大纲
    summary: 把回放计划还原成按组合结构分组的步骤树
    parent: model.scenario
    responsibility: 把回放计划按组合结构还原成一棵树（T6）：连续带同一个 loop / ref 实例、同一个 par 分支的帧归入同一分组，分支点成为 alt 节点并下挂全部选项（条件、序号、状态，空选项无子节点）；状态与时序图全貌一致（路径上 path、未选 unchosen、截止之后 unreached）。与层次、进度无关。
    principle: 「已走过 / 进度所在 / 本层序号」依赖进度与层次，不在大纲里，由导航树用本层帧投影现算。
    codeRefs: [src/model/scenario/outline.ts]
  - id: model.scenario.sequence
    name: 时序模型
    summary: 产出本层可见消息的时序模型，并回答泳道查询
    parent: model.scenario
    responsibility: 由本层的可见消息产出时序模型：参与者（父模块、模块路径、所属层、层次排序键 hierarchyKey，本层非层子模块标为可按横坐标排，P9、P13）、消息（同步 / 异步 / 显式返回 / 内部活动；本层没有视图边时标经由上层关系或未建模，P11、P15）、组合框（类型、条件、包住的消息区间；alt 含全部分支、选项序号及哪一支已选）；框内消息全部合并为内部活动时标记为折叠（P6）。另回答「某个模块或参与者在这张时序图里是哪些泳道」（lanesOf，R15、R16）：参与者为自己的泳道；模块是当前层次本身或其祖先时没有；否则为它包含的泳道，没有时为包含它的最深泳道。
    codeRefs: [src/model/scenario/sequence.ts]

