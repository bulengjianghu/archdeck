# media-web 第二级模块之下的子模块、全项目关系、接口与数据结构。
# 代码路径相对 media-platform 仓库根。第二级模块见 layers.yaml（不在此重复定义）。

modules:
  # ── 基础原语：media-core ─────────────────────────────────
  - id: primitives.core.errors
    name: 错误与事件
    parent: primitives.core
    responsibility: 平台统一错误 MediaFault（携带 contracts 的 ErrorCode）与 describeError；同步事件中心 EventHub（监听者异常不影响其他监听者与发布者，以页面未捕获错误的方式上抛）。不依赖 Runtime，领域包可直接使用。
    provides: [if.core.MediaFault, if.core.EventHub]
    codeRefs: [media-web/packages/media-core/src/index.ts]
  - id: primitives.core.operation
    name: Operation 与执行身份
    parent: primitives.core
    responsibility: 一次受理、一个终态的异步操作 Operation：取消、截止时间（含等待开始前的时间）、AbortSignal 级联、迟到结果回收（disposeLate）；执行身份 ExecutionIdentity 的校验与比较。被几乎所有 Provider 与资源模块用来约束原生异步调用。
    principle: |
      - **单一终态**：pending → succeeded / failed / cancelled 只转一次；终态之后 run 才返回的值交给 `disposeLate` 释放，不改变终态。
      - **截止时间**：从受理时刻起算（`performance.now()`），超时以 `timeout` 失败并 abort 内部 signal；传输丢失不等于取消。
      - **上下文快照**：带 `context` 时 `snapshot` 输出 contracts 的 `OperationContext`（身份、受理 / 截止时刻、终态错误）。
      - 包根 `index.ts` 里还留有一个无截止时间的旧版 `Operation`，各 Provider 实际都从 `@lsst/media-core/operation` 子路径引用新版。
    provides: [if.core.Operation, if.core.assertExecutionIdentity]
    dataStructures: [ds.OperationOptions]
    codeRefs: [media-web/packages/media-core/src/operation.ts, media-web/packages/media-core/src/index.ts]
  - id: primitives.core.track
    name: Track 端口
    parent: primitives.core
    responsibility: 与运行时无关的媒体轨道 MediaTrack 与 EventSource 端口：描述（contracts 的 TrackDescriptor）+ 可选原生对象 + stop；原生对象的具体类型留在 Provider 边界。
    dataStructures: [ds.MediaTrack]
    codeRefs: [media-web/packages/media-core/src/index.ts]
  - id: primitives.core.codec-config
    name: 编解码配置标识
    parent: primitives.core
    responsibility: 把编解码配置字典（含 description 字节与嵌套参数）规范化为稳定字符串键，用于判断两次配置是否等价；对嵌套深度与大小设硬上限。
    provides: [if.core.codecConfigurationKey]
    codeRefs: [media-web/packages/media-core/src/configuration.ts]

  # ── 基础原语：media-resources ────────────────────────────
  - id: primitives.resources.handles
    name: 资源句柄与所有权
    parent: primitives.resources
    responsibility: owned / borrowed 资源句柄、同步所有权作用域 ResourceScope（逆序清理）与共享租约 shareResource（ResourceOwner）。不复制底层原生对象。
    principle: |
      - **owned**：唯一所有者，`close()` 才调用 closer 释放原生对象（默认依次尝试 `close` / `stop`）；只有 owned 句柄 `transferable`。
      - **borrowed**：只借用，`close()` 只标记关闭，不释放原生对象。
      - **共享租约**：`shareResource` 接管一个句柄，`acquire()` 发出 borrowed 租约；所有者关闭后不再发新租约，最后一个租约关闭时才真正释放（采集轨道、Canvas 输出轨道、AudioContext 都靠它在多个消费者间共享）。
      - **ResourceScope**：`adopt` 收养、`close` 逆序关闭并汇总错误；已关闭的作用域收养即刻关闭对象并抛错。
    provides: [if.resources.ownedResource, if.resources.shareResource, if.resources.ResourceScope]
    dataStructures: [ds.ResourceHandle, ds.ResourceOwner]
    codeRefs: [media-web/packages/media-resources/src/handles.ts, media-web/packages/media-resources/src/lifecycle.ts]
  - id: primitives.resources.budget
    name: 资源预算与有界队列
    parent: primitives.resources
    responsibility: 按对象数 / 字节 / 媒体时长 / 在途数四个维度的层级预算 ResourceBudget（fork 出子上限，预留同时检查所有祖先）与基于预算的有界 FIFO ResourceQueue。只记账，不分配内存。
    principle: |
      - **同步准入**：`reserve` 先检查本级及所有祖先的余量，全部通过才同时扣减，失败返回 `undefined` 并计入 rejected；返回的 Closable 释放预留。
      - **fork 是上限不是预付**：子预算不占父预算，实际预留时才逐级扣减；嵌套深度 ≤ 32。
      - **队列所有权**：`offer` 失败所有权留给调用方；`take` 释放记账并把所有权交给调用方；`close` 关闭所有剩余项。
    provides: [if.resources.ResourceBudget, if.resources.ResourceQueue]
    dataStructures: [ds.ResourceCost]
    codeRefs: [media-web/packages/media-resources/src/budget.ts]
  - id: primitives.resources.frame-store
    name: CPU 帧存储
    parent: primitives.resources
    responsibility: 本 realm 内的 CPU 字节帧存储 FrameStore：按帧数 / 字节上限（可选挂父预算）存放帧拷贝，返回字符串句柄；读出的是拷贝。句柄不可跨 Worker 传递，也不是授权凭据。
    principle: |
      - 插入时用 contracts 的 `validateContract('LocalFrameDescriptor')` 校验元数据，再整份拷贝字节，生成 `web-frame-N` 句柄。
      - `read` 返回描述与字节的拷贝，`release` 释放单帧及其预算预留，`close` 全部释放。
    provides: [if.resources.FrameStore]
    dataStructures: [ds.LocalFrameDescriptor]
    codeRefs: [media-web/packages/media-resources/src/index.ts]
  - id: primitives.resources.byte-io
    name: 字节读写端口
    parent: primitives.resources
    responsibility: 有限、不可变的随机读字节源 RandomAccessMediaSource 与有界字节写目标 MediaByteTarget 两个端口，由宿主实现、容器 Provider 消费；约定取消必须传到传输层、finalize 之后才发布产物。
    provides: [if.resources.RandomAccessMediaSource, if.resources.MediaByteTarget]
    codeRefs: [media-web/packages/media-resources/src/index.ts]
  - id: primitives.resources.execution
    name: 执行作用域
    parent: primitives.resources
    responsibility: 绑定一个 ExecutionIdentity 与专属预算节点的 ResourceExecutionScope：预先准入整份分配、创建原生资源并以 owned 句柄交付，关闭时取消在途操作并逆序清理；assembleResources 把一次装配做成事务（失败或取消即整体回收）。
    principle: |
      - `acquire` 在创建前就按完整成本预留（含 inFlight），预留一直持有到输出句柄关闭，包括忽略取消的迟到原生工作。
      - 作用域关闭：abort signal → 关闭预算准入 → 取消所有在途 Operation → 逆序关闭资源；仍在运行的原生工作保持可见并继续计费直到落定。
    provides: [if.resources.ResourceExecutionScope, if.resources.assembleResources]
    codeRefs: [media-web/packages/media-resources/src/execution.ts]
  - id: primitives.resources.handoff
    name: 跨 realm 交接与信用
    parent: primitives.resources
    responsibility: 跨 Worker 的资源所有权边界：transferResource 消费唯一 owned 句柄做原生转移；MediaResourceInbox 在接收端按执行身份与预算接收转入的帧（含迟到回复）；ResourceCreditOwner / Receiver 以授权 → 回执的信用通道在受信、有序的 Worker 端口上对远端资源记账。
    principle: |
      - **transfer**：只接受 open 的 owned 且 transferable 的句柄；无论 `postMessage` 是否抛错都关闭发送端句柄。
      - **Inbox**：身份不匹配或超预算的句柄当场关闭（stale / overflow 计数），即「收到即负责」。
      - **信用**：授权方 `grant` 从预算预留并发出单调递增序号的 ResourceGrant；接收方 `accept` 生成局部预算，资源真正释放后 `complete()` 产出回执，授权方 `acknowledge` 才释放预留。端口断开或超时只停止准入，不视为远端已清理；Worker 确认终止后才 `confirmTerminated` 一次性释放。
    provides: [if.resources.transferResource, if.resources.MediaResourceInbox, if.resources.ResourceCreditOwner]
    dataStructures: [ds.ResourceGrant, ds.ResourceGrantReceipt]
    codeRefs: [media-web/packages/media-resources/src/handoff.ts, media-web/packages/media-resources/src/credits.ts]
  - id: primitives.resources.clock
    name: 媒体时钟映射
    parent: primitives.resources
    responsibility: 按绝对锚点把一个时钟域（kind / domainId / generation）上的时间映射到另一个时钟域，并携带误差上界（含浮点舍入）；不同域或越出有效区间时返回 undefined 而不是猜测。
    provides: [if.resources.mapMediaTime]
    dataStructures: [ds.MappedMediaTime, ds.MediaClockMapping]
    codeRefs: [media-web/packages/media-resources/src/clock.ts]
  - id: primitives.resources.audio
    name: AudioContext 作用域
    parent: primitives.resources
    responsibility: 宿主显式持有的 AudioContext 作用域（无进程级单例）：租约上限、用户手势激活、AudioWorklet 模块按 URL 去重加载；关闭只阻止新租约，已有输出持有上下文直到最后释放。
    provides: [if.resources.AudioContextScope]
    codeRefs: [media-web/packages/media-resources/src/audio.ts]

  # ── 端口与契约：provider-spi ─────────────────────────────
  - id: ports.provider-spi.roles
    name: 内置角色枚举
    parent: ports.provider-spi
    responsibility: 内置 Provider 角色 PROVIDER_ROLES（rtc.session、capture.*、playback.*、processing.graph、codec.webcodecs.*）与扩展角色 custom:<id> 的类型和判定，防止未分类字符串进入注册表。
    provides: [if.provider-spi.isProviderRole]
    dataStructures: [ds.ProviderRole]
    codeRefs: [media-web/packages/media-provider-spi/src/index.ts]
  - id: ports.provider-spi.descriptors
    name: Provider 描述与合约
    parent: ports.provider-spi
    responsibility: Provider 的形状：descriptor（来自 contracts）+ ProviderContract（role → capability 覆盖表）+ create 工厂 + role-scoped ports；以及 defineProvider / defineProviderPort / defineProviderContract 与端口查找辅助。与任何具体 Runtime 实现无关。
    provides: [if.provider-spi.defineProvider, if.provider-spi.findProviderPort]
    dataStructures: [ds.Provider, ds.ProviderContract, ds.ProviderRoleDescriptor, ds.ProviderPort, ds.ProviderPortDescriptor, ds.ProviderDescriptor]
    codeRefs: [media-web/packages/media-provider-spi/src/index.ts]
  - id: ports.provider-spi.resolver
    name: 能力解析端口
    parent: ports.provider-spi
    responsibility: CapabilityResolver 端口：按 MediaProfile 解析 Provider 与端口（resolve / resolveDetailed / resolvePort / resolvePortDetailed）。领域 Kit 可以接受这个端口，也可以直接接收具体依赖。
    provides: [if.provider-spi.CapabilityResolver]
    dataStructures: [ds.ProviderPortResolution, ds.CapabilityResolution, ds.MediaProfile]
    codeRefs: [media-web/packages/media-provider-spi/src/index.ts]

  # ── 端口与契约：playback-pipeline ───────────────────────
  - id: ports.playback-pipeline.contract
    name: 管线契约
    parent: ports.playback-pipeline
    responsibility: 会话内核（@lsst/media-player，在 media-sdk-kits）与各族管线（在 media-wasm）之间的接口：一族管线 Pipelines / PipelineFamily、单会话 Pipeline / StartPipeline、上报口 PipelineSink（事件、统计、失败）、命令 PipelineCommand、源与打开参数、时间线、失败原因与日志码。只有类型与少量常量 / 判定函数，不含实现。
    principle: |
      - **分工**：管线拥有拉流、解码、延迟执行器、呈现与音频；内核拥有会话状态（session-opened、state、session-closed 只由内核产生）。
      - **路由**：自建时钟族（wasm / webcodecs）与媒体元素族（mse / native）；auto 下 WebCodecs 失败可在会话内切到 wasm（route-switched），不重建拉流与缓冲。
      - **线程**：Worker 或主线程在 open 时定下、会话内不变；Worker 模式的消息定义不在本包（在 media-wasm 的 wasm-playback Provider）。
      - **统计**：`STATS_INTERVAL_MS` 一次；某路由测不到的计数省略而不是填 0；`progressWatch` 判定连续 `NO_PROGRESS_PERIODS` 个周期无进展。
    provides: [if.playback-pipeline.PipelineFamily, if.playback-pipeline.Pipeline, if.playback-pipeline.PipelineSink, if.playback-pipeline.progressWatch]
    dataStructures: [ds.PipelineStart, ds.PlayerSource, ds.PlayerOpenOptions, ds.PipelineCommand, ds.PipelineSinkEvent, ds.PipelineStats, ds.PipelineTimeline, ds.PipelineEnvironment, ds.SessionFailureCause]
    codeRefs: [media-web/packages/media-playback-pipeline/src/pipeline.ts]
    docRefs: [docs/design/02-web-live-player.md]
  - id: ports.playback-pipeline.latency
    name: 延迟决策律
    parent: ports.playback-pipeline
    responsibility: 两族管线共用的延迟决策律：配置 / 读数 / 状态 / 动作 / 上报类型与配置校验，纯函数 decideLatency 与录制回放 replayLatency，以及每会话运行器 runLatencyLaw（上报转 sink 事件、动作交给本族执行器并计数）。不读浏览器 API、不设定时器。
    principle: |
      `(state, reading, config) => { state, action, reports }`，时间只来自 `reading.atMs`，从 `initialLatencyState()` 回放录制必须逐步复现同样的决策。一次决策四步：
      1. **释放锁**：时间线断开时解锁已锁手段（自己发起的重连除外）；rate / drop-skip 锁 30 s 冷却。
      2. **观测**：边沿触发上报 over-limit、target-unreachable、jitter-above-target、absolute-unavailable；断线 / 目标不可达 / 绝对基准缺结构延迟时只「保持」（撤销在用手段）。
      3. **增益测量**：手段在 `GAIN_WINDOW_MS` 内无增益即锁定并撤销，转用下一个手段；全部用尽报 means-exhausted。
      4. **按区间选动作**：死区（≥ 抖动）内不动或撤销；高于死区先 1.1 倍速再丢非参考帧；高于上限先跳到最新 IDR（落点须在上限之下且不浅于死区），再 1.25 倍速、丢帧，最后（仅绝对基准）重连；低于死区 0.9 倍速。改倍速会停顿的执行器（WebKit 元素）不减速、放宽死区并限制改速间隔。积压排空期间最多保持 `BACKLOG_HOLD_MS`。
    provides: [if.playback-pipeline.decideLatency, if.playback-pipeline.replayLatency, if.playback-pipeline.validateLatencyConfig, if.playback-pipeline.runLatencyLaw]
    dataStructures: [ds.LatencyConfig, ds.LatencyReading, ds.LatencyAction, ds.LatencyState, ds.LatencyReport, ds.LatencyDecision, ds.LatencyRecording]
    codeRefs:
      - media-web/packages/media-playback-pipeline/src/latency.ts
      - media-web/packages/media-playback-pipeline/src/latency-law.ts
      - media-web/packages/media-playback-pipeline/src/latency-run.ts
    docRefs: [docs/design/02-web-live-player.md]
  - id: ports.playback-pipeline.metering
    name: 抖动、冻结与墙钟锚点
    parent: ports.playback-pipeline
    responsibility: 管线共用的计量器：到达抖动 JitterMeter（决策律死区读数与积压判定）、画面冻结 FreezeMeter（阈值与归因）、墙钟锚点（SEI / PROGRAM-DATE-TIME / 到达时间三种精度的选择与换算，ArrivalLog）。只做标量运算，不读时钟。
    principle: |
      - **抖动**：样本为「到达时间 − 媒体时间」，只采媒体推进不快于到达的块（更快的是积压排空）；读数取窗口内偏移相对最小值的 95 分位。近 300 ms 媒体比经过时间多 100 ms 即判定积压。
      - **冻结**：两帧上屏间隔 ≥ max(3 × 平均帧间隔, 平均 + 150 ms)，平均为权重 1/30 的指数平均；原因取间隔内或前 `SETTLE_MS` 内最早的信号（seek / latency / buffering / startup），都没有才是 late / unknown；边界处截断上报。
      - **锚点**：带内时间与另一锚点相差超出信任范围时视为别的机器时钟，改用另一锚点。
    provides: [if.playback-pipeline.JitterMeter, if.playback-pipeline.FreezeMeter, if.playback-pipeline.ArrivalLog]
    dataStructures: [ds.Freeze, ds.Anchor]
    codeRefs:
      - media-web/packages/media-playback-pipeline/src/jitter.ts
      - media-web/packages/media-playback-pipeline/src/freeze.ts
      - media-web/packages/media-playback-pipeline/src/anchors.ts
  - id: ports.playback-pipeline.pull
    name: HTTP 拉流与有界重连
    parent: ports.playback-pipeline
    responsibility: 单次 HTTP 流式请求 requestStream（空闲超时、取消、非 2xx 关闭响应体、无 AbortController 退路）与 HTTP-FLV 拉流 startPull（有限次指数退避重连、稳定 10 s 后清零、干净结束两次即流结束）；失败计数器 boundedRetries 与 HLS 拉流共用。与容器格式无关。
    principle: |
      - 重连等待 `min(500·2^(n-1), 4000)` ms，最多 `MAX_RECONNECT_ATTEMPTS` 次；401 / 403 不重试。
      - 会话被压住（hold-unseen）时丢失不计数，重试等到释放后立即全部执行。
      - 日志与错误消息里的 URL 去掉查询串（签名 token 不外泄），完整 URL 只留在 PullLoss 里。
    provides: [if.playback-pipeline.requestStream, if.playback-pipeline.startPull, if.playback-pipeline.boundedRetries]
    dataStructures: [ds.PullLoss]
    codeRefs:
      - media-web/packages/media-playback-pipeline/src/http-request.ts
      - media-web/packages/media-playback-pipeline/src/network.ts
  - id: ports.playback-pipeline.hls
    name: HLS 拉流
    parent: ports.playback-pipeline
    responsibility: m3u8 解析（纯函数）、列表时间轴上的滑动窗口 HlsWindow（可 seek 区间、墙钟、直播起播点），以及按序加载分片的 HLS 拉流器 startHlsPull（open / watch / follow 三种起始方式，seek、goLive、按墙钟 seek、时移 join、暂停）。
    principle: |
      - 位置用「列表时间」：首次读到的第一个分片从 0 开始累加时长；滑动窗口只移动可 seek 区间的起点。
      - 直播从边缘后 3 个目标时长起播；列表无新分片超过 3 个目标时长视为源丢失；列表请求 20 s 内未完成视为丢失；列表超过 16 MiB 不播。
      - 失败与重试沿用 startPull 的规则（boundedRetries）；EXT-X-GAP 分片跳过，下一个分片以新时间线开始。
    provides: [if.playback-pipeline.parsePlaylist, if.playback-pipeline.HlsWindow, if.playback-pipeline.startHlsPull]
    dataStructures: [ds.MediaPlaylist, ds.HlsSegmentStart]
    codeRefs: [media-web/packages/media-playback-pipeline/src/hls/**]
    docRefs: [docs/development/09-web-player-p4-hls-ts-input.md, docs/development/11-web-player-live-timeshift.md]
  - id: ports.playback-pipeline.timers
    name: 定时与压住
    parent: ports.playback-pipeline
    responsibility: 可注入的 Timers；HoldUnseen（会话被压住 / 释放）；只在页面可见时计时的 visibleTimers 与只在会话未被压住时计时的 sessionTimers；带截止的 within。让拉流与各族等待随会话压住而停走。
    provides: [if.playback-pipeline.sessionTimers]
    codeRefs: [media-web/packages/media-playback-pipeline/src/timers.ts]

  # ── Runtime ─────────────────────────────────────────────
  - id: runtime.media-runtime.registry
    name: 注册与契约校验
    parent: runtime.media-runtime
    responsibility: register 时校验 descriptor（contracts schema）、ProviderContract 与每个 port，再对 descriptor / contract / ports 做快照存入注册表，返回注销函数。不调用 Provider 的 create。
    principle: |
      - **descriptor**：`validateContract('ProviderDescriptor')`；ID 不得重复。
      - **contract 覆盖**：`contract.id` 必须等于 descriptor.id；每个 role 合法（内置或 `custom:<id>`）且不重复，其 capability 必须是 descriptor 声明过的；descriptor 声明的每个 capability 都必须被至少一个 role 覆盖。
      - **port 落在 contract 内**：port 的每个 role 都在 contract 中、且与该 role 的 capability 有交集；port 的每个 capability 都被它某个 role 覆盖；port ID 不重复。
      - **快照**：`structuredClone` 复制清单，注册后调用方再改也影响不了能力；capability 形如 `name@N`。
    provides: [if.runtime.Runtime, if.runtime.register]
    codeRefs: [media-web/packages/media-runtime/src/index.ts]
  - id: runtime.media-runtime.resolver
    name: 确定性解析
    parent: runtime.media-runtime
    responsibility: 按 MediaProfile（requires / optional、execution、permissions）与 port role 选择 Provider 或端口，返回快照化的 factory / port 与可用性；必需能力不可用时以 unsupported 或 permission-denied 失败。只做控制面选择，不调用 create、不经手帧与 segment。
    principle: |
      - **确定性**：候选 Provider 按 ID 的 Unicode 码点序排序（与 Rust 字符串序一致，不用 locale），取第一个 execution 相同、声明该 capability 且权限全被 profile 允许的。
      - **端口解析**：`resolvePortDetailed` 依次尝试 capability，返回命中的 provider / port 快照及其 descriptor、role、capability；`resolvePort` 只取 port。
      - **失败原因**：有候选仅因权限被挡时报 `permission-denied`，否则 `unsupported`。
    provides: [if.runtime.resolveDetailed, if.runtime.resolvePort, if.runtime.resolvePortDetailed]
    codeRefs: [media-web/packages/media-runtime/src/index.ts]
  - id: runtime.media-runtime.telemetry
    name: Telemetry Hub
    parent: runtime.media-runtime
    responsibility: 校验 TelemetryRecord 后只复制契约字段，经 EventHub 发布给订阅者；不转发任意 Provider / 用户对象。
    provides: [if.runtime.record]
    codeRefs: [media-web/packages/media-runtime/src/index.ts]
  - id: runtime.media-runtime.execution-plan
    name: 执行计划校验
    parent: runtime.media-runtime
    responsibility: 对静态、锁定的执行计划（节点 = provider + role + 输入 / 输出媒体端口 + 声明成本，路径 = 节点序列）做纯函数、有界校验：端口衔接、域转换须显式声明、无环、无孤立节点、所需媒体与产物齐全、成本汇总不超限。不访问注册表、不探测浏览器、不创建 Provider，结果标记 execution unverified。
    provides: [if.runtime.validateExecutionPlan]
    dataStructures: [ds.ExecutionPlan, ds.ExecutionPlanNode, ds.ValidatedExecutionPlan]
    codeRefs: [media-web/packages/media-runtime/src/execution-plan.ts]

  # ── 浏览器 Provider：capture ─────────────────────────────
  - id: providers.capture.source
    name: 采集源
    parent: providers.capture
    responsibility: getUserMedia / getDisplayMedia 采集（带截止与取消，错误映射为 permission-denied / unsupported / provider-failed）；BrowserCaptureSource 以共享租约管理每条轨道、转发 ended / mute / unmute 事件、协商约束；BrowserDeviceMonitor 只监听 devicechange，不申请权限。
    principle: |
      - 每条原生轨道包成 owned 句柄再 `shareResource`，消费者拿 borrowed 租约，最后一个租约关闭才 `stop()`。
      - 有租约时拒绝改约束（device-busy，需消费者协商）；`applyConstraints` 超时或取消无法回滚，直接停掉这条轨道，避免迟到效果影响其他消费者。
      - 采集 Operation 落定后若已取消，关闭刚拿到的源再报 cancelled。
    provides: [if.capture.captureUserMedia, if.capture.BrowserCaptureSource, if.capture.BrowserDeviceMonitor]
    dataStructures: [ds.CaptureEvent]
    codeRefs: [media-web/packages/media-provider-browser-capture/src/capture.ts]
  - id: providers.capture.facade
    name: 采集 Provider 入口
    parent: providers.capture
    responsibility: 静态注入对象 browserCaptureProvider（把采集源适配成 MediaTrack 列表）与可注册 facade createBrowserCaptureProvider（capability media.capture@1；角色 capture.source、capture.device-monitor；端口 user-media、display-media、device-monitor）。
    provides: [if.capture.browserCaptureProvider, if.capture.createBrowserCaptureProvider]
    dataStructures: [ds.BrowserCapturedSource]
    codeRefs: [media-web/packages/media-provider-browser-capture/src/index.ts]

  # ── 浏览器 Provider：processing ──────────────────────────
  - id: providers.processing.facade
    name: 处理 Provider 入口
    parent: providers.processing
    responsibility: 静态注入对象 browserProcessingProvider（能力探测 + 创建处理图）与可注册 facade createBrowserProcessingProvider（capability media.processing@1，角色 processing.graph，端口 browser.processing.graph）。音频输出、视频、录制只经子路径导出，不在 Provider 合约里。
    provides: [if.processing.browserProcessingProvider, if.processing.createBrowserProcessingProvider]
    codeRefs: [media-web/packages/media-provider-browser-processing/src/index.ts]
  - id: providers.processing.graph
    name: Worker 处理图
    parent: providers.processing
    responsibility: 专用处理 Worker 的有界控制面 BrowserProcessingGraph：configured → prepared → running ⇄ paused → draining → stopped / cancelled / failed 状态机，process 请求转成 Worker 请求，记录 format-changed / discontinuity / end-of-stream 事件；浏览器原生能力探测。媒体对象由调用方经 transfer list 交给 Worker，中央 Runtime 从不序列化帧。
    provides: [if.processing.BrowserProcessingGraph, if.processing.detectBrowserMediaCapabilities]
    dataStructures: [ds.BrowserGraphState, ds.BrowserMediaCapabilities]
    codeRefs: [media-web/packages/media-provider-browser-processing/src/processing.ts]
  - id: providers.processing.worker
    name: Worker 请求通道
    parent: providers.processing
    responsibility: 对专用、受信 Worker 的 request / response / cancel 协议客户端 WorkerClient：容量与超时上限、显式 transfer list、可选 v2 身份信封；超时或 Worker 出错即整体失效（独占时 terminate）。
    principle: |
      - **消息**：`{version, [identity], type: 'request', id, method, body}`，回复 `{type: 'response', version, [identity], id, ok, result}`，取消 `{type: 'cancel', id}`；id 单调递增，method 形如 `process.<op>`、`clock.exchange`。
      - **transfer list**：调用方经 `WorkerRequestOptions.transfer` 显式给出，只属于调用方与 Worker 之间的数据通道，不进入 Runtime profile 或 telemetry。
      - **迟到与失效**：已取消、重复或身份不符的回复不会复活请求，其 result 交给 `disposeLate` 释放；超时、`error` / `messageerror`、投递失败都使客户端失效并拒绝所有在途请求。取消只请求 Worker 停止，不能证明后端已停。
    provides: [if.processing.WorkerClient]
    dataStructures: [ds.WorkerEndpoint, ds.WorkerClientOptions]
    codeRefs: [media-web/packages/media-provider-browser-processing/src/worker.ts]
  - id: providers.processing.worker-clock
    name: Worker 时钟桥
    parent: providers.processing
    responsibility: 页面与 Worker 之间的时钟校准与观测映射 WorkerClockBridge：多轮 clock.exchange 往返、交由注入的估计器求映射并取逆，只接收绑定执行身份与时钟代、按 Worker 时间单调的观测，误差超界即拒绝；Worker 侧 answerWorkerClockExchange。估计器本身不归本包。
    provides: [if.processing.WorkerClockBridge, if.processing.answerWorkerClockExchange]
    dataStructures: [ds.WorkerClockExchange, ds.WorkerObservationBatch, ds.Observation]
    codeRefs: [media-web/packages/media-provider-browser-processing/src/worker-clock.ts]
  - id: providers.processing.pcm-output
    name: PCM 音频输出
    parent: providers.processing
    responsibility: 共享 AudioContextScope 上的 PCM 输出 PcmOutput（独立队列、调度、静音与生命周期），以及跨 realm 版本 openRemote：在主线程建好 AudioWorklet 节点，把包队列经 MessagePort 或共享内存环交给另一个 realm（如播放 Worker）；生产端客户端 PcmPortClient / PcmRingClient 在任意 realm 执行同样的预算、调度与代际规则，并读取 worklet 回报的渲染位置作为音频时钟。
    principle: |
      - **所有权**：`enqueueOwned` 成功即转移整个 ArrayBuffer（transfer），被拒仍归调用方；`enqueueBorrowed` 显式拷贝并计入 `boundaryCopiedBytes`。
      - **调度**：块带绝对 AudioContext 帧号 `startFrame`，不得与已排队重叠，领先当前时间不超过 5 s；非有限样本被拒。
      - **代际 reset**：代号 +1，旧代确认丢弃前不接收新包；5 s 未确认即失败。
      - **时钟**：端口模式每 8 个渲染量子回报一次帧号，客户端外推且最多外推 3 个回报周期（渲染停住时钟也停）；共享环模式直接原子读渲染量子，不依赖消息投递。共享环需要跨源隔离页面，从不静默替换为端口。
    provides: [if.processing.PcmOutput, if.processing.PcmPortClient, if.processing.PcmRingClient]
    dataStructures: [ds.PcmBlock, ds.PcmRing, ds.RemotePcmOutput]
    codeRefs:
      - media-web/packages/media-provider-browser-processing/src/audio.ts
      - media-web/packages/media-provider-browser-processing/src/pcm-port.ts
      - media-web/packages/media-provider-browser-processing/src/pcm-ring.ts
  - id: providers.processing.pcm-worklet
    name: PCM Worklet 处理器
    parent: providers.processing
    responsibility: 独立加载的 AudioWorklet 模块 media-pcm-output-v1：按帧号把排队的 PCM 包写到输出，回报每包 played / late 帧数与渲染位置；支持一次性 attach 到外部端口或共享环。不 import 任何运行时代码。
    codeRefs: [media-web/packages/media-provider-browser-processing/src/pcm-worklet.ts]
  - id: providers.processing.video
    name: 视频桥与 Canvas 处理
    parent: providers.processing
    responsibility: 浏览器视频对象之间的显式桥：Track → VideoFrame（MediaStreamTrackProcessor，私有克隆轨道隔离取消）、已呈现的 video 元素 → VideoFrame（requestVideoFrameCallback）、VideoFrame → Canvas 捕获轨道；以及只做裁剪 / 缩放 / 旋转、一次绘制完成的 CanvasVideoProcessor。每次只允许一帧在外，尺寸与像素数有上限，不做 CPU 回读。
    principle: |
      - 输入帧只借用；输出帧以 owned 句柄交给调用方，关闭时释放预算预留。
      - Canvas 路线只接受色彩空间描述完整的 SDR 输入；画布尺寸变化先缩到 1 像素宽，避免横竖切换瞬时分配更大表面。
      - 输出轨道以共享租约分发，最后一个消费者释放才停止原生轨道；Canvas 捕获使用新时钟，不保留源 PTS。
    provides: [if.processing.VideoTrackSource, if.processing.PresentedVideoFrameSource, if.processing.CanvasVideoTrackOutput, if.processing.CanvasVideoProcessor]
    dataStructures: [ds.CanvasVideoEffect]
    codeRefs:
      - media-web/packages/media-provider-browser-processing/src/video.ts
      - media-web/packages/media-provider-browser-processing/src/video-track.ts
  - id: providers.processing.recording
    name: 原生录制
    parent: providers.processing
    responsibility: 以 MediaRecorder 为完整编码 / 容器后端的 BrowserRecordingSource：持有一个 MediaStream 租约，按 timeslice 把 Blob 分块交给异步消费者，对块大小、在途字节 / 块数、总字节与总时长设预算；源轨道结束、原生错误或超预算即失败。分块不承诺可独立播放。
    provides: [if.processing.BrowserRecordingSource]
    codeRefs: [media-web/packages/media-provider-browser-processing/src/recording.ts]

  # ── 浏览器 Provider：webcodecs ───────────────────────────
  - id: providers.webcodecs.codec
    name: WebCodecs 编解码队列
    parent: providers.webcodecs
    responsibility: 对 VideoDecoder / VideoEncoder / AudioDecoder / AudioEncoder 的有界封装：配置去重（codecConfigurationKey）、输入 / 输出两级预算、代际丢弃、flush 截止、尺寸上限，输出以 owned 句柄排队，取出时所有权交给调用方；构造函数探测与配置支持探测（结果标记 execution unverified）。
    principle: |
      - **代际**：每次重配置 / reset / 失败代号 +1，旧代迟到的输出直接关闭；配置键不变且已配置时 `configure` 为空操作。
      - **输入记账**：提交时按字节 / 时长预留，依据 `decodeQueueSize` / `encodeQueueSize` 和 `ondequeue` 逐个释放；flush 成功释放全部。
      - **输出记账**：输出放进 ResourceQueue，放不下即关闭该输出并以 resource-exhausted 失败；未知字节 / 时长按满额计，绝不按 0 计。
      - 编码器的 decoderConfig 元数据随输出另存，不在换配置时静默丢失。
    provides: [if.webcodecs.BrowserWebCodecsVideoDecoder, if.webcodecs.probeWebCodecsConfiguration]
    dataStructures: [ds.BrowserWebCodecsOptions, ds.BrowserWebCodecsEvent]
    codeRefs: [media-web/packages/media-provider-webcodecs/src/codec.ts]
  - id: providers.webcodecs.facade
    name: WebCodecs Provider 入口
    parent: providers.webcodecs
    responsibility: 静态注入对象 browserWebCodecsProvider（探测 + 四种编解码器工厂）与可注册 facade createBrowserWebCodecsProvider（capability media.codec@1，四个 codec.webcodecs.* 角色各一个端口）。
    provides: [if.webcodecs.browserWebCodecsProvider, if.webcodecs.createBrowserWebCodecsProvider]
    codeRefs: [media-web/packages/media-provider-webcodecs/src/index.ts]

  # ── 浏览器 Provider：container ───────────────────────────
  - id: providers.container.reader
    name: 容器读取
    parent: providers.container
    responsibility: 基于 Mediabunny 的 MP4 / MPEG-TS 只拉取式解封装 ContainerReader：一次一个操作、一次只借出一个包，无预取；对源大小、单次读、累计 I/O、包数、轨道数与元数据设上限；MP4 先做盒结构准入检查。只输出编码包，不含解码与播放策略。
    principle: |
      - 打开即接管源所有权（初始化失败也会关闭源）。
      - 读包先取元数据检查大小，再按同一游标取数据并核对序号与长度，避免 PTS 重复时取错包；配置变化要求重新打开。
      - 关键帧 seek 使解码连续性失效，调用方须重置解码器。
    provides: [if.container.ContainerReader, if.container.checkMp4Admission]
    dataStructures: [ds.ContainerTrack, ds.ContainerPacket, ds.ContainerLimits]
    codeRefs:
      - media-web/packages/media-provider-container/src/input.ts
      - media-web/packages/media-provider-container/src/mp4-limits.ts
  - id: providers.container.writer
    name: MP4 写入
    parent: providers.container
    responsibility: 基于 Mediabunny 的分片 MP4 封装 Mp4PacketWriter：按轨道配置键校验包、要求每轨以关键帧开始且解码序递增，按位置顺序写入 MediaByteTarget；finalize 要求目标字节数一致，产物标记需要解码验证；abort 幂等且有界。
    provides: [if.container.Mp4PacketWriter]
    codeRefs: [media-web/packages/media-provider-container/src/output.ts]
  - id: providers.container.facade
    name: 容器 Provider 入口
    parent: providers.container
    responsibility: 静态对象 containerProvider（openReader / openMp4Writer）与已构造的可注册对象 containerRuntimeProvider（capability media.container@1，使用 custom:container.reader / custom:container.mp4-writer 扩展角色）。原生媒体与 RTC 消费者不需要引入本包。
    provides: [if.container.containerRuntimeProvider]
    codeRefs: [media-web/packages/media-provider-container/src/index.ts]

relations:
  # ── media-core ──
  - id: rel.web.core-errors-contracts
    from: primitives.core.errors
    to: contracts.media-contracts
    type: depends
    payload: [ds.ErrorCode]
    description: MediaFault 的 code 取 contracts 的 ErrorCode。
  - id: rel.web.core-operation-contracts
    from: primitives.core.operation
    to: contracts.media-contracts
    type: depends
    payload: [ds.ExecutionIdentity, ds.OperationContext, ds.OperationState]
    description: Operation 的状态、执行身份与上下文快照使用 contracts 类型。
  - id: rel.web.core-operation-errors
    from: primitives.core.operation
    to: primitives.core.errors
    type: depends
    interface: if.core.MediaFault
    description: 取消、超时、失败均以 MediaFault 表达。
  - id: rel.web.core-track-contracts
    from: primitives.core.track
    to: contracts.media-contracts
    type: depends
    payload: [ds.TrackDescriptor]
  - id: rel.web.core-config-errors
    from: primitives.core.codec-config
    to: primitives.core.errors
    type: depends
    interface: if.core.MediaFault

  # ── media-resources ──
  - id: rel.web.resources-errors
    from: primitives.resources
    to: primitives.core.errors
    type: depends
    interface: if.core.MediaFault
    description: 全包以 MediaFault 报告非法参数、状态与资源耗尽。
  - id: rel.web.resources-framestore-contracts
    from: primitives.resources.frame-store
    to: contracts.media-contracts
    type: calls
    interface: if.media-contracts.validateContract
    payload: [ds.LocalFrameDescriptor]
    description: 插入帧时按 schema 校验帧元数据。
  - id: rel.web.resources-framestore-budget
    from: primitives.resources.frame-store
    to: primitives.resources.budget
    type: calls
    interface: if.resources.ResourceBudget
    payload: [ds.ResourceCost]
    description: 可选父预算为每份帧拷贝计费。
  - id: rel.web.resources-execution-operation
    from: primitives.resources.execution
    to: primitives.core.operation
    type: depends
    interface: if.core.Operation
    payload: [ds.OperationOptions]
    description: 资源创建与装配事务都包成带上下文的 Operation。
  - id: rel.web.resources-execution-contracts
    from: primitives.resources.execution
    to: contracts.media-contracts
    type: depends
    payload: [ds.ExecutionIdentity]
  - id: rel.web.resources-execution-budget
    from: primitives.resources.execution
    to: primitives.resources.budget
    type: calls
    interface: if.resources.ResourceBudget
    payload: [ds.ResourceCost]
    description: 创建前按完整成本预留，作用域关闭时关闭预算准入。
  - id: rel.web.resources-execution-handles
    from: primitives.resources.execution
    to: primitives.resources.handles
    type: depends
    interface: if.resources.ResourceScope
    payload: [ds.ResourceHandle]
    description: 用 ResourceScope 收养产出的 owned 句柄并逆序清理。
  - id: rel.web.resources-handoff-operation
    from: primitives.resources.handoff
    to: primitives.core.operation
    type: depends
    interface: if.core.assertExecutionIdentity
    description: 交接与信用消息按执行身份校验与比对。
  - id: rel.web.resources-handoff-contracts
    from: primitives.resources.handoff
    to: contracts.media-contracts
    type: depends
    payload: [ds.ExecutionIdentity, ds.ResourceGrant, ds.ResourceGrantReceipt]
  - id: rel.web.resources-handoff-budget
    from: primitives.resources.handoff
    to: primitives.resources.budget
    type: calls
    interface: if.resources.ResourceQueue
    payload: [ds.ResourceCost]
    description: Inbox 以有界队列接收；信用授权方从预算预留，接收方按授权额度建局部预算。
  - id: rel.web.resources-handoff-handles
    from: primitives.resources.handoff
    to: primitives.resources.handles
    type: depends
    payload: [ds.ResourceHandle]
    description: 只有 owned 且 transferable 的句柄可转移；被拒的句柄当场关闭。
  - id: rel.web.resources-clock-contracts
    from: primitives.resources.clock
    to: contracts.media-contracts
    type: depends
    payload: [ds.MediaClockRef, ds.MediaClockMapping]
  - id: rel.web.resources-audio-handles
    from: primitives.resources.audio
    to: primitives.resources.handles
    type: calls
    interface: if.resources.shareResource
    payload: [ds.ResourceOwner]
    description: AudioContext 以共享租约分发给各输出。
  - id: rel.web.resources-audio-operation
    from: primitives.resources.audio
    to: primitives.core.operation
    type: depends
    interface: if.core.Operation
    description: 激活与加载 Worklet 带截止时间。

  # ── provider-spi ──
  - id: rel.web.spi-descriptors-contracts
    from: ports.provider-spi.descriptors
    to: contracts.media-contracts
    type: depends
    payload: [ds.ProviderDescriptor]
    description: Provider descriptor 直接复用并再导出 contracts 的 ProviderDescriptor。
  - id: rel.web.spi-resolver-contracts
    from: ports.provider-spi.resolver
    to: contracts.media-contracts
    type: depends
    payload: [ds.MediaProfile, ds.CapabilityAvailability]
  - id: rel.web.spi-descriptors-roles
    from: ports.provider-spi.descriptors
    to: ports.provider-spi.roles
    type: depends
    payload: [ds.ProviderRole]
  - id: rel.web.spi-resolver-descriptors
    from: ports.provider-spi.resolver
    to: ports.provider-spi.descriptors
    type: depends
    payload: [ds.Provider, ds.ProviderPort]

  # ── media-runtime ──
  - id: rel.web.runtime-errors
    from: runtime.media-runtime
    to: primitives.core.errors
    type: depends
    interface: if.core.MediaFault
  - id: rel.web.runtime-registry-validate
    from: runtime.media-runtime.registry
    to: contracts.media-contracts
    type: calls
    interface: if.media-contracts.validateContract
    payload: [ds.ProviderDescriptor]
