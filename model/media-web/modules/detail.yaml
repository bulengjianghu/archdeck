interfaces:
  # ── media-contracts ──
  - id: if.media-contracts.validateContract
    name: validateContract
    owner: contracts.media-contracts
    signature: |
      function validateContract(name: ContractName, value: unknown): { valid: boolean; errors: string[] };
    description: 按 media-specs 生成的 JSON Schema（ajv）校验一个契约值。
    semantics: 未知契约名抛 Error；media-web 用它校验 ProviderDescriptor、MediaProfile、TelemetryRecord、LocalFrameDescriptor。

  # ── media-core ──
  - id: if.core.MediaFault
    name: MediaFault / describeError
    owner: primitives.core.errors
    signature: |
      class MediaFault extends Error {
        readonly code: ErrorCode;
        constructor(code: ErrorCode, message: string);
      }
      function describeError(error: unknown): string;
    description: 运行时中立的平台错误；describeError 把异常与 cause 链压成一行（不带堆栈与文件路径）。
  - id: if.core.EventHub
    name: EventHub
    owner: primitives.core.errors
    signature: |
      class EventHub<T> {
        subscribe(listener: (event: T) => void): () => void;
        emit(event: T): void;
        close(): void;
        readonly size: number;
      }
    semantics: 关闭后 subscribe 抛 invalid-state、emit 静默；某个监听者抛错以 reportError 上抛，其余监听者与发布者继续。
  - id: if.core.Operation
    name: Operation
    owner: primitives.core.operation
    signature: |
      class Operation<T> {
        constructor(run: (signal: AbortSignal) => Promise<T>, options?: OperationOptions<T> | ((value: T) => void));
        readonly promise: Promise<T>;
        readonly state: OperationState;
        readonly snapshot: OperationContext | undefined;
        cancel(): boolean;
      }
    semantics: run 在下一个微任务开始；终态只设一次。超时以 timeout、取消以 cancelled 拒绝并 abort 传给 run 的 signal；终态后才落定的值交给 disposeLate。非 MediaFault 的失败在快照中记为 provider-failed。
  - id: if.core.assertExecutionIdentity
    name: assertExecutionIdentity / sameExecution
    owner: primitives.core.operation
    signature: |
      function assertExecutionIdentity(identity: ExecutionIdentity): void;
      function sameExecution(a: ExecutionIdentity, b: ExecutionIdentity): boolean;
    semantics: 身份须 version 1、instanceId / sessionId 非空、generation 为非负安全整数，否则抛 invalid-argument；四个字段全等才是同一执行。
  - id: if.core.codecConfigurationKey
    name: codecConfigurationKey
    owner: primitives.core.codec-config
    signature: |
      function codecConfigurationKey(config: unknown): string;
    semantics: 键按字典序排序、去掉 undefined，字节转数组；嵌套 > 8 层、单值 > 64 KiB、结果 > 512 KiB 等越界抛 MediaFault。

  # ── media-resources ──
  - id: if.resources.ownedResource
    name: ownedResource / borrowedResource / closeResource
    owner: primitives.resources.handles
    signature: |
      function ownedResource<T>(resource: T, closer?: ResourceCloser<T>): ResourceHandle<T>;
      function borrowedResource<T>(resource: T): ResourceHandle<T>;
      function closeResource(resource: ResourceHandle<unknown> | { close?(): void } | { stop?(): void } | null | undefined): void;
    semantics: close 幂等；owned 关闭时调用 closer（默认 close 或 stop），borrowed 只标记关闭。
  - id: if.resources.shareResource
    name: shareResource
    owner: primitives.resources.handles
    signature: |
      function shareResource<T>(handle: ResourceHandle<T>): ResourceOwner<T>;
    semantics: 接管句柄且不克隆原生对象；所有者关闭且租约数归零时才关闭底层句柄。共享已关闭句柄抛 invalid-state。
  - id: if.resources.ResourceScope
    name: ResourceScope
    owner: primitives.resources.handles
    signature: |
      class ResourceScope implements Closable {
        adopt<T extends Closable>(resource: T): T;
        release(resource: Closable): boolean;
        close(): void;
        readonly closed: boolean;
        readonly size: number;
      }
    semantics: 关闭后 adopt 会立即关闭传入对象并抛错；close 逆序关闭，多个失败汇总为 AggregateError。
  - id: if.resources.ResourceBudget
    name: ResourceBudget
    owner: primitives.resources.budget
    signature: |
      class ResourceBudget {
        constructor(limits: ResourceCost);
        fork(limits: ResourceCost): ResourceBudget;
        reserve(cost: ResourceCost): Closable | undefined;
        close(): void;
        readonly snapshot: { used: ResourceCost; peak: ResourceCost; rejected: number; limits: ResourceCost };
        readonly reservationCount: number;
      }
    semantics: reserve 同步检查本级与所有祖先，任一不足返回 undefined 且不改任何用量；close 停止本级及后代的准入，不伪造释放。
  - id: if.resources.ResourceQueue
    name: ResourceQueue
    owner: primitives.resources.budget
    signature: |
      class ResourceQueue<T extends Closable> implements Closable {
        constructor(budget: ResourceBudget);
        offer(value: T, cost: Omit<ResourceCost, 'objects'>): boolean;
        take(): T | undefined;
        close(): void;
        readonly size: number;
      }
    semantics: offer 失败所有权留给调用方；take 转移所有权；close 关闭剩余项。
  - id: if.resources.FrameStore
    name: FrameStore
    owner: primitives.resources.frame-store
    signature: |
      class FrameStore {
        constructor(maxFrames: number, maxBytes: number, budget?: ResourceBudget);
        insert(metadata: Omit<LocalFrameDescriptor, 'handle'>, bytes: Uint8Array): string;
        read(handle: string): { descriptor: LocalFrameDescriptor; bytes: Uint8Array };
        release(handle: string): boolean;
        close(): void;
        readonly resourceCount: number;
        readonly byteCount: number;
      }
    semantics: insert 校验元数据并拷贝字节，超出帧数 / 字节或父预算时抛 resource-exhausted；read 返回拷贝；未知句柄抛 invalid-state。
  - id: if.resources.RandomAccessMediaSource
    name: RandomAccessMediaSource
    owner: primitives.resources.byte-io
    signature: |
      interface RandomAccessMediaSource {
        id: string;
        size: number;
        read(start: number, endExclusive: number, signal: AbortSignal): Promise<Uint8Array>;
        close(): void;
      }
    semantics: 字节在读之间不得变化；消费者负责 close；取消必须传到传输层。
  - id: if.resources.MediaByteTarget
    name: MediaByteTarget
    owner: primitives.resources.byte-io
    signature: |
      interface MediaByteTarget {
        write(position: number, data: Uint8Array, signal: AbortSignal): Promise<void>;
        finalize(signal: AbortSignal): Promise<{ id: string; byteLength: number }>;
        abort(): Promise<void>;
      }
    semantics: finalize 只表示字节可访问，不承诺持久或可独立解码；abort 幂等，须丢弃部分输出并阻止迟到的 write / finalize 发布产物。
  - id: if.resources.ResourceExecutionScope
    name: ResourceExecutionScope
    owner: primitives.resources.execution
    signature: |
      class ResourceExecutionScope implements Closable {
        constructor(identity: ExecutionIdentity, budget: ResourceBudget, maxOperations?: number);
        readonly signal: AbortSignal;
        adopt<T extends Closable>(resource: T): T;
        acquire<T>(operationId: string, cost: ResourceCost, create: (signal: AbortSignal) => Promise<T>,
          dispose: ResourceCloser<T>, options?: { signal?: AbortSignal; timeoutMs?: number }): Operation<ResourceHandle<T>>;
        close(): void;
      }
    semantics: cost 至少 1 个对象与 1 个在途；operationId 唯一；预算不足抛 resource-exhausted。作用域关闭后交付的资源立即释放并以 cancelled 失败。
  - id: if.resources.assembleResources
    name: assembleResources
    owner: primitives.resources.execution
    signature: |
      function assembleResources<T>(scope: ResourceExecutionScope,
        build: (scope: ResourceExecutionScope, signal: AbortSignal) => Promise<T>,
        options?: { signal?: AbortSignal; timeoutMs?: number }): Operation<T>;
    semantics: 一次装配事务：失败或取消关闭整个作用域，成功则保留作用域。
  - id: if.resources.transferResource
    name: transferResource
    owner: primitives.resources.handoff
    signature: |
      function transferResource<T>(handle: ResourceHandle<T>, send: (resource: T) => void): void;
    semantics: 只接受 open 的 owned 且 transferable 句柄；send 后无论成功与否都关闭句柄（原生转移已使发送端对象分离）。
  - id: if.resources.MediaResourceInbox
    name: MediaResourceInbox
    owner: primitives.resources.handoff
    signature: |
      class MediaResourceInbox<T> {
        constructor(identity: ExecutionIdentity, budget: ResourceBudget);
        receive(identity: ExecutionIdentity, handle: ResourceHandle<T>, cost: Omit<ResourceCost, 'objects'>): boolean;
        take(): ResourceHandle<T> | undefined;
        close(): void;
      }
    semantics: receive 总是消费传入句柄：身份不符（stale）或超预算（overflow）时当场关闭。
  - id: if.resources.ResourceCreditOwner
    name: ResourceCreditOwner / ResourceCreditReceiver
    owner: primitives.resources.handoff
    signature: |
      class ResourceCreditOwner implements Closable {
        constructor(identity: ExecutionIdentity, channelId: string, budget: ResourceBudget, capacity?: number);
        grant(cost: ResourceCost): ResourceGrant | undefined;
        acknowledge(receipt: ResourceGrantReceipt): boolean;
        close(): void;
        confirmTerminated(): void;
      }
      class ResourceCreditReceiver implements Closable {
        accept(grant: ResourceGrant): { budget: ResourceBudget; complete(): ResourceGrantReceipt };
        close(): void;
      }
    semantics: 授权序号严格递增；接收方在局部预算仍有预留时 complete 抛 invalid-state；授权方只能在 close 之后、确认 Worker 已终止时 confirmTerminated。
  - id: if.resources.mapMediaTime
    name: mapMediaTime / sameClock / mediaTimeDifference
    owner: primitives.resources.clock
    signature: |
      function sameClock(a: MediaClockRef, b: MediaClockRef): boolean;
      function mapMediaTime(valueUs: number, clock: MediaClockRef, mapping: MediaClockMapping): MappedMediaTime | undefined;
      function mediaTimeDifference(a: MappedMediaTime, b: MappedMediaTime): { valueUs: number; maxErrorUs: number } | undefined;
    semantics: 时钟域不符或越出有效区间返回 undefined；非法映射或溢出抛 invalid-argument；误差上界含浮点舍入。
  - id: if.resources.AudioContextScope
    name: AudioContextScope
    owner: primitives.resources.audio
    signature: |
      class AudioContextScope {
        constructor(options?: { context?: AudioContext; ownContext?: boolean; sampleRate?: number; maxLeases?: number });
        acquire(): ResourceHandle<AudioContext>;
        activate(signal?: AbortSignal): Promise<void>;
        loadWorklet(url: string, signal?: AbortSignal): Promise<void>;
        close(): void;
      }
    semantics: activate 须在用户手势内调用，5 s 截止，之后上下文仍非 running 即失败；会话暂停不得挂起本作用域；Worklet 模块最多 8 个。

  # ── provider-spi ──
  - id: if.provider-spi.isProviderRole
    name: isProviderRole
    owner: ports.provider-spi.roles
    signature: |
      const PROVIDER_ROLES: readonly ['rtc.session', 'capture.source', 'capture.device-monitor', 'playback.native', 'playback.mse',
        'playback.hls', 'playback.mpegts', 'processing.graph', 'codec.webcodecs.video-decoder', /* … */];
      function isProviderRole(value: unknown): value is ProviderRole;
    semantics: 内置角色或匹配 /^custom:[a-z][a-z0-9.-]{0,120}$/ 的扩展角色。
  - id: if.provider-spi.defineProvider
    name: defineProvider / defineProviderPort / defineProviderContract
    owner: ports.provider-spi.descriptors
    signature: |
      function defineProvider<T>(provider: Provider<T>): Provider<T>;
      function defineProviderPort<T>(port: ProviderPort<T>): ProviderPort<T>;
      function defineProviderContract(contract: ProviderContract): ProviderContract;
    description: 仅做类型约束的恒等函数，Provider 包用它声明可注册 facade；真正的校验在 Runtime 注册时进行。
  - id: if.provider-spi.findProviderPort
    name: findProviderPort / providerPorts / providerContractRoles
    owner: ports.provider-spi.descriptors
    signature: |
      function findProviderPort<T>(provider: Provider, role: ProviderRole, capability?: string): ProviderPort<T> | undefined;
      function providerPorts(provider: Provider): ProviderPort[];
      function providerContractRoles(provider: Provider, role?: ProviderRole): ProviderRoleDescriptor[];
    description: 不经 Runtime、直接从固定 Provider 上取端口的辅助（领域 Kit 静态注入时使用）。
  - id: if.provider-spi.CapabilityResolver
    name: CapabilityResolver
    owner: ports.provider-spi.resolver
    signature: |
      interface CapabilityResolver {
        resolve(profile: MediaProfile): Map<string, Provider>;
        resolveDetailed(profile: MediaProfile): CapabilityResolution;
        resolvePort<T>(profile: MediaProfile, role: ProviderRole, capability?: string): ProviderPort<T>;
        resolvePortDetailed<T>(profile: MediaProfile, role: ProviderRole, capability?: string): ProviderPortResolution<T>;
      }
    description: Kit 面向的解析端口；只需构造入口用 resolvePort，需要定位命中的 Provider 用 resolvePortDetailed。

  # ── media-runtime ──
  - id: if.runtime.Runtime
    name: Runtime
    owner: runtime.media-runtime.registry
    signature: |
      class Runtime implements CapabilityResolver {
        register<T>(provider: Provider<T>): () => void;
        resolve(profile: MediaProfile): Map<string, Provider>;
        resolveDetailed(profile: MediaProfile): { providers: Map<string, Provider>; ports: ProviderPort[]; availability: CapabilityAvailability[] };
        resolvePort<T>(profile: MediaProfile, role: ProviderRole, capability?: string): ProviderPort<T>;
        resolvePortDetailed<T>(profile: MediaProfile, role: ProviderRole, capability?: string): ProviderPortResolution<T>;
        record(record: TelemetryRecord): void;
        readonly telemetry: EventHub<TelemetryRecord>;
        readonly providerCount: number;
        close(): void;
      }
    description: 可选的 Registry / Resolver 实现，直接 new Runtime() 使用。仓库 README 示例中的 createMediaRuntime() 在代码中不存在。
    semantics: close 后 register / resolve* 抛 invalid-state，record 静默忽略。
  - id: if.runtime.register
    name: Runtime.register
    owner: runtime.media-runtime.registry
    signature: |
      register<T>(provider: Provider<T>): () => void;
    semantics: 校验失败、ID 重复抛 invalid-argument；成功后存快照并返回注销函数（只注销本次注册的那份）。
  - id: if.runtime.resolveDetailed
    name: Runtime.resolve / resolveDetailed
    owner: runtime.media-runtime.resolver
    signature: |
      resolve(profile: MediaProfile): Map<string, Provider>;
      resolveDetailed(profile: MediaProfile): { providers: Map<string, Provider>; ports: ProviderPort[]; availability: CapabilityAvailability[] };
    semantics: 对 requires ∪ optional 的每个 capability 取第一个合格 Provider；必需能力不可用抛 unsupported / permission-denied，可选能力只记入 availability。
  - id: if.runtime.resolvePort
    name: Runtime.resolvePort
    owner: runtime.media-runtime.resolver
    signature: |
      resolvePort<T = unknown>(profile: MediaProfile, role: ProviderRole, capability?: string): ProviderPort<T>;
    semantics: 等同 resolvePortDetailed(...).port。
  - id: if.runtime.resolvePortDetailed
    name: Runtime.resolvePortDetailed
    owner: runtime.media-runtime.resolver
    signature: |
      resolvePortDetailed<T = unknown>(profile: MediaProfile, role: ProviderRole, capability?: string): ProviderPortResolution<T>;
    semantics: 未给 capability 时依次尝试 profile 的全部 capability；role 非法或 capability 不合 name@N 抛 invalid-argument；找不到抛 unsupported 或（仅被权限挡住时）permission-denied。返回的 provider / port 是快照。
  - id: if.runtime.record
    name: Runtime.record
    owner: runtime.media-runtime.telemetry
    signature: |
      record(record: TelemetryRecord): void;
    semantics: 校验失败抛 invalid-argument；只转发契约字段。
  - id: if.runtime.validateExecutionPlan
    name: validateExecutionPlan
    owner: runtime.media-runtime.execution-plan
    signature: |
      function validateExecutionPlan(input: ExecutionPlan): ValidatedExecutionPlan;
    semantics: 结构非法抛 invalid-argument；节点权限不在计划内抛 permission-denied；缺所需媒体或产物抛 unsupported；声明成本超限或未知时抛 resource-exhausted。返回深冻结的副本。

  # ── playback-pipeline ──
  - id: if.playback-pipeline.PipelineFamily
    name: PipelineFamily / Pipelines
    owner: ports.playback-pipeline.contract
    signature: |
      type PipelineFamily = (environment: PipelineEnvironment) => Promise<Pipelines>;
      interface Pipelines {
        readonly workerAvailable: boolean;
        readonly routes: ReadonlyArray<readonly [PlayerContainer, PlayerRoute]>;
        readonly unavailable: readonly UnavailableRoute[];
        readonly startPipeline: StartPipeline;
        readonly volumeControl: boolean;
        readonly freezesMeasured: boolean;
        setVolume(volume: number, muted: boolean): void;
        clearLastFrame(): void;
        destroy(): void;
      }
    description: 宿主选定一族管线，播放器用 PipelineEnvironment 调用它一次；内核按 routes 为每个会话解析路由。
  - id: if.playback-pipeline.Pipeline
    name: StartPipeline / Pipeline
    owner: ports.playback-pipeline.contract
    signature: |
      type StartPipeline = (start: PipelineStart) => Pipeline;
      interface Pipeline {
        command(command: PipelineCommand): void;
        stop(): Promise<void>;
        terminate(): void;
        screenshot(): Promise<Blob>;
      }
    semantics: stop 释放管线获取的一切；stop 超时后内核调用 terminate（Worker 模式即终止 Worker）。screenshot 在未出帧或上下文丢失时拒绝 invalid-state。
  - id: if.playback-pipeline.PipelineSink
    name: PipelineSink
    owner: ports.playback-pipeline.contract
    signature: |
      interface PipelineSink {
        event(event: PipelineSinkEvent): void;
        stats(stats: PipelineStats): void;
        failed(cause: SessionFailureCause, error: MediaError): void;
      }
    semantics: 会话开始关闭后的调用被丢弃；failed 后内核使会话失败并停止管线；stats 每 STATS_INTERVAL_MS 一次。
  - id: if.playback-pipeline.progressWatch
    name: progressWatch
    owner: ports.playback-pipeline.contract
    signature: |
      type ProgressWatch = (expecting: boolean, reading: number) => number;
      function progressWatch(): ProgressWatch;
    semantics: 每个统计周期调用一次，返回连续无进展的期望周期数（最多 NO_PROGRESS_PERIODS 后清零）。
  - id: if.playback-pipeline.decideLatency
    name: decideLatency
    owner: ports.playback-pipeline.latency
    signature: |
      type LatencyLaw = (state: LatencyState, reading: LatencyReading, config: LatencyConfig) => LatencyDecision;
      const decideLatency: LatencyLaw;
      function initialLatencyState(): LatencyState;
    semantics: 纯函数，无副作用、不读时钟；每次读数至多一个动作，set-* 动作持续到被改变。调用方原样回传 state，不得修改。
  - id: if.playback-pipeline.replayLatency
    name: replayLatency
    owner: ports.playback-pipeline.latency
    signature: |
      function replayLatency(recording: LatencyRecording, law?: LatencyLaw): number;
    semantics: 从初始状态回放，返回第一个与录制决策（动作 + 上报）不同的步序号，全部一致返回 -1。
  - id: if.playback-pipeline.validateLatencyConfig
    name: validateLatencyConfig
    owner: ports.playback-pipeline.latency
    signature: |
      function validateLatencyConfig(config: unknown): LatencyConfig;
    semantics: 枚举字段非法、时长非有限非负、无目标却 catchUpAbove 为 target 或有余量、目标 + 余量超过上限时抛 invalid-argument。
  - id: if.playback-pipeline.runLatencyLaw
    name: runLatencyLaw
    owner: ports.playback-pipeline.latency
    signature: |
      function runLatencyLaw(config: LatencyConfig, sink: Pick<PipelineSink, 'event'>,
        execute: (action: ChosenLatencyAction) => void): LatencyLawRun;
      interface LatencyLawRun { read(reading: LatencyReading): void; reset(): void; readonly counts: LatencyActionCounts }
    semantics: 每 READING_INTERVAL_MS 读一次；上报转成 latency 事件，非 none 动作交给本族执行器并计数；回到直播边缘时 reset。
  - id: if.playback-pipeline.JitterMeter
    name: JitterMeter
    owner: ports.playback-pipeline.metering
    signature: |
      class JitterMeter {
        constructor(windowMs: number);
        add(arrivalMs: number, mediaMs: number): void;
        spreadMs(nowMs: number): number;
        backlog(nowMs: number): boolean;
        reset(): void;
      }
    semantics: 新连接前后的偏移不可比，须 reset。
  - id: if.playback-pipeline.FreezeMeter
    name: FreezeMeter
    owner: ports.playback-pipeline.metering
    signature: |
      class FreezeMeter {
        constructor(report: (freeze: Freeze) => void, declaredFps: () => number | null);
        frame(atMs: number, mediaMs: number, unseen?: number): void;
        boundary(atMs: number): void;
        restart(): void;
        seeking(atMs: number, active: boolean): void;
        acted(atMs: number, latency: FreezeLatency): void;
        buffering(atMs: number, active: boolean): void;
        late(atMs: number): void;
      }
    semantics: 冻结在下一帧上屏时报出，或在边界处截断报出；每帧只做标量运算。
  - id: if.playback-pipeline.ArrivalLog
    name: ArrivalLog / trustedAnchor
    owner: ports.playback-pipeline.metering
    signature: |
      class ArrivalLog {
        record(timeline: number, newestPositionMs: number, nowMs: number): void;
        anchorAt(timeline: number, positionMs: number): Anchor | null;
        latest(timeline: number): Anchor | null;
      }
      function trustedAnchor(inband: Anchor | null, other: Anchor | null): Anchor | null;
      function epochAt(anchor: Pick<Anchor, 'positionMs' | 'epochMs'>, positionMs: number): number;
    semantics: 新时间线使旧锚点失效；带内锚点与另一锚点相差超出信任范围时取另一锚点。
  - id: if.playback-pipeline.requestStream
    name: requestStream
    owner: ports.playback-pipeline.pull
    signature: |
      function requestStream(url: string, timers: Timers, on: RequestHandlers): () => void;
      interface RequestHandlers {
        ok(responseUrl: string): void;
        chunk(bytes: Uint8Array): void;
        done(): void;
        fail(failure: RequestFailure): void;
      }
    semantics: 返回取消函数，取消后不再回调；IDLE_TIMEOUT_MS 无字节（含响应头）报 idle；非 2xx 关闭响应体后报 http。README 称不导出，但包根实际导出了。
  - id: if.playback-pipeline.startPull
    name: startPull
    owner: ports.playback-pipeline.pull
    signature: |
      function startPull(url: string, handlers: PullHandlers, timers?: Timers, start?: 'open' | 'again'): Pull;
      interface Pull { reconnect(): void; holdUnseen(held: boolean): void; stop(): void }
      interface PullHandlers {
        connected(reconnected: boolean): void;
        chunk(bytes: Uint8Array): void;
        disconnected(attempt: number, loss: PullLoss): void;
        exhausted(loss: PullLoss): void;
        ended(): void;
      }
    semantics: reconnect（决策律动作）不计为失败；次数用尽或 401 / 403 时 exhausted；干净结束后重连又干净结束、或曾推流的地址返回 404 时 ended。
  - id: if.playback-pipeline.boundedRetries
    name: boundedRetries
    owner: ports.playback-pipeline.pull
    signature: |
      function boundedRetries(timers: Timers, steady?: () => void): Retries;
      interface Retries {
        fail(): number | null;
        retry(run: () => void, limit?: number): Retry | null;
        working(): void;
        holdUnseen(held: boolean): void;
        reset(): void;
        stop(): void;
      }
    semantics: 超过上限返回 null；压住期间的丢失返回 0（不计数），释放时立即执行所有待重试。
  - id: if.playback-pipeline.parsePlaylist
    name: parsePlaylist
    owner: ports.playback-pipeline.hls
    signature: |
      function parsePlaylist(text: string, baseUrl: string): MediaPlaylist | MasterPlaylist | PlaylistError;
    semantics: 纯函数；EXT-X-KEY / MAP / BYTERANGE 报 unsupported-tag；主列表只取第一个变体。
  - id: if.playback-pipeline.HlsWindow
    name: HlsWindow
    owner: ports.playback-pipeline.hls
    signature: |
      class HlsWindow {
        apply(playlist: MediaPlaylist): { grew: boolean; continues: boolean };
        timeline(): PipelineTimeline | null;
        seekableEndMs(): number;
        indexAt(positionMs: number): number;
        segmentAtEpoch(epochMs: number): { index: number; epochMs: number; withinMs: number } | null | 'untimed';
        readonly segments: readonly WindowSegment[];
        // …
      }
    semantics: 不连续的新列表整体接到边缘、时间轴继续，并以 continues=false 告知。
  - id: if.playback-pipeline.startHlsPull
    name: startHlsPull
    owner: ports.playback-pipeline.hls
    signature: |
      function startHlsPull(url: string, handlers: HlsHandlers, timers?: Timers, start?: 'open' | 'watch' | 'follow'): HlsPull;
      interface HlsPull extends Pull {
        seek(positionMs: number): void;
        seekWallClock(epochMs: number): void;
        goLive(): void;
        liveStartMs(): number | null;
        join(epochMs: number): void;
        pause(paused: boolean): void;
      }
    semantics: 每个分片先 segmentStart（带时间线起点）再 chunk*、segmentEnd；窗口变化先于首个分片以 timeline 报出；不支持的列表报 unsupported 后不再回调。
  - id: if.playback-pipeline.sessionTimers
    name: Timers / sessionTimers / visibleTimers / HoldUnseen
    owner: ports.playback-pipeline.timers
    signature: |
      interface Timers { set(callback: () => void, ms: number): () => void }
      class HoldUnseen { held(): boolean; hold(held: boolean): void; subscribe(listener: (held: boolean) => void): () => void }
      function sessionTimers(hold: HoldUnseen, base?: Timers, now?: () => number): Timers;
      function visibleTimers(visibility: PageVisibility, base?: Timers, now?: () => number): Timers;
      function within<T>(work: Promise<T>, ms: number, timers: Timers, expired: () => Error): Promise<T>;
    semantics: 计时在条件不满足时暂停、恢复后继续剩余时长。

  # ── capture ──
  - id: if.capture.captureUserMedia
    name: captureUserMedia / captureDisplay
    owner: providers.capture.source
    signature: |
      function captureUserMedia(constraints: MediaStreamConstraints, signal?: AbortSignal, options?: { timeoutMs?: number }): Promise<BrowserCaptureSource>;
      function captureDisplay(signal?: AbortSignal, options?: { timeoutMs?: number }): Promise<BrowserCaptureSource>;
    semantics: 默认 30 s 截止（上限 120 s）；需要安全上下文；NotAllowedError / SecurityError → permission-denied，NotFoundError → unsupported，其余 provider-failed。
  - id: if.capture.BrowserCaptureSource
    name: BrowserCaptureSource
    owner: providers.capture.source
    signature: |
      class BrowserCaptureSource {
        readonly events: EventHub<CaptureEvent>;
        readonly tracks: MediaStreamTrack[];
        acquireTrack(track: MediaStreamTrack): ResourceHandle<MediaStreamTrack>;
        trackSettings(track: MediaStreamTrack): MediaTrackSettings;
        applyTrackConstraints(track: MediaStreamTrack, constraints: MediaTrackConstraints, options?: { signal?: AbortSignal; timeoutMs?: number }): Promise<MediaTrackSettings>;
        stopTrack(track: MediaStreamTrack): void;
        close(): void;
      }
    semantics: 有租约或正在协商时改约束抛 device-busy；最后一条轨道结束时自动关闭并发 closed。
  - id: if.capture.BrowserDeviceMonitor
    name: BrowserDeviceMonitor
    owner: providers.capture.source
    signature: |
      class BrowserDeviceMonitor {
        constructor(devices?: MediaDevices);
        readonly events: EventHub<{ type: 'devices-changed' | 'closed' }>;
        close(): void;
      }
  - id: if.capture.browserCaptureProvider
    name: browserCaptureProvider
    owner: providers.capture.facade
    signature: |
      const browserCaptureProvider: {
        userMedia(constraints: MediaStreamConstraints, signal?: AbortSignal, options?: CaptureRequestOptions): Promise<BrowserCapturedSource>;
        displayMedia(signal?: AbortSignal, options?: CaptureRequestOptions): Promise<BrowserCapturedSource>;
      };
    description: 供领域 Kit 静态注入的采集实现。
  - id: if.capture.createBrowserCaptureProvider
    name: createBrowserCaptureProvider
    owner: providers.capture.facade
    signature: |
      function createBrowserCaptureProvider(): Provider<typeof browserCaptureProvider>;
      const browserCaptureProviderDescriptor: ProviderDescriptor; // id browser.capture, capabilities [media.capture@1]
      const browserCaptureRuntimeProvider: Provider;
    description: 可注册 facade；端口 browser.capture.user-media / display-media（capture.source）与 browser.capture.device-monitor（capture.device-monitor）。

  # ── processing ──
  - id: if.processing.browserProcessingProvider
    name: browserProcessingProvider
    owner: providers.processing.facade
    signature: |
      const browserProcessingProvider: {
        detect(scope?: Record<string, unknown>): BrowserMediaCapabilities;
        createGraph(endpoint: WorkerEndpoint, options?: { owned?: boolean; capacity?: number; timeoutMs?: number }): BrowserProcessingGraph;
      };
  - id: if.processing.createBrowserProcessingProvider
    name: createBrowserProcessingProvider
    owner: providers.processing.facade
    signature: |
      function createBrowserProcessingProvider(): Provider<typeof browserProcessingProvider>;
      const browserProcessingProviderDescriptor: ProviderDescriptor; // id browser.processing, capabilities [media.processing@1]
      const browserProcessingRuntimeProvider: Provider;
    description: 可注册 facade；端口 browser.processing.graph（processing.graph）。
  - id: if.processing.BrowserProcessingGraph
    name: BrowserProcessingGraph
    owner: providers.processing.graph
    signature: |
      class BrowserProcessingGraph {
        constructor(endpoint: WorkerEndpoint, options?: { owned?: boolean; capacity?: number; timeoutMs?: number });
        readonly state: BrowserGraphState;
        prepare(): void; start(): void; pause(): void;
        process<T>(operation: string, descriptor: unknown, signal?: AbortSignal, options?: WorkerRequestOptions): Promise<T>;
        drain(): Promise<void>;
        markFormatChanged(): void; markDiscontinuity(): void;
        fail(message?: string): void; cancel(): void;
        takeEvents(): BrowserGraphEvent[];
      }
    semantics: 非法状态转换抛 invalid-state；process 只在 running 时可用，provider-failed 使图进入 failed；drain 等全部在途请求，任一失败即 failed。
  - id: if.processing.detectBrowserMediaCapabilities
    name: detectBrowserMediaCapabilities
    owner: providers.processing.graph
    signature: |
      function detectBrowserMediaCapabilities(scope?: Record<string, unknown>): BrowserMediaCapabilities;
    semantics: 只看构造函数是否存在，不加载 Provider、不打 polyfill。
  - id: if.processing.WorkerClient
    name: WorkerClient
    owner: providers.processing.worker
    signature: |
      class WorkerClient {
        constructor(worker: WorkerEndpoint, options?: WorkerClientOptions);
        request(method: string, body: unknown, signal?: AbortSignal, options?: { transfer?: Transferable[] }): Promise<unknown>;
        close(): void;
        readonly pendingCount: number;
        readonly isClosed: boolean;
      }
    semantics: 超出容量拒绝 resource-exhausted；超时、Worker 错误、无效回复使客户端失效（独占时 terminate Worker）；取消发送 cancel 消息但不保证后端停止。
  - id: if.processing.WorkerClockBridge
    name: WorkerClockBridge
    owner: providers.processing.worker-clock
    signature: |
      class WorkerClockBridge {
        constructor(client: WorkerClient, options: WorkerClockBridgeOptions);
        readonly calibrated: boolean;
        calibrate(signal?: AbortSignal): Promise<MediaClockMapping>;
        rebind(identity: ExecutionIdentity, pageClock: MediaClockRef, workerClock: MediaClockRef): void;
        map(batch: WorkerObservationBatch): { observations: Observation[]; rejected: number; maxErrorUs: number };
      }
    semantics: 校准误差超过 maxErrorUs 即失败；rebind 丢弃旧映射，不跨代复用；身份 / 时钟代不符或时间倒退的观测计入 rejected。
  - id: if.processing.answerWorkerClockExchange
    name: answerWorkerClockExchange
    owner: providers.processing.worker-clock
    signature: |
      function answerWorkerClockExchange(clock: MediaClockRef, receivedUs: number, now?: () => number): WorkerClockReply;
    description: Worker 侧回答 clock.exchange，带上自己的时钟引用与收发时间戳。
  - id: if.processing.PcmOutput
    name: PcmOutput
    owner: providers.processing.pcm-output
    signature: |
      class PcmOutput {
        static open(scope: AudioContextScope, options?: PcmOutputOptions): Promise<PcmOutput>;
        static openRemote(scope: AudioContextScope, options?: PcmOutputOptions & { transport?: 'message-port' | 'shared-ring' }): Promise<RemotePcmOutput>;
        enqueueOwned(block: PcmBlock): void;
        enqueueBorrowed(block: PcmBlock): void;
        setMuted(muted: boolean): void;
        reset(): Promise<void>;
        close(): void;
      }
    semantics: 子路径 @lsst/media-provider-browser-processing/audio 导出；shared-ring 在页面未跨源隔离时直接拒绝（unsupported）。
  - id: if.processing.PcmPortClient
    name: PcmPortClient
    owner: providers.processing.pcm-output
    signature: |
      class PcmPortClient {
        constructor(port: PcmPort, options: PcmPortClientOptions);
        reportedTime(now?: number): number | undefined;
        enqueueOwned(block: PcmBlock): void;
        enqueueBorrowed(block: PcmBlock): void;
        reset(): Promise<void>;
        close(): void;
      }
    semantics: 在拿到转移来的端口的 realm（如播放 Worker）中使用；Worklet 拒包、确认不一致、时钟回报倒退都会使队列失败。
  - id: if.processing.PcmRingClient
    name: PcmRingClient / createPcmRing
    owner: providers.processing.pcm-output
    signature: |
      function sharedRingAvailable(): boolean;
      function createPcmRing(options: PcmQueueLimits & { channels?: 1 | 2 }): PcmRing;
      class PcmRingClient {
        constructor(ring: PcmRing, options: PcmRingClientOptions);
        reportedTime(): number | undefined;
        enqueueOwned(block: PcmBlock): void;
        reset(): Promise<void>;
        close(): void;
      }
    semantics: 单生产者单消费者环；块大于一个槽（2048 帧）被拒而不是静默切分；写索引以 Atomics.store 发布。
  - id: if.processing.VideoTrackSource
    name: VideoTrackSource
    owner: providers.processing.video
    signature: |
      class VideoTrackSource {
        constructor(source: ResourceHandle<MediaStreamTrack>, options?: VideoLimits & { timeoutMs?: number });
        read(signal?: AbortSignal): Promise<ResourceHandle<VideoFrame> | undefined>;
        close(): Promise<void>;
      }
    semantics: 接管一个轨道租约并克隆私有轨道；上一帧未释放前再读抛 resource-exhausted；流结束返回 undefined。
  - id: if.processing.PresentedVideoFrameSource
    name: PresentedVideoFrameSource
    owner: providers.processing.video
    signature: |
      class PresentedVideoFrameSource {
        constructor(source: ResourceHandle<HTMLVideoElement>, options?: VideoLimits & { timeoutMs?: number });
        read(signal?: AbortSignal): Promise<ResourceHandle<VideoFrame> | undefined>;
        close(): void;
      }
    semantics: 宿主须先让元素播放；本类不调用 play / pause、不改 srcObject。
  - id: if.processing.CanvasVideoTrackOutput
    name: CanvasVideoTrackOutput
    owner: providers.processing.video
    signature: |
      class CanvasVideoTrackOutput {
        constructor(width: number, height: number, options?: VideoLimits);
        acquireTrack(): ResourceHandle<MediaStreamTrack>;
        write(frame: VideoFrame, signal?: AbortSignal): void;
        close(): void;
      }
    semantics: 借用帧、同步绘制并 requestFrame；交付不确认、可能合并；尺寸本代固定。
  - id: if.processing.CanvasVideoProcessor
    name: CanvasVideoProcessor
    owner: providers.processing.video
    signature: |
      class CanvasVideoProcessor {
        constructor(options?: VideoLimits & { smoothing?: boolean });
        process(input: VideoFrame, effects: readonly unknown[], signal?: AbortSignal): Promise<ResourceHandle<VideoFrame>>;
        close(): void;
      }
    semantics: 最多 8 个效果合成一次绘制；未释放的输出帧超过 maxFrames 时拒绝 resource-exhausted；effects 用 unknown[] 以免 Provider 依赖 Kit 的类型。
  - id: if.processing.BrowserRecordingSource
    name: BrowserRecordingSource
    owner: providers.processing.recording
    signature: |
      class BrowserRecordingSource {
        constructor(source: ResourceHandle<MediaStream>, options: BrowserRecordingOptions);
        start(consume: (chunk: Blob) => Promise<void>, signal: AbortSignal): Promise<void>;
        stop(): Promise<void>;
        onFailure(callback: (error: unknown) => void): () => void;
      }
    semantics: 每种媒体至多一条活轨道；MIME 不支持抛 unsupported；超出块 / 字节 / 时长预算、源轨道结束（device-lost）或无任何字节即失败。

  # ── webcodecs ──
  - id: if.webcodecs.BrowserWebCodecsVideoDecoder
    name: BrowserWebCodecs 编解码器（四种）
    owner: providers.webcodecs.codec
    signature: |
      class BrowserWebCodecsVideoDecoder {   // 另有 VideoEncoder / AudioDecoder / AudioEncoder，形状相同
        constructor(options?: BrowserWebCodecsOptions);
        readonly events: EventHub<BrowserWebCodecsEvent>;
        readonly state: 'idle' | 'configured' | 'closed';
        configure(config: unknown): void;
        decode(chunk: unknown, signal?: AbortSignal): void;
        takeFrame<T = unknown>(): T | undefined;
        outputMetadata(output: object): unknown;
        flush(signal?: AbortSignal): Promise<void>;
        reset(): void;
        close(): void;
      }
    semantics: 未配置时提交抛 invalid-state；flush 期间禁止提交；输入预算不足抛 resource-exhausted；原生错误或输出放不下则关闭并发 error 事件；takeFrame 取出后原生对象所有权归调用方。
  - id: if.webcodecs.probeWebCodecsConfiguration
    name: probeWebCodecsConfiguration / detectWebCodecs
    owner: providers.webcodecs.codec
    signature: |
      function detectWebCodecs(scope?: Record<string, unknown>): { videoEncoder: boolean; videoDecoder: boolean; audioEncoder: boolean; audioDecoder: boolean };
      function probeWebCodecsConfiguration(name: 'VideoDecoder' | 'VideoEncoder' | 'AudioDecoder' | 'AudioEncoder', config: unknown,
        options?: { scope?: Record<string, unknown>; timeoutMs?: number; signal?: AbortSignal }
      ): Promise<{ supported: boolean; configurationId?: string; config?: unknown; execution: 'unverified' }>;
    semantics: 构造函数存在 ≠ 配置受支持 ≠ 实际能执行；探测结果始终标记 unverified。
  - id: if.webcodecs.browserWebCodecsProvider
    name: browserWebCodecsProvider
    owner: providers.webcodecs.facade
    signature: |
      const browserWebCodecsProvider: {
        detect: typeof detectWebCodecs;
        createVideoDecoder(options?: BrowserWebCodecsOptions): BrowserWebCodecsVideoDecoder;
        createVideoEncoder(options?: BrowserWebCodecsOptions): BrowserWebCodecsVideoEncoder;
        createAudioDecoder(options?: BrowserWebCodecsOptions): BrowserWebCodecsAudioDecoder;
        createAudioEncoder(options?: BrowserWebCodecsOptions): BrowserWebCodecsAudioEncoder;
      };
  - id: if.webcodecs.createBrowserWebCodecsProvider
    name: createBrowserWebCodecsProvider
    owner: providers.webcodecs.facade
    signature: |
      function createBrowserWebCodecsProvider(): Provider<typeof browserWebCodecsProvider>;
      const browserWebCodecsProviderDescriptor: ProviderDescriptor; // id browser.webcodecs, capabilities [media.codec@1], maturity preview
      const browserWebCodecsRuntimeProvider: Provider;

  # ── container ──
  - id: if.container.ContainerReader
    name: ContainerReader / containerBlobSource
    owner: providers.container.reader
    signature: |
      class ContainerReader {
        static open(source: ContainerSource, limits?: ContainerLimits, signal?: AbortSignal): Promise<ContainerReader>;
        readonly tracks: ContainerTrack[];
        read(trackId: string, keyframeAtUs?: number): Promise<ResourceHandle<ContainerPacket> | undefined>;
        close(): void;
      }
      function containerBlobSource(id: string, blob: Blob): ContainerSource;
    semantics: 上一个包未释放或有操作在途时再读抛 resource-exhausted；任一操作失败即关闭读取器；轨道配置变化抛 unsupported（需重新打开）。
  - id: if.container.checkMp4Admission
    name: checkMp4Admission
    owner: providers.container.reader
    signature: |
      function checkMp4Admission(size: number, read: (start: number, end: number) => Promise<Uint8Array>,
        limits: { metadataBytes: number; samples: number; tracks: number }): Promise<void>;
    semantics: 只遍历盒结构做准入：盒数、深度、元数据字节、轨道数、样本数超限抛 resource-exhausted；多个 sample description 抛 unsupported。
  - id: if.container.Mp4PacketWriter
    name: Mp4PacketWriter
    owner: providers.container.writer
    signature: |
      class Mp4PacketWriter {
        static open(tracks: ContainerTrack[], target: ContainerTarget, options?: ContainerWriterOptions, signal?: AbortSignal): Promise<Mp4PacketWriter>;
        add(packet: ContainerPacket): Promise<void>;
        finalize(): Promise<{ id: string; byteLength: number; container: 'mp4'; decodeVerification: 'required' }>;
        abort(): Promise<void>;
      }
    semantics: 1–8 条轨道，视频 avc / hevc / av1 / vp9，音频 aac / opus；add 借用包字节直到落定；输入超预算即 abort；每条声明的轨道都必须有媒体才能 finalize。
  - id: if.container.containerRuntimeProvider
    name: containerProvider / containerRuntimeProvider
    owner: providers.container.facade
    signature: |
      const containerProvider: { openReader: typeof ContainerReader.open; openMp4Writer: typeof Mp4PacketWriter.open };
      const containerRuntimeProvider: Provider<typeof containerProvider>; // id web.container, capabilities [media.container@1]
    description: 与其他 Provider 不同，没有 create* 工厂函数，contract 也未经 defineProviderContract。

dataStructures:
  # ── media-contracts（外部契约，media-web 只消费）──
  - id: ds.ErrorCode
    name: ErrorCode
    definition: |
      type ErrorCode = 'invalid-argument' | 'invalid-state' | 'unsupported' | 'version-mismatch' | 'permission-denied'
        | 'device-busy' | 'profile-unsupported' | 'device-lost' | 'driver-failed' | 'cancelled' | 'timeout'
        | 'resource-exhausted' | 'provider-failed' | 'unauthorized';
    description: 平台统一错误码（@lsst/media-contracts）。
  - id: ds.MediaError
    name: MediaError
    definition: |
      interface MediaError { code: ErrorCode; message: string; retryable: boolean; source: string }
    description: 可序列化的错误记录（@lsst/media-contracts）；管线上报故障使用它。
  - id: ds.OperationState
    name: OperationState
    definition: |
      type OperationState = 'pending' | 'succeeded' | 'failed' | 'cancelled';
  - id: ds.ExecutionIdentity
    name: ExecutionIdentity
    definition: |
      interface ExecutionIdentity { version: number; instanceId: string; sessionId: string; generation: number }
    description: 一次执行（实例 + 会话 + 代）的身份（@lsst/media-contracts）；跨 Worker 的消息、交接与信用以它绑定。
    invariants: version 为 1；generation 为非负安全整数；四字段全等才是同一执行。
  - id: ds.OperationContext
    name: OperationContext
    definition: |
      interface OperationContext {
        identity: ExecutionIdentity; operationId: string; state: OperationState;
        acceptedAtMonoMs: number; deadlineMonoMs?: number; error?: MediaError;
      }
  - id: ds.TrackDescriptor
    name: TrackDescriptor
    definition: |
      interface TrackDescriptor { id: string; kind: TrackKind; clockDomain: string; owned: boolean }
  - id: ds.LocalFrameDescriptor
    name: LocalFrameDescriptor
    definition: |
      interface LocalFrameDescriptor { trackId: string; timestampUs: number; durationUs: number; clockDomain: string; handle: string }
    description: 本地帧元数据（@lsst/media-contracts），FrameStore 以它描述存储的帧。
  - id: ds.ProviderDescriptor
    name: ProviderDescriptor
    definition: |
      interface ProviderDescriptor {
        id: string;
        version: string;
        capabilities: CapabilityId[];        // 形如 media.capture@1
        execution: 'web' | 'native' | 'agent';
        permissions: string[];
        maturity: 'experimental' | 'preview' | 'stable';
      }
    description: Provider 描述（@lsst/media-contracts），provider-spi 原样再导出。
  - id: ds.MediaProfile
    name: MediaProfile
    definition: |
      interface MediaProfile {
        requires: CapabilityId[];
        optional: CapabilityId[];
        execution: 'web' | 'native' | 'agent';
        permissions: string[];
      }
    description: 调用方的能力需求（@lsst/media-contracts），Runtime 解析的输入。
  - id: ds.CapabilityAvailability
    name: CapabilityAvailability
    definition: |
      interface CapabilityAvailability { capability: CapabilityId; available: boolean; reason?: string }
  - id: ds.TelemetryRecord
    name: TelemetryRecord
    definition: |
      interface TelemetryRecord {
        component: string; timestampMs: number; name: string;
        value?: number; unit?: string; sessionId?: string; operationId?: string;
      }
  - id: ds.MediaClockRef
    name: MediaClockRef
    definition: |
      interface MediaClockRef { kind: 'media' | 'monotonic' | 'wall'; domainId: string; generation: number }
  - id: ds.MediaClockMapping
    name: MediaClockMapping
    definition: |
      interface MediaClockMapping {
        source: MediaClockRef; target: MediaClockRef;
        sourceAnchorUs: number; targetAnchorUs: number; rate: number;
        maxErrorUs: number; validFromUs: number; validUntilUs: number;
      }
    description: 两个时钟域之间的线性映射与误差上界（@lsst/media-contracts）。
    invariants: rate > 0；maxErrorUs ≥ 0；validUntilUs ≥ validFromUs。
  - id: ds.Observation
    name: Observation
    definition: |
      interface Observation {
        identity: ExecutionIdentity; metricId: string; definitionVersion: string; sourceId: string;
        provenance: 'measured' | 'derived' | 'estimated' | 'simulated';
        validity: 'valid' | 'unknown' | 'not-collected' | 'stale' | 'not-applicable';
        observedAtMonoMs: number; clock: MediaClockRef; value?: number; unit: string;
        // …
      }
  - id: ds.ResourceGrant
    name: ResourceGrant
    definition: |
      interface ResourceGrant {
        version: number; identity: ExecutionIdentity; channelId: string; sequence: number;
        cost: { objects: number; bytes: number; durationUs: number; inFlight: number };
      }
    invariants: 同一通道 sequence 严格递增；字段集必须精确（多字段即无效）。
  - id: ds.ResourceGrantReceipt
    name: ResourceGrantReceipt
    definition: |
      interface ResourceGrantReceipt { version: number; identity: ExecutionIdentity; channelId: string; sequence: number }

  # ── media-core ──
  - id: ds.OperationOptions
    name: OperationOptions
    definition: |
      interface OperationOptions<T> {
        signal?: AbortSignal;
        timeoutMs?: number;          // 自受理起算，含开始前的等待
        context?: { identity: ExecutionIdentity; operationId: string };
        disposeLate?: (value: T) => void;
      }
  - id: ds.MediaTrack
    name: MediaTrack
    definition: |
      interface MediaTrack<TNative = unknown> {
        descriptor: TrackDescriptor;
        native?: TNative;
        stop(): void;
      }

  # ── media-resources ──
  - id: ds.ResourceHandle
    name: ResourceHandle
    definition: |
      type ResourceOwnership = 'owned' | 'borrowed';
      interface ResourceHandle<T> {
        readonly resource: T;
        readonly ownership: ResourceOwnership;
        readonly closed: boolean;
        readonly transferable?: boolean;
        close(): void;
      }
    invariants: 只有唯一的 owned 句柄可以 transferable；close 幂等；owned 关闭才释放原生对象，borrowed 关闭不释放。
  - id: ds.ResourceOwner
    name: ResourceOwner
    definition: |
      interface ResourceOwner<T> extends ResourceHandle<T> {
        acquire(): ResourceHandle<T>;   // 发出 borrowed 租约
        readonly leaseCount: number;
      }
    invariants: 所有者关闭后不再发租约；所有者已关闭且租约数为 0 时释放底层句柄。
  - id: ds.ResourceCost
    name: ResourceCost
    definition: |
      interface ResourceCost { objects: number; bytes: number; durationUs: number; inFlight: number }
    invariants: 各维度有限且非负；除 durationUs 外为安全整数；durationUs 是排队的媒体时长，不是墙钟驻留时间。
  - id: ds.MappedMediaTime
    name: MappedMediaTime
    definition: |
      interface MappedMediaTime { valueUs: number; maxErrorUs: number; clock: MediaClockRef }

  # ── provider-spi ──
  - id: ds.ProviderRole
    name: ProviderRole
    definition: |
      type ProviderRole = typeof PROVIDER_ROLES[number] | `custom:${string}`;
  - id: ds.ProviderRoleDescriptor
    name: ProviderRoleDescriptor
    definition: |
      interface ProviderRoleDescriptor { role: ProviderRole; capabilities: string[]; description?: string }
  - id: ds.ProviderContract
    name: ProviderContract
    definition: |
      interface ProviderContract {
        id: string;                       // 必须等于 descriptor.id
        roles: ProviderRoleDescriptor[];
      }
    invariants: role 不重复；每个 role 的 capability 都在 descriptor 中声明过；descriptor 的每个 capability 至少被一个 role 覆盖（Runtime 注册时校验）。
  - id: ds.ProviderPortDescriptor
    name: ProviderPortDescriptor
    definition: |
      interface ProviderPortDescriptor { id: string; roles: ProviderRole[]; capabilities: string[]; description?: string }
    invariants: 每个 role 在 contract 中且与其 capability 有交集；每个 capability 被某个 role 覆盖。
  - id: ds.ProviderPort
    name: ProviderPort
    definition: |
      interface ProviderPort<T = unknown> { descriptor: ProviderPortDescriptor; create: () => T }
  - id: ds.Provider
    name: Provider
    definition: |
      interface Provider<T = unknown> {
        descriptor: ProviderDescriptor;
        contract: ProviderContract;
        create: () => T;
        ports?: ProviderPort[];
      }
    description: 与具体 Runtime 无关的 Provider 工厂；既可注册到 Runtime，也可被 Kit 直接注入。
  - id: ds.ProviderPortResolution
    name: ProviderPortResolution
    definition: |
      interface ProviderPortResolution<T = unknown> {
        provider: Provider; providerDescriptor: ProviderDescriptor;
        port: ProviderPort<T>; portDescriptor: ProviderPortDescriptor;
        role: ProviderRole; capability: string;
      }
  - id: ds.CapabilityResolution
    name: CapabilityResolution
    definition: |
      interface CapabilityResolution {
        providers: Map<string, Provider>;      // capability → Provider
        ports?: ProviderPort[];
        availability: CapabilityAvailability[];
      }

  # ── media-runtime ──
  - id: ds.ExecutionPlan
    name: ExecutionPlan
    definition: |
      interface ExecutionPlan {
        version: 1; id: string; locked: true;
        requiredMedia: Array<'audio' | 'video'>;
        nodes: ExecutionPlanNode[];
        paths: Array<{ kind: 'audio' | 'video'; nodes: string[] }>;
        permissions: string[];
        limits: Partial<Record<keyof ExecutionPlanCost, number>>;
        requiredArtifacts: string[];
      }
    invariants: 节点 ≤ 64、路径 ≤ 16；锁定的静态计划不会静默更换 Provider、格式或路由。
  - id: ds.ExecutionPlanNode
    name: ExecutionPlanNode
    definition: |
      interface ExecutionPlanNode {
        id: string; providerId: string; role: string;
        input?: ExecutionMediaPort;   // { kind, domain: 'bytes'|'sample'|'frame'|'track'|'element', format, clockId }
        output: ExecutionMediaPort;
        permissions: string[];
        cost: ExecutionPlanCost;       // bytes / nativeObjects / inFlight / workers / copiesPerSample / readbacksPerSample，null 表示未知
        conversion?: { from: MediaDataDomain; to: MediaDataDomain };
        artifacts: string[];
      }
    invariants: 输入输出数据域不同必须显式声明 conversion；相邻节点的域、格式、时钟必须一致。
  - id: ds.ValidatedExecutionPlan
    name: ValidatedExecutionPlan
    definition: |
      interface ValidatedExecutionPlan {
        readonly plan: ExecutionPlan;
        readonly declaredCost: ExecutionPlanCost;
        readonly unknownCosts: Array<keyof ExecutionPlanCost>;
        readonly execution: 'unverified';
      }

  # ── playback-pipeline ──
  - id: ds.PipelineStart
    name: PipelineStart
    definition: |
      interface PipelineStart {
        generation: number;
        threading: 'worker' | 'main';
        route: 'wasm' | 'webcodecs' | 'mse' | 'native';
        source: PlayerSource;
        options: PlayerOpenOptions;
        sink: PipelineSink;
      }
  - id: ds.PlayerSource
    name: PlayerSource
    definition: |
      interface PlayerSource {
        url: string;
        container: 'flv' | 'mp4' | 'hls';
        decryptionKey?: Uint8Array;        // xor-v2 的 32 字节密钥；有它则不走 native
        timeshift?: { url: string };       // FLV 直播的录制（HLS 列表）
      }
  - id: ds.PlayerOpenOptions
    name: PlayerOpenOptions
    definition: |
      interface PlayerOpenOptions {
        latency: LatencyConfig;
        route?: 'auto' | PlayerRoute;
        autoplay: boolean;
        threading?: 'auto' | 'worker' | 'main';
      }
  - id: ds.PipelineCommand
    name: PipelineCommand
    definition: |
      type PipelineCommand =
        | { type: 'play' } | { type: 'pause' }
        | { type: 'seek'; positionMs: number } | { type: 'seek-live' } | { type: 'seek-wall-clock'; epochMs: number }
        | { type: 'set-timeshift'; timeshift: TimeshiftSource | null }
        | { type: 'visibility'; visible: boolean }
        | { type: 'hold-unseen'; held: boolean };
  - id: ds.PipelineSinkEvent
    name: PipelineSinkEvent
    definition: |
      type PipelineEvent =
        | { type: 'funnel'; stage: FunnelStage }
        | { type: 'route-switched'; from: 'webcodecs'; to: 'wasm'; cause: string }
        | { type: 'timeline'; timeline: PipelineTimeline }
        | { type: 'seek'; active: boolean; positionMs: number }
        | { type: 'buffering'; active: boolean }
        | { type: 'network'; connected: boolean; attempt: number }
        | { type: 'latency'; report: LatencyReport }
        | { type: 'error'; error: MediaError }
        | { type: 'log'; level: 'debug' | 'info' | 'warn'; code: LogCode; message: string }
        | { type: 'sound-held'; held: boolean }
        | { type: 'stream-info'; stream: StreamInfo }
        | { type: 'freeze'; freeze: Freeze };
      type PipelineSinkEvent = PipelineEvent | { type: 'ended' } | { type: 'paused' } | { type: 'played' };
    description: 管线经 sink 上报的事实；会话状态类事件只由内核产生。
    invariants: funnel 各阶段每会话至多一次且按顺序；LogCode 是封闭集合，新增即契约变更。
  - id: ds.PipelineStats
    name: PipelineStats
    definition: |
      interface PipelineStats {
        atMs: number; positionMs: number; bufferMs: number;
        decodedFrames?: number; renderedFrames: number;
        droppedFrames: { nonReference?: number; waitingRandomAccess?: number; overLimit: number; late?: number };
        randomAccessSkips?: { byLaw: number; byBufferFull: number; /* … */ };
        jitterMs?: number; jitterEstimateMs?: number;
        latencyActions?: LatencyActionCounts;
        // … 解码错误、不连续、音频欠载、音画校正、MSE 恢复、时移切换等累计计数
      }
    invariants: 自会话开始累计；某路由没有来源的可选计数省略而不是填 0。
  - id: ds.PipelineTimeline
    name: PipelineTimeline
    definition: |
      type PipelineTimeline =
        | { form: 'live'; seekable: TimeRange | null; liveEdgeMs?: number; wallClock?: WallClockAnchor }
        | { form: 'on-demand'; seekable: TimeRange; durationMs: number; wallClock?: WallClockAnchor };
      interface WallClockAnchor { positionMs: number; epochMs: number; precision?: 'frame' | 'segment' | 'estimate' }
    description: 会话时间线；直播可转为点播（HLS 列表结束）。
  - id: ds.PipelineEnvironment
    name: PipelineEnvironment
    definition: |
      interface PipelineEnvironment {
        container: HTMLElement;
        audio: { context: AudioContext; destination: AudioNode; running(): boolean;
                 subscribe(l: (running: boolean) => void): () => void; onResume(l: () => void): () => void } | null;
        visibility: PageVisibility;    // { visible(): boolean; subscribe(l): () => void }
      }
    description: 播放器交给一族管线的环境：呈现容器、页面级音频图、页面可见性。
  - id: ds.SessionFailureCause
    name: SessionFailureCause
    definition: |
      type SessionFailureCause = 'network' | 'unsupported-stream' | 'over-resolution-limit' | 'no-route' | 'decoder' | 'worker' | 'internal';
  - id: ds.LatencyConfig
    name: LatencyConfig
    definition: |
      interface LatencyConfig {
        basis: 'buffer' | 'absolute';
        targetMs: number | null;
        limitMs: number;
        worstMeans: 'rate' | 'drop-skip' | 'reconnect';
        overLimit: 'clamp' | 'stall';
        catchUpAbove?: 'target' | 'limit';
        adaptiveHeadroomMs: number;
      }
    invariants: targetMs + adaptiveHeadroomMs ≤ limitMs；targetMs 为 null 时 headroom 为 0 且 catchUpAbove 不为 target。
  - id: ds.LatencyReading
    name: LatencyReading
    definition: |
      interface LatencyReading {
        atMs: number; bufferMs: number;
        randomAccessBufferMs: number | null; randomAccessFixed: boolean;
        structuralMs: number | null; jitterMs: number;
        backlog: boolean; connected: boolean; discontinuity: boolean;
        canDropNonReference: boolean; rateChangeStalls: boolean; settling: boolean;
        switchCostMs: number; seekCostMs: number;
      }
    description: 执行器按自己的节奏采的一次样本；决策律唯一的时间来源是 atMs。
  - id: ds.LatencyAction
    name: LatencyAction
    definition: |
      type LatencyAction =
        | { type: 'none' }
        | { type: 'set-rate'; rate: number }
        | { type: 'set-drop-non-reference'; enabled: boolean }
        | { type: 'skip-to-random-access' }
        | { type: 'reconnect' };
    invariants: 动作所属手段不得高于 config.worstMeans；set-* 持续生效，其余一次性。
  - id: ds.LatencyState
    name: LatencyState
    definition: |
      interface LatencyState {
        readonly rate: number; readonly dropNonReference: boolean; readonly adaptiveOffsetMs: number;
        readonly attempt: { means: LatencyMeans; startedAtMs: number; startBufferMs: number } | null;
        readonly lockedMeans: readonly { means: LatencyMeans; lockedAtMs: number }[];
        readonly lastSkip: { tookEffectAtMs: number | null; standstillMs: number } | null;
        readonly skipLockedAtMs: number | null; readonly rateChangedAtMs: number | null;
        readonly backlogSinceMs: number | null;
        readonly overLimit: { sinceMs: number; peakMs: number } | null;
        readonly activeReports: readonly ('target-unreachable' | 'jitter-above-target' | 'absolute-unavailable')[];
      }
    invariants: 纯数据；调用方原样回传，不得修改。
  - id: ds.LatencyReport
    name: LatencyReport
    definition: |
      type LatencyReport =
        | { type: 'over-limit'; active: true; bufferMs: number }
        | { type: 'over-limit'; active: false; durationMs: number; peakMs: number }
        | { type: 'target-unreachable'; active: boolean; structuralMs: number; jitterMs: number }
        | { type: 'jitter-above-target'; active: boolean; jitterMs: number }
        | { type: 'target-adapted'; effectiveTargetMs: number }
        | { type: 'means-locked'; means: LatencyMeans }
        | { type: 'skip-locked' } | { type: 'means-exhausted' }
        | { type: 'absolute-unavailable'; active: boolean };
    invariants: 条件类上报边沿触发：开始与结束各报一次。
  - id: ds.LatencyDecision
    name: LatencyDecision
    definition: |
      interface LatencyDecision { state: LatencyState; action: LatencyAction; reports: LatencyReport[] }
  - id: ds.LatencyRecording
    name: LatencyRecording
    definition: |
      interface LatencyRecording {
        version: 1;
        config: LatencyConfig;
        steps: { reading: LatencyReading; action: LatencyAction; reports: LatencyReport[] }[];
      }
    description: 用于离线确定性回放的录制。
  - id: ds.Freeze
    name: Freeze
    definition: |
      interface Freeze {
        atMs: number; durationMs: number;
        cause: 'seek' | 'latency' | 'buffering' | 'late' | 'startup' | 'unknown';
        latency?: FreezeLatency;
        signals: ('seek' | 'latency' | 'buffering' | 'startup' | 'late')[];
        truncated: boolean;
        mediaStepMs?: number;
      }
  - id: ds.Anchor
    name: Anchor
    definition: |
      interface Anchor { timeline: number; positionMs: number; epochMs: number; precision: 'frame' | 'segment' | 'estimate' }
  - id: ds.PullLoss
    name: PullLoss
    definition: |
      interface PullLoss { of: 'stream' | 'playlist' | 'segment'; url: string; cause: LossCause }
      type LossCause = RequestFailure   // http / idle / fetch
        | { kind: 'ended' } | { kind: 'stale'; afterMs: number } | { kind: 'deadline'; afterMs: number }
        | { kind: 'discontinuous' } | { kind: 'left-window' } | { kind: 'join-unreachable' } | { kind: 'segment-unreachable' };
  - id: ds.MediaPlaylist
    name: MediaPlaylist
    definition: |
      interface MediaPlaylist {
        form: 'media'; targetDurationMs: number; mediaSequence: number; endList: boolean; event: boolean;
        segments: { url: string; durationMs: number; discontinuity: boolean; gap: boolean; encrypted: boolean; programDateTime?: number }[];
      }
  - id: ds.HlsSegmentStart
    name: HlsSegmentStart
    definition: |
      interface HlsSegmentStart {
        url: string; baseMs: number; encrypted: boolean;
        targetDurationMs: number; segmentDurationMs: number;
        timeline: { kind: 'continues' } | { kind: 'discontinuity' } | { kind: 'restart' }
          | { kind: 'seek'; targetMs: number; edge: boolean } | { kind: 'join'; epochMs: number; withinMs: number };
      }

  # ── capture ──
  - id: ds.CaptureEvent
    name: CaptureEvent
    definition: |
      interface CaptureEvent {
        type: 'track-ended' | 'track-muted' | 'track-unmuted' | 'closed';
        trackId?: string;
        reason?: 'ended' | 'stopped';
      }
  - id: ds.BrowserCapturedSource
    name: BrowserCapturedSource
    definition: |
      interface BrowserCapturedSource {
        tracks: MediaTrack<MediaStreamTrack>[];
        events: EventHub<CaptureEvent>;
        acquireTrack(trackId: string): MediaTrack<MediaStreamTrack>;   // 租约，stop 即释放租约
        stop(): void;
      }

  # ── processing ──
  - id: ds.BrowserGraphState
    name: BrowserGraphState
    definition: |
      type BrowserGraphState = 'configured' | 'prepared' | 'running' | 'paused' | 'draining' | 'stopped' | 'cancelled' | 'failed';
  - id: ds.BrowserMediaCapabilities
    name: BrowserMediaCapabilities
    definition: |
      interface BrowserMediaCapabilities {
        dedicatedWorker: boolean; videoEncoder: boolean; videoDecoder: boolean;
        audioEncoder: boolean; audioDecoder: boolean; webGpu: boolean;
      }
  - id: ds.WorkerEndpoint
    name: WorkerEndpoint
    definition: |
      interface WorkerEndpoint {
        postMessage(message: unknown, transfer?: Transferable[]): void;
        addEventListener(type: string, listener: EventListener): void;
        removeEventListener(type: string, listener: EventListener): void;
        terminate(): void;
      }
    description: 专用、受信的 Worker；不得接 window 或共享消息总线。
  - id: ds.WorkerClientOptions
    name: WorkerClientOptions
    definition: |
      interface WorkerClientOptions {
        owned?: boolean;          // 默认 true：失效时 terminate
        capacity?: number;        // 在途请求上限，默认 128
        timeoutMs?: number;       // 默认 5000
        identity?: ExecutionIdentity;   // 有则使用 v2 信封，且必须独占
        disposeLate?: (value: unknown) => void;
      }
  - id: ds.WorkerClockExchange
    name: WorkerClockExchange
    definition: |
      interface WorkerClockExchange { sourceSendUs: number; targetReceiveUs: number; targetSendUs: number; sourceReceiveUs: number }
  - id: ds.WorkerObservationBatch
    name: WorkerObservationBatch
    definition: |
      interface WorkerObservationBatch { identity: ExecutionIdentity; clock: MediaClockRef; observations: Observation[] }
  - id: ds.PcmBlock
    name: PcmBlock
    definition: |
      interface PcmBlock {
        samples: Float32Array;     // 交错样本；owned 入队时须独占整个 ArrayBuffer
        channels: 1 | 2;
        sampleRate: number;
        startFrame: number;        // 绝对 AudioContext 帧号，不从媒体 PTS 隐式换算
      }
    invariants: 声道与采样率须与输出一致（不做隐式重采样）；与已排队不重叠；领先不超过 5 s；样本必须有限。
  - id: ds.PcmRing
    name: PcmRing
    definition: |
      interface PcmRing {
        control: SharedArrayBuffer;   // Int32：QUANTUM / WRITE / READ / GEN_REQ / GEN_ACK / ERROR / CLOSED
        meta: SharedArrayBuffer;      // 每槽 Float64：generation / start / frames / channels / played / late
        samples: SharedArrayBuffer;
        slots: number;                // 2 的幂，≤ 256
        slotFrames: number;           // 2048
        channels: 1 | 2;
      }
    description: 生产 realm 与 PCM Worklet 之间的单生产者单消费者共享内存环；需要跨源隔离页面。
  - id: ds.RemotePcmOutput
    name: RemotePcmOutput
    definition: |
      interface RemotePcmOutput {
        readonly transport: 'message-port' | 'shared-ring';
        readonly port?: MessagePort;   // 转移给生产 realm，在那里包成 PcmPortClient
        readonly ring?: PcmRing;       // 发给生产 realm，在那里包成 PcmRingClient
        readonly sampleRate: number;
        readonly channels: 1 | 2;
        readonly failed: string | undefined;
        setMuted(muted: boolean): void;
        close(): void;
      }
  - id: ds.CanvasVideoEffect
    name: CanvasVideoEffect
    definition: |
      type CanvasVideoEffect =
        | { type: 'crop'; x: number; y: number; width: number; height: number }
        | { type: 'scale'; width: number; height: number }
        | { type: 'rotate'; degrees: 0 | 90 | 180 | 270 };

  # ── webcodecs ──
  - id: ds.BrowserWebCodecsOptions
    name: BrowserWebCodecsOptions
    definition: |
      interface BrowserWebCodecsOptions {
        scope?: Record<string, unknown>;   // 构造函数来源，默认 globalThis
        capacity?: number; inputCapacity?: number;
        maxInputBytes?: number; maxOutputBytes?: number; maxQueuedDurationUs?: number;
        timeoutMs?: number; maxWidth?: number; maxHeight?: number;
        budget?: ResourceBudget;           // 可选父上限，输入 / 输出队列为其子上限
      }
  - id: ds.BrowserWebCodecsEvent
    name: BrowserWebCodecsEvent
    definition: |
      type BrowserWebCodecsEvent =
        | { type: 'output'; kind: 'video-frame' | 'encoded-video-chunk' | 'audio-data' | 'encoded-audio-chunk' }
        | { type: 'error'; code: 'provider-failed' | 'resource-exhausted' }
        | { type: 'closed' };

  # ── container ──
  - id: ds.ContainerTrack
    name: ContainerTrack
    definition: |
      interface ContainerTrack {
        id: string;
        kind: 'video' | 'audio';
        codec: string;
        configurationId: string;     // codecConfigurationKey(decoderConfig)
        decoderConfig: VideoDecoderConfig | AudioDecoderConfig;
      }
  - id: ds.ContainerPacket
    name: ContainerPacket
    definition: |
      interface ContainerPacket {
        trackId: string;
        configurationId: string;
        ptsUs: number;
        durationUs: number;
        decodeOrder: number;     // 解码序，不是 DTS
        dtsUs?: number;
        access: 'key' | 'delta';
        data: Uint8Array;
      }
    invariants: PTS 精确到容器时基后取整到微秒；写入端要求每轨 decodeOrder 严格递增且首包为 key。
  - id: ds.ContainerLimits
    name: ContainerLimits
    definition: |
      interface ContainerLimits {
        maxSourceBytes?: number; maxReadBytes?: number; cacheBytes?: number;
        maxPacketBytes?: number; maxPackets?: number; maxTracks?: number;
        maxMetadataBytes?: number; timeoutMs?: number;
      }
