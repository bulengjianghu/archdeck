    <h1>客厅里的用户</h1>
    <p class="lede">这一层是 <span data-arch="host.demo">演示页</span>：<span data-arch="host.demo" data-field="summary"></span>。它是这台播放机在仓库里的唯一用户——所以它的用法就是最好的接入文档。</p>

    <figure>
      <svg viewBox="0 0 640 224" role="img" aria-label="表单创建播放器，按钮变命令，事件与快照更新页面">
        <defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker></defs>
        <rect x="14" y="26" width="190" height="130" rx="10" fill="var(--soft)" stroke="var(--line)"/>
        <text x="109" y="50" font-size="11" text-anchor="middle" class="">左侧面板</text>
        <text x="30" y="72" font-size="9" class="muted">测试流下拉 · 参数表单</text>
        <text x="30" y="88" font-size="9" class="muted">→ 校验 → 生效配置</text>
        <text x="30" y="110" font-size="9" class="muted">播放 / 暂停 / seek 按钮</text>
        <text x="30" y="126" font-size="9" class="muted">→ 一条条 SDK 命令</text>
        <text x="30" y="146" font-size="8.5" class="muted">分享链接 · 地址脱敏</text>
        <path d="M206,90 L234,90" stroke="var(--text-2)" stroke-width="2" marker-end="url(#f)"/>
        <rect x="238" y="56" width="150" height="68" rx="10" fill="var(--accent-soft)" stroke="var(--accent)"/>
        <text x="313" y="84" font-size="11.5" text-anchor="middle" class="">机身 SDK</text>
        <text x="313" y="104" font-size="8.5" text-anchor="middle" class="muted">只经门面来往</text>
        <path d="M390,74 L418,74" stroke="var(--text-2)" stroke-width="2" marker-end="url(#f)"/>
        <path d="M390,100 L418,100" stroke="var(--accent)" stroke-width="2" marker-end="url(#f)"/>
        <rect x="422" y="44" width="204" height="44" rx="8" fill="var(--ok-soft)" stroke="var(--ok)"/><text x="524" y="62" font-size="10.5" text-anchor="middle" class="">画面区</text><text x="524" y="78" font-size="8.5" text-anchor="middle" class="muted">只按事件与快照更新</text>
        <rect x="422" y="96" width="204" height="44" rx="8" fill="var(--warn-soft)" stroke="var(--warn)"/><text x="524" y="114" font-size="10.5" text-anchor="middle" class="">诊断台</text><text x="524" y="130" font-size="8.5" text-anchor="middle" class="muted">事件表 · 指标 · 故障注入</text>

        <text x="320" y="194" font-size="9.5" text-anchor="middle" class="muted">故障注入走代理：按会话掐一下网，看机身与机芯怎么救</text>

      <figcaption>左边配，中间播，右边诊。</figcaption>

    <h2>三个零件</h2>
    <div class="cols c3">
      <div><b><span data-arch="host.demo.app">应用骨架</span></b>按表单创建播放器（注入哪种机芯）、把按钮翻译成命令。</div>
      <div><b><span data-arch="host.demo.layout">布局</span></b>页面骨架与样式补丁——客厅装修，与播放逻辑无关。</div>
      <div><b><span data-arch="host.demo.page-kit">页面工具</span></b>接入示例代码生成：照「快速开始」的写法，复制即用。</div>
    </div>

    <p class="note">诊断与故障注入（右栏）只读 SDK 事件与快照，或经代理掐网——它们演示的是「出了问题怎么观察」，本身就是架构主张的一部分。</p>
