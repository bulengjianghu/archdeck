    <h1>自备节拍器的机芯</h1>
    <p class="lede">这一层是 <span data-arch="providers.self-clocked">自建时钟机芯</span>：<span data-arch="providers.self-clocked" data-field="summary"></span>。画面自己画、节拍自己打——自由度最大的一种机芯。</p>

    <figure>
      <svg viewBox="0 0 640 240" role="img" aria-label="播放器级资产与每会话流水，Worker 与主线程共用同一份会话实现">
        <defs><marker id="j" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker></defs>
        <rect x="14" y="24" width="280" height="74" rx="10" fill="var(--soft)" stroke="var(--line)"/>
        <text x="154" y="46" font-size="11" text-anchor="middle" class="">播放器级（开机一次）</text>
        <text x="30" y="66" font-size="9" class="muted">画布 · 渲染器 · 已编译 wasm 模块</text>
        <text x="30" y="82" font-size="9" class="muted">预热的后台线程（解码重活专用）</text>
        <rect x="346" y="24" width="280" height="74" rx="10" fill="var(--soft)" stroke="var(--line)"/>
        <text x="486" y="46" font-size="11" text-anchor="middle" class="">每会话（打开一次）</text>
        <text x="362" y="66" font-size="9" class="muted">拉流 → 分片预算解码 → 按媒体钟呈现</text>
        <text x="362" y="82" font-size="9" class="muted">喂音频 · 以本族执行器跑延迟律</text>
        <path d="M294,61 L342,61" stroke="var(--text-2)" stroke-width="2" marker-end="url(#j)"/>
        <rect x="120" y="116" width="400" height="66" rx="10" fill="var(--accent-soft)" stroke="var(--accent)"/>
        <text x="320" y="140" font-size="11.5" text-anchor="middle" class="">主线程 ⇄ 后台线程：同一份会话实现</text>
        <text x="320" y="160" font-size="9" text-anchor="middle" class="">Worker 模式只是把同一颗芯装进另一间屋——消息协议做映射，逻辑不分叉</text>
        <rect x="90" y="198" width="210" height="30" rx="8" fill="var(--bg)" stroke="var(--ok)"/><text x="195" y="217" font-size="9.5" text-anchor="middle" class="">呈现：画布一帧帧自绘</text>
        <rect x="340" y="198" width="210" height="30" rx="8" fill="var(--bg)" stroke="var(--ok)"/><text x="445" y="217" font-size="9.5" text-anchor="middle" class="">节拍：自己的媒体钟走点</text>
        <text x="320" y="132" font-size="0" text-anchor="middle" class=""></text>
      </svg>
      <figcaption>同一颗芯、两间屋：主线程与 Worker 共用一份会话实现。</figcaption>
    </figure>

    <h2>机芯里的岗位</h2>
    <div class="cols c2">
      <div><b><span data-arch="providers.self-clocked.family">族装配</span> 与 <span data-arch="providers.self-clocked.session">会话</span></b>开机建画布、渲染器、线程池；每会话拉流、按预算解码、按钟呈现。</div>
      <div><b><span data-arch="providers.self-clocked.video">视频</span> / <span data-arch="providers.self-clocked.presentation">呈现</span> / <span data-arch="providers.self-clocked.audio">音频</span></b>解码出的帧上画布、到点出画面、声音喂输出——三线并行一拍不乱。</div>
      <div><b><span data-arch="providers.self-clocked.worker-client">客户端</span> / <span data-arch="providers.self-clocked.worker-host">宿主</span> / <span data-arch="providers.self-clocked.worker-protocol">协议</span></b>把会话搬进后台线程的三件套：一头发指令、一头干活、协议做映射。</div>
      <div><b>与延迟律的握手</b>读数从到达计量来，动作（快进 / 跳帧）由本族执行器落到位——律是共用的，手脚是本族的。</div>
    </div>
