    <h1>进口发动机：C 的芯，JS 的接口面板</h1>
    <p class="lede">这一层是 <span data-arch="providers.wasm-module">wasm 模块与会话</span>：<span data-arch="providers.wasm-module" data-field="summary"></span>。两种机芯共用同一台解码发动机——C 语言写的芯，配一块规格化的接口面板。</p>

    <h2>三个岗位</h2>
    <div class="cols c3">
      <div><b><span data-arch="providers.wasm-module.module">模块与会话</span></b>编译一份基线播放模块；每个播放会话领一个实例，经接口面板推字节、取帧。</div>
      <div><b><span data-arch="providers.wasm-module.sample">归一化样本</span></b>引擎吐出的帧与声音统一成一种规格，两族机芯拿到手就能用。</div>
      <div><b><span data-arch="providers.wasm-module.lifecycle">会话生命周期</span></b>开与关都讲顺序：资源按借用的反序归还，还到超时直接终止，绝不悬挂。</div>
    </div>

    <p class="note">它的上游是 <span data-arch="providers.stream-input">进料口</span>；两族机芯（<span data-arch="providers.self-clocked">自建时钟</span> / <span data-arch="providers.element">元素</span>）都只带这块面板的插头——发动机换版本，机芯无感。</p>
