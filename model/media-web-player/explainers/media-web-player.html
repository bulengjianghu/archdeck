    <h1>同一机身，双机芯</h1>
    <p class="lede">这台播放机分五层楼：客厅里的用户（演示页）、可换装的机身（会话内核）、机身与机芯共用的说明书与物理定律、两种机芯，以及公共件。<b>机身与机芯互相不认识，只认中间那本说明书。</b></p>

        <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker></defs>
        <rect x="8" y="6" width="624" height="56" rx="10" fill="var(--soft)" stroke="var(--line)"/>
        <text x="20" y="26" font-size="13" class="">Host · 客厅（唯一用户：演示页）</text>
        <rect x="430" y="18" width="100" height="32" rx="8" fill="var(--bg)" stroke="var(--warn)"/><text x="480" y="38" font-size="10.5" text-anchor="middle" class="">演示页 ★</text>

        <rect x="8" y="70" width="306" height="96" rx="10" fill="var(--accent-soft)" stroke="var(--accent)"/>
        <text x="20" y="90" font-size="12.5" class="">Kit · 机身（会话内核）</text>
        <text x="20" y="105" font-size="9.5" class="muted">一次打开到关闭 = 一个会话</text>
        <rect x="20" y="114" width="88" height="40" rx="8" fill="var(--bg)" stroke="var(--warn)"/><text x="64" y="130" font-size="10" text-anchor="middle" class="">门面 ★</text><text x="64" y="144" font-size="8.5" text-anchor="middle" class="muted">方法→命令</text>
        <rect x="114" y="114" width="94" height="40" rx="8" fill="var(--bg)" stroke="var(--warn)"/><text x="161" y="130" font-size="10" text-anchor="middle" class="">会话内核 ★</text><text x="161" y="144" font-size="8.5" text-anchor="middle" class="muted">排队·状态·释放</text>
        <rect x="214" y="114" width="88" height="40" rx="8" fill="var(--bg)" stroke="var(--warn)"/><text x="258" y="130" font-size="10" text-anchor="middle" class="">会话规则 ★</text><text x="258" y="144" font-size="8.5" text-anchor="middle" class="muted">接受表·路线</text>

        <rect x="326" y="70" width="306" height="96" rx="10" fill="var(--ok-soft)" stroke="var(--ok)"/>
        <text x="338" y="90" font-size="12.5" class="">Pipeline · 说明书 + 物理定律</text>
        <text x="338" y="105" font-size="9.5" class="muted">共用的契约与定律，不认识任何一族</text>
        <rect x="338" y="114" width="138" height="40" rx="8" fill="var(--bg)" stroke="var(--warn)"/><text x="407" y="130" font-size="10" text-anchor="middle" class="">管线契约 ★</text><text x="407" y="144" font-size="8.5" text-anchor="middle" class="muted">插座标准</text>
        <rect x="482" y="114" width="138" height="40" rx="8" fill="var(--bg)" stroke="var(--warn)"/><text x="551" y="130" font-size="10" text-anchor="middle" class="">延迟决策律 ★</text><text x="551" y="144" font-size="8.5" text-anchor="middle" class="muted">恒温器 · 纯函数</text>

        <rect x="8" y="174" width="624" height="92" rx="10" fill="var(--warn-soft)" stroke="var(--warn)"/>
        <text x="20" y="194" font-size="12.5" class="">Providers · 机芯 × 2（客厅主人选好注入机身）</text>
        <rect x="20" y="204" width="148" height="50" rx="8" fill="var(--bg)" stroke="var(--warn)"/><text x="94" y="224" font-size="10" text-anchor="middle" class="">自建时钟机芯 ★</text><text x="94" y="240" font-size="8.5" text-anchor="middle" class="muted">画布自绘 · 可进后台</text>
        <rect x="176" y="204" width="148" height="50" rx="8" fill="var(--bg)" stroke="var(--warn)"/><text x="250" y="224" font-size="10" text-anchor="middle" class="">元素机芯 ★</text><text x="250" y="240" font-size="8.5" text-anchor="middle" class="muted">借浏览器现成元件</text>
        <rect x="332" y="204" width="148" height="50" rx="8" fill="var(--bg)" stroke="var(--warn)"/><text x="406" y="224" font-size="10" text-anchor="middle" class="">wasm 模块会话 ★</text><text x="406" y="240" font-size="8.5" text-anchor="middle" class="muted">共用的进口发动机</text>

        <text x="20" y="294" font-size="12.5" class="">Share · 公共件</text>
        <text x="20" y="310" font-size="9.5" class="muted">机身机芯共用的原语：错误 · 事件 · 一次性操作 · 轨道</text>
        <rect x="470" y="286" width="150" height="30" rx="8" fill="var(--bg)" stroke="var(--hot)"/><text x="545" y="305" font-size="10" text-anchor="middle" class="">基础媒体模型 ★</text>
        <text x="300" y="68" font-size="9.5" text-anchor="middle" class="muted">★ 核心 11 个（两份机芯内部机制另有图解）</text>
      </svg>
      <figcaption>五层楼：机身与机芯互不 import，装配时才见面。</figcaption>
    </figure>

    <h2>机身与机芯怎么相见</h2>
    <figure>
      <svg viewBox="0 0 640 138" role="img" aria-label="机身与机芯之间隔着一块插座面板">
        <defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker></defs>
        <rect x="24" y="30" width="190" height="84" rx="10" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="119" y="62" font-size="11.5" text-anchor="middle" class="">机身 · 内核</text><text x="119" y="82" font-size="9.5" text-anchor="middle" class="muted">会话 · 命令队列 · 状态</text><text x="119" y="98" font-size="9.5" text-anchor="middle" class="muted">零浏览器细节</text>
        <rect x="226" y="22" width="188" height="100" rx="10" fill="var(--bg)" stroke="var(--warn)"/>
        <text x="320" y="44" font-size="11" class="">插座面板（契约）</text>
        <rect x="242" y="52" width="156" height="16" rx="4" fill="var(--soft)" stroke="var(--line)"/><text x="320" y="64" font-size="9" text-anchor="middle" class="muted">源 · 打开选项</text>
        <rect x="242" y="72" width="156" height="16" rx="4" fill="var(--soft)" stroke="var(--line)"/><text x="320" y="84" font-size="9" text-anchor="middle" class="muted">命令 → 回报</text>
        <rect x="242" y="92" width="156" height="16" rx="4" fill="var(--soft)" stroke="var(--line)"/><text x="320" y="104" font-size="9" text-anchor="middle" class="muted">统计 · 族端口</text>
        <rect x="430" y="30" width="190" height="84" rx="10" fill="var(--warn-soft)" stroke="var(--warn)"/><text x="525" y="62" font-size="11.5" text-anchor="middle" class="">机芯 · 管线族</text><text x="525" y="82" font-size="9.5" text-anchor="middle" class="muted">拉流 · 解码 · 呈现 · 音频</text><text x="525" y="98" font-size="9.5" text-anchor="middle" class="muted">自带定律执行器</text>
        <path d="M216,72 L222,72 M416,72 L426,72" stroke="var(--text-2)" stroke-width="2.5" marker-end="url(#c)"/>
        <text x="320" y="134" font-size="9.5" text-anchor="middle" class="muted">谁想接入，谁照插座做——换机芯不动机身</text>
      </svg>
      <figcaption>客厅主人把机芯注入机身：双方只认插座。</figcaption>
    </figure>

    <p class="note ok">机芯两族（自建时钟族：画布自绘每一帧，自由度大；元素族：借浏览器现成元件，稳而省力）都归 <span data-arch="providers">机芯层</span> 管；机身与说明书分属 <span data-arch="kit">机身层</span> 与 <span data-arch="pipeline">说明书层</span>。两族共用同一台 wasm 解码发动机与同一条延迟定律——调好一次，两台都好。</p>
