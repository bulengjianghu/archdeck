    <style>

body{margin:0;padding:18px 22px 32px;background:var(--bg);color:var(--text);font:14px/1.7 -apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif}

.cols{display:grid;gap:8px;margin:8px 0}

.note.ok{border-left-color:var(--ok);background:var(--ok-soft)}

    <h1>说明书上的规则页</h1>
    <p class="lede">这一层是 <span data-arch="kit.session">会话规则</span>：<span data-arch="kit.session" data-field="summary"></span>。什么状态收什么命令、auto 路线先试谁、事件顺序对不对——全是查表，不是猜。</p>

    <figure>
      <svg viewBox="0 0 640 206" role="img" aria-label="三张纯规则表：接受表、路线策略、事件顺序机检">
        <defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker></defs>
        <rect x="14" y="26" width="192" height="100" rx="10" fill="var(--warn-soft)" stroke="var(--warn)"/>
        <text x="110" y="50" font-size="11" text-anchor="middle" class="">① 命令接受表</text>
        <rect x="30" y="62" width="160" height="18" rx="4" fill="var(--bg)" stroke="var(--line)"/><text x="110" y="75" font-size="8.5" text-anchor="middle" class="">空闲态 → 收 open / …</text>
        <rect x="30" y="84" width="160" height="18" rx="4" fill="var(--bg)" stroke="var(--line)"/><text x="110" y="97" font-size="8.5" text-anchor="middle" class="">播放态 → 收 seek / …</text>
        <text x="30" y="116" font-size="8.5" class="muted">查表即答：现在收不收</text>
        <rect x="224" y="26" width="192" height="100" rx="10" fill="var(--ok-soft)" stroke="var(--ok)"/>
        <text x="320" y="50" font-size="11" text-anchor="middle" class="">② 路线策略</text>
        <rect x="240" y="62" width="160" height="18" rx="4" fill="var(--bg)" stroke="var(--line)"/><text x="320" y="75" font-size="8.5" text-anchor="middle" class="">auto 在此容器：先试谁</text>
        <rect x="240" y="84" width="160" height="18" rx="4" fill="var(--bg)" stroke="var(--line)"/><text x="320" y="97" font-size="8.5" text-anchor="middle" class="">延迟上限互斥的取舍</text>
        <text x="240" y="116" font-size="8.5" class="muted">解析出唯一一条路线</text>
        <rect x="434" y="26" width="192" height="100" rx="10" fill="var(--accent-soft)" stroke="var(--accent)"/>
        <text x="530" y="50" font-size="11" text-anchor="middle" class="">③ 事件顺序机检</text>
        <rect x="450" y="62" width="160" height="18" rx="4" fill="var(--bg)" stroke="var(--line)"/><text x="530" y="75" font-size="8.5" text-anchor="middle" class="">opened 之后才允许 …</text>
        <rect x="450" y="84" width="160" height="18" rx="4" fill="var(--bg)" stroke="var(--line)"/><text x="530" y="97" font-size="8.5" text-anchor="middle" class="">closed 之后必须无事件</text>
        <text x="450" y="116" font-size="8.5" class="muted">顺序错了当场报警</text>
        <path d="M110,128 L110,152 L320,152 L320,132" stroke="var(--text-2)" stroke-width="1.5" fill="none" marker-end="url(#h)"/>
        <text x="320" y="172" font-size="10" text-anchor="middle" class="">三张都是纯表（类型 + 表 + 纯函数）：内核随时来查，测试不用开机</text>
        <text x="320" y="194" font-size="9.5" text-anchor="middle" class="muted">状态与命令、事件与快照的类型也定义在这一层——先有词表再有规则</text>
      </svg>
      <figcaption>三张纯表：收不收、走哪条、顺序对不对。</figcaption>
    </figure>

    <h2>四页内容</h2>
    <div class="cols c2">
      <div><b><span data-arch="kit.session.contract">词表</span> 与 <span data-arch="kit.session.acceptance">接受表</span></b>状态、命令、事件、快照的类型；外加一张「什么状态收什么命令」的纯表——拒收也是正常回答，带原因。</div>
      <div><b><span data-arch="kit.session.routes">路线</span> 与 <span data-arch="kit.session.order-check">顺序机检</span></b>auto 先试谁、延迟上限互斥怎么取舍；事件顺序错乱当场报警——坏时序活不过这一页。</div>
    </div>
